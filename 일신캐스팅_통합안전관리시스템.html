function reportStatusOf(i){
  if(!i || !i.reportTitle) return '미작성';
  const hasChecklist = i.reportChecklist && Object.keys(i.reportChecklist).length>0;
  const hasCM = i.reportCauseMeasure && i.reportCauseMeasure.every(r=>r.cause && r.measure);
  if(i.reportNarrative && hasChecklist && hasCM) return '완료';
  return '작성중';
}
function rptStatusBadge(s){
  const cls = s==='완료' ? 'b-ok' : s==='작성중' ? 'b-caution' : 'b-gray';
  return `<span class="badge ${cls}">${esc(s)}</span>`;
}

// 서명 이미지를 문서에 직접 삽입 (docxtemplater 이미지 모듈은 브라우저에서 호환성 버그가 있어 사용하지 않음)
// signatures: [{marker, dataUrl}] — dataUrl이 없으면 건너뜀(빈 칸으로 유지)
function injectSignatureImages(zip, signatures){
  const docXmlPath = 'word/document.xml';
  const relsPath = 'word/_rels/document.xml.rels';
  let xml = zip.file(docXmlPath).asText();
  let relsXml = zip.file(relsPath).asText();

  const existingIds = [...relsXml.matchAll(/Id="rId(\d+)"/g)].map(m=>parseInt(m[1],10));
  let nextRid = (existingIds.length ? Math.max(...existingIds) : 0) + 1;
  const mediaFiles = Object.keys(zip.files).filter(f=>/^word\/media\/image(\d+)\.png$/.test(f));
  const existingMediaNums = mediaFiles.map(f=> parseInt(f.match(/image(\d+)\.png/)[1],10));
  let mediaIndex = (existingMediaNums.length ? Math.max(...existingMediaNums) : 0) + 1;

  const cx = 400000, cy = 160000; // EMU 단위 — 텍스트 줄 높이에 맞춰 작게 조정 (기존보다 절반 이하)
  const newRels = [];

  signatures.forEach(({marker, dataUrl})=>{
    if(!dataUrl) return;
    const runRe = new RegExp(`<w:r><w:t xml:space="preserve">${marker}</w:t></w:r>`);
    if(!runRe.test(xml)) return;
    const rId = 'rId' + (nextRid++);
    const mediaName = `image${mediaIndex}.png`;
    const picId = 100 + (mediaIndex++);
    const drawingXml = `<w:r><w:drawing><wp:inline distT="0" distB="0" distL="91440" distR="0" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="${picId}" name="Signature${picId}"/><wp:cNvGraphicFramePr><a:graphicFrameLocks noChangeAspect="1"/></wp:cNvGraphicFramePr><a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic><pic:nvPicPr><pic:cNvPr id="${picId}" name="${mediaName}"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="${rId}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"/></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>`;
    xml = xml.replace(runRe, drawingXml);
    zip.file(`word/media/${mediaName}`, dataUrlToUint8Array(dataUrl));
    newRels.push(`<Relationship Id="${rId}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/${mediaName}"/>`);
  });

  if(newRels.length){
    relsXml = relsXml.replace('</Relationships>', newRels.join('') + '</Relationships>');
    zip.file(relsPath, relsXml);
    zip.file(docXmlPath, xml);
  }
}

function generatePermitDocx(p){
  if(typeof PizZip==='undefined' || typeof window.docxtemplater==='undefined'){
    toast('문서 생성 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해주세요.');
    return;
  }
  try{
    const binary = atob(PERMIT_TEMPLATE_B64);
    const bytes = new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++){ bytes[i] = binary.charCodeAt(i); }
    const zip = new PizZip(bytes);
    const doc = new window.docxtemplater(zip, { paragraphLoop:true, linebreaks:true });
    const equipmentText = [...(p.equipment||[]), p.equipmentOther].filter(Boolean).join(', ') || '-';

    // 서명이 실제로 있는 항목만 고유 마커를 부여 (없으면 빈 문자열 → 해당 칸은 비워둠)
    const sigList = [
      { key:'contractorSigMarker', marker:'ZZSIGCONTRACTORZZ', dataUrl: p.contractorSignature },
      { key:'managerSigMarker',    marker:'ZZSIGMANAGERZZ',    dataUrl: p.deptSignature },
      { key:'approverSigMarker',   marker:'ZZSIGAPPROVERZZ',   dataUrl: p.approverSignature },
      { key:'endConfirmSigMarker', marker:'ZZSIGENDCONFIRMZZ', dataUrl: p.endConfirmerSignature },
    ];
    const renderData = {
      company: p.company||'',
      workName: p.workContent||'',
      workPeriod: `${fmtDate(p.startDate)} ~ ${fmtDate(p.endDate)}`,
      location: p.location||'',
      headcount: p.headcount||'',
      siteSuper: p.contractorLead||'',
      equipment: equipmentText,
      hazardMeasures: p.hazardDetail||'',
      fireYesBox: p.fireWork ? '☑' : '□',
      fireDetail: p.fireWork ? (p.fireDetail||'') : '',
      fireNoBox: p.fireWork ? '□' : '☑',
      watchman: p.fireWork ? (p.watchman||'') : '',
      extinguisher: p.fireWork ? (p.fireExtinguisher||'') : '',
      combustible: p.fireWork ? (p.combustibleRemoval||'') : '',
      contractorSign: p.contractorLead||'',
      managerSign: p.deptName || p.processManager || '',
      approverSign: p.approverName||'',
      endDatetime: p.endDatetime ? fmtDateTime(p.endDatetime) : '',
      siteConditionText: p.siteCondition ? (p.siteCondition==='이상없음' ? '☑ 이상없음   □ 이상있음' : '□ 이상없음   ☑ 이상있음') : '□ 이상없음   □ 이상있음',
      residualCheck: p.fireWork ? (p.residualCheck||'') : '',
      endConfirmer: p.endConfirmer||'',
    };
    sigList.forEach(s=>{ renderData[s.key] = s.dataUrl ? s.marker : ''; });
    doc.render(renderData);

    const outZip = doc.getZip();
    injectSignatureImages(outZip, sigList.map(s=>({ marker:s.marker, dataUrl:s.dataUrl })));

    const out = outZip.generate({ type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
    const url = URL.createObjectURL(out);
    const a = document.createElement('a');
    a.href = url;
    const safeCompany = (p.company||'업체명').replace(/[\\/:*?"<>|]/g,'');
    a.download = `안전작업허가서_${safeCompany}_${p.startDate||''}.docx`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 3000);
    toast('허가서 파일이 다운로드되었습니다');
  }catch(err){
    console.error('허가서 다운로드 오류:', err);
    let detail = err && err.message ? err.message : String(err);
    if(err && err.properties && err.properties.errors && err.properties.errors.length){
      console.error('상세 오류 목록:', err.properties.errors);
      detail = err.properties.errors.map(e=> e.message || e.name || JSON.stringify(e)).join(' / ');
    }
    alert('문서 생성 중 오류가 발생했습니다.\n\n[오류 내용]\n' + detail + '\n\n이 내용을 캡처해서 전달해주시면 빠르게 확인하겠습니다.');
  }
}

function renderRisks(){
  const el = document.getElementById('view-risks');
  const filter = State.filters.risks || '전체';
  const processFilter = State.filters.risksProcess || '전체';
  const viewMode = State.filters.risksView || 'table';
  const isAdmin = State.mode==='admin';

  function getFilteredRisks(){
    const arr = objToArr(DataStore.get(PATHS.risks)).sort((a,b)=>{
      return riskLevel(b) - riskLevel(a);
    });
    let f = filter==='전체' ? arr : arr.filter(r=>r.status===filter);
    if(processFilter!=='전체') f = f.filter(r=>r.process===processFilter);
    return f;
  }

  el.innerHTML = `
    <div class="toolbar">
      <div class="tabs" id="riskTabs">
        ${['전체','접수완료','조치중','완료','일부개선완료'].map(s=>`<button class="tab ${filter===s?'active':''}" data-s="${s}">${s==='전체'?t('tab_all'):statusLabel(s)}</button>`).join('')}
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <select id="riskProcessFilter" class="btn btn-sm" style="font-weight:700;">
          <option value="전체">${t('tab_all')} (${t('th_process_task')})</option>
          ${PROCESS_OPTIONS.map(p=>`<option value="${p}" ${processFilter===p?'selected':''}>${esc(p)}</option>`).join('')}
        </select>
        <button class="btn btn-sm" id="galleryToggleBtn">${viewMode==='table' ? icon('alert-triangle',14)+' '+t('btn_gallery_view') : icon('grid',14)+' '+t('btn_table_view')}</button>
        ${isAdmin ? `<button class="btn btn-sm" id="printRisksBtn">${icon('file-check',14)} ${t('btn_print')}</button>` : ''}
        ${isAdmin ? `<button class="btn btn-sm" id="excelRisksBtn">${icon('file-check',14)} ${t('btn_excel')}</button>` : ''}
        <button class="btn btn-primary" id="addRiskBtn">${icon('plus',15)} ${t('risks_add_btn')}</button>
      </div>
    </div>
    ${viewMode==='table' ? riskLegendHtml() : ''}
    <div id="riskViewArea"></div>
  `;
  el.querySelectorAll('#riskTabs .tab').forEach(t=>t.addEventListener('click', ()=>{
    State.filters.risks = t.dataset.s; renderRisks();
  }));
  document.getElementById('riskProcessFilter').addEventListener('change', e=>{
    State.filters.risksProcess = e.target.value; renderRisks();
  });
  document.getElementById('galleryToggleBtn').addEventListener('click', ()=>{
    State.filters.risksView = viewMode==='table' ? 'gallery' : 'table';
    renderRisks();
  });
  if(isAdmin){
    document.getElementById('printRisksBtn').addEventListener('click', ()=> printRisks(getFilteredRisks()));
    document.getElementById('excelRisksBtn').addEventListener('click', ()=> exportRisksExcel(getFilteredRisks()));
  }
  el.querySelector('#addRiskBtn').addEventListener('click', ()=>{
    openRiskModal();
  });

  const filtered = getFilteredRisks();
  const area = document.getElementById('riskViewArea');

  if(viewMode==='gallery'){
    const done = filtered.filter(r=>r.status==='완료'||r.status==='일부개선완료');
    if(done.length===0){
      area.innerHTML = `<div class="empty"><span class="big">${icon('alert-triangle',22)}</span>${t('gallery_empty')}</div>`;
      return;
    }
    area.innerHTML = `<div class="gallery-grid">${done.map(r=>{
      const beforeScore = (Number(r.frequency)||0)*(Number(r.severity)||0);
      const afterScore = (r.afterFrequency && r.afterSeverity) ? (Number(r.afterFrequency)*Number(r.afterSeverity)) : null;
      return `<div class="gallery-card">
        <div class="gc-photos">
          <div class="gc-photo">${r.photoBefore?`<img src="${r.photoBefore}" class="risk-photo-lg">`:`<div class="gc-noimg">${t('gallery_no_photo')}</div>`}<span class="gc-tag">${t('gallery_before')}</span></div>
          <div class="gc-photo">${r.photoAfter?`<img src="${r.photoAfter}" class="risk-photo-lg">`:`<div class="gc-noimg">${t('gallery_no_photo')}</div>`}<span class="gc-tag">${t('gallery_after')}</span></div>
        </div>
        <div class="gc-body">
          <div class="gc-head"><b>${esc(r.process||'-')}</b> ${statusBadge('risk', r.status)}</div>
          <div class="gc-hazard">${esc(r.hazard||'-')}</div>
          <div class="gc-score">${beforeScore}${afterScore!=null?` → <b>${afterScore}</b>`:''}</div>
        </div>
      </div>`;
    }).join('')}</div>`;
    bindImageZoom(area);
    return;
  }

  area.innerHTML = `
    <div class="table-wrap"><table>
      <thead><tr>
        <th>${t('th_process_task')}</th><th>${t('th_hazard')}</th><th class="tight">${t('th_frequency')}</th><th class="tight">${t('th_severity')}</th><th class="tight">${t('th_risklevel_before')}</th><th class="tight">${t('th_risklevel_after')}</th><th>${t('th_measures')}</th><th>${t('dt_photo_site')}</th><th>${t('dt_photo_after')}</th><th>${t('th_reporter_applicant')}</th><th>${t('th_status')}</th><th class="tight">${t('btn_manage_col')}</th>
      </tr></thead>
      <tbody id="riskBody"></tbody>
    </table></div>
  `;
  const body = document.getElementById('riskBody');
  if(filtered.length===0){
    body.innerHTML = `<tr><td colspan="12"><div class="empty"><span class="big">${icon('alert-triangle',22)}</span>${t('risks_empty')}</div></td></tr>`;
    return;
  }
  body.innerHTML = filtered.map(r=>`
    <tr>
      <td class="cell-strong">${newBadge(r, PATHS.risks)}${esc(r.process||'-')}<div class="cell-sub">${esc(r.task||'')}</div></td>
      <td>${esc(r.hazard||'-')}</td>
      <td class="tight mono">${r.frequency||0}</td>
      <td class="tight mono">${r.severity||0}</td>
      <td class="tight">${riskLevelBadge(r)}</td>
      <td class="tight">${(r.afterFrequency && r.afterSeverity) ? riskLevelBadge({frequency:r.afterFrequency, severity:r.afterSeverity}) : '<span style="color:var(--ink-faint);font-size:11.5px;">-</span>'}</td>
      <td>${esc(r.measures||'-')}</td>
      <td>${riskThumb(r.photoBefore)}</td>
      <td>${riskThumb(r.photoAfter)}</td>
      <td>${esc(r.reporter||'-')}</td>
      <td>${statusBadge('risk', r.status)}</td>
      <td class="tight row-btns"><button class="btn btn-sm" data-view-id="${r.id}">${t('btn_view')}</button></td>
    </tr>
  `).join('');
  body.querySelectorAll('[data-view-id]').forEach(b=> b.addEventListener('click', ()=> openRiskDetail(b.dataset.viewId)));
  bindImageZoom(body);
}

function riskThumb(src){
  if(!src) return '<span style="color:var(--ink-faint);font-size:11.5px;">-</span>';
  return `<img src="${src}" class="risk-thumb" style="width:56px;height:56px;object-fit:cover;border-radius:7px;border:1px solid var(--line);cursor:zoom-in;">`;
}
// 사진(썸네일) 클릭 시 원본 크기로 확대해서 보여주는 라이트박스
function bindImageZoom(container){
  (container||document).querySelectorAll('img.risk-thumb, img.risk-photo-lg').forEach(img=>{
    img.addEventListener('click', ()=> openImageLightbox(img.src));
  });
}
function openImageLightbox(src){
  const overlay = document.createElement('div');
  overlay.className = 'lightbox-overlay';
  overlay.innerHTML = `<img src="${src}"><button class="lightbox-close" aria-label="close">✕</button>`;
  overlay.addEventListener('click', ()=> overlay.remove());
  document.body.appendChild(overlay);
}

// 위험성평가 엑셀 다운로드 — 공식 양식과 동일한 컬럼 구조로 출력 (한글 문서에 복사·붙여넣기 용도)
function dataUrlToExt(dataUrl){
  const m = /^data:image\/(\w+);base64,/.exec(dataUrl||'');
  return m ? m[1].replace('jpeg','jpg') : 'jpg';
}
function dataUrlToBase64(dataUrl){
  return (dataUrl||'').split(',')[1] || '';
}

function exportRisksExcel(list){
  if(!list || list.length===0){ toast(t('print_no_data')); return; }
  if(typeof XLSX==='undefined'){ toast('엑셀 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해주세요.'); return; }

  // 2부: 위험성평가표 — 실제 사용 양식(순번/공정명/세부작업명/위험분류/유해위험요인파악/현재조치/가능성/중대성/위험성/감소대책/개선후위험성/접수일/완료일/담당자) 컬럼 구조 그대로
  const header2 = ['순번','공정명','세부작업명','위험분류','유해위험요인 파악(위험발생상황 및 결과)','현재의 안전보건조치','가능성','중대성','위험성','위험성 감소대책','개선후 위험성','접수일','완료일','담당자'];
  // 3부: 위험성평가 개선계획서 — 개선전/후 사진 파일명(zip 참조), 위험성 변화, 상태 중심
  const header3 = ['공정명','점검사항(유해위험요인)','개선방법','개선전 사진파일','개선후 사진파일','개선전 위험성','개선후 위험성','상태','담당자'];

  const byProcess = {};
  list.forEach(r=>{
    const key = r.process || '기타';
    if(!byProcess[key]) byProcess[key] = [];
    byProcess[key].push(r);
  });
  // 공정별 1부터 매기는 사진 번호 — 엑셀 3부 시트와 zip 파일명이 서로 일치하도록 동일 인덱스 사용
  Object.keys(byProcess).forEach(proc=>{
    byProcess[proc].forEach((r, idx)=>{ r._photoIdx = idx+1; });
  });

  const wb = XLSX.utils.book_new();
  Object.keys(byProcess).forEach(proc=>{
    const items = byProcess[proc];
    const rows2 = items.map((r, idx)=>{
      const score = (Number(r.frequency)||0)*(Number(r.severity)||0);
      const afterScore = (r.afterFrequency && r.afterSeverity) ? Number(r.afterFrequency)*Number(r.afterSeverity) : '';
      const hazardCat = [r.hazardCategory, r.hazardDetailType].filter(Boolean).join(' · ');
      return [
        idx+1, r.process||'', r.task||'', hazardCat,
        r.hazard||'', r.currentMeasures||'',
        r.frequency||'', r.severity||'', score||'',
        r.measures||'',
        afterScore,
        r.createdAt ? fmtDate(r.createdAt) : '', '',
        r.reporter||''
      ];
    });
    const ws2 = XLSX.utils.aoa_to_sheet([header2, ...rows2]);
    ws2['!cols'] = [{wch:5},{wch:10},{wch:14},{wch:16},{wch:32},{wch:24},{wch:7},{wch:7},{wch:7},{wch:28},{wch:9},{wch:11},{wch:11},{wch:10}];
    const safeSheetName2 = (proc+'_평가표').slice(0,31).replace(/[\\\/\?\*\[\]:]/g,'');
    XLSX.utils.book_append_sheet(wb, ws2, safeSheetName2 || 'Sheet');

    const rows3 = items.map(r=>{
      const score = (Number(r.frequency)||0)*(Number(r.severity)||0);
      const afterScore = (r.afterFrequency && r.afterSeverity) ? Number(r.afterFrequency)*Number(r.afterSeverity) : '';
      return [
        r.process||'', r.hazard||'', r.measures||'',
        r.photoBefore ? `${proc}_${r._photoIdx}_개선전.${dataUrlToExt(r.photoBefore)}` : '-',
        r.photoAfter ? `${proc}_${r._photoIdx}_개선후.${dataUrlToExt(r.photoAfter)}` : '-',
        score, afterScore,
        statusLabel(r.status)||'', r.reporter||''
      ];
    });
    const ws3 = XLSX.utils.aoa_to_sheet([header3, ...rows3]);
    ws3['!cols'] = [{wch:10},{wch:32},{wch:28},{wch:22},{wch:22},{wch:10},{wch:10},{wch:12},{wch:10}];
    const safeSheetName3 = (proc+'_개선계획').slice(0,31).replace(/[\\\/\?\*\[\]:]/g,'');
    XLSX.utils.book_append_sheet(wb, ws3, safeSheetName3 || 'Sheet2');
  });
  XLSX.writeFile(wb, `위험성평가_${todayStr()}.xlsx`);

  // 사진은 엑셀에 직접 넣을 수 없어(무료 라이브러리 한계), 별도 zip 파일로 같이 내려받게 처리
  if(typeof JSZip==='undefined'){
    toast('사진 압축 라이브러리를 불러오지 못해 사진은 함께 다운로드되지 않았습니다.');
    return;
  }
  const hasAnyPhoto = list.some(r=>r.photoBefore||r.photoAfter);
  if(!hasAnyPhoto) return;
  const zip = new JSZip();
  Object.keys(byProcess).forEach(proc=>{
    const folder = zip.folder(proc);
    byProcess[proc].forEach(r=>{
      if(r.photoBefore){
        folder.file(`${proc}_${r._photoIdx}_개선전.${dataUrlToExt(r.photoBefore)}`, dataUrlToBase64(r.photoBefore), {base64:true});
      }
      if(r.photoAfter){
        folder.file(`${proc}_${r._photoIdx}_개선후.${dataUrlToExt(r.photoAfter)}`, dataUrlToBase64(r.photoAfter), {base64:true});
      }
    });
  });
  zip.generateAsync({type:'blob'}).then(blob=>{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `위험성평가_사진_${todayStr()}.zip`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
    toast('사진은 별도 zip 파일로 함께 다운로드됩니다');
  });
}

const HAZARD_SUBCATEGORIES = {
  '기계적요인': ['협착·끼임','절단·베임','말림','충돌·부딪힘','튀어나옴','기타(직접입력)'],
  '전기적요인': ['감전','누전·합선','정전기','아크·스파크','기타(직접입력)'],
  '화학적요인': ['유해가스·증기','분진','화재·폭발','부식성물질','피부접촉·흡입','기타(직접입력)'],
  '생물학적요인': ['세균·바이러스','곰팡이·진균','동물·곤충','기타(직접입력)'],
  '작업특성요인': ['반복작업','부적절한자세','과도한힘','중량물취급','기타(직접입력)'],
  '작업환경요인': ['소음·진동','고온·저온','조명불량','밀폐공간','미끄러짐·넘어짐','기타(직접입력)'],
};

function openRiskModal(existing){
  const isEdit = !!existing;
  const v = existing || {};
  const isAdmin = State.mode==='admin';
  const isManager = State.mode==='admin' || State.mode==='dept';
  showModal(`
    <div class="modal-head"><h3>${isEdit?t('risk_edit_title'):t('risk_new_title')}</h3><button class="x-btn" data-close>✕</button></div>
    <div class="modal-body">
      <div class="row2">
        <div class="field"><label>${t('lbl_processname')} *</label>
          <select id="f_process">
            <option value="">${t('opt_select_please')}</option>
            ${PROCESS_OPTIONS.map(p=>`<option value="${p}" ${v.process===p?'selected':''}>${esc(p)}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>${t('lbl_subtask')}</label><input type="text" id="f_task" value="${esc(v.task||'')}" placeholder="예: 주형 이동"></div>
      </div>
      <div class="field"><label>${t('lbl_hazard')} *</label><textarea id="f_hazard">${esc(v.hazard||'')}</textarea></div>
      <div class="field"><label>${t('lbl_risktype')}</label>
        <select id="f_riskType">
          <option value="">${t('opt_none_selected')}</option>
          ${ACCIDENT_TYPES.filter(at=>at!=='기타(직접입력)').map(at=>`<option value="${at}" ${(v.riskType||v.linkedAccidentType)===at?'selected':''}>${t('accidenttype_'+at)}</option>`).join('')}
        </select>
      </div>
      <div class="row2">
        <div class="field"><label>${t('lbl_frequency')} *</label>
          <select id="f_frequency">
            ${[1,2,3,4,5].map(n=>`<option value="${n}" ${Number(v.frequency)===n?'selected':''}>${t('freq_'+n)}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>${t('lbl_severity')} *</label>
          <select id="f_severity">
            ${[1,2,3,4].map(n=>`<option value="${n}" ${Number(v.severity)===n?'selected':''}>${t('sev_'+n)}</option>`).join('')}
          </select>
          <p id="riskTypeHint" style="color:var(--danger);font-size:11.5px;font-weight:700;margin:5px 0 0;"></p>
        </div>
      </div>
      <div class="field"><label>${t('lbl_current_measures')}</label><textarea id="f_currentMeasures" placeholder="${t('hint_current_measures')}">${esc(v.currentMeasures||'')}</textarea></div>
      <div class="field"><label>${t('lbl_measures_only')} *</label><textarea id="f_measures">${esc(v.measures||'')}</textarea></div>
      <div class="field"><label>${t('lbl_photo_before')}</label>
        ${photoFieldHtml('f_photoBefore', v.photoBefore, v.photoBefore?`<p class="hint">${t('hint_photo_replace')}</p>`:'')}
      </div>
      <div class="field"><label>${t('th_reporter_applicant')} *</label><input type="text" id="f_reporter" value="${esc(v.reporter||'')}" placeholder="이름"></div>
      ${isManager ? `
      <div class="divider"></div>
      <p class="hint" style="margin-bottom:8px;font-weight:700;color:var(--ink-soft);">관리자 전용 항목 (서류용 상세분류)</p>
      <div class="field"><label>${t('lbl_progress_admin')}</label>
        <select id="f_status">${(isAdmin ? ['접수완료','조치중','완료'] : ['접수완료','조치중']).map(s=>`<option value="${s}" ${(v.status===s || (s==='완료' && v.status==='일부개선완료'))?'selected':''}>${statusLabel(s)}</option>`).join('')}</select>
        ${!isAdmin ? `<p class="hint">"완료" 최종 처리는 전체관리자만 할 수 있습니다.</p>` : ''}
      </div>
      <div class="row2">
        <div class="field"><label>위험분류</label>
          <select id="f_hazardCategory">
            <option value="">선택 안 함</option>
            ${Object.keys(HAZARD_SUBCATEGORIES).map(c=>`<option value="${c}" ${v.hazardCategory===c?'selected':''}>${c}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>위험세부분류</label>
          <select id="f_hazardDetailType" ${v.hazardCategory?'':'disabled'}>
            <option value="">${v.hazardCategory ? '선택 안 함' : '먼저 위험분류를 선택하세요'}</option>
            ${(HAZARD_SUBCATEGORIES[v.hazardCategory]||[]).map(d=>`<option value="${d}" ${v.hazardDetailType===d?'selected':''}>${d}</option>`).join('')}
          </select>
          <input type="text" id="f_hazardDetailTypeOther" value="${esc(v.hazardDetailType && !(HAZARD_SUBCATEGORIES[v.hazardCategory]||[]).includes(v.hazardDetailType) ? v.hazardDetailType : '')}" placeholder="세부분류 직접 입력" style="margin-top:8px;${v.hazardDetailType && !(HAZARD_SUBCATEGORIES[v.hazardCategory]||[]).includes(v.hazardDetailType) ? '' : 'display:none'}">
        </div>
      </div>
      ${isAdmin ? `
      <div class="field"><label>${t('lbl_photo_after')}</label>
        ${photoFieldHtml('f_photoAfter', v.photoAfter, v.photoAfter?`<p class="hint">${t('hint_photo_replace')}</p>`:'')}
      </div>
      <div id="afterEvalFields" style="${v.status==='완료'||v.status==='일부개선완료'?'':'display:none'};background:#F7F8FA;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:6px;">
        <p class="hint" style="margin-bottom:8px;font-weight:700;">개선후 재평가 — 완료 처리 시 반드시 입력해주세요</p>
        <div class="row2">
          <div class="field"><label>개선후 가능성</label>
            <select id="f_afterFrequency">
              <option value="">${t('opt_select_please')}</option>
              ${[1,2,3,4,5].map(n=>`<option value="${n}" ${Number(v.afterFrequency)===n?'selected':''}>${t('freq_'+n)}</option>`).join('')}
            </select>
          </div>
          <div class="field"><label>개선후 강도</label>
            <select id="f_afterSeverity">
              <option value="">${t('opt_select_please')}</option>
              ${[1,2,3,4].map(n=>`<option value="${n}" ${Number(v.afterSeverity)===n?'selected':''}>${t('sev_'+n)}</option>`).join('')}
            </select>
          </div>
        </div>
        <p class="hint">재평가 점수가 6점 이하면 "완료"로 저장됩니다. 7점 이상이면 저장 전에 확인창이 뜨고, 확인하면 "일부개선완료"로 저장됩니다.</p>
      </div>
      ` : ''}
      ` : ''}
    </div>
    <div class="modal-foot">
      <button class="btn" data-close>${t('btn_cancel')}</button>
      <button class="btn btn-primary" id="saveRiskBtn">${t('btn_save')}</button>
    </div>
  `);
  bindPhotoField('f_photoBefore', 'risk-photos');
  const riskTypeSel = document.getElementById('f_riskType');
  const riskTypeHint = document.getElementById('riskTypeHint');
  function updateRiskTypeHint(){
    const rt = riskTypeSel.value;
    if(rt && ACCIDENT_SEVERITY_HINT[rt]){
      riskTypeHint.textContent = `⚠ ${t('risktype_hint_prefix')} ${ACCIDENT_SEVERITY_HINT[rt]} (${t('risktype_hint_basis')}: ${t('accidenttype_'+rt)} — ${t('risktype_hint_suffix')})`;
    }else{
      riskTypeHint.textContent = '';
    }
  }
  riskTypeSel.addEventListener('change', updateRiskTypeHint);
  updateRiskTypeHint();
  if(isManager){
    if(isAdmin) bindPhotoField('f_photoAfter', 'risk-photos');
    const statusSel = document.getElementById('f_status');
    const afterFields = document.getElementById('afterEvalFields');
    if(afterFields){
      statusSel.addEventListener('change', e=>{
        afterFields.style.display = (isAdmin && e.target.value==='완료') ? '' : 'none';
      });
    }
    const catSel = document.getElementById('f_hazardCategory');
    const detailSel = document.getElementById('f_hazardDetailType');
    const detailOther = document.getElementById('f_hazardDetailTypeOther');
    catSel.addEventListener('change', ()=>{
      const cat = catSel.value;
      const opts = HAZARD_SUBCATEGORIES[cat] || [];
      detailSel.disabled = !cat;
      detailSel.innerHTML = `<option value="">${cat ? '선택 안 함' : '먼저 위험분류를 선택하세요'}</option>` +
        opts.map(d=>`<option value="${d}">${d}</option>`).join('');
      detailOther.style.display = 'none';
      detailOther.value = '';
    });
    detailSel.addEventListener('change', ()=>{
      detailOther.style.display = detailSel.value==='기타(직접입력)' ? '' : 'none';
    });
  }
  document.getElementById('saveRiskBtn').addEventListener('click', async ()=>{
    const data = {
      process: document.getElementById('f_process').value.trim(),
      task: document.getElementById('f_task').value.trim(),
      hazard: document.getElementById('f_hazard').value.trim(),
      riskType: document.getElementById('f_riskType').value,
      frequency: Number(document.getElementById('f_frequency').value),
      severity: Number(document.getElementById('f_severity').value),
      currentMeasures: document.getElementById('f_currentMeasures').value.trim(),
      measures: document.getElementById('f_measures').value.trim(),
      reporter: document.getElementById('f_reporter').value.trim(),
    };
    let chosenStatus = null;
    if(isManager && document.getElementById('f_status')){
      chosenStatus = document.getElementById('f_status').value;
      data.status = chosenStatus;
    }else if(!isEdit){
      data.status = '접수완료';
    }
    if(!data.process || !data.hazard || !data.measures || !data.reporter){ toast(t('toast_fill_required')); return; }

    if(isManager){
      data.hazardCategory = document.getElementById('f_hazardCategory').value;
      const detailSelVal = document.getElementById('f_hazardDetailType').value;
      const detailOtherVal = document.getElementById('f_hazardDetailTypeOther').value.trim();
      data.hazardDetailType = (detailSelVal==='기타(직접입력)' || (!detailSelVal && detailOtherVal)) ? detailOtherVal : detailSelVal;
    }

    // 완료 처리 시 개선후 재평가 필수. 점수가 7점 이상이면 바로 저장하지 않고 확인 팝업을 먼저 띄움
    let pendingPartial = false, afterScore = null;
    if(isAdmin && chosenStatus==='완료'){
      const af = document.getElementById('f_afterFrequency').value;
      const as = document.getElementById('f_afterSeverity').value;
      if(!af || !as){ toast('완료 처리하려면 개선후 재평가(가능성·강도)를 입력해주세요'); return; }
      const afterFrequency = Number(af), afterSeverity = Number(as);
      afterScore = afterFrequency * afterSeverity;
      data.afterFrequency = afterFrequency;
      data.afterSeverity = afterSeverity;
      if(afterScore <= 6){
        data.status = '완료';
      }else{
        data.status = '일부개선완료';
        pendingPartial = true;
      }
    }

    const photoBeforeInput = document.getElementById('f_photoBefore');
    const photoBeforeFile = photoBeforeInput.files[0];
    if(photoBeforeFile){
      if(photoBeforeFile.size > 5*1024*1024){ toast(t('toast_photo_toobig')); return; }
      data.photoBefore = photoBeforeInput.dataset.uploadedUrl || await uploadFileToStorage(photoBeforeFile, 'risk-photos');
      data.photoBeforeSize = photoBeforeFile.size;
    }
    const photoAfterInput = document.getElementById('f_photoAfter');
    if(photoAfterInput){
      const photoAfterFile = photoAfterInput.files[0];
      if(photoAfterFile){
        if(photoAfterFile.size > 5*1024*1024){ toast(t('toast_photo_toobig')); return; }
        data.photoAfter = photoAfterInput.dataset.uploadedUrl || await uploadFileToStorage(photoAfterFile, 'risk-photos');
        data.photoAfterSize = photoAfterFile.size;
      }
    }

    if(pendingPartial){
      openPartialImprovementConfirm(afterScore, ()=> finalizeRiskSave(data, isEdit, existing));
      return;
    }
    await finalizeRiskSave(data, isEdit, existing);
  });
}

// 개선후 재평가 점수가 7점 이상일 때 뜨는 확인 팝업 — 확인을 눌러야 실제 저장됨
function openPartialImprovementConfirm(afterScore, onConfirm){
  showModal(`
    <div class="modal-head"><h3>추가 개선 필요 안내</h3><button class="x-btn" data-close>✕</button></div>
    <div class="modal-body">
      <p style="font-size:13.5px;line-height:1.7;">
        재평가 결과 위험도가 <b>${afterScore}점</b>으로 아직 높습니다.<br>
        <b>"일부개선완료"</b>로 저장되며, 계속 관리 대상에 남아 추가 개선이 필요합니다.
      </p>
      <p class="hint">그대로 진행하시겠습니까?</p>
    </div>
    <div class="modal-foot">
      <button class="btn" data-close>취소</button>
      <button class="btn btn-primary" id="confirmPartialBtn">확인하고 저장</button>
    </div>
  `);
  document.getElementById('confirmPartialBtn').addEventListener('click', async ()=>{
    await onConfirm();
  });
}

async function finalizeRiskSave(data, isEdit, existing){
  if(isEdit){
    await DataStore.update(PATHS.risks, existing.id, data);
    toast(t('toast_risk_updated'));
    closeModal(); renderRisks();
  }else{
    data.createdAt = Date.now();
    const newId = await DataStore.push(PATHS.risks, data);
    closeModal();
    if(State.mode!=='admin'){
      addMyOwnedId('isc_my_risks', newId);
      showSuccessPopup(t('toast_risk_registered'));
    }else{
      toast(t('toast_risk_registered'));
    }
    renderRisks();
  }
}

function calcLeaveDays(incidentDatetime, returnDate){
  if(!incidentDatetime || !returnDate) return null;
  const start = new Date(incidentDatetime);
  const end = new Date(returnDate+'T00:00:00');
  const diffMs = end - new Date(start.getFullYear(),start.getMonth(),start.getDate());
  const days = Math.round(diffMs / (1000*60*60*24));
  return days>=0 ? days : null;
}

      <div class="field"><label>${t('lbl_status_admin')}</label>
        <select id="f_status">${['접수','조사중','완료'].map(s=>`<option value="${s}" ${v.status===s?'selected':''}>${statusLabel(s)}</option>`).join('')}</select>

      </div>

      <button class="btn" data-close>${t('btn_cancel')}</button>
      <button class="btn btn-primary" id="saveIncBtn">${t('btn_save')}</button>
    </div>
  `);
  bindPhotoField('f_incPhoto1', 'incident-photos');
  bindPhotoField('f_incPhoto2', 'incident-photos');
  document.getElementById('f_accidentType').addEventListener('change', e=>{
    document.getElementById('f_accidentTypeOther').style.display = e.target.value==='기타(직접입력)' ? '' : 'none';
  });
  document.getElementById('f_sameAsReporter').addEventListener('change', e=>{
    if(e.target.checked){
      document.getElementById('f_injuredPerson').value = document.getElementById('f_reporter').value;
    }
  });
  document.getElementById('f_reporter').addEventListener('input', e=>{
    if(document.getElementById('f_sameAsReporter').checked){
      document.getElementById('f_injuredPerson').value = e.target.value;
    }
  });
  if(State.mode==='admin'){
    const recalc = ()=>{
      const d = calcLeaveDays(document.getElementById('f_datetime').value, document.getElementById('f_returnDate').value);
      document.getElementById('f_leaveDaysDisplay').value = d!=null ? d+'일' : '-';
    };
    document.getElementById('f_returnDate').addEventListener('change', recalc);
    document.getElementById('f_datetime').addEventListener('change', recalc);
  }
  document.getElementById('saveIncBtn').addEventListener('click', async ()=>{
    const accidentType = document.getElementById('f_accidentType').value;
    const data = {
      process: document.getElementById('f_process').value,
      datetime: document.getElementById('f_datetime').value,
      location: document.getElementById('f_location').value.trim(),
      accidentType,
      accidentTypeOther: accidentType==='기타(직접입력)' ? document.getElementById('f_accidentTypeOther').value.trim() : '',
      description: document.getElementById('f_description').value.trim(),
      reporter: document.getElementById('f_reporter').value.trim(),
      injuredPerson: document.getElementById('f_injuredPerson').value.trim(),
      injurySeverity: document.getElementById('f_injurySeverity').value,
      injuryDetail: document.getElementById('f_injuryDetail').value.trim(),
    };
    const photo1Input = document.getElementById('f_incPhoto1');
    const photo1File = photo1Input.files[0];
    if(photo1File){
      if(photo1File.size > 5*1024*1024){ toast(t('toast_photo_toobig')); return; }
      data.photo1 = photo1Input.dataset.uploadedUrl || await uploadFileToStorage(photo1File, 'incident-photos');
      data.photo1Size = photo1File.size;
    }
    const photo2Input = document.getElementById('f_incPhoto2');
    const photo2File = photo2Input.files[0];
    if(photo2File){
      if(photo2File.size > 5*1024*1024){ toast(t('toast_photo_toobig')); return; }
      data.photo2 = photo2Input.dataset.uploadedUrl || await uploadFileToStorage(photo2File, 'incident-photos');
      data.photo2Size = photo2File.size;
    }
    if(State.mode==='admin'){
      data.status = document.getElementById('f_status').value;
      data.action = document.getElementById('f_action').value.trim();
      data.returnDate = document.getElementById('f_returnDate').value;
      const d = calcLeaveDays(data.datetime, data.returnDate);
      data.leaveDays = d;
    }else if(!isEdit){
      data.status = '접수';
    }
    if(!data.process || !data.location || !data.description || !data.datetime || !data.reporter || !data.injuredPerson || !accidentType || (accidentType==='기타(직접입력)' && !data.accidentTypeOther)){
      toast(t('toast_fill_required')); return;
    }
    if(isEdit){
      await DataStore.update(PATHS.incidents, existing.id, data);
      toast(t('toast_incident_updated'));
      closeModal(); renderIncidents();
    }else{
      data.createdAt = Date.now();
      const newId = await DataStore.push(PATHS.incidents, data);
      // 사고접수가 등록되면 위험성평가에도 자동 연동 등록 (관리자가 이어서 평가만 하면 됨)
      // - 부상정도(injurySeverity)를 강도(severity)에 그대로 반영 (같은 척도를 쓰므로)
      // - 사고유형은 세부작업 칸에 참고로 표시, riskType으로 저장해 위험성평가와 동일하게 추천점수에 활용
      const typeLabel = accidentType==='기타(직접입력)' ? data.accidentTypeOther : t('accidenttype_'+accidentType);
      await DataStore.push(PATHS.risks, {
        process: data.process,
        task: typeLabel || '',
        hazard: `사고 접수로 등록됨: ${data.description}`,
        riskType: accidentType==='기타(직접입력)' ? '' : accidentType,
        frequency: '', severity: data.injurySeverity || '',
        measures: '',
        reporter: data.reporter,
        status: '접수완료',
        linkedIncidentId: newId,
        createdAt: Date.now(),
      });
      closeModal();
      if(State.mode!=='admin'){
        addMyOwnedId('isc_my_incidents', newId);
        showSuccessPopup(t('toast_incident_registered'));
      }else{
        toast(t('toast_incident_registered'));
      }
      renderIncidents();
    }
  });
}

// 여러 줄을 "▪ 한 줄씩" 입력받는 재사용 컴포넌트 (원인/사고내용/미흡사항/대책 등에서 공통 사용)
function bulletListInputHtml(idPrefix, text){
  const lines = (text||'').split('\n').map(l=>l.trim()).filter(Boolean);
  const arr = lines.length ? lines : [''];
  return `<div class="bullet-list" id="${idPrefix}_list">
    ${arr.map(line=>bulletLineRowHtml(line)).join('')}
  </div>
  <button type="button" class="btn btn-sm" data-bullet-add="${idPrefix}" style="margin-top:6px;">+ 줄 추가</button>`;
}
function bulletLineRowHtml(value){
  return `<div class="bullet-line-row">
    <span class="bullet-dot">▪</span>
    <input type="text" class="bullet-line-input" value="${esc(value||'')}">
    <button type="button" class="bullet-remove" title="이 줄 삭제">✕</button>
  </div>`;
}
function bindBulletList(idPrefix){
  const container = document.getElementById(idPrefix+'_list');
  const addBtn = document.querySelector(`[data-bullet-add="${idPrefix}"]`);
  function bindRemove(row){
    row.querySelector('.bullet-remove').addEventListener('click', ()=>{
      if(container.children.length>1) row.remove();
      else row.querySelector('.bullet-line-input').value = '';
    });
  }
  container.querySelectorAll('.bullet-line-row').forEach(bindRemove);
  addBtn.addEventListener('click', ()=>{
    const div = document.createElement('div');
    div.className = 'bullet-line-row';
    div.innerHTML = `<span class="bullet-dot">▪</span><input type="text" class="bullet-line-input" value=""><button type="button" class="bullet-remove" title="이 줄 삭제">✕</button>`;
    container.appendChild(div);
    bindRemove(div);
    div.querySelector('input').focus();
  });
}
function collectBulletList(idPrefix){
  const container = document.getElementById(idPrefix+'_list');
  return Array.from(container.querySelectorAll('.bullet-line-input')).map(inp=>inp.value.trim()).filter(Boolean).join('\n');
}

function checklistToggleHtml(cat, item, idx, current){
  const opts = ['O','△','X','-'];
  return `<div class="rpt-chk-row">
    <span class="rpt-chk-label">${esc(item)}</span>
    <div class="rpt-chk-btns" data-cat="${esc(cat)}" data-idx="${idx}">
      ${opts.map(o=>`<button type="button" class="rpt-chk-btn ${current===o?'active':''}" data-val="${o}">${o}</button>`).join('')}
    </div>
  </div>`;
}

      <div class="section-title"><span class="n">01</span> 기본 정보</div>
      <div class="field"><label>보고서 부제 (예: 웻지 스프링 와이어 교체작업 중 손 열상 사고)</label><input type="text" id="rpt_title" value="${esc(v.reportTitle)}"></div>
      <div class="row3">
        <div class="field"><label>재해자 생년월일</label><input type="date" id="rpt_birth" value="${v.reportBirthDate}"></div>
        <div class="field"><label>입사일</label><input type="date" id="rpt_hire" value="${v.reportHireDate}"></div>
        <div class="field"><label>성별</label>
          <select id="rpt_gender"><option value="">-</option><option value="남" ${v.reportGender==='남'?'selected':''}>남</option><option value="여" ${v.reportGender==='여'?'selected':''}>여</option></select>
        </div>
      </div>
      <p class="hint" id="rpt_ageTenurePreview">연령·근속은 사고발생일 기준으로 자동 계산되어 보고서에 반영됩니다.</p>

      <div class="section-title"><span class="n">02</span> 사고내용 서술</div>
      <div class="field">${bulletListInputHtml('rpt_narrative', v.reportNarrative)}</div>

      <div class="section-title"><span class="n">03</span> 원인</div>
      <div class="field">${bulletListInputHtml('rpt_causes', v.reportCauses)}</div>

      <div class="section-title"><span class="n">04</span> 비고</div>
      <label style="display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px;margin-bottom:8px;">
        <input type="checkbox" id="rpt_remarksCheck" ${v.reportRemarks?'checked':''}> 비고 있음
      </label>
      <div class="field" id="rpt_remarksField" style="${v.reportRemarks?'':'display:none'}">${bulletListInputHtml('rpt_remarks', v.reportRemarks)}</div>

      <div class="section-title"><span class="n">05</span> 안전관리항목 Check (O 양호 / △ 미흡 / X 불량 / - 해당없음)</div>
      <div class="rpt-cat-grid" id="rpt_checklistGrid">
        ${Object.keys(RPT_CHECKLIST).map(cat=>`
          <div class="rpt-cat-col">
            <div class="rpt-cat-title" style="color:#${RPT_CATCOLOR[cat]};">${esc(RPT_CATLABEL_UI[cat])}</div>
            ${RPT_CHECKLIST[cat].map((item,idx)=>checklistToggleHtml(cat, item, idx, v.reportChecklist[cat+'_'+idx]||'')).join('')}
          </div>
        `).join('')}
      </div>

      <div class="section-title"><span class="n">06</span> 미흡 사항 (카테고리별)</div>
      ${Object.keys(RPT_CHECKLIST).map(cat=>`
        <div class="field"><label style="color:#${RPT_CATCOLOR[cat]};">${esc(RPT_CATLABEL_UI[cat])} 미흡 사항</label>
          <p class="hint" id="rpt_def_hint_${cat}" style="margin:-2px 0 6px;">방금 체크한 항목: (없음)</p>
          ${bulletListInputHtml('rpt_def_'+cat, v.reportDeficiency[cat]||'')}
        </div>
      `).join('')}

      <div class="section-title"><span class="n">07</span> 사고 원인 및 재발방지 대책</div>
      <p class="hint" style="margin-top:-6px;">원인은 위 "미흡 사항"에서 자동으로 채워집니다 (직접 수정 가능). 대책은 직접 작성해주세요.</p>
      ${v.reportCauseMeasure.map((row,idx)=>`
        <div class="field" style="background:#F7F8FA;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;">
          <label style="font-weight:800;">${esc(row.cat)}</label>
          <div class="row2">
            <div class="field"><label>원인</label>${bulletListInputHtml('rpt_cm_cause_'+idx, row.cause||'')}</div>
            <div class="field"><label>대책</label>${bulletListInputHtml('rpt_cm_measure_'+idx, row.measure||'')}</div>

  // 글머리기호 입력(사고내용/원인/비고/미흡사항/원인·대책) 전부 바인딩
  ['rpt_narrative','rpt_causes','rpt_remarks','rpt_def_인적','rpt_def_물적','rpt_def_시스템','rpt_def_환경',
   'rpt_cm_cause_0','rpt_cm_measure_0','rpt_cm_cause_1','rpt_cm_measure_1','rpt_cm_cause_2','rpt_cm_measure_2'
  ].forEach(id=> bindBulletList(id));

  // 비고 체크박스 — 체크했을 때만 입력창을 보여줌 (PPT에는 항상 원본 행이 유지되고, 값이 없으면 그 칸만 비워둠)
  document.getElementById('rpt_remarksCheck').addEventListener('change', e=>{
    document.getElementById('rpt_remarksField').style.display = e.target.checked ? '' : 'none';
  });

  // 방금 체크한(X·△) 항목을 미흡사항 입력란 옆에 요약해서 보여줌 — 위로 다시 스크롤해서 찾지 않아도 되도록
  function refreshDeficiencyHints(){
    Object.keys(RPT_CHECKLIST).forEach(cat=>{
      const flagged = [];
      document.querySelectorAll(`#rpt_checklistGrid .rpt-chk-btns[data-cat="${cat}"]`).forEach(group=>{
        const active = group.querySelector('.rpt-chk-btn.active');
        if(active && (active.dataset.val==='X' || active.dataset.val==='△')) flagged.push(RPT_CHECKLIST[cat][parseInt(group.dataset.idx,10)]);
      });
      document.getElementById('rpt_def_hint_'+cat).textContent = '방금 체크한 항목: ' + (flagged.length ? flagged.join(', ') : '(없음)');
    });
  }
  refreshDeficiencyHints();

  // 체크리스트 버튼 토글
  document.querySelectorAll('#rpt_checklistGrid .rpt-chk-btns').forEach(group=>{
    group.querySelectorAll('.rpt-chk-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        group.querySelectorAll('.rpt-chk-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        refreshDeficiencyHints();
      });
    });
  });

  // 미흡사항 입력 시, 원인 칸이 비어있으면 자동으로 채워줌(직접 입력한 값은 덮어쓰지 않음)
  function autoFillCauses(){
    const def = { 인적: collectBulletList('rpt_def_인적'),
                  물적: collectBulletList('rpt_def_물적'),
                  시스템: collectBulletList('rpt_def_시스템'),
                  환경: collectBulletList('rpt_def_환경') };
    const map = [ ['인적'], ['물적'], ['시스템','환경'] ];
    map.forEach((cats, idx)=>{
      if(!collectBulletList('rpt_cm_cause_'+idx)){
        const merged = cats.map(c=>def[c]).filter(x=>x && x!=='해당 없음').join('\n');
        const listEl = document.getElementById('rpt_cm_cause_'+idx+'_list');
        const lines2 = merged.split('\n').map(l=>l.trim()).filter(Boolean);
        listEl.innerHTML = (lines2.length?lines2:['']).map(l=>bulletLineRowHtml(l)).join('');
        bindBulletList('rpt_cm_cause_'+idx);
      }
    });
  }
  ['인적','물적','시스템','환경'].forEach(cat=>{
    document.getElementById('rpt_def_'+cat+'_list').addEventListener('focusout', autoFillCauses);
  });

  function collectReportData(){
    const checklist = {};
    document.querySelectorAll('#rpt_checklistGrid .rpt-chk-btns').forEach(group=>{
      const active = group.querySelector('.rpt-chk-btn.active');
      if(active) checklist[group.dataset.cat+'_'+group.dataset.idx] = active.dataset.val;
    });
    const causeMeasure = v.reportCauseMeasure.map((row,idx)=>({
      cat: row.cat,
      cause: collectBulletList('rpt_cm_cause_'+idx),
      measure: collectBulletList('rpt_cm_measure_'+idx),
    }));
    const remarksOn = document.getElementById('rpt_remarksCheck').checked;
    return {
      reportTitle: document.getElementById('rpt_title').value.trim(),
      reportBirthDate: document.getElementById('rpt_birth').value,
      reportHireDate: document.getElementById('rpt_hire').value,
      reportGender: document.getElementById('rpt_gender').value,
      reportNarrative: collectBulletList('rpt_narrative'),
      reportCauses: collectBulletList('rpt_causes'),
      reportRemarks: remarksOn ? collectBulletList('rpt_remarks') : '',
      reportChecklist: checklist,
      reportDeficiency: {
        인적: collectBulletList('rpt_def_인적'),
        물적: collectBulletList('rpt_def_물적'),
        시스템: collectBulletList('rpt_def_시스템'),
        환경: collectBulletList('rpt_def_환경'),
      },
      reportCauseMeasure: causeMeasure,
      reportUpdatedAt: Date.now(),
    };
  }

  document.getElementById('rptSaveBtn').addEventListener('click', async ()=>{
    try{
      const data = collectReportData();
      await DataStore.update(PATHS.incidents, i.id, data);
      window.__noBackdropClose = false;
      toast('보고서 내용이 저장되었습니다');
      closeModal();
      openIncidentDetail(i.id);
    }catch(err){
      console.error('보고서 저장 오류:', err);
      alert('저장 중 오류가 발생했습니다.\n\n[오류 내용]\n' + (err&&err.message?err.message:String(err)));
    }
  });

  document.getElementById('rptDownloadBtn').addEventListener('click', async ()=>{
    try{
      const data = collectReportData();
      if(!data.reportTitle || !data.reportNarrative){
        toast('보고서 부제와 사고내용은 입력해주세요'); return;
      }
      await DataStore.update(PATHS.incidents, i.id, data);
      await generateIncidentReportPptx(Object.assign({}, i, data));
      toast('PPT 파일이 다운로드되었습니다');
    }catch(err){
      console.error('보고서 다운로드 오류:', err);
      alert('다운로드 중 오류가 발생했습니다.\n\n[오류 내용]\n' + (err&&err.message?err.message:String(err)));
    }
  });
}

async function generateIncidentReportPptx(i){
  if(typeof PizZip==='undefined'){
    toast('문서 생성 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해주세요.');
    return;
  }
  try{
    const NAVY_CATCOLOR = RPT_CATCOLOR;
    const CHECKLIST_ID_MAP = {
      인적: { checkbox:[110,107,94,109,85,92], label:[13,14,15,16,17,59] },
      물적: { checkbox:[87,93,103,65,66,106], label:[60,61,62,63,64,105] },
      시스템: { checkbox:[74,88,104,89,90,108], label:[67,68,69,70,71,72] },
      환경: { checkbox:[111,81,82,91,84,112], label:[75,76,77,78,79,80] },
    };
    const DEF_ID_MAP = { 인적:95, 물적:113, 시스템:99, 환경:98 };

    function escXml(s){
      return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');
    }
    function extractRPr(between){
      const openMatch = /<a:rPr\b[^>]*>/.exec(between);
      if(!openMatch) return '';
      const openTag = openMatch[0];
      if(openTag.slice(-2)==='/>') return openTag;
      const closeIdx = between.indexOf('</a:rPr>', openMatch.index);
      if(closeIdx===-1) return openTag;
      return between.slice(openMatch.index, closeIdx + '</a:rPr>'.length);
    }
    function injectMarker(xml, marker, text, bullet){
      const markerIdx = xml.indexOf(marker);
      if(markerIdx===-1) return xml;
      const tOpenIdx = xml.lastIndexOf('<a:t>', markerIdx);
      const tCloseIdx = xml.indexOf('</a:t>', markerIdx);
      if(tOpenIdx===-1 || tCloseIdx===-1) return xml;
      const tContent = xml.slice(tOpenIdx+5, tCloseIdx);
      if(tContent === marker){
        const rOpenIdx = xml.lastIndexOf('<a:r>', tOpenIdx);
        const rCloseIdx = xml.indexOf('</a:r>', tCloseIdx) + '</a:r>'.length;
        const rPr = extractRPr(xml.slice(rOpenIdx, tOpenIdx));
        const lines = String(text||'').split('\n').filter(l=>l.trim()!=='');
        const finalLines = lines.length ? lines : [''];
        const runs = finalLines.map((line,idx)=>{
          const br = idx>0 ? '<a:br/>' : '';
          const prefixed = bullet ? ('▪ ' + line) : line;
          return br + `<a:r>${rPr}<a:t>${escXml(prefixed)}</a:t></a:r>`;
        }).join('');
        return xml.slice(0, rOpenIdx) + runs + xml.slice(rCloseIdx);
      }
      const localIdx = tContent.indexOf(marker);
      const before = tContent.slice(0, localIdx);
      const after = tContent.slice(localIdx + marker.length);
      const newTag = `<a:t>${before}${escXml(text||'')}${after}</a:t>`;
      return xml.slice(0, tOpenIdx) + newTag + xml.slice(tCloseIdx + 6);
    }
    function injectChecklistValue(xml, shapeId, value, isBad){
      const idPattern = 'id="'+shapeId+'"';
      const idx = xml.indexOf(idPattern);
      if(idx===-1) return xml;
      const nextSpIdx = xml.indexOf('<p:sp>', idx);
      const boundary = nextSpIdx!==-1 ? nextSpIdx : idx+3000;
      const dashTag = '<a:t>-</a:t>';
      const dashIdx = xml.indexOf(dashTag, idx);
      if(dashIdx===-1 || dashIdx > boundary) return xml;
      let result = xml.slice(0, dashIdx) + `<a:t>${escXml(value)}</a:t>` + xml.slice(dashIdx + dashTag.length);
      if(isBad){
        const rPrIdx = result.indexOf('<a:rPr', idx);
        if(rPrIdx!==-1 && rPrIdx < dashIdx){
          const closeSelf = result.indexOf('/>', rPrIdx);
          const closeOpen = result.indexOf('>', rPrIdx);
          if(closeSelf!==-1 && closeSelf < closeOpen){
            result = result.slice(0, closeSelf) + '><a:solidFill><a:srgbClr val="E5484D"/></a:solidFill></a:rPr>' + result.slice(closeSelf+2);
          } else if(closeOpen!==-1){
            result = result.slice(0, closeOpen+1) + '<a:solidFill><a:srgbClr val="E5484D"/></a:solidFill>' + result.slice(closeOpen+1);
          }
        }
        const spStartApprox = xml.lastIndexOf('<p:spPr', idx);
        if(spStartApprox!==-1 && spStartApprox < boundary){
          const lnIdx = result.indexOf('<a:srgbClr val="000000">', spStartApprox);
          if(lnIdx!==-1 && lnIdx < dashIdx){
            result = result.slice(0,lnIdx) + '<a:srgbClr val="E5484D">' + result.slice(lnIdx + '<a:srgbClr val="000000">'.length);
          }
        }
      }
      return result;
    }
    function injectLabelColor(xml, shapeId, isBad){
      const idPattern = 'id="'+shapeId+'"';
      const idx = xml.indexOf(idPattern);
      if(idx===-1) return xml;
      const nextSpIdx = xml.indexOf('<p:sp>', idx);
      const boundary = nextSpIdx!==-1 ? nextSpIdx : idx+3000;
      const rPrIdx = xml.indexOf('<a:rPr', idx);
      if(rPrIdx===-1 || rPrIdx > boundary) return xml;
      const color = isBad ? 'E5484D' : '14192B';
      const closeSelf = xml.indexOf('/>', rPrIdx);
      const closeOpen = xml.indexOf('>', rPrIdx);
      // 기존에 색상 지정(solidFill)이 있으면 통째로 잘라내고 새로 지정 (원본에 이미 빨간색이 박혀있던 라벨 대응)
      const rPrEndTag = (closeSelf!==-1 && closeSelf < closeOpen) ? closeSelf+2 : xml.indexOf('</a:rPr>', rPrIdx)+8;
      if(closeSelf!==-1 && closeSelf < closeOpen){
        return xml.slice(0, closeSelf) + `><a:solidFill><a:srgbClr val="${color}"/></a:solidFill></a:rPr>` + xml.slice(closeSelf+2);
      } else if(closeOpen!==-1){
        let segment = xml.slice(closeOpen+1, rPrEndTag);
        segment = segment.replace(/<a:solidFill>[\s\S]*?<\/a:solidFill>/, '');
        return xml.slice(0, closeOpen+1) + `<a:solidFill><a:srgbClr val="${color}"/></a:solidFill>` + segment + xml.slice(rPrEndTag);
      }
      return xml;
    }

    const age = calcAgeAt(i.reportBirthDate, i.datetime);
    const tenure = calcTenureAt(i.reportHireDate, i.datetime);
    const cm = i.reportCauseMeasure || [];
    const checklist = i.reportChecklist || {};
    const deficiency = i.reportDeficiency || {};
    const dtStr = fmtDateTime(i.datetime);

    const binary = atob(RPT_TAGGED_TEMPLATE_B64);
    const bytes = new Uint8Array(binary.length);
    for(let bi=0; bi<binary.length; bi++){ bytes[bi] = binary.charCodeAt(bi); }
    const zip = new PizZip(bytes);

    // 슬라이드1: 표지
    let s1 = zip.file('ppt/slides/slide1.xml').asText();
    s1 = injectMarker(s1, '{{TITLE_SUB}}', i.reportTitle||'');
    s1 = injectMarker(s1, '{{AUTHOR_LINE}}', (State.dept||'안전환경부')+' 이건우 대리');
    s1 = injectMarker(s1, '{{DATE_LINE}}', fmtDate(Date.now()).replace(/-/g,'. ')+'.');
    zip.file('ppt/slides/slide1.xml', s1);

    // 슬라이드2: 사고발생 세부내용
    let s2 = zip.file('ppt/slides/slide2.xml').asText();
    s2 = injectMarker(s2, '{{TITLE_SUB}}', i.reportTitle||'');
    s2 = injectMarker(s2, '{{OVERVIEW}}', `▪ 일   시 : ${dtStr}\n▪ 장   소 : ${i.location||''}\n▪ 형   태 : ${(i.accidentType==='기타(직접입력)'?i.accidentTypeOther:t('accidenttype_'+i.accidentType))||''}`);
    s2 = injectMarker(s2, '{{V_NAME}}', i.injuredPerson||'-');
    s2 = injectMarker(s2, '{{V_AGE}}', age!=null?age+'세':'-');
    s2 = injectMarker(s2, '{{V_TENURE}}', tenure||'-');
    s2 = injectMarker(s2, '{{V_GENDER}}', i.reportGender||'-');
    s2 = injectMarker(s2, '{{V_DEPT}}', processDept(i.process)||'-');
    s2 = injectMarker(s2, '{{V_PROCESS}}', i.process||'-');
    s2 = injectMarker(s2, '{{NARRATIVE}}', i.reportNarrative||'', true);
    s2 = injectMarker(s2, '{{CAUSES}}', i.reportCauses||'', true);
    s2 = injectMarker(s2, '{{REMARKS}}', i.reportRemarks||'', true);
    zip.file('ppt/slides/slide2.xml', s2);
    async function toBase64DataUrl(src){
      if(!src) return null;
      if(src.startsWith('data:')) return src;
      const res = await fetch(src);
      const blob = await res.blob();
      return await new Promise((resolve,reject)=>{
        const r = new FileReader();
        r.onload = ()=> resolve(r.result);
        r.onerror = reject;
        r.readAsDataURL(blob);
      });
    }
    const photo1Data = await toBase64DataUrl(i.photo1);
    const photo2Data = await toBase64DataUrl(i.photo2);
    if(photo1Data || photo2Data){
      const existingMedia = Object.keys(zip.files).filter(f=>/^ppt\/media\/image(\d+)\.(png|jpe?g)$/.test(f));
      let nextMediaIdx = existingMedia.length ? Math.max(...existingMedia.map(f=>parseInt(f.match(/image(\d+)\./)[1],10)))+1 : 1;
      const relsPath = 'ppt/slides/_rels/slide2.xml.rels';
      let relsXml = zip.file(relsPath).asText();
      const existingIds = [...relsXml.matchAll(/Id="rId(\d+)"/g)].map(m=>parseInt(m[1],10));
      let nextRid = existingIds.length ? Math.max(...existingIds)+1 : 1;
      const RECT_X=6.19, RECT_Y1=1.18, RECT_Y2=4.03, RECT_W=3.68, RECT_H=2.75;
      const EMU=914400;
      const newRels = [];
      let spTreeCloseIdx = s2.indexOf('</p:spTree>');
      [ {photo:photo1Data, y:RECT_Y1}, {photo:photo2Data, y:RECT_Y2} ].forEach(({photo,y})=>{
        if(!photo) return;
        const b64data = (photo.split(',')[1]||'');
        const bin2 = atob(b64data);
        const bytes2 = new Uint8Array(bin2.length);
        for(let bj=0;bj<bin2.length;bj++){ bytes2[bj]=bin2.charCodeAt(bj); }
        const mediaName = `image${nextMediaIdx++}.png`;
        zip.file(`ppt/media/${mediaName}`, bytes2);
        const rId = 'rId'+(nextRid++);
        newRels.push(`<Relationship Id="${rId}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="../media/${mediaName}"/>`);
        const cx = Math.round(RECT_W*EMU), cy = Math.round(RECT_H*EMU);
        const xEmu = Math.round(RECT_X*EMU), yEmu = Math.round(y*EMU);
        const picId = 900+nextMediaIdx;
        const picXml = `<p:pic><p:nvPicPr><p:cNvPr id="${picId}" name="Photo${picId}"/><p:cNvPicPr><a:picLocks noChangeAspect="1"/></p:cNvPicPr><p:nvPr/></p:nvPicPr><p:blipFill><a:blip r:embed="${rId}"/><a:stretch><a:fillRect/></a:stretch></p:blipFill><p:spPr><a:xfrm><a:off x="${xEmu}" y="${yEmu}"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></p:spPr></p:pic>`;
        s2 = s2.slice(0, spTreeCloseIdx) + picXml + s2.slice(spTreeCloseIdx);
        spTreeCloseIdx += picXml.length;
      });
      if(newRels.length){
        relsXml = relsXml.slice(0, relsXml.indexOf('</Relationships>')) + newRels.join('') + '</Relationships>';
        zip.file(relsPath, relsXml);
        zip.file('ppt/slides/slide2.xml', s2);
      }
    }

    // 슬라이드3: 체크리스트
    let s3 = zip.file('ppt/slides/slide3.xml').asText();
    Object.keys(RPT_CHECKLIST).forEach(cat=>{
      const ids = CHECKLIST_ID_MAP[cat];
      RPT_CHECKLIST[cat].forEach((item, idx)=>{
        const val = checklist[cat+'_'+idx] || '-';
        const isBad = val==='X';
        s3 = injectChecklistValue(s3, ids.checkbox[idx], val, isBad);
        s3 = injectLabelColor(s3, ids.label[idx], isBad);
      });
      s3 = injectMarker(s3, '{{DEF_'+cat+'}}', deficiency[cat]||'', true);
    });
    zip.file('ppt/slides/slide3.xml', s3);

    // 슬라이드4: 원인 및 재발방지 대책
    let s4 = zip.file('ppt/slides/slide4.xml').asText();
    const CM_KEY = { '인적요인':'인적', '물적요인':'물적', '시스템 및 환경':'시스템환경' };
    cm.forEach(row=>{
      const key = CM_KEY[row.cat] || row.cat;
      s4 = injectMarker(s4, '{{CM_'+key+'_CAUSE}}', row.cause||'', true);
      s4 = injectMarker(s4, '{{CM_'+key+'_MEASURE}}', row.measure||'', true);
    });
    zip.file('ppt/slides/slide4.xml', s4);

    const out = zip.generate({ type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.presentationml.presentation' });
    const url = URL.createObjectURL(out);
    const a = document.createElement('a');
    a.href = url;
    const safeTitle = (i.reportTitle||'사고보고서').replace(/[\\\/:*?"<>|]/g,'').slice(0,40);
    a.download = `안전사고보고서_${safeTitle}.pptx`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 3000);
    toast('보고서 파일이 다운로드되었습니다');
  }catch(err){
    console.error('사고보고서 다운로드 오류:', err);
    alert('문서 생성 중 오류가 발생했습니다.\n\n[오류 내용]\n' + (err&&err.message?err.message:String(err)));
  }
}

  const v = existing || {};
  showModal(`
    <div class="modal-head"><h3>${isEdit?t('contractor_edit_title'):t('contractor_new_title')}</h3><button class="x-btn" data-close>✕</button></div>
    <div class="modal-body">
      <div class="field"><label>${t('lbl_companyname')} *</label><input type="text" id="f_name" value="${esc(v.name||'')}"></div>
      <div class="row2">
        <div class="field"><label>${t('th_type')}</label>
          <select id="f_type">${['상주(용역)','정기납품','물류운송','공사·정비','기타'].map(ct=>`<option value="${ct}" ${v.type===ct?'selected':''}>${contractorTypeLabel(ct)}</option>`).join('')}</select>

        <div class="field"><label>${t('th_contact')}</label><input type="text" id="f_contact" value="${esc(v.contact||'')}"></div>

// 공지사항 첨부파일 목록 렌더 (여러 개 지원, 이전 단일파일 기록과도 호환, 이미지는 클릭 시 확대)
function noticeFilesHtml(n){
  const files = n.files && n.files.length ? n.files : (n.fileData ? [{fileName:n.fileName, fileType:n.fileType, fileData:n.fileData}] : []);
  if(!files.length) return '';
  return `<div class="notice-meta" style="display:flex;flex-direction:column;gap:8px;">${files.map(f=>
    f.fileType && f.fileType.startsWith('image/')
      ? `<div><img src="${f.fileData}" alt="${esc(f.fileName||'첨부이미지')}" class="risk-thumb" style="max-width:100%;border-radius:8px;border:1px solid var(--line);display:block;cursor:zoom-in;"><a href="${f.fileData}" download="${esc(f.fileName||'첨부파일')}" style="color:var(--info);font-weight:700;">📎 ${esc(f.fileName||'첨부파일')} 다운로드</a></div>`
      : `<a href="${f.fileData}" download="${esc(f.fileName||'첨부파일')}" style="color:var(--info);font-weight:700;">📎 ${esc(f.fileName||'첨부파일')} 다운로드</a>`
  ).join('')}</div>`;
}

function renderNoticeList(){
  const notices = objToArr(DataStore.get(PATHS.notices)).sort((a,b)=> (b.pinned?1:0)-(a.pinned?1:0) || (b.createdAt||0)-(a.createdAt||0));
  const list = document.getElementById('noticeList');
  list.innerHTML = notices.length ? notices.map(n=>`
    <div class="notice-item ${n.pinned?'pinned':''}">
      <h4 data-view-n="${n.id}" style="cursor:pointer;">${n.pinned?icon('pin',14):''} ${newBadge(n, PATHS.notices)}${esc(n.title)}</h4>
      <div class="notice-content">${n.content||''}</div>
      ${noticeFilesHtml(n)}
      <div class="notice-meta">${esc(n.author||'안전환경부')} · ${fmtDate(n.createdAt)}
        ${State.mode==='admin'?` · <a href="#" data-edit-n="${n.id}" style="color:var(--info)">${t('btn_edit')}</a> · <a href="#" data-del-n="${n.id}" style="color:var(--danger)">${t('btn_delete')}</a>`:''}
      </div>
    </div>
  `).join('') : `<div class="empty"><span class="big">${icon('megaphone',22)}</span>${t('notices_empty')}</div>`;

  list.querySelectorAll('[data-del-n]').forEach(a=> a.addEventListener('click', async e=>{
    e.preventDefault();
    if(confirm(t('confirm_delete'))){ await DataStore.remove(PATHS.notices, a.dataset.delN); toast(t('toast_deleted')); renderNotices(); }
  }));

}

function renderContactGrid(){
  let contacts = objToArr(DataStore.get(PATHS.contacts));
  const searchQ = (State.filters.contactSearch||'').trim().toLowerCase();
  if(searchQ){
    contacts = contacts.filter(c=>
      (c.name||'').toLowerCase().includes(searchQ) ||
      (c.role||'').toLowerCase().includes(searchQ) ||
      (c.phone||'').toLowerCase().includes(searchQ)
    );
  }
  if(State.filters.contactDept) contacts = contacts.filter(c=> c.dept === State.filters.contactDept);
  if(State.filters.contactRank) contacts = contacts.filter(c=> c.rank === State.filters.contactRank);
  const RANK_ORDER = { '부장':1, '차장':2, '과장':3, '대리':4, '사원':5, '직장':6 };
  const sortMode = State.filters.contactSort || 'rank';
  if(sortMode==='name') contacts.sort((a,b)=> (a.name||'').localeCompare(b.name||'', 'ko'));
  else if(sortMode==='role') contacts.sort((a,b)=> (a.role||'').localeCompare(b.role||'', 'ko'));
  else if(sortMode==='rank') contacts.sort((a,b)=> (RANK_ORDER[a.rank]||0) - (RANK_ORDER[b.rank]||0));
  const grid = document.getElementById('contactGrid');
  grid.innerHTML = contacts.length ? contacts.map(c=>`
    <div class="contact-card">
      <div class="c-role">${esc(c.role||'담당')}</div>
      <div class="c-name">${esc(c.name)}</div>
      ${(c.dept || c.rank) ? `<div style="font-size:11.5px;color:var(--ink-soft);margin:2px 0;">${[c.dept,c.rank].filter(Boolean).join(' · ')}</div>` : ''}
      <div class="c-phone">${esc(c.phone||'-')}</div>
      ${State.mode==='admin'?`<div style="margin-top:8px;display:flex;gap:10px;"><a href="#" data-edit-c2="${c.id}" style="font-size:11.5px;color:var(--info)">${t('btn_edit')}</a><a href="#" data-del-c2="${c.id}" style="font-size:11.5px;color:var(--danger)">${t('btn_delete')}</a></div>`:''}
    </div>
  `).join('') : `<div class="empty"><span class="big">☎</span>${t('contacts_empty')}</div>`;
  grid.querySelectorAll('[data-edit-c2]').forEach(a=> a.addEventListener('click', e=>{
    e.preventDefault();
    const c = DataStore.get(PATHS.contacts)[a.dataset.editC2];
    openContactModal(Object.assign({id:a.dataset.editC2}, c));
  }));
  grid.querySelectorAll('[data-del-c2]').forEach(a=> a.addEventListener('click', async e=>{
    e.preventDefault();
    if(confirm(t('confirm_delete'))){ await DataStore.remove(PATHS.contacts, a.dataset.delC2); toast(t('toast_deleted')); renderContactGrid(); }
  }));
}

function openNoticeModal(existing){
  const isEdit = !!existing;
  const v = existing || {};
  showModal(`
    <div class="modal-head"><h3>${isEdit?t('notice_edit_title'):t('notice_new_title')}</h3><button class="x-btn" data-close>✕</button></div>
    <div class="modal-body">
      <div class="field"><label>${t('lbl_title')} *</label><input type="text" id="f_title" value="${esc(v.title||'')}"></div>
      <div class="field">
        <label>${t('lbl_content')} *</label>
        <div class="rte-toolbar" style="display:flex;gap:5px;margin-bottom:6px;flex-wrap:wrap;">
          <button type="button" class="btn btn-sm" data-cmd="bold" title="${t('rte_bold')}" style="font-weight:800;">B</button>
          <button type="button" class="btn btn-sm" data-cmd="forecolor" data-group="color" data-val="#E5484D" title="${t('rte_red')}" style="color:#E5484D;font-weight:800;">A</button>
          <button type="button" class="btn btn-sm" data-cmd="forecolor" data-group="color" data-val="#2D7DD2" title="${t('rte_blue')}" style="color:#2D7DD2;font-weight:800;">A</button>
          <button type="button" class="btn btn-sm" data-cmd="forecolor" data-group="color" data-val="#1DA46F" title="${t('rte_green')}" style="color:#1DA46F;font-weight:800;">A</button>
          <button type="button" class="btn btn-sm" data-cmd="forecolor" data-group="color" data-val="#14192B" title="${t('rte_default')}" style="color:#14192B;font-weight:800;">A</button>
          <span style="width:1px;background:var(--line);margin:0 2px;"></span>
          <button type="button" class="btn btn-sm" data-cmd="fontsize" data-group="size" data-val="2" title="${t('rte_small')}">${t('rte_small')}</button>
          <button type="button" class="btn btn-sm" data-cmd="fontsize" data-group="size" data-val="4" title="${t('rte_normal')}">${t('rte_normal')}</button>
          <button type="button" class="btn btn-sm" data-cmd="fontsize" data-group="size" data-val="6" title="${t('rte_large')}">${t('rte_large')}</button>
        </div>
        <div id="f_content" contenteditable="true" style="min-height:120px;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:13.5px;line-height:1.6;">${v.content||''}</div>
      </div>
      <div class="field"><label>${t('lbl_author')}</label><input type="text" id="f_author" value="${esc(v.author||'안전환경부')}"></div>
      <div class="field"><label>${t('lbl_attachment')} (여러 개 선택 가능)</label>
        <input type="file" id="f_file" multiple>
        <p class="hint">${t('hint_attachment_size')} (파일 1개당 5MB 이내)</p>
        <div id="attachedFileList" style="margin-top:8px;display:flex;flex-direction:column;gap:6px;"></div>
      </div>
      <div class="field"><label><input type="checkbox" id="f_pinned" ${v.pinned?'checked':''}> ${t('lbl_pin_top')}</label></div>
    </div>
    <div class="modal-foot"><button class="btn" data-close>${t('btn_cancel')}</button><button class="btn btn-primary" id="saveNoticeBtn">${isEdit?t('btn_save'):t('btn_register')}</button></div>
  `);
  let attachedFiles = (v.files ? v.files.slice() : (v.fileName ? [{fileName:v.fileName, fileType:v.fileType, fileData:v.fileData}] : []));
  function renderAttachedFileList(){
    const box = document.getElementById('attachedFileList');
    box.innerHTML = attachedFiles.map((f,idx)=>`
      <div style="display:flex;align-items:center;gap:8px;background:#F7F8FA;border:1px solid var(--line);border-radius:8px;padding:6px 10px;">
        <span style="flex:1;font-size:12.5px;">📎 ${esc(f.fileName||'첨부파일')}</span>
        <button type="button" class="btn btn-sm" data-remove-file="${idx}">${t('btn_delete')}</button>
      </div>
    `).join('');
    box.querySelectorAll('[data-remove-file]').forEach(b=> b.addEventListener('click', ()=>{
      attachedFiles.splice(parseInt(b.dataset.removeFile,10), 1);
      renderAttachedFileList();
    }));
  }
  renderAttachedFileList();
  document.getElementById('f_file').addEventListener('change', async (e)=>{
    const files = Array.from(e.target.files || []);
    for(const file of files){
      if(file.size > 5*1024*1024){ toast(t('toast_file_toobig')); continue; }
      let dataUrl;
      try{
        dataUrl = await uploadFileToStorage(file, 'notice-files');
      }catch(err){
        console.error('파일 업로드 실패:', err);
        toast('파일 업로드에 실패했습니다: ' + file.name);
        continue;
      }
      attachedFiles.push({ fileName:file.name, fileType:file.type, fileData:dataUrl, fileSize:file.size });
    }
    e.target.value = '';
    renderAttachedFileList();
  });
  document.querySelectorAll('.rte-toolbar [data-cmd]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.getElementById('f_content').focus();
      document.execCommand(btn.dataset.cmd, false, btn.dataset.val || null);
      if(btn.dataset.cmd==='bold'){
        btn.classList.toggle('active', document.queryCommandState('bold'));
      }else if(btn.dataset.group){
        document.querySelectorAll(`.rte-toolbar [data-group="${btn.dataset.group}"]`).forEach(b=> b.classList.remove('active'));
        btn.classList.add('active');
      }
    });
  });
  document.getElementById('saveNoticeBtn').addEventListener('click', async ()=>{
    const title = document.getElementById('f_title').value.trim();
    const contentEl = document.getElementById('f_content');
    const content = contentEl.innerHTML.trim();
    if(!title || !contentEl.textContent.trim()){ toast(t('toast_fill_required')); return; }
    const data = {
      title, content,
      author: document.getElementById('f_author').value.trim() || '안전환경부',
      pinned: document.getElementById('f_pinned').checked,
      files: attachedFiles,
    };
    if(isEdit){
      await DataStore.update(PATHS.notices, existing.id, data);
      toast(t('toast_notice_updated'));
    }else{
      data.createdAt = Date.now();
      await DataStore.push(PATHS.notices, data);
      toast(t('toast_notice_registered'));
    }
    closeModal(); renderNotices();
  });
}

/* ============================================================
   13-1. 안전제안제도 — 실명 접수, 익명 불가
   일반사용자는 목록을 볼 수 없고 본인이 이 기기에서 등록한 제안만 조회 가능(로컬 저장 기반)
============================================================= */
// 여러 메뉴(위험성평가/사고접수/작업허가 등)에서 공통으로 쓰는 "내가 이 기기에서 등록한 항목" 추적
function getMyOwnedIds(storageKey){
  try{ return JSON.parse(localStorage.getItem(storageKey) || '[]'); }
  catch(e){ return []; }
}
function addMyOwnedId(storageKey, id){
  const ids = getMyOwnedIds(storageKey);
  ids.unshift(id);
  localStorage.setItem(storageKey, JSON.stringify(ids.slice(0,200)));
}

const MY_SUGGESTIONS_KEY = 'isc_my_suggestions';
function getMySuggestionIds(){
  try{ return JSON.parse(localStorage.getItem(MY_SUGGESTIONS_KEY) || '[]'); }
  catch(e){ return []; }
}
function addMySuggestionId(id){
  const ids = getMySuggestionIds();
  ids.unshift(id);
  localStorage.setItem(MY_SUGGESTIONS_KEY, JSON.stringify(ids.slice(0,100)));
}

function renderSuggestions(){
  const el = document.getElementById('view-suggestions');
  const isAdmin = State.mode==='admin';
  const filter = State.filters.suggestions || '전체';

  if(isAdmin){
    el.innerHTML = `
      <div class="toolbar">
        <div class="tabs" id="sugTabs">
          ${['전체','접수','검토중','완료'].map(s=>`<button class="tab ${filter===s?'active':''}" data-s="${s}">${s==='전체'?t('tab_all'):statusLabel(s)}</button>`).join('')}
        </div>
        <button class="btn btn-primary" id="addSugBtn">${icon('plus',15)} ${t('sug_add_btn')}</button>
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>${t('sug_th_title')}</th><th>${t('sug_th_reporter')}</th><th>${t('th_date')}</th><th>${t('th_status')}</th><th class="tight">${t('btn_manage_col')}</th></tr></thead>
        <tbody id="sugBody"></tbody>
      </table></div>
    `;
    document.getElementById('addSugBtn').addEventListener('click', ()=> openSuggestionModal());
    el.querySelectorAll('#sugTabs .tab').forEach(t=>t.addEventListener('click', ()=>{
      State.filters.suggestions = t.dataset.s; renderSuggestions();
    }));
    const arr = objToArr(DataStore.get(PATHS.suggestions)).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    const filtered = filter==='전체' ? arr : arr.filter(s=>s.status===filter);
    const body = document.getElementById('sugBody');
    body.innerHTML = filtered.length ? filtered.map(s=>`
      <tr>
        <td class="cell-strong">${newBadge(s, PATHS.suggestions)}${esc(s.title)}</td>
        <td>${esc(s.reporter||'-')}</td>
        <td class="mono">${fmtDate(s.createdAt)}</td>
        <td>${statusBadge('suggestion', s.status)}</td>
        <td class="tight row-btns"><button class="btn btn-sm" data-view-id="${s.id}">${t('btn_view')}</button></td>
      </tr>
    `).join('') : `<tr><td colspan="5"><div class="empty"><span class="big">${icon('lightbulb',22)}</span>${t('sug_empty')}</div></td></tr>`;
    body.querySelectorAll('[data-view-id]').forEach(b=> b.addEventListener('click', ()=> openSuggestionDetail(b.dataset.viewId)));
    return;
  }

  // 일반사용자: 등록 + 본인이 이 기기에서 낸 제안만 조회
  el.innerHTML = `
    <div class="toolbar">
      <div style="font-size:13px;color:var(--ink-soft);font-weight:600;">${t('sug_my_title')}</div>
      <button class="btn btn-primary" id="addSugBtn">${icon('plus',15)} ${t('sug_add_btn')}</button>
    </div>
    <p class="hint" style="margin:-8px 0 14px;">${t('sug_my_hint')}</p>
    <div id="mySugList"></div>
  `;
  document.getElementById('addSugBtn').addEventListener('click', ()=> openSuggestionModal());
  const all = DataStore.get(PATHS.suggestions) || {};
  const myIds = getMySuggestionIds();
  const mine = myIds.map(id=> all[id] ? Object.assign({id}, all[id]) : null).filter(Boolean);
  const list = document.getElementById('mySugList');
  list.innerHTML = mine.length ? mine.map(s=>`
    <div class="notice-item">
      <h4>${esc(s.title)} ${statusBadge('suggestion', s.status)}</h4>
      <div class="notice-content">${esc(s.content)}</div>
      ${s.photo ? `<img src="${s.photo}" class="risk-thumb" style="max-width:200px;border-radius:8px;border:1px solid var(--line);margin-top:8px;display:block;cursor:zoom-in;">` : ''}
      ${s.answer ? `<div class="notice-meta" style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);"><b>${t('sug_answer_label')}:</b> ${esc(s.answer)}</div>` : ''}
      <div class="notice-meta">${fmtDate(s.createdAt)}</div>
      ${s.status==='접수' ? `<button class="btn btn-sm" data-edit-sug="${s.id}" style="margin-top:8px;">${t('btn_edit')}</button>` : ''}
    </div>
  `).join('') : `<div class="empty"><span class="big">${icon('lightbulb',22)}</span>${t('sug_my_empty')}</div>`;
  bindImageZoom(list);
  list.querySelectorAll('[data-edit-sug]').forEach(b=> b.addEventListener('click', ()=>{
    const s = mine.find(x=>x.id===b.dataset.editSug);
    openSuggestionModal(s);
  }));
}

function openSuggestionModal(existing){
  const isEdit = !!existing;
  const v = existing || {};
  showModal(`
    <div class="modal-head"><h3>${isEdit?t('btn_edit'):t('sug_new_title')}</h3><button class="x-btn" data-close>✕</button></div>
    <div class="modal-body">
      <div class="field"><label>${t('lbl_title')} *</label><input type="text" id="f_sugTitle" value="${esc(v.title||'')}"></div>
      <div class="field"><label>${t('sug_lbl_content')} *</label><textarea id="f_sugContent" style="min-height:120px" placeholder="${t('sug_content_placeholder')}">${esc(v.content||'')}</textarea></div>
      <div class="field"><label>${t('lbl_reporter_input')} *</label><input type="text" id="f_sugReporter" value="${esc(v.reporter||'')}" placeholder="이름"></div>
      <div class="field"><label>${t('sug_lbl_photo')}</label>
        ${photoFieldHtml('f_sugPhoto', v.photo||'', v.photo?`<p class="hint">${t('hint_photo_replace')}</p>`:'')}
      </div>
      <p class="hint">${t('sug_realname_notice')}</p>
    </div>
    <div class="modal-foot"><button class="btn" data-close>${t('btn_cancel')}</button><button class="btn btn-primary" id="saveSugBtn">${isEdit?t('btn_save'):t('btn_register')}</button></div>
  `);
  bindPhotoField('f_sugPhoto', 'suggestion-photos');
  document.getElementById('saveSugBtn').addEventListener('click', async ()=>{
    const data = {
      title: document.getElementById('f_sugTitle').value.trim(),
      content: document.getElementById('f_sugContent').value.trim(),
      reporter: document.getElementById('f_sugReporter').value.trim(),
    };
    if(!data.title || !data.content || !data.reporter){ toast(t('toast_fill_required')); return; }
    const sugPhotoInput = document.getElementById('f_sugPhoto');
    const file = sugPhotoInput.files[0];
    if(file){
      if(file.size > 5*1024*1024){ toast(t('toast_photo_toobig')); return; }
      data.photo = sugPhotoInput.dataset.uploadedUrl || await uploadFileToStorage(file, 'suggestion-photos');
      data.photoSize = file.size;
    }
    if(isEdit){
      await DataStore.update(PATHS.suggestions, existing.id, data);
      closeModal();
      toast(t('toast_updated_generic'));
    }else{
      data.status = '접수';
      data.createdAt = Date.now();
      const newId = await DataStore.push(PATHS.suggestions, data);
      addMySuggestionId(newId);
      closeModal();
      showSuccessPopup(t('sug_registered_msg'));
    }
    renderSuggestions();
  });
}

function openSuggestionDetail(id){
  const raw = DataStore.get(PATHS.suggestions)[id];

  markRead(PATHS.suggestions, id);

    </div>
  `);
  bindImageZoom(document.getElementById('modalBox'));
  document.getElementById('saveSugStatusBtn').addEventListener('click', async ()=>{
    await DataStore.update(PATHS.suggestions, id, {

      await DataStore.remove(PATHS.suggestions, id); closeModal(); toast(t('toast_deleted')); renderSuggestions();
    }
  });

/* ============================================================
   14. 모달 공용 함수
============================================================= */
function showModal(html){
  document.getElementById('modalBox').innerHTML = html;
  document.getElementById('overlay').hidden = false;
  document.querySelectorAll('#modalBox [data-close]').forEach(b=> b.addEventListener('click', closeModal));
}

// Firebase가 "수상한 시도"로 보고 일시적으로 막아버리는 것을 예방할 수 있음)
async function enterWithPassword(role, input){
  const pw = input.trim();
  if(!pw){ toast(t('toast_pw_required')); return false; }
  if(!db){ toast('Firebase가 연결되어 있지 않아 관리자 로그인을 사용할 수 없습니다'); return false; }
  const email = ROLE_EMAIL_MAP[role];
  try{
    await firebase.auth().signOut().catch(()=>{});
    await firebase.auth().signInWithEmailAndPassword(email, pw);
    State.mode = role==='admin' ? 'admin' : 'dept';
    State.dept = role==='admin' ? null : role;
    return true;
  }catch(e){
    toast(e.code==='auth/too-many-requests' ? '로그인 시도가 너무 많아 잠시 후 다시 시도해주세요' : t('toast_pw_mismatch'));
    return false;
  }
}

const REMEMBER_MODE_KEY = 'isc_remember_mode';
const REMEMBER_DEPT_KEY = 'isc_remember_dept';

document.getElementById('gateEnter').addEventListener('click', async ()=>{
  const mode = document.getElementById('gateMode').value;
  if(mode==='admin'){
    const role = document.getElementById('gateRole').value;
    if(!(await enterWithPassword(role, document.getElementById('gatePw').value))) return;
    if(document.getElementById('gateRemember').checked){
      localStorage.setItem(REMEMBER_MODE_KEY, State.mode);
      if(State.dept) localStorage.setItem(REMEMBER_DEPT_KEY, State.dept);
      else localStorage.removeItem(REMEMBER_DEPT_KEY);
    }
  }else{
    State.mode = 'user'; State.dept = null;
    if(db) await firebase.auth().signOut().catch(()=>{});
  }
  document.getElementById('gate').style.display = 'none';
  updateModeUI();
  await authReady;
  boot();
});

async function logoutToUser(){
  State.mode = 'user'; State.dept = null;
  localStorage.removeItem(REMEMBER_MODE_KEY);
  localStorage.removeItem(REMEMBER_DEPT_KEY);

    await firebase.auth().signOut().catch(()=>{});

}

function boot(){
  const d = new Date();
  document.getElementById('todayChip').textContent =
    `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} (${['일','월','화','수','목','금','토'][d.getDay()]})`;

  updateNotifyBtnUI();

  renderNav();
  switchView('dashboard');

  // 전체관리자는 모든 메뉴의 새 항목(NEW) 표시가 항상 실시간이어야 하므로, 전체 경로를 바로 구독한다.
  // 부서관리자·일반사용자는 대시보드가 이미 구독한 경로(작업허가 포함)만 실시간이고,
  // 나머지는 해당 메뉴를 한 번 열어야 그 뒤로 실시간이 된다 — 트래픽 절약을 위한 의도된 차등.
  if(State.mode==='admin'){
    ensurePathsSubscribed(Object.values(PATHS));
  }else if(notifyEnabled()){
    // 알림을 켠 사람에 한해서만 알림 대상 4곳을 어느 메뉴에 머물든 놓치지 않도록 미리 구독한다.
    // 알림을 안 켰으면 원래대로 대시보드 기본 3곳(작업허가·위험성평가·사고접수)만 구독하고,
    // 아차사고 등 나머지는 해당 메뉴를 열 때만 구독 — 안 쓰는 사람에게 불필요한 트래픽을 주지 않기 위함.
    ensurePathsSubscribed(Object.keys(NOTIFY_PATHS));
  }
}

// 접수/신청 후 2일(48시간)이 지나도록 초기 상태 그대로면 자동으로 다음 단계로 넘김
// (방치되는 것을 막기 위함 — 데이터를 실제로 불러온 시점마다 점검)
const STALE_ESCALATE_MS = 2*24*60*60*1000;
const STALE_ESCALATE_RULES = {}; // path -> {from, to}, 아래서 PATHS 확정 후 채움
STALE_ESCALATE_RULES[PATHS.permits]   = { from:'신청',     to:'검토중' };
STALE_ESCALATE_RULES[PATHS.risks]     = { from:'접수완료', to:'조치중' };
STALE_ESCALATE_RULES[PATHS.incidents] = { from:'접수',     to:'조사중' };

async function checkStaleEscalation(path, val){
  const rule = STALE_ESCALATE_RULES[path];
  if(!rule || !val) return;
  for(const id of Object.keys(val)){
    const item = val[id];
    if(item && item.status===rule.from && item.createdAt && (Date.now()-item.createdAt > STALE_ESCALATE_MS)){
      await DataStore.update(path, id, { status: rule.to });
    }
  }
}
