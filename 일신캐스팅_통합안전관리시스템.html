<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>일신캐스팅 통합 안전관리 시스템</title>

<!-- ============================================================
  Firebase SDK (compat 버전 - 별도 빌드 도구 없이 바로 사용 가능)
============================================================= -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pizzip@3.1.6/dist/pizzip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docxtemplater@3.44.0/build/docxtemplater.min.js"></script>

<style>
/* ==========================================================================
   토큰 시스템
   Color
     --navy-900 #101B33  사이드바/헤더 배경 (딱딱한 조명 아래 도장 강판 느낌)
     --navy-700 #1C2E52  사이드바 hover
     --paper    #F4F6F8  본문 배경
     --card     #FFFFFF  카드 배경
     --line     #E2E6EC  경계선
     --ink      #14192B  본문 텍스트
     --ink-soft #667085  보조 텍스트
     --safety   #FF6A13  안전표지 오렌지 (경고/CTA 강조)
     --caution  #FFC93C  주의(황색 표지판)
     --ok       #1DA46F  안전(녹색 표지판)
     --danger   #E5484D  위험(적색 표지판)
     --info     #2D7DD2  정보/파랑
   Type
     display : 'Pretendard' (한글 가변폭 산세리프, 큰 숫자/타이틀)
     mono    : 'JetBrains Mono' (지표 숫자, 코드성 데이터)
   Signature
     대시보드 상단의 "무재해 카운터" 게시판 — 공장 정문에 걸린
     'ㅇㅇㅇ일 무재해' 안내판을 웹 UI로 옮긴 히어로 스탯 패널.
========================================================================== */
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap');

:root{
  --navy-900:#101B33;
  --navy-800:#152648;
  --navy-700:#1C2E52;
  --paper:#F4F6F8;
  --card:#FFFFFF;
  --line:#E2E6EC;
  --ink:#14192B;
  --ink-soft:#667085;
  --ink-faint:#98A2B3;
  --safety:#FF6A13;
  --safety-dim:#FFE8D6;
  --caution:#FFC93C;
  --caution-dim:#FFF6DA;
  --ok:#1DA46F;
  --ok-dim:#DDF3E9;
  --danger:#E5484D;
  --danger-dim:#FCE3E4;
  --info:#2D7DD2;
  --info-dim:#E1EDFB;
  --radius:10px;
  --shadow:0 1px 2px rgba(16,27,51,.04), 0 4px 16px rgba(16,27,51,.06);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:'Pretendard', system-ui, -apple-system, 'Malgun Gothic', sans-serif;
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  font-size:14.5px;
  line-height:1.5;
}
::selection{background:var(--safety-dim);}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:inherit;}

.mono{font-family:'JetBrains Mono', ui-monospace, monospace;}

/* ---------- App shell ---------- */
#app{display:flex;min-height:100vh;}

/* Sidebar */
.sidebar{
  width:236px;flex:0 0 236px;
  background:linear-gradient(180deg,var(--navy-900),var(--navy-800) 70%);
  color:#fff;
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
  z-index:20;
}
.brand{
  padding:22px 20px 16px;
  border-bottom:1px solid rgba(255,255,255,.08);
  display:flex;align-items:flex-start;gap:11px;
}
.brand-logo{
  flex:0 0 44px;width:44px;height:44px;border-radius:10px;
  background:#fff;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 10px rgba(0,0,0,.25);
  padding:5px;
}
.brand-logo img{width:100%;height:100%;object-fit:contain;}
.brand-text{min-width:0;}
.brand .tag{
  display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.08em;
  color:var(--safety);background:rgba(255,106,19,.14);
  padding:3px 7px;border-radius:5px;margin-bottom:8px;
}
.brand h1{font-size:16.5px;margin:0 0 2px;font-weight:800;letter-spacing:-.01em;}
.brand p{margin:0;font-size:11.5px;color:#8C99B8;}

.nav{flex:1;padding:14px 10px;overflow-y:auto;}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:8px;margin-bottom:2px;
  color:#B7C0D6;font-size:13.5px;font-weight:600;
  border:none;background:none;width:100%;text-align:left;
  transition:background .12s, color .12s;
}
.nav-item svg{flex:0 0 18px;width:18px;height:18px;opacity:.85;}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:var(--safety);color:#fff;}
.nav-item.active svg{opacity:1;}
.nav-badge{
  margin-left:auto;font-size:10.5px;font-weight:700;
  background:rgba(255,255,255,.14);padding:1px 7px;border-radius:20px;
  font-family:'JetBrains Mono',monospace;
}
.nav-item.active .nav-badge{background:rgba(255,255,255,.28);}

.sidebar-foot{
  padding:14px 18px 18px;border-top:1px solid rgba(255,255,255,.08);
  font-size:11px;color:#7686A8;
}
.mode-pill{
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(255,255,255,.06);border-radius:8px;padding:8px 10px;margin-bottom:10px;
}
.mode-pill span{font-size:12px;font-weight:700;color:#D6DCEA;}
.mode-btn{
  border:1px solid rgba(255,255,255,.18);background:transparent;color:#fff;
  font-size:11px;font-weight:700;padding:4px 9px;border-radius:6px;
}
.mode-btn.on{background:var(--ok);border-color:var(--ok);}

/* Main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  position:sticky;top:0;z-index:10;
  background:rgba(244,246,248,.9);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);
  padding:18px 32px;display:flex;align-items:center;justify-content:space-between;
}
.topbar h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.01em;}
.topbar .sub{margin:2px 0 0;font-size:12.5px;color:var(--ink-soft);}
.topbar-right{display:flex;align-items:center;gap:10px;}
.today-chip{
  font-size:12px;color:var(--ink-soft);background:#fff;border:1px solid var(--line);
  padding:6px 12px;border-radius:20px;font-family:'JetBrains Mono',monospace;font-weight:600;
}

.view{padding:26px 32px 60px;}
.view[hidden]{display:none;}

/* ---------- Buttons / inputs ---------- */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--line);background:#fff;color:var(--ink);
  font-size:13px;font-weight:700;padding:9px 15px;border-radius:8px;
  transition:all .12s;white-space:nowrap;
}
.btn:hover{border-color:#C7CFDC;background:#FAFBFC;}
.btn-primary{background:var(--safety);border-color:var(--safety);color:#fff;}
.btn-primary:hover{background:#E85E0E;border-color:#E85E0E;}
.btn-ghost{border-color:transparent;background:transparent;}
.btn-ghost:hover{background:#EEF1F5;}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:7px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:6px;}
.field .hint{font-size:11.5px;color:var(--ink-faint);font-weight:500;margin-top:4px;}
.field input[type=text],.field input[type=date],.field input[type=time],
.field input[type=tel],.field select,.field textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;
  font-size:13.5px;color:var(--ink);background:#fff;
}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none;border-color:var(--safety);box-shadow:0 0 0 3px var(--safety-dim);
}
.field textarea{resize:vertical;min-height:70px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
@media(max-width:720px){.row2,.row3{grid-template-columns:1fr;}}

/* ---------- Cards / KPI ---------- */
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
@media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);}}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.kpi{padding:18px 18px 16px;border-left:4px solid var(--info);}
.kpi.c-safety{border-left-color:var(--safety);}
.kpi.c-ok{border-left-color:var(--ok);}
.kpi.c-danger{border-left-color:var(--danger);}
.kpi.c-caution{border-left-color:var(--caution);}
.kpi .k-label{font-size:12px;font-weight:700;color:var(--ink-soft);display:flex;align-items:center;gap:6px;}
.kpi .k-num{font-family:'JetBrains Mono',monospace;font-size:30px;font-weight:700;margin:6px 0 2px;letter-spacing:-.01em;}
.kpi .k-sub{font-size:11.5px;color:var(--ink-faint);}

/* Signature: 무재해 카운터 보드 */
.zeroboard{
  background:radial-gradient(120% 140% at 0% 0%, var(--navy-800), var(--navy-900) 65%);
  border-radius:14px;color:#fff;padding:26px 30px;display:flex;align-items:center;
  justify-content:space-between;gap:24px;box-shadow:var(--shadow);position:relative;overflow:hidden;
  margin-bottom:20px;
}
.zeroboard:before{
  content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(135deg, rgba(255,255,255,.025) 0 2px, transparent 2px 14px);
  pointer-events:none;
}
.zb-left .zb-eyebrow{
  font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--caution);
  display:flex;align-items:center;gap:7px;margin-bottom:10px;
}
.zb-eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(29,164,111,.25);}
.zb-num{
  font-family:'JetBrains Mono',monospace;font-size:64px;font-weight:700;line-height:1;
  letter-spacing:-.02em;
}
.zb-num span{font-size:22px;font-weight:700;margin-left:8px;color:#B7C0D6;}
.zb-desc{font-size:13px;color:#AEB9D2;margin-top:8px;max-width:360px;}
.zb-right{display:flex;gap:26px;position:relative;z-index:1;}
.zb-stat{text-align:right;}
.zb-stat .n{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:700;}
.zb-stat .l{font-size:11px;color:#8C99B8;margin-top:2px;}
@media(max-width:820px){.zeroboard{flex-direction:column;align-items:flex-start;}.zb-right{align-self:stretch;justify-content:space-between;}}

.dash-header{
  display:flex;align-items:center;gap:14px;margin-bottom:18px;
}
.dash-header .dh-logo{
  flex:0 0 52px;width:52px;height:52px;border-radius:12px;
  background:#fff;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow);padding:6px;
}
.dash-header .dh-logo img{width:100%;height:100%;object-fit:contain;}
.dash-header h1{
  margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em;color:var(--ink);
}
.dash-header p{margin:2px 0 0;font-size:12.5px;color:var(--ink-soft);font-weight:600;}

.section-title{font-size:15px;font-weight:800;margin:26px 0 12px;display:flex;align-items:center;gap:8px;}
.section-title .n{color:var(--ink-faint);font-weight:700;font-size:12px;}

/* Two column dashboard lower section */
.dash-lower{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-top:6px;}
@media(max-width:980px){.dash-lower{grid-template-columns:1fr;}}

.list-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
.list-card .lc-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
.list-card .lc-head h3{margin:0;font-size:14px;font-weight:800;}
.lc-body{max-height:340px;overflow-y:auto;}
.mini-row{padding:11px 18px;border-bottom:1px solid #EEF1F5;display:flex;align-items:center;gap:10px;font-size:13px;}
.mini-row:last-child{border-bottom:none;}
.mini-row .mr-title{flex:1;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mini-row .mr-meta{font-size:11.5px;color:var(--ink-faint);font-family:'JetBrains Mono',monospace;}
.empty{padding:30px 18px;text-align:center;color:var(--ink-faint);font-size:13px;}
.empty .big{font-size:26px;display:block;margin-bottom:6px;}

/* ---------- Badges ---------- */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap;}
.b-gray{background:#EEF1F5;color:#4B5468;}
.b-info{background:var(--info-dim);color:var(--info);}
.b-caution{background:var(--caution-dim);color:#946200;}
.b-ok{background:var(--ok-dim);color:var(--ok);}
.b-danger{background:var(--danger-dim);color:var(--danger);}
.b-safety{background:var(--safety-dim);color:#B24A00;}

/* ---------- Toolbar / filter tabs ---------- */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.tabs{display:flex;gap:6px;flex-wrap:wrap;}
.tab{
  border:1px solid var(--line);background:#fff;color:var(--ink-soft);
  font-size:12.5px;font-weight:700;padding:7px 13px;border-radius:20px;
}
.tab.active{background:var(--navy-900);border-color:var(--navy-900);color:#fff;}
.searchbox{
  display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);
  border-radius:8px;padding:0 12px;min-width:220px;
}
.searchbox input{border:none;padding:8px 0;font-size:13px;flex:1;background:transparent;}
.searchbox input:focus{outline:none;}

/* ---------- Table ---------- */
.table-wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{
  text-align:left;font-size:11.5px;font-weight:800;color:var(--ink-soft);
  text-transform:uppercase;letter-spacing:.03em;
  padding:11px 16px;border-bottom:1px solid var(--line);background:#FAFBFC;white-space:nowrap;
}
tbody td{padding:12px 16px;border-bottom:1px solid #EEF1F5;color:var(--ink);vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#FAFBFC;}
td.tight,th.tight{width:1%;white-space:nowrap;}
.row-btns{display:flex;gap:6px;}
.cell-strong{font-weight:700;}
.cell-sub{font-size:11.5px;color:var(--ink-faint);margin-top:2px;}

/* ---------- Modal ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(16,27,51,.5);backdrop-filter:blur(1px);
  display:flex;align-items:flex-start;justify-content:center;padding:5vh 20px;z-index:100;overflow-y:auto;
}
.overlay[hidden]{display:none;}
.modal{
  background:#fff;border-radius:14px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(16,27,51,.25);
  animation:pop .14s ease-out;
}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.99)}to{opacity:1;transform:none}}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
.modal-head h3{margin:0;font-size:16px;font-weight:800;}
.modal-body{padding:20px 22px;max-height:70vh;overflow-y:auto;}
.modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;}
.x-btn{border:none;background:#F1F3F6;width:30px;height:30px;border-radius:8px;font-size:15px;color:var(--ink-soft);}

/* ---------- Detail drawer content ---------- */
.detail-grid{display:grid;grid-template-columns:120px 1fr;row-gap:10px;font-size:13.5px;}
.detail-grid dt{color:var(--ink-soft);font-weight:700;}
.detail-grid dd{margin:0;}
.divider{height:1px;background:var(--line);margin:16px 0;}

/* ---------- Notice board ---------- */
.notice-item{border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:10px;background:#fff;}
.notice-item.pinned{border-color:var(--safety);background:linear-gradient(0deg,#fff,var(--safety-dim) 400%);}
.notice-item h4{margin:0 0 6px;font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:8px;}
.notice-item p{margin:0;font-size:13px;color:var(--ink-soft);white-space:pre-wrap;}
.notice-meta{font-size:11.5px;color:var(--ink-faint);margin-top:8px;font-family:'JetBrains Mono',monospace;}

.contact-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
@media(max-width:900px){.contact-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:600px){.contact-grid{grid-template-columns:1fr;}}
.contact-card{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:#fff;}
.contact-card .c-role{font-size:11px;font-weight:800;color:var(--safety);letter-spacing:.03em;}
.contact-card .c-name{font-size:14.5px;font-weight:800;margin:4px 0 2px;}
.contact-card .c-phone{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--ink-soft);}

/* ---------- Risk matrix chip ---------- */
.risk-chip{
  display:inline-flex;align-items:center;justify-content:center;
  width:34px;height:26px;border-radius:6px;font-weight:800;font-size:12.5px;
  font-family:'JetBrains Mono',monospace;color:#fff;
}
.risk-low{background:var(--ok);}
.risk-mid{background:var(--caution);color:#5C4400;}
.risk-high{background:var(--safety);}
.risk-crit{background:var(--danger);}

/* ---------- Login gate ---------- */
.gate{
  position:fixed;inset:0;background:var(--navy-900);display:flex;align-items:center;justify-content:center;z-index:200;
}
.gate-card{background:#fff;border-radius:16px;padding:36px 34px;width:100%;max-width:360px;box-shadow:0 30px 80px rgba(0,0,0,.4);}
.gate-card .tag{
  display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.08em;color:var(--safety);
  background:var(--safety-dim);padding:3px 8px;border-radius:5px;margin-bottom:10px;
}
.gate-card h2{margin:0 0 4px;font-size:19px;font-weight:800;}
.gate-card p{margin:0 0 20px;font-size:12.5px;color:var(--ink-soft);}
.gate-actions{display:flex;gap:8px;margin-top:6px;}
.gate-actions .btn{flex:1;justify-content:center;}

/* ---------- Toast ---------- */
#toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--navy-900);color:#fff;padding:12px 20px;border-radius:9px;font-size:13px;font-weight:600;
  box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:all .2s;z-index:300;
  display:flex;align-items:center;gap:8px;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#toast .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);}

/* ---------- Scrollbar ---------- */
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#CBD3DF;border-radius:20px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- Config banner ---------- */
.config-banner{
  background:var(--caution-dim);border:1px solid #F0D26B;color:#7A5B00;
  padding:10px 16px;border-radius:9px;font-size:12.5px;margin-bottom:18px;
  display:flex;align-items:center;gap:8px;font-weight:600;
}

/* ---------- Mobile ---------- */
.hamburger{display:none;}
@media(max-width:880px){
  .sidebar{position:fixed;left:-260px;top:0;transition:left .18s;box-shadow:0 0 40px rgba(0,0,0,.3);}
  .sidebar.open{left:0;}
  .hamburger{display:flex;border:1px solid var(--line);background:#fff;border-radius:8px;width:36px;height:36px;align-items:center;justify-content:center;}
  .topbar{padding:14px 16px;}
  .view{padding:18px 16px 50px;}
  .grid-4{grid-template-columns:1fr 1fr;}
  .zeroboard{padding:20px;}
  .zb-num{font-size:44px;}
}
</style>
</head>

<script>
/* ============================================================
   0. Firebase 설정
   -------------------------------------------------------------
   ⚠️ 아래 값을 Firebase 콘솔(console.firebase.google.com)에서
   새로 만든 프로젝트의 "프로젝트 설정 > 일반 > 내 앱 > SDK 설정"
   값으로 교체하세요. Realtime Database를 반드시 활성화해야 합니다.
============================================================= */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyApm6yQhoaoKhkV9k3QNm2hTMjwP6NsNf4",
  authDomain: "safety-ilshin-ce0f1.firebaseapp.com",
  databaseURL: "https://safety-ilshin-ce0f1-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "safety-ilshin-ce0f1",
  storageBucket: "safety-ilshin-ce0f1.firebasestorage.app",
  messagingSenderId: "650408278252",
  appId: "1:650408278252:web:d98398987af67cd0a6cdc9"
};
const CONFIG_IS_PLACEHOLDER = FIREBASE_CONFIG.apiKey === "YOUR_API_KEY";

let db = null;
if(!CONFIG_IS_PLACEHOLDER){
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.database();
}

/* 로컬 폴백 저장소 (Firebase 설정 전 데모/오프라인용) ------------- */
const LocalStore = {
  read(path){ try{return JSON.parse(localStorage.getItem('isc_'+path))||{}}catch(e){return {}} },
  write(path,val){ localStorage.setItem('isc_'+path, JSON.stringify(val)); }
};

/* ============================================================
   1. 데이터 계층 — Firebase 사용 가능하면 RTDB, 아니면 로컬 저장
============================================================= */
const DataStore = {
  _cache:{},
  _listeners:{},

  listen(path, cb){
    this._listeners[path] = this._listeners[path]||[];
    this._listeners[path].push(cb);
    if(db){
      db.ref(path).on('value', snap=>{
        const val = snap.val() || {};
        this._cache[path] = val;
        this._listeners[path].forEach(fn=>fn(val));
      });
    }else{
      const val = LocalStore.read(path);
      this._cache[path] = val;
      cb(val);
    }
  },
  async push(path, data){
    const id = 'id_' + Date.now() + '_' + Math.floor(Math.random()*1000);
    if(db){
      await db.ref(path+'/'+id).set(data);
    }else{
      const val = LocalStore.read(path);
      val[id] = data;
      LocalStore.write(path, val);
      this._cache[path] = val;
      (this._listeners[path]||[]).forEach(fn=>fn(val));
    }
    return id;
  },
  async update(path, id, data){
    if(db){
      await db.ref(path+'/'+id).update(data);
    }else{
      const val = LocalStore.read(path);
      val[id] = Object.assign({}, val[id], data);
      LocalStore.write(path, val);
      this._cache[path] = val;
      (this._listeners[path]||[]).forEach(fn=>fn(val));
    }
  },
  async remove(path, id){
    if(db){
      await db.ref(path+'/'+id).remove();
    }else{
      const val = LocalStore.read(path);
      delete val[id];
      LocalStore.write(path, val);
      this._cache[path] = val;
      (this._listeners[path]||[]).forEach(fn=>fn(val));
    }
  },
  get(path){ return this._cache[path] || {}; }
};

/* ============================================================
   2. 전역 상태
============================================================= */
const State = {
  mode: 'user', // 'user' | 'admin'
  view: 'dashboard',
  filters: {}
};

const PATHS = {
  permits:'permits',
  risks:'risk_assessments',
  incidents:'incidents',
  contractors:'contractors',
  contractorRecords:'contractor_records',
  notices:'notices',
  contacts:'emergency_contacts'

function toast(msg){
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('show'), 2400);
}
function fmtDate(d){
  if(!d) return '-';
  const dt = new Date(d);
  if(isNaN(dt)) return d;
  return `${dt.getFullYear()}.${String(dt.getMonth()+1).padStart(2,'0')}.${String(dt.getDate()).padStart(2,'0')}`;
}
function fmtDateTime(d){
  if(!d) return '-';
  const dt = new Date(d);
  if(isNaN(dt)) return d;
  return `${fmtDate(d)} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
}
function daysBetween(a,b){
  return Math.floor((new Date(b) - new Date(a)) / 86400000);
}
function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function esc(s){
  return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function objToArr(obj){ return Object.entries(obj||{}).map(([id,v])=>({id, ...v})); }
function requireAdmin(actionLabel){
  if(State.mode !== 'admin'){
    toast(`🔒 ${actionLabel}은(는) 관리자 모드에서만 가능합니다`);
    return false;
  }
  return true;
}

function renderNav(){
  const nav = document.getElementById('navList');
  nav.innerHTML = NAV_ITEMS.map(item=>{
    const count = navBadgeCount(item.id);
    return `<button class="nav-item ${State.view===item.id?'active':''}" data-view="${item.id}">
      ${icon(item.icon)}<span>${item.label}</span>
      ${count!=null?`<span class="nav-badge">${count}</span>`:''}
    </button>`;
  }).join('');
  nav.querySelectorAll('.nav-item').forEach(btn=>{
    btn.addEventListener('click', ()=> switchView(btn.dataset.view));
  });
}
function navBadgeCount(viewId){
  if(viewId==='permits'){
    const arr = objToArr(DataStore.get(PATHS.permits));
    const n = arr.filter(p=>p.status==='신청'||p.status==='검토중').length;
    return n>0 ? n : null;
  }
  if(viewId==='incidents'){
    const arr = objToArr(DataStore.get(PATHS.incidents));
    const n = arr.filter(i=>i.status!=='완료').length;
    return n>0 ? n : null;
  }
  if(viewId==='risks'){
    const arr = objToArr(DataStore.get(PATHS.risks));
    const n = arr.filter(r=>r.status!=='완료').length;
    return n>0 ? n : null;
  }
  return null;
}

function switchView(id){
  State.view = id;
  const item = NAV_ITEMS.find(n=>n.id===id);
  document.getElementById('pageTitle').textContent = item.label;
  document.getElementById('pageSub').textContent = item.sub;
  renderNav();
  document.querySelectorAll('.view').forEach(v=> v.hidden = v.id !== 'view-'+id);
  document.getElementById('sidebar').classList.remove('open');
  renderCurrentView();
}
function renderCurrentView(){
  ({
    dashboard: renderDashboard,
    permits: renderPermits,
    risks: renderRisks,
    incidents: renderIncidents,
    contractors: renderContractors,
    notices: renderNotices
  }[State.view]||function(){})();
}

let monthlyChartInstance = null;
function computeMonthlyIncidentCounts(incidents, monthsBack){
  const now = new Date();
  const labels = [];
  const keys = [];
  for(let i=monthsBack-1; i>=0; i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    keys.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);
    labels.push(`${d.getMonth()+1}월`);
  }
  const counts = keys.map(k=> incidents.filter(i=> (i.datetime||'').slice(0,7)===k).length);
  return { labels, counts };
}
function renderMonthlyChart(monthly){
  const canvas = document.getElementById('monthlyChart');
  if(!canvas || typeof Chart==='undefined') return;
  if(monthlyChartInstance){ monthlyChartInstance.destroy(); }
  monthlyChartInstance = new Chart(canvas.getContext('2d'), {
    type: 'bar',
    data: {
      labels: monthly.labels,
      datasets: [{
        label: '재해 건수',
        data: monthly.counts,
        backgroundColor: '#FF6A13',
        borderRadius: 5,
        maxBarThickness: 42
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display:false } },
      scales: {
        y: { beginAtZero:true, ticks:{ precision:0, color:'#667085', font:{size:11.5} }, grid:{ color:'#EEF1F5' } },
        x: { ticks:{ color:'#667085', font:{size:11.5} }, grid:{ display:false } }
      }
    }
  });
}

function renderMiniList(arr, mapFn){
  if(!arr || arr.length===0) return `<div class="empty"><span class="big">${icon('grid',22)}</span>등록된 항목이 없습니다</div>`;
  const sorted = [...arr].sort((a,b)=> new Date(b.createdAt||b.startDate||b.datetime||0) - new Date(a.createdAt||a.startDate||a.datetime||0));
  return sorted.slice(0,6).map(item=>{
    const m = mapFn(item);
    return `<div class="mini-row">
      <div class="mr-title">${esc(m.title)}</div>
      <div class="mr-meta">${esc(m.meta)}</div>
      ${m.badge||''}
    </div>`;
  }).join('');
}

/* ============================================================
   8. 배지 / 위험도 헬퍼
============================================================= */
function statusBadge(kind, status){
  const map = {
    permit:{'신청':'b-info','검토중':'b-caution','승인':'b-ok','반려':'b-danger','종료':'b-gray'},
    risk:{'등록':'b-info','조치중':'b-caution','완료':'b-ok'},
    incident:{'접수':'b-info','조사중':'b-caution','완료':'b-ok'}
  };
  const cls = (map[kind]||{})[status] || 'b-gray';
  return `<span class="badge ${cls}">${esc(status||'-')}</span>`;
}
function riskLevel(r){
  const score = (Number(r.frequency)||0) * (Number(r.severity)||0);
  if(score>=15) return 'crit';
  if(score>=8) return 'high';
  if(score>=4) return 'mid';
  return 'low';
}
function riskChip(r){
  const score = (Number(r.frequency)||0) * (Number(r.severity)||0);
  const lv = riskLevel(r);
  const label = {low:'낮음',mid:'보통',high:'높음',crit:'매우높음'}[lv];
  return `<span class="risk-chip risk-${lv}" title="위험도 ${label}">${score}</span>`;
}

function generatePermitDocx(p){
  if(typeof PizZip==='undefined' || typeof window.docxtemplater==='undefined'){
    toast('문서 생성 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해주세요.');
    return;
  }
  try{
    const binary = atob(PERMIT_TEMPLATE_B64);
    const bytes = new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++){ bytes[i] = binary.charCodeAt(i); }
    const zip = new PizZip(bytes);
    const doc = new window.docxtemplater(zip, { paragraphLoop:true, linebreaks:true });
    const equipmentText = [...(p.equipment||[]), p.equipmentOther].filter(Boolean).join(', ') || '-';
    doc.render({
      company: p.company||'',
      workName: p.workContent||'',
      workPeriod: `${fmtDate(p.startDate)} ~ ${fmtDate(p.endDate)}`,
      location: p.location||'',
      headcount: p.headcount||'',
      siteSuper: p.contractorLead||'',
      equipment: equipmentText,
      hazardMeasures: p.hazardDetail||'',
      fireYesBox: p.fireWork ? '☑' : '□',
      fireDetail: p.fireWork ? (p.fireDetail||'') : '',
      fireNoBox: p.fireWork ? '□' : '☑',
      watchman: p.fireWork ? (p.watchman||'') : '',
      extinguisher: p.fireWork ? (p.fireExtinguisher||'') : '',
      combustible: p.fireWork ? (p.combustibleRemoval||'') : '',
      contractorSign: p.contractorLead||'',
      managerSign: p.processManager||'',
      approverSign: '',
      endDatetime: p.endDatetime ? fmtDateTime(p.endDatetime) : '',
      siteConditionText: p.siteCondition ? (p.siteCondition==='이상없음' ? '☑ 이상없음   □ 이상있음' : '□ 이상없음   ☑ 이상있음') : '□ 이상없음   □ 이상있음',
      residualCheck: p.fireWork ? (p.residualCheck||'') : '',
      endConfirmer: p.endConfirmer||'',
    });
    const out = doc.getZip().generate({ type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
    const url = URL.createObjectURL(out);
    const a = document.createElement('a');
    a.href = url;
    const safeCompany = (p.company||'업체명').replace(/[\\/:*?"<>|]/g,'');
    a.download = `안전작업허가서_${safeCompany}_${p.startDate||''}.docx`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 3000);
    toast('허가서 파일이 다운로드되었습니다');
  }catch(err){
    console.error(err);
    toast('문서 생성 중 오류가 발생했습니다');
  }
}

    return s - s2;

    </tr>

      <div style="display:flex;gap:8px;">
        <button class="btn" id="addContractorBtn">${icon('plus',15)} 업체 등록</button>

function openContractorModal(existing){
  const isEdit = !!existing;
  const v = existing || {};
  showModal(`
    <div class="modal-head"><h3>${isEdit?'업체 정보 수정':'도급업체 등록'}</h3><button class="x-btn" data-close>✕</button></div>
    <div class="modal-body">
      <div class="field"><label>업체명 *</label><input type="text" id="f_name" value="${esc(v.name||'')}"></div>
      <div class="row2">
        <div class="field"><label>유형</label>
          <select id="f_type">${['상주(용역)','정기납품','물류운송','공사·정비','기타'].map(t=>`<option ${v.type===t?'selected':''}>${t}</option>`).join('')}</select>
        </div>
        <div class="field"><label>연락처</label><input type="text" id="f_contact" value="${esc(v.contact||'')}"></div>
      </div>
      <div class="field"><label>담당업무</label><input type="text" id="f_role" value="${esc(v.role||'')}" placeholder="예: 주물용 중자 납품"></div>
    </div>
    <div class="modal-foot"><button class="btn" data-close>취소</button><button class="btn btn-primary" id="saveContractorBtn">저장</button></div>
  `);
  document.getElementById('saveContractorBtn').addEventListener('click', async ()=>{
    const data = {
      name: document.getElementById('f_name').value.trim(),
      type: document.getElementById('f_type').value,
      contact: document.getElementById('f_contact').value.trim(),
      role: document.getElementById('f_role').value.trim(),
    };
    if(!data.name){ toast('업체명을 입력해주세요'); return; }
    if(isEdit){ await DataStore.update(PATHS.contractors, existing.id, data); toast('수정되었습니다'); }
    else{ data.createdAt = Date.now(); await DataStore.push(PATHS.contractors, data); toast('업체가 등록되었습니다'); }
    closeModal(); renderContractors();
  });
}

          <select id="f_recordType">${['협의체 회의록','합동점검일지','순회점검일지'].map(t=>`<option>${t}</option>`).join('')}</select>

function renderNotices(){
  const el = document.getElementById('view-notices');
  el.innerHTML = `
    <div class="toolbar">
      <div style="font-size:13px;color:var(--ink-soft);font-weight:600;">안전 공지사항</div>
      <button class="btn btn-primary" id="addNoticeBtn">${icon('plus',15)} 공지 등록</button>
    </div>
    <div id="noticeList"></div>

    <div class="toolbar" style="margin-bottom:12px;">
      <div></div>
      <button class="btn" id="addContactBtn">${icon('plus',15)} 연락처 등록</button>
    </div>
    <div class="contact-grid" id="contactGrid"></div>
  `;
  document.getElementById('addNoticeBtn').addEventListener('click', ()=>{

    openNoticeModal();

    if(!requireAdmin('연락처 등록')) return;
    openContactModal();
  });

  const notices = objToArr(DataStore.get(PATHS.notices)).sort((a,b)=> (b.pinned?1:0)-(a.pinned?1:0) || (b.createdAt||0)-(a.createdAt||0));
  const list = document.getElementById('noticeList');
  list.innerHTML = notices.length ? notices.map(n=>`
    <div class="notice-item ${n.pinned?'pinned':''}">
      <h4>${n.pinned?icon('pin',14):''} ${esc(n.title)}</h4>
      <p>${esc(n.content)}</p>
      ${n.fileData ? `<div class="notice-meta"><a href="${n.fileData}" download="${esc(n.fileName||'첨부파일')}" style="color:var(--info);font-weight:700;">📎 ${esc(n.fileName||'첨부파일')} 다운로드</a></div>` : ''}
      <div class="notice-meta">${esc(n.author||'안전환경부')} · ${fmtDate(n.createdAt)}
        ${State.mode==='admin'?` · <a href="#" data-del-n="${n.id}" style="color:var(--danger)">삭제</a>`:''}
      </div>
    </div>
  `).join('') : `<div class="empty"><span class="big">${icon('megaphone',22)}</span>등록된 공지사항이 없습니다</div>`;
  list.querySelectorAll('[data-del-n]').forEach(a=> a.addEventListener('click', async e=>{
    e.preventDefault();
    if(confirm('공지를 삭제하시겠습니까?')){ await DataStore.remove(PATHS.notices, a.dataset.delN); toast('삭제되었습니다'); renderNotices(); }
  }));

  const contacts = objToArr(DataStore.get(PATHS.contacts));
  const grid = document.getElementById('contactGrid');
  grid.innerHTML = contacts.length ? contacts.map(c=>`
    <div class="contact-card">
      <div class="c-role">${esc(c.role||'담당')}</div>
      <div class="c-name">${esc(c.name)}</div>
      <div class="c-phone">${esc(c.phone||'-')}</div>
      ${State.mode==='admin'?`<div style="margin-top:8px"><a href="#" data-del-c2="${c.id}" style="font-size:11.5px;color:var(--danger)">삭제</a></div>`:''}
    </div>
  `).join('') : `<div class="empty"><span class="big">☎</span>등록된 비상연락처가 없습니다</div>`;
  grid.querySelectorAll('[data-del-c2]').forEach(a=> a.addEventListener('click', async e=>{
    e.preventDefault();
    if(confirm('삭제하시겠습니까?')){ await DataStore.remove(PATHS.contacts, a.dataset.delC2); toast('삭제되었습니다'); renderNotices(); }
  }));
}

function openNoticeModal(){
  showModal(`
    <div class="modal-head"><h3>공지사항 등록</h3><button class="x-btn" data-close>✕</button></div>
    <div class="modal-body">
      <div class="field"><label>제목 *</label><input type="text" id="f_title"></div>
      <div class="field"><label>내용 *</label><textarea id="f_content" style="min-height:120px"></textarea></div>
      <div class="field"><label>작성자</label><input type="text" id="f_author" value="안전환경부"></div>
      <div class="field"><label>첨부파일 (이미지, PDF 등)</label><input type="file" id="f_file">
        <p class="hint">용량이 큰 파일은 느려질 수 있어요. 5MB 이내 문서·이미지 위주로 첨부해주세요.</p>
      </div>
      <div class="field"><label><input type="checkbox" id="f_pinned"> 상단 고정</label></div>
    </div>
    <div class="modal-foot"><button class="btn" data-close>취소</button><button class="btn btn-primary" id="saveNoticeBtn">등록</button></div>
  `);
  document.getElementById('saveNoticeBtn').addEventListener('click', async ()=>{
    const title = document.getElementById('f_title').value.trim();
    const content = document.getElementById('f_content').value.trim();
    if(!title || !content){ toast('필수 항목(*)을 입력해주세요'); return; }
    const data = {
      title, content,
      author: document.getElementById('f_author').value.trim() || '안전환경부',
      pinned: document.getElementById('f_pinned').checked,
    };
    const fileInput = document.getElementById('f_file');
    const file = fileInput.files && fileInput.files[0];
    if(file){
      if(file.size > 5*1024*1024){
        toast('파일 용량이 너무 큽니다 (5MB 이내로 첨부해주세요)'); return;
      }
      const dataUrl = await new Promise((resolve, reject)=>{
        const reader = new FileReader();
        reader.onload = ()=> resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
      data.fileName = file.name;
      data.fileData = dataUrl;
    }
    data.createdAt = Date.now();
    await DataStore.push(PATHS.notices, data);
    toast('공지사항이 등록되었습니다');
    closeModal(); renderNotices();
  });
}

      <div class="field"><label>역할 *</label><input type="text" id="f_role" placeholder="예: 안전환경부장, 소방서, 119"></div>

/* ============================================================
   14. 모달 공용 함수
============================================================= */
function showModal(html){
  document.getElementById('modalBox').innerHTML = html;
  document.getElementById('overlay').hidden = false;
  document.querySelectorAll('[data-close]').forEach(b=> b.addEventListener('click', closeModal));
}
function closeModal(){ document.getElementById('overlay').hidden = true; document.getElementById('modalBox').innerHTML=''; }
document.getElementById('overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closeModal(); });

/* ============================================================
   15. 로그인 게이트 로직
============================================================= */
const ADMIN_PW_KEY = 'isc_admin_pw';
document.getElementById('gateMode').addEventListener('change', e=>{
  document.getElementById('gatePwWrap').hidden = e.target.value !== 'admin';
});
document.getElementById('gateEnter').addEventListener('click', ()=>{
  const mode = document.getElementById('gateMode').value;
  if(mode==='admin'){
    const input = document.getElementById('gatePw').value.trim();
    const saved = localStorage.getItem(ADMIN_PW_KEY);
    if(!saved){
      if(!input){ toast('사용할 비밀번호를 입력해주세요'); return; }
      localStorage.setItem(ADMIN_PW_KEY, input);
      toast('관리자 비밀번호가 설정되었습니다');
    }else if(input !== saved){
      toast('비밀번호가 일치하지 않습니다'); return;
    }
    State.mode = 'admin';
  }else{
    State.mode = 'user';
  }
  document.getElementById('gate').style.display = 'none';
  updateModeUI();
  boot();
});

document.getElementById('modeSwitchBtn').addEventListener('click', ()=>{
  if(State.mode === 'admin'){
    State.mode = 'user';
    updateModeUI();
    toast('일반 열람 모드로 전환되었습니다');
    renderCurrentView(); renderNav();
  }else{
    const saved = localStorage.getItem(ADMIN_PW_KEY);
    const input = prompt(saved ? '관리자 비밀번호를 입력하세요' : '사용할 관리자 비밀번호를 새로 설정하세요');
    if(input===null) return;
    if(!saved){
      if(!input.trim()){ toast('비밀번호를 입력해주세요'); return; }
      localStorage.setItem(ADMIN_PW_KEY, input.trim());
      toast('관리자 비밀번호가 설정되었습니다');
    }else if(input !== saved){
      toast('비밀번호가 일치하지 않습니다'); return;
    }
    State.mode = 'admin';
    updateModeUI();
    toast('관리자 모드로 전환되었습니다');
    renderCurrentView(); renderNav();
  }
});
function updateModeUI(){
  document.getElementById('modeLabel').textContent = State.mode==='admin' ? '관리자 모드' : '일반 열람 모드';
  document.getElementById('modeSwitchBtn').textContent = State.mode==='admin' ? '해제' : '전환';
  document.getElementById('modeSwitchBtn').classList.toggle('on', State.mode==='admin');
}

document.getElementById('hamburger').addEventListener('click', ()=>{
  document.getElementById('sidebar').classList.toggle('open');
});

/* ============================================================
   16. 부트스트랩
============================================================= */
function boot(){
  const d = new Date();
  document.getElementById('todayChip').textContent =
    `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} (${['일','월','화','수','목','금','토'][d.getDay()]})`;

  renderNav();
  switchView('dashboard');

  Object.values(PATHS).forEach(path=>{
    DataStore.listen(path, ()=>{
      renderNav();
      renderCurrentView();
    });
  });
}
