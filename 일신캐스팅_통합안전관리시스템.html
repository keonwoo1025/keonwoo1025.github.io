function openNoticeModal(existing){
  const isEdit = !!existing;
  const v = existing || {};
  showModal(`
    <div class="modal-head"><h3>${isEdit?t('notice_edit_title'):t('notice_new_title')}</h3><button class="x-btn" data-close>✕</button></div>
    <div class="modal-body">
      <div class="field"><label>${t('lbl_title')} *</label><input type="text" id="f_title" value="${esc(v.title||'')}"></div>
      <div class="field">
        <label>${t('lbl_content')} *</label>
        <div class="rte-toolbar" style="display:flex;gap:5px;margin-bottom:6px;flex-wrap:wrap;">
          <button type="button" class="btn btn-sm" data-cmd="bold" title="${t('rte_bold')}" style="font-weight:800;">B</button>
          <button type="button" class="btn btn-sm" data-cmd="forecolor" data-group="color" data-val="#E5484D" title="${t('rte_red')}" style="color:#E5484D;font-weight:800;">A</button>
          <button type="button" class="btn btn-sm" data-cmd="forecolor" data-group="color" data-val="#2D7DD2" title="${t('rte_blue')}" style="color:#2D7DD2;font-weight:800;">A</button>
          <button type="button" class="btn btn-sm" data-cmd="forecolor" data-group="color" data-val="#1DA46F" title="${t('rte_green')}" style="color:#1DA46F;font-weight:800;">A</button>
          <button type="button" class="btn btn-sm" data-cmd="forecolor" data-group="color" data-val="#14192B" title="${t('rte_default')}" style="color:#14192B;font-weight:800;">A</button>
          <span style="width:1px;background:var(--line);margin:0 2px;"></span>
          <button type="button" class="btn btn-sm" data-cmd="fontsize" data-group="size" data-val="2" title="${t('rte_small')}">${t('rte_small')}</button>
          <button type="button" class="btn btn-sm" data-cmd="fontsize" data-group="size" data-val="4" title="${t('rte_normal')}">${t('rte_normal')}</button>
          <button type="button" class="btn btn-sm" data-cmd="fontsize" data-group="size" data-val="6" title="${t('rte_large')}">${t('rte_large')}</button>
        </div>
        <div id="f_content" contenteditable="true" style="min-height:120px;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:13.5px;line-height:1.6;">${v.content||''}</div>
      </div>
      <div class="field"><label>${t('lbl_author')}</label><input type="text" id="f_author" value="${esc(v.author||'안전환경부')}"></div>
      <div class="field"><label>${t('lbl_attachment')}</label><input type="file" id="f_file">
        ${v.fileName ? `<p class="hint">${t('hint_existing_attachment').replace('{name}', esc(v.fileName))}</p>` : ''}
        <p class="hint">${t('hint_attachment_size')}</p>
      </div>
      <div class="field"><label><input type="checkbox" id="f_pinned" ${v.pinned?'checked':''}> ${t('lbl_pin_top')}</label></div>
    </div>
    <div class="modal-foot"><button class="btn" data-close>${t('btn_cancel')}</button><button class="btn btn-primary" id="saveNoticeBtn">${isEdit?t('btn_save'):t('btn_register')}</button></div>
  `);
  document.querySelectorAll('.rte-toolbar [data-cmd]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.getElementById('f_content').focus();
      document.execCommand(btn.dataset.cmd, false, btn.dataset.val || null);
      if(btn.dataset.cmd==='bold'){
        btn.classList.toggle('active', document.queryCommandState('bold'));
      }else if(btn.dataset.group){
        document.querySelectorAll(`.rte-toolbar [data-group="${btn.dataset.group}"]`).forEach(b=> b.classList.remove('active'));
        btn.classList.add('active');
      }
    });
  });
  document.getElementById('saveNoticeBtn').addEventListener('click', async ()=>{
    const title = document.getElementById('f_title').value.trim();
    const contentEl = document.getElementById('f_content');
    const content = contentEl.innerHTML.trim();
    if(!title || !contentEl.textContent.trim()){ toast(t('toast_fill_required')); return; }
    const data = {
      title, content,
      author: document.getElementById('f_author').value.trim() || '안전환경부',
      pinned: document.getElementById('f_pinned').checked,
    };
    const fileInput = document.getElementById('f_file');
    const file = fileInput.files && fileInput.files[0];
    if(file){
      if(file.size > 5*1024*1024){
        toast(t('toast_file_toobig')); return;
      }
      const dataUrl = await new Promise((resolve, reject)=>{
        const reader = new FileReader();
        reader.onload = ()=> resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
      data.fileName = file.name;
      data.fileType = file.type;
      data.fileData = dataUrl;
    }
    if(isEdit){
      await DataStore.update(PATHS.notices, existing.id, data);
      toast(t('toast_notice_updated'));
    }else{
      data.createdAt = Date.now();
      await DataStore.push(PATHS.notices, data);
      toast(t('toast_notice_registered'));
    }
    closeModal(); renderNotices();
  });
}

/* ============================================================
   13-1. 안전제안제도 — 실명 접수, 익명 불가
   일반사용자는 목록을 볼 수 없고 본인이 이 기기에서 등록한 제안만 조회 가능(로컬 저장 기반)
============================================================= */
// 여러 메뉴(위험성평가/사고접수/작업허가 등)에서 공통으로 쓰는 "내가 이 기기에서 등록한 항목" 추적
function getMyOwnedIds(storageKey){
  try{ return JSON.parse(localStorage.getItem(storageKey) || '[]'); }
  catch(e){ return []; }
}
function addMyOwnedId(storageKey, id){
  const ids = getMyOwnedIds(storageKey);
  ids.unshift(id);
  localStorage.setItem(storageKey, JSON.stringify(ids.slice(0,200)));
}

const MY_SUGGESTIONS_KEY = 'isc_my_suggestions';
function getMySuggestionIds(){
  try{ return JSON.parse(localStorage.getItem(MY_SUGGESTIONS_KEY) || '[]'); }
  catch(e){ return []; }
}
function addMySuggestionId(id){
  const ids = getMySuggestionIds();
  ids.unshift(id);
  localStorage.setItem(MY_SUGGESTIONS_KEY, JSON.stringify(ids.slice(0,100)));
}

function renderSuggestions(){
  const el = document.getElementById('view-suggestions');
  const isAdmin = State.mode==='admin';
  const filter = State.filters.suggestions || '전체';

  if(isAdmin){
    el.innerHTML = `
      <div class="toolbar">
        <div class="tabs" id="sugTabs">
          ${['전체','접수','검토중','완료'].map(s=>`<button class="tab ${filter===s?'active':''}" data-s="${s}">${s==='전체'?t('tab_all'):statusLabel(s)}</button>`).join('')}
        </div>
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>${t('sug_th_title')}</th><th>${t('sug_th_reporter')}</th><th>${t('th_date')}</th><th>${t('th_status')}</th><th class="tight">${t('btn_manage_col')}</th></tr></thead>
        <tbody id="sugBody"></tbody>
      </table></div>
    `;
    el.querySelectorAll('#sugTabs .tab').forEach(t=>t.addEventListener('click', ()=>{
      State.filters.suggestions = t.dataset.s; renderSuggestions();
    }));
    const arr = objToArr(DataStore.get(PATHS.suggestions)).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    const filtered = filter==='전체' ? arr : arr.filter(s=>s.status===filter);
    const body = document.getElementById('sugBody');
    body.innerHTML = filtered.length ? filtered.map(s=>`
      <tr>
        <td class="cell-strong">${newBadge(s, PATHS.suggestions)}${esc(s.title)}</td>
        <td>${esc(s.reporter||'-')}</td>
        <td class="mono">${fmtDate(s.createdAt)}</td>
        <td>${statusBadge('suggestion', s.status)}</td>
        <td class="tight row-btns"><button class="btn btn-sm" data-view-id="${s.id}">${t('btn_view')}</button></td>
      </tr>
    `).join('') : `<tr><td colspan="5"><div class="empty"><span class="big">${icon('lightbulb',22)}</span>${t('sug_empty')}</div></td></tr>`;
    body.querySelectorAll('[data-view-id]').forEach(b=> b.addEventListener('click', ()=> openSuggestionDetail(b.dataset.viewId)));
    return;
  }

  // 일반사용자: 등록 + 본인이 이 기기에서 낸 제안만 조회
  el.innerHTML = `
    <div class="toolbar">
      <div style="font-size:13px;color:var(--ink-soft);font-weight:600;">${t('sug_my_title')}</div>
      <button class="btn btn-primary" id="addSugBtn">${icon('plus',15)} ${t('sug_add_btn')}</button>
    </div>
    <p class="hint" style="margin:-8px 0 14px;">${t('sug_my_hint')}</p>
    <div id="mySugList"></div>
  `;
  document.getElementById('addSugBtn').addEventListener('click', ()=> openSuggestionModal());
  const all = DataStore.get(PATHS.suggestions) || {};
  const myIds = getMySuggestionIds();
  const mine = myIds.map(id=> all[id] ? Object.assign({id}, all[id]) : null).filter(Boolean);
  const list = document.getElementById('mySugList');
  list.innerHTML = mine.length ? mine.map(s=>`
    <div class="notice-item">
      <h4>${esc(s.title)} ${statusBadge('suggestion', s.status)}</h4>
      <div class="notice-content">${esc(s.content)}</div>
      ${s.photo ? `<img src="${s.photo}" class="risk-thumb" style="max-width:200px;border-radius:8px;border:1px solid var(--line);margin-top:8px;display:block;cursor:zoom-in;">` : ''}
      ${s.answer ? `<div class="notice-meta" style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);"><b>${t('sug_answer_label')}:</b> ${esc(s.answer)}</div>` : ''}
      <div class="notice-meta">${fmtDate(s.createdAt)}</div>
      ${s.status==='접수' ? `<button class="btn btn-sm" data-edit-sug="${s.id}" style="margin-top:8px;">${t('btn_edit')}</button>` : ''}
    </div>
  `).join('') : `<div class="empty"><span class="big">${icon('lightbulb',22)}</span>${t('sug_my_empty')}</div>`;
  bindImageZoom(list);
  list.querySelectorAll('[data-edit-sug]').forEach(b=> b.addEventListener('click', ()=>{
    const s = mine.find(x=>x.id===b.dataset.editSug);
    openSuggestionModal(s);
  }));
}

  `);
  bindPhotoField('f_sugPhoto');
  document.getElementById('saveSugBtn').addEventListener('click', async ()=>{
    const data = {
      title: document.getElementById('f_sugTitle').value.trim(),
      content: document.getElementById('f_sugContent').value.trim(),
      reporter: document.getElementById('f_sugReporter').value.trim(),
    };
    if(!data.title || !data.content || !data.reporter){ toast(t('toast_fill_required')); return; }

      showSuccessPopup(t('sug_registered_msg'));

const MY_BUGS_KEY = 'isc_my_bugs';
function getMyBugIds(){
  try{ return JSON.parse(localStorage.getItem(MY_BUGS_KEY) || '[]'); }
  catch(e){ return []; }
}
function addMyBugId(id){
  const ids = getMyBugIds();
  ids.unshift(id);
  localStorage.setItem(MY_BUGS_KEY, JSON.stringify(ids.slice(0,100)));
}

  if(isAdmin){
    el.innerHTML = `
      <div class="toolbar">
        <div class="tabs" id="bugTabs">
          ${['전체','접수','확인중','완료'].map(s=>`<button class="tab ${filter===s?'active':''}" data-s="${s}">${s==='전체'?t('tab_all'):statusLabel(s)}</button>`).join('')}

(function setupBackExitGuard(){
  history.pushState({ trap:true }, '');
  window.addEventListener('popstate', ()=>{
    if(signaturePadOpen){
      // 서명 중에는 뒤로가기 제스처로 서명창이 닫히지 않도록 무시하고 트랩만 다시 쌓음

const ADMIN_PW_KEY = 'isc_admin_pw';
const DEPTS = ['관리부','생산부','품질관리부'];
function deptPwKey(dept){ return 'isc_dept_pw_' + dept; }

function updateLangPicker(){

    b.classList.toggle('active', b.dataset.lang === State.lang);
  });
}
document.querySelectorAll('#langPicker .lang-btn').forEach(btn=>{

    localStorage.setItem('isc_lang', State.lang);
    updateLangPicker();
    applyI18n();
  });
});
updateLangPicker();
applyI18n();

document.getElementById('gateMode').addEventListener('change', e=>{
  document.getElementById('gatePwWrap').hidden = e.target.value === 'user';
});

// 저장된 비밀번호가 하나도 없으면(최초 실행) true — 이 경우에만 입력값으로 전체관리자 비번을 새로 설정
function noPasswordsSetYet(){
  if(localStorage.getItem(ADMIN_PW_KEY)) return false;
  return !DEPTS.some(d => localStorage.getItem(deptPwKey(d)));
}

// 비밀번호 하나로 역할(전체관리자/부서관리자)을 자동 판별
function resolveRoleByPassword(input){
  if(!input) return { ok:false, reason:'empty' };
  const adminSaved = localStorage.getItem(ADMIN_PW_KEY);
  if(adminSaved && input === adminSaved){
    return { ok:true, mode:'admin', dept:null };
  }
  for(const d of DEPTS){
    const saved = localStorage.getItem(deptPwKey(d));
    if(saved && input === saved){
      return { ok:true, mode:'dept', dept:d };
    }
  }
  if(noPasswordsSetYet()){
    // 최초 실행: 지금 입력한 비밀번호를 전체관리자 비밀번호로 등록
    localStorage.setItem(ADMIN_PW_KEY, input);
    toast(t('toast_admin_pw_set'));
    return { ok:true, mode:'admin', dept:null };
  }
  return { ok:false, reason:'mismatch' };
}

function enterWithPassword(input){
  const result = resolveRoleByPassword(input.trim());
  if(!result.ok){
    toast(result.reason==='empty' ? t('toast_pw_required') : t('toast_pw_mismatch'));
    return false;
  }
  State.mode = result.mode; State.dept = result.dept;
  return true;
}

const REMEMBER_MODE_KEY = 'isc_remember_mode';
const REMEMBER_DEPT_KEY = 'isc_remember_dept';

document.getElementById('gateEnter').addEventListener('click', ()=>{
  const mode = document.getElementById('gateMode').value;
  if(mode==='admin'){
    if(!enterWithPassword(document.getElementById('gatePw').value)) return;
    if(document.getElementById('gateRemember').checked){
      localStorage.setItem(REMEMBER_MODE_KEY, State.mode);
      if(State.dept) localStorage.setItem(REMEMBER_DEPT_KEY, State.dept);
      else localStorage.removeItem(REMEMBER_DEPT_KEY);
    }
  }else{
    State.mode = 'user'; State.dept = null;
  }
  document.getElementById('gate').style.display = 'none';
  updateModeUI();
  boot();
});

document.getElementById('modeSwitchBtn').addEventListener('click', ()=>{
  if(State.mode !== 'user'){
    State.mode = 'user'; State.dept = null;
    // 로그인 유지 상태였다면 이 기기의 기억 정보도 함께 삭제 (완전 로그아웃)
    localStorage.removeItem(REMEMBER_MODE_KEY);
    localStorage.removeItem(REMEMBER_DEPT_KEY);
    updateModeUI();
    toast(t('toast_switched_user'));
    renderCurrentView(); renderNav();
    return;
  }
  const input = prompt('관리자 비밀번호를 입력하세요\n(비밀번호에 따라 전체관리자 또는 해당 부서 관리자로 자동 접속됩니다)');
  if(input===null) return;
  if(!enterWithPassword(input)) return;
  updateModeUI();
  toast('모드가 전환되었습니다');
  renderCurrentView(); renderNav();
});

// 외주업체 전용 고유링크 접속 감지 (?p=토큰) — 매칭되면 게이트를 건너뛰고 작업허가만 보이는 열람모드로 진입
const partnerToken = new URLSearchParams(location.search).get('p');
if(partnerToken){
  document.getElementById('gate').style.display = 'none';
  document.body.insertAdjacentHTML('beforeend', `<div id="partnerLoadingScreen" style="position:fixed;inset:0;background:#F4F6F8;display:flex;align-items:center;justify-content:center;z-index:300;font-size:13px;color:#667085;">${t('partner_loading')}</div>`);
  let partnerDecided = false;
  DataStore.listen(PATHS.permitPartners, (val)=>{
    if(partnerDecided) return;
    partnerDecided = true;
    const entry = Object.values(val||{}).find(p=>p.token===partnerToken);
    const screen = document.getElementById('partnerLoadingScreen');
    if(entry){
      State.mode = 'partner';
      State.partnerCompany = entry.name;
      if(screen) screen.remove();
      updateModeUI();
      boot();
    }else if(screen){
      screen.innerHTML = `<div style="text-align:center;padding:20px;"><p style="font-weight:700;margin-bottom:6px;">${t('partner_invalid_title')}</p><p style="font-size:12px;color:#98A2B3;">${t('partner_invalid_desc')}</p></div>`;
    }
  });
}

// 이 기기에 "로그인 유지"가 저장되어 있으면 게이트를 건너뛰고 바로 접속
(function tryAutoLogin(){
  if(partnerToken) return; // 외주업체 링크로 접속한 경우는 이 흐름을 타지 않음
  const rememberedMode = localStorage.getItem(REMEMBER_MODE_KEY);
  if(rememberedMode==='admin' || rememberedMode==='dept'){
    State.mode = rememberedMode;
    State.dept = rememberedMode==='dept' ? localStorage.getItem(REMEMBER_DEPT_KEY) : null;
    document.getElementById('gate').style.display = 'none';
    updateModeUI();
    boot();
  }
})();

// 전체관리자 전용: 부서 비밀번호 설정/변경
function openDeptPasswordModal(){
  showModal(`
    <div class="modal-head"><h3>관리자 계정 설정</h3><button class="x-btn" data-close>✕</button></div>
    <div class="modal-body">
      <div class="field"><label>전체관리자 비밀번호 변경</label>
        <input type="text" id="f_pw_admin" placeholder="새 비밀번호 (변경하지 않으려면 비워두세요)">
      </div>
      <div class="divider"></div>
      <p class="hint" style="margin-bottom:14px;">각 부서에 나눠줄 비밀번호를 설정하세요. 부서 담당자가 이 비밀번호로 로그인하면 자동으로 해당 부서 관리자로 접속됩니다.</p>
      ${DEPTS.map(d=>`
        <div class="field"><label>${d}</label>
          <input type="text" id="f_pw_${d}" placeholder="${localStorage.getItem(deptPwKey(d)) ? '설정됨 (변경하려면 새 비밀번호 입력)' : '비밀번호 설정'}">
        </div>
      `).join('')}
    </div>
    <div class="modal-foot">
      <button class="btn" data-close>취소</button>
      <button class="btn btn-primary" id="saveDeptPwBtn">저장</button>
    </div>
  `);
  document.getElementById('saveDeptPwBtn').addEventListener('click', ()=>{
    let changed = 0;
    const newAdminPw = document.getElementById('f_pw_admin').value.trim();
    if(newAdminPw){ localStorage.setItem(ADMIN_PW_KEY, newAdminPw); changed++; }
    DEPTS.forEach(d=>{
      const val = document.getElementById('f_pw_'+d).value.trim();
      if(val){ localStorage.setItem(deptPwKey(d), val); changed++; }
    });
    toast(changed>0 ? '비밀번호가 저장되었습니다' : '변경된 내용이 없습니다');
    closeModal();
  });
}

function updateModeUI(){
  const label = State.mode==='admin' ? t('mode_label_admin')
    : State.mode==='dept' ? `${t('mode_label_dept')} (${State.dept})`
    : State.mode==='partner' ? `${t('mode_label_partner')} (${State.partnerCompany})`
    : t('mode_label_user');
  document.getElementById('modeLabel').textContent = label;
  document.getElementById('deptPwSettingBtn').style.display = State.mode==='admin' ? '' : 'none';
  document.getElementById('modeSwitchBtn').style.display = State.mode==='partner' ? 'none' : '';
  document.getElementById('modeSwitchBtn').textContent = State.mode==='user' ? t('mode_switch') : t('mode_release');
  document.getElementById('modeSwitchBtn').classList.toggle('on', State.mode!=='user');
}

/* 정적 마크업(data-i18n / data-i18n-placeholder)에 현재 언어 적용 */
function applyI18n(){
  document.documentElement.lang = State.lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    el.textContent = t(el.dataset.i18n);
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{
    el.setAttribute('placeholder', t(el.dataset.i18nPlaceholder));
  });
}

document.getElementById('deptPwSettingBtn').addEventListener('click', ()=>{
  if(State.mode!=='admin'){ toast(t('toast_admin_only')); return; }
  openDeptPasswordModal();
});

document.getElementById('brandHome').addEventListener('click', ()=>{
  switchView('dashboard');
});

function openMobileSidebar(){
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebarBackdrop').classList.add('open');
}
function closeMobileSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarBackdrop').classList.remove('open');
}
document.getElementById('hamburger').addEventListener('click', ()=>{
  if(document.getElementById('sidebar').classList.contains('open')) closeMobileSidebar();
  else openMobileSidebar();
});
document.getElementById('sidebarBackdrop').addEventListener('click', closeMobileSidebar);
document.getElementById('sidebarCloseBtn').addEventListener('click', closeMobileSidebar);

/* ============================================================
   16. 부트스트랩
============================================================= */
function boot(){
  const d = new Date();
  document.getElementById('todayChip').textContent =
    `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} (${['일','월','화','수','목','금','토'][d.getDay()]})`;

  renderNav();
  switchView('dashboard');

  Object.values(PATHS).forEach(path=>{
    DataStore.listen(path, (val)=>{
      renderNav();
      renderCurrentView();
      checkStaleEscalation(path, val);
    });
  });
}

// 접수/신청 후 2일(48시간)이 지나도록 초기 상태 그대로면 자동으로 다음 단계로 넘김
// (방치되는 것을 막기 위함 — 데이터를 실제로 불러온 시점마다 점검)
const STALE_ESCALATE_MS = 2*24*60*60*1000;
const STALE_ESCALATE_RULES = {}; // path -> {from, to}, 아래서 PATHS 확정 후 채움
STALE_ESCALATE_RULES[PATHS.permits]   = { from:'신청',     to:'검토중' };
STALE_ESCALATE_RULES[PATHS.risks]     = { from:'접수완료', to:'조치중' };
STALE_ESCALATE_RULES[PATHS.incidents] = { from:'접수',     to:'조사중' };

async function checkStaleEscalation(path, val){
  const rule = STALE_ESCALATE_RULES[path];
  if(!rule || !val) return;
  for(const id of Object.keys(val)){
    const item = val[id];
    if(item && item.status===rule.from && item.createdAt && (Date.now()-item.createdAt > STALE_ESCALATE_MS)){
      await DataStore.update(path, id, { status: rule.to });
    }
  }
}

/* ============================================================
   17. PWA 설치 안내 (로그인 화면 버튼)
============================================================= */
let deferredInstallPrompt = null;
const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);

function updateInstallBtn(){
  const btn = document.getElementById('gateInstallBtn');
  if(!btn) return;
  // 설치 여부와 상관없이 언제든 눌러서 설치를 시도/안내받을 수 있도록 항상 노출
  btn.style.display = '';
  btn.innerHTML = `${icon('file-check',14)} ${t('gate_install_btn')}`;
}

window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  updateInstallBtn();
});

document.getElementById('gateInstallBtn').addEventListener('click', async ()=>{
  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    const choice = await deferredInstallPrompt.userChoice;
    if(choice.outcome === 'accepted'){ toast(t('toast_app_installed')); }
    deferredInstallPrompt = null;
    updateInstallBtn();
  }else if(isIOS){
    showModal(`
      <div class="modal-head"><h3>${t('ios_install_title')}</h3><button class="x-btn" data-close>✕</button></div>
      <div class="modal-body">
        <ol style="margin:0;padding-left:20px;font-size:13.5px;line-height:2;">
          <li>${t('ios_install_step1')}</li>
          <li>${t('ios_install_step2')}</li>
          <li>${t('ios_install_step3')}</li>
        </ol>
      </div>
      <div class="modal-foot"><button class="btn" data-close>${t('btn_close')}</button></div>
    `);
  }else{
    // 자동 설치 이벤트가 아직 안 뜬 경우(브라우저마다 타이밍 차이) 일반 안내로 대체
    showModal(`
      <div class="modal-head"><h3>${t('generic_install_title')}</h3><button class="x-btn" data-close>✕</button></div>
      <div class="modal-body">
        <ol style="margin:0;padding-left:20px;font-size:13.5px;line-height:2;">
          <li>${t('generic_install_step1')}</li>
          <li>${t('generic_install_step2')}</li>
          <li>${t('generic_install_step3')}</li>
        </ol>
      </div>
      <div class="modal-foot"><button class="btn" data-close>${t('btn_close')}</button></div>
    `);
  }
});

window.addEventListener('appinstalled', ()=>{
  deferredInstallPrompt = null;
  updateInstallBtn();
});

updateInstallBtn();

// 로그인 상태에서도 사이드바에서 언어변경/설치 접근 가능 (앱을 껐다 켤 필요 없이)
document.getElementById('sidebarInstallBtn').addEventListener('click', ()=>{
  document.getElementById('gateInstallBtn').click();
});
document.getElementById('sidebarLangBtn').addEventListener('click', ()=>{
  showModal(`
    <div class="modal-head"><h3>${t('gate_lang_label')}</h3><button class="x-btn" data-close>✕</button></div>
    <div class="modal-body">
      <div class="lang-picker" id="sidebarLangPicker">
        <button type="button" class="lang-btn ${State.lang==='ko'?'active':''}" data-lang="ko"><span class="flag">🇰🇷</span><span>한국어</span></button>
        <button type="button" class="lang-btn ${State.lang==='en'?'active':''}" data-lang="en"><span class="flag">🇺🇸</span><span>English</span></button>
        <button type="button" class="lang-btn ${State.lang==='th'?'active':''}" data-lang="th"><span class="flag">🇹🇭</span><span>ไทย</span></button>
        <button type="button" class="lang-btn ${State.lang==='id'?'active':''}" data-lang="id"><span class="flag">🇮🇩</span><span>Indonesia</span></button>
        <button type="button" class="lang-btn ${State.lang==='mn'?'active':''}" data-lang="mn"><span class="flag">🇲🇳</span><span>Монгол</span></button>
      </div>
    </div>
  `);
  document.querySelectorAll('#sidebarLangPicker .lang-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      State.lang = btn.dataset.lang;
      localStorage.setItem('isc_lang', State.lang);
      applyI18n();
      updateModeUI();
      renderNav();
      renderCurrentView();
      closeModal();
    });
  });
});
</script>
