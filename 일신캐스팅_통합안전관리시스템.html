<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>일신캐스팅 통합 안전관리 시스템</title>

<!-- ============================================================
  PWA (홈 화면 설치용 앱 설정)
============================================================= -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#101B33">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="일신안전관리">

<!-- ============================================================
  Firebase SDK (compat 버전 - 별도 빌드 도구 없이 바로 사용 가능)
============================================================= -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pizzip@3.1.6/dist/pizzip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docxtemplater@3.44.0/build/docxtemplater.min.js"></script>

<style>
/* ==========================================================================
   토큰 시스템
   Color
     --navy-900 #101B33  사이드바/헤더 배경 (딱딱한 조명 아래 도장 강판 느낌)
     --navy-700 #1C2E52  사이드바 hover
     --paper    #F4F6F8  본문 배경
     --card     #FFFFFF  카드 배경
     --line     #E2E6EC  경계선
     --ink      #14192B  본문 텍스트
     --ink-soft #667085  보조 텍스트
     --safety   #FF6A13  안전표지 오렌지 (경고/CTA 강조)
     --caution  #FFC93C  주의(황색 표지판)
     --ok       #1DA46F  안전(녹색 표지판)
     --danger   #E5484D  위험(적색 표지판)
     --info     #2D7DD2  정보/파랑
   Type
     display : 'Pretendard' (한글 가변폭 산세리프, 큰 숫자/타이틀)
     mono    : 'JetBrains Mono' (지표 숫자, 코드성 데이터)
   Signature
     대시보드 상단의 "무재해 카운터" 게시판 — 공장 정문에 걸린
     'ㅇㅇㅇ일 무재해' 안내판을 웹 UI로 옮긴 히어로 스탯 패널.
========================================================================== */
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap');

:root{
  --navy-900:#101B33;
  --navy-800:#152648;
  --navy-700:#1C2E52;
  --paper:#F4F6F8;
  --card:#FFFFFF;
  --line:#E2E6EC;
  --ink:#14192B;
  --ink-soft:#667085;
  --ink-faint:#98A2B3;
  --safety:#FF6A13;
  --safety-dim:#FFE8D6;
  --caution:#FFC93C;
  --caution-dim:#FFF6DA;
  --ok:#1DA46F;
  --ok-dim:#DDF3E9;
  --danger:#E5484D;
  --danger-dim:#FCE3E4;
  --info:#2D7DD2;
  --info-dim:#E1EDFB;
  --radius:10px;
  --shadow:0 1px 2px rgba(16,27,51,.04), 0 4px 16px rgba(16,27,51,.06);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:'Pretendard', system-ui, -apple-system, 'Malgun Gothic', sans-serif;
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  font-size:14.5px;
  line-height:1.5;
}
::selection{background:var(--safety-dim);}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:inherit;}

.mono{font-family:'JetBrains Mono', ui-monospace, monospace;}

/* ---------- App shell ---------- */
#app{display:flex;min-height:100vh;}

/* Sidebar */
.sidebar{
  width:236px;flex:0 0 236px;
  background:linear-gradient(180deg,var(--navy-900),var(--navy-800) 70%);
  color:#fff;
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
  z-index:20;
}
.brand{
  padding:22px 20px 16px;
  border-bottom:1px solid rgba(255,255,255,.08);
  display:flex;align-items:flex-start;gap:11px;
}
.brand-logo{
  flex:0 0 44px;width:44px;height:44px;border-radius:10px;
  background:#fff;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 10px rgba(0,0,0,.25);
  padding:5px;
}
.brand-logo img{width:100%;height:100%;object-fit:contain;}
.brand-text{min-width:0;}
.brand .tag{
  display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.08em;
  color:var(--safety);background:rgba(255,106,19,.14);
  padding:3px 7px;border-radius:5px;margin-bottom:8px;
}
.brand h1{font-size:16.5px;margin:0 0 2px;font-weight:800;letter-spacing:-.01em;}
.brand p{margin:0;font-size:11.5px;color:#8C99B8;}

.nav{flex:1;padding:14px 10px;overflow-y:auto;}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:8px;margin-bottom:2px;
  color:#B7C0D6;font-size:13.5px;font-weight:600;
  border:none;background:none;width:100%;text-align:left;
  transition:background .12s, color .12s;
}
.nav-item svg{flex:0 0 18px;width:18px;height:18px;opacity:.85;}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:var(--safety);color:#fff;}
.nav-item.active svg{opacity:1;}
.nav-badge{
  margin-left:auto;font-size:10.5px;font-weight:700;
  background:rgba(255,255,255,.14);padding:1px 7px;border-radius:20px;
  font-family:'JetBrains Mono',monospace;
}
.nav-item.active .nav-badge{background:rgba(255,255,255,.28);}
.nav-dot{
  width:8px;height:8px;border-radius:50%;background:var(--danger);
  display:inline-block;margin-left:6px;flex:0 0 8px;
  box-shadow:0 0 0 3px rgba(229,72,77,.28);
  animation:new-pulse 1.8s ease-in-out infinite;
}

.sidebar-foot{
  padding:14px 18px 18px;border-top:1px solid rgba(255,255,255,.08);
  font-size:11px;color:#7686A8;
}
.mode-pill{
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(255,255,255,.06);border-radius:8px;padding:8px 10px;margin-bottom:10px;
}
.mode-pill span{font-size:12px;font-weight:700;color:#D6DCEA;}
.mode-btn{
  border:1px solid rgba(255,255,255,.18);background:transparent;color:#fff;
  font-size:11px;font-weight:700;padding:4px 9px;border-radius:6px;
}
.mode-btn.on{background:var(--ok);border-color:var(--ok);}

/* Main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  position:sticky;top:0;z-index:10;
  background:rgba(244,246,248,.9);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);
  padding:18px 32px;display:flex;align-items:center;justify-content:space-between;
}
.topbar h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.01em;}
.topbar .sub{margin:2px 0 0;font-size:12.5px;color:var(--ink-soft);}
.topbar-right{display:flex;align-items:center;gap:10px;}
.today-chip{
  font-size:12px;color:var(--ink-soft);background:#fff;border:1px solid var(--line);
  padding:6px 12px;border-radius:20px;font-family:'JetBrains Mono',monospace;font-weight:600;
}

.view{padding:18px 32px 40px;}
.view[hidden]{display:none;}

/* ---------- Buttons / inputs ---------- */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--line);background:#fff;color:var(--ink);
  font-size:13px;font-weight:700;padding:9px 15px;border-radius:8px;
  transition:all .12s;white-space:nowrap;
}
.btn:hover{border-color:#C7CFDC;background:#FAFBFC;}
.btn-primary{background:var(--safety);border-color:var(--safety);color:#fff;}
.btn-primary:hover{background:#E85E0E;border-color:#E85E0E;}
.btn-ghost{border-color:transparent;background:transparent;}
.btn-ghost:hover{background:#EEF1F5;}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:7px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:6px;}
.field .hint{font-size:11.5px;color:var(--ink-faint);font-weight:500;margin-top:4px;}
.field input[type=text],.field input[type=date],.field input[type=time],
.field input[type=tel],.field select,.field textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;
  font-size:13.5px;color:var(--ink);background:#fff;
}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none;border-color:var(--safety);box-shadow:0 0 0 3px var(--safety-dim);
}
.field textarea{resize:vertical;min-height:70px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
@media(max-width:720px){.row2,.row3{grid-template-columns:1fr;}}

/* ---------- Cards / KPI ---------- */
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
@media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);}}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.kpi{padding:12px 14px 11px;border-left:4px solid var(--info);}
.kpi.c-safety{border-left-color:var(--safety);}
.kpi.c-ok{border-left-color:var(--ok);}
.kpi.c-danger{border-left-color:var(--danger);}
.kpi.c-caution{border-left-color:var(--caution);}
.kpi .k-label{font-size:11.5px;font-weight:700;color:var(--ink-soft);display:flex;align-items:center;gap:6px;}
.kpi .k-num{font-family:'JetBrains Mono',monospace;font-size:23px;font-weight:700;margin:4px 0 1px;letter-spacing:-.01em;}
.kpi .k-sub{font-size:11px;color:var(--ink-faint);}

/* Signature: 무재해 카운터 보드 */
.zeroboard{
  background:radial-gradient(120% 140% at 0% 0%, var(--navy-800), var(--navy-900) 65%);
  border-radius:14px;color:#fff;padding:26px 30px;display:flex;align-items:center;
  justify-content:space-between;gap:24px;box-shadow:var(--shadow);position:relative;overflow:hidden;
  margin-bottom:20px;
}
.zeroboard:before{
  content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(135deg, rgba(255,255,255,.025) 0 2px, transparent 2px 14px);
  pointer-events:none;
}
.zb-left .zb-eyebrow{
  font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--caution);
  display:flex;align-items:center;gap:7px;margin-bottom:10px;
}
.zb-eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(29,164,111,.25);}
.zb-num{
  font-family:'JetBrains Mono',monospace;font-size:64px;font-weight:700;line-height:1;
  letter-spacing:-.02em;
}
.zb-num span{font-size:22px;font-weight:700;margin-left:8px;color:#B7C0D6;}
.zb-desc{font-size:13px;color:#AEB9D2;margin-top:8px;max-width:360px;}
.zb-right{display:flex;gap:26px;position:relative;z-index:1;}
.zb-stat{text-align:right;}
.zb-stat .n{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:700;}
.zb-stat .l{font-size:11px;color:#8C99B8;margin-top:2px;}
@media(max-width:820px){.zeroboard{flex-direction:column;align-items:flex-start;}.zb-right{align-self:stretch;justify-content:space-between;}}

.dash-header{
  display:flex;align-items:center;gap:12px;margin-bottom:10px;cursor:default;
}
.dash-header .dh-logo{
  flex:0 0 40px;width:40px;height:40px;border-radius:10px;
  background:#fff;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow);padding:5px;
}
.dash-header .dh-logo img{width:100%;height:100%;object-fit:contain;}
.dash-header h1{
  margin:0;font-size:17px;font-weight:800;letter-spacing:-.01em;color:var(--ink);
}
.dash-header p{margin:1px 0 0;font-size:11.5px;color:var(--ink-soft);font-weight:600;}

.section-title{font-size:15px;font-weight:800;margin:26px 0 12px;display:flex;align-items:center;gap:8px;}
.section-title .n{color:var(--ink-faint);font-weight:700;font-size:12px;}

/* Two column dashboard lower section */
.dash-lower{display:grid;grid-template-columns:1.3fr 1fr;gap:12px;margin-top:10px;}
@media(max-width:980px){.dash-lower{grid-template-columns:1fr;}}
.dash-charts{display:grid;grid-template-columns:1.6fr 1fr;gap:12px;margin-bottom:10px;}
@media(max-width:980px){.dash-charts{grid-template-columns:1fr;}}

.list-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
.list-card .lc-head{padding:9px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
.list-card .lc-head h3{margin:0;font-size:12.5px;font-weight:800;}
.lc-body{max-height:170px;overflow-y:auto;}
.mini-row{padding:7px 14px;border-bottom:1px solid #EEF1F5;display:flex;align-items:center;gap:10px;font-size:12px;}
.mini-row:last-child{border-bottom:none;}
.mini-row .mr-title{flex:1;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mini-row .mr-meta{font-size:11px;color:var(--ink-faint);font-family:'JetBrains Mono',monospace;}
.empty{padding:30px 18px;text-align:center;color:var(--ink-faint);font-size:13px;}
.empty .big{font-size:26px;display:block;margin-bottom:6px;}

/* ---------- Badges ---------- */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap;}
.badge-new{
  display:inline-flex;align-items:center;padding:2px 7px;border-radius:5px;
  font-size:10px;font-weight:800;letter-spacing:.03em;color:#fff;background:var(--danger);
  vertical-align:middle;margin-right:2px;animation:new-pulse 1.8s ease-in-out infinite;
}
@keyframes new-pulse{0%,100%{opacity:1;}50%{opacity:.55;}}
.b-gray{background:#EEF1F5;color:#4B5468;}
.b-info{background:var(--info-dim);color:var(--info);}
.b-caution{background:var(--caution-dim);color:#946200;}
.b-ok{background:var(--ok-dim);color:var(--ok);}
.b-danger{background:var(--danger-dim);color:var(--danger);}
.b-safety{background:var(--safety-dim);color:#B24A00;}
.b-caution2{background:#FFE7C7;color:#9A4B00;}

/* ---------- Toolbar / filter tabs ---------- */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.tabs{display:flex;gap:6px;flex-wrap:wrap;}
.tab{
  border:1px solid var(--line);background:#fff;color:var(--ink-soft);
  font-size:12.5px;font-weight:700;padding:7px 13px;border-radius:20px;
}
.tab.active{background:var(--navy-900);border-color:var(--navy-900);color:#fff;}
.searchbox{
  display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);
  border-radius:8px;padding:0 12px;min-width:220px;
}
.searchbox input{border:none;padding:8px 0;font-size:13px;flex:1;background:transparent;}
.searchbox input:focus{outline:none;}

/* ---------- Table ---------- */
.table-wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow-x:auto;-webkit-overflow-scrolling:touch;}
.table-wrap table{min-width:640px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{
  text-align:left;font-size:11.5px;font-weight:800;color:var(--ink-soft);
  text-transform:uppercase;letter-spacing:.03em;
  padding:11px 16px;border-bottom:1px solid var(--line);background:#FAFBFC;white-space:nowrap;
}
tbody td{padding:12px 16px;border-bottom:1px solid #EEF1F5;color:var(--ink);vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#FAFBFC;}
td.tight,th.tight{width:1%;white-space:nowrap;}
.row-btns{display:flex;gap:6px;}
.cell-strong{font-weight:700;}
.cell-sub{font-size:11.5px;color:var(--ink-faint);margin-top:2px;}

/* ---------- Modal ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(16,27,51,.5);backdrop-filter:blur(1px);
  display:flex;align-items:flex-start;justify-content:center;padding:5vh 20px;z-index:100;overflow-y:auto;
}
.overlay[hidden]{display:none;}
.modal{
  background:#fff;border-radius:14px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(16,27,51,.25);
  animation:pop .14s ease-out;
}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.99)}to{opacity:1;transform:none}}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
.modal-head h3{margin:0;font-size:16px;font-weight:800;}
.modal-body{padding:20px 22px;max-height:70vh;overflow-y:auto;}
.modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;}
.x-btn{border:none;background:#F1F3F6;width:30px;height:30px;border-radius:8px;font-size:15px;color:var(--ink-soft);}

/* ---------- Detail drawer content ---------- */
.detail-grid{display:grid;grid-template-columns:120px 1fr;row-gap:10px;font-size:13.5px;}
.detail-grid dt{color:var(--ink-soft);font-weight:700;}
.detail-grid dd{margin:0;}
.divider{height:1px;background:var(--line);margin:16px 0;}

/* ---------- Notice board ---------- */
.notice-item{border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:10px;background:#fff;}
.notice-item.pinned{border-color:var(--safety);background:linear-gradient(0deg,#fff,var(--safety-dim) 400%);}
.notice-item h4{margin:0 0 6px;font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:8px;}
.notice-item p{margin:0;font-size:13px;color:var(--ink-soft);white-space:pre-wrap;}
.notice-content{margin:0;font-size:13px;color:var(--ink-soft);line-height:1.6;word-break:break-word;}
.notice-content b,.notice-content strong{color:var(--ink);}
.notice-meta{font-size:11.5px;color:var(--ink-faint);margin-top:8px;font-family:'JetBrains Mono',monospace;}

.contact-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
@media(max-width:900px){.contact-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:600px){.contact-grid{grid-template-columns:1fr;}}
.contact-card{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:#fff;}
.contact-card .c-role{font-size:11px;font-weight:800;color:var(--safety);letter-spacing:.03em;}
.contact-card .c-name{font-size:14.5px;font-weight:800;margin:4px 0 2px;}
.contact-card .c-phone{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--ink-soft);}

/* ---------- Risk matrix chip ---------- */
.risk-chip{
  display:inline-flex;align-items:center;justify-content:center;
  width:34px;height:26px;border-radius:6px;font-weight:800;font-size:12.5px;
  font-family:'JetBrains Mono',monospace;color:#fff;
}
.risk-low{background:var(--ok);}
.risk-mid{background:var(--caution);color:#5C4400;}
.risk-high{background:var(--safety);}
.risk-crit{background:var(--danger);}
.risk-level-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;}
.risk-legend{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 16px;padding:14px 16px;background:#F7F8FA;border:1px solid var(--line);border-radius:10px;margin-bottom:14px;}
@media(max-width:620px){.risk-legend{grid-template-columns:1fr;}}
.risk-legend-item{display:flex;align-items:flex-start;gap:10px;font-size:12.5px;}
.risk-legend-item b{font-size:12.5px;}
.lightbox-overlay{
  position:fixed;inset:0;background:rgba(10,14,26,.88);z-index:500;
  display:flex;align-items:center;justify-content:center;padding:24px;cursor:zoom-out;
  animation:lightbox-fade .12s ease-out;
}
@keyframes lightbox-fade{from{opacity:0;}to{opacity:1;}}
.lightbox-overlay img{max-width:100%;max-height:100%;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
.lightbox-close{
  position:fixed;top:20px;right:24px;width:40px;height:40px;border-radius:50%;
  background:rgba(255,255,255,.15);color:#fff;border:none;font-size:18px;cursor:pointer;
}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;}
.gallery-card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);}
.gc-photos{display:grid;grid-template-columns:1fr 1fr;}
.gc-photo{position:relative;aspect-ratio:1/1;background:#EEF1F5;}
.gc-photo img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;display:block;}
.gc-noimg{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-size:11px;}
.gc-tag{position:absolute;bottom:6px;left:6px;background:rgba(20,25,43,.72);color:#fff;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px;}
.gc-body{padding:12px 14px;}
.gc-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px;}
.gc-hazard{font-size:12.5px;color:var(--ink-soft);margin-bottom:8px;line-height:1.5;}
.gc-score{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:800;color:var(--ink);}

/* ---------- Login gate ---------- */
.gate{
  position:fixed;inset:0;background:var(--navy-900);display:flex;align-items:center;justify-content:center;z-index:200;
}
.gate-card{background:#fff;border-radius:16px;padding:36px 34px;width:100%;max-width:360px;box-shadow:0 30px 80px rgba(0,0,0,.4);}
.gate-card .tag{
  display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.08em;color:var(--safety);
  background:var(--safety-dim);padding:3px 8px;border-radius:5px;margin-bottom:10px;
}
.gate-card h2{margin:0 0 4px;font-size:19px;font-weight:800;}
.gate-card p{margin:0 0 20px;font-size:12.5px;color:var(--ink-soft);}
.lang-picker{display:flex;flex-wrap:wrap;gap:7px;}
.lang-btn{
  display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:9px;
  border:1.5px solid var(--line);background:#fff;font-size:12.5px;font-weight:700;color:var(--ink);
}
.lang-btn .flag{font-size:16px;line-height:1;}
.lang-btn.active{border-color:var(--safety);background:var(--safety-dim);color:#B24A00;}
.gate-actions{display:flex;gap:8px;margin-top:6px;}
.gate-actions .btn{flex:1;justify-content:center;}

/* ---------- Toast ---------- */
#toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--navy-900);color:#fff;padding:12px 20px;border-radius:9px;font-size:13px;font-weight:600;
  box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:all .2s;z-index:300;
  display:flex;align-items:center;gap:8px;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#toast .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);}

/* ---------- Scrollbar ---------- */
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#CBD3DF;border-radius:20px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- Config banner ---------- */
.config-banner{
  background:var(--caution-dim);border:1px solid #F0D26B;color:#7A5B00;
  padding:10px 16px;border-radius:9px;font-size:12.5px;margin-bottom:18px;
  display:flex;align-items:center;gap:8px;font-weight:600;
}

/* ---------- Mobile ---------- */
.hamburger{display:none;}
@media(max-width:880px){
  .sidebar{position:fixed;left:-260px;top:0;transition:left .18s;box-shadow:0 0 40px rgba(0,0,0,.3);}
  .sidebar.open{left:0;}
  .hamburger{display:flex;border:1px solid var(--line);background:#fff;border-radius:8px;width:36px;height:36px;align-items:center;justify-content:center;}
  .topbar{padding:14px 16px;}
  .view{padding:18px 16px 50px;}
  .grid-4{grid-template-columns:1fr 1fr;}
  .dash-charts{grid-template-columns:1fr;}
}
@media(max-width:620px){
  html,body{overflow-x:hidden;}
  .grid-4{grid-template-columns:1fr;}
  .modal{max-width:100%;border-radius:12px;}
  .overlay{padding:0;align-items:flex-end;}
  .modal-body{max-height:75vh;}
  .toolbar{flex-direction:column;align-items:stretch;}
  .tabs{overflow-x:auto;padding-bottom:2px;}
  .searchbox{width:100%;}
  .contact-grid{grid-template-columns:1fr;}
  .detail-grid{grid-template-columns:100px 1fr;font-size:12.5px;}
  .dash-header h1{font-size:16px;}
  .kpi .k-num{font-size:22px;}
  .dash-charts > .list-card > div[style*="height:130px"]{height:110px;}
  .zb-num{font-size:34px;}
  .zb-right{gap:14px;flex-wrap:wrap;}
  .list-card canvas{max-width:100%;}
}
</style>
</head>

   로그인 게이트 (모드 선택: 관리자 / 일반 열람)
========================================================== -->
<div class="gate" id="gate">
  <div class="gate-card">
    <span class="tag" data-i18n="gate_tag">ILSHIN CASTING · SAFETY</span>
    <h2 data-i18n="gate_title">통합 안전관리 시스템</h2>
    <p data-i18n="gate_desc">안전환경부 · 사고예방 및 현장관리 통합 플랫폼</p>
    <div class="field">
      <label data-i18n="gate_lang_label">언어 선택</label>
      <div class="lang-picker" id="langPicker">
        <button type="button" class="lang-btn" data-lang="ko"><span class="flag">🇰🇷</span><span>한국어</span></button>
        <button type="button" class="lang-btn" data-lang="en"><span class="flag">🇺🇸</span><span>English</span></button>
        <button type="button" class="lang-btn" data-lang="th"><span class="flag">🇹🇭</span><span>ไทย</span></button>
        <button type="button" class="lang-btn" data-lang="id"><span class="flag">🇮🇩</span><span>Indonesia</span></button>
        <button type="button" class="lang-btn" data-lang="mn"><span class="flag">🇲🇳</span><span>Монгол</span></button>
      </div>
    </div>
    <div class="field">
      <label data-i18n="gate_mode_label">접속 모드</label>
      <select id="gateMode">
        <option value="user" data-i18n="gate_mode_user">일반 열람 (조회 · 신청 · 제보)</option>
        <option value="admin" data-i18n="gate_mode_admin">관리자</option>
      </select>
    </div>
    <div class="field" id="gatePwWrap" hidden>
      <label data-i18n="gate_pw_label">비밀번호</label>
      <input type="text" id="gatePw" placeholder="비밀번호 입력" data-i18n-placeholder="gate_pw_placeholder">
      <p class="hint" data-i18n="gate_pw_hint">비밀번호에 따라 전체관리자 또는 해당 부서 관리자로 자동 접속됩니다.</p>
    </div>
    <div class="gate-actions">
      <button class="btn btn-primary" id="gateEnter" style="flex:1" data-i18n="gate_enter">입장하기</button>
    </div>
  </div>
</div>

/* 로컬 폴백 저장소 (Firebase 설정 전 데모/오프라인용) ------------- */
const LocalStore = {
  read(path){ try{return JSON.parse(localStorage.getItem('isc_'+path))||{}}catch(e){return {}} },
  write(path,val){ localStorage.setItem('isc_'+path, JSON.stringify(val)); }
};

/* ============================================================
   1. 데이터 계층 — Firebase 사용 가능하면 RTDB, 아니면 로컬 저장
============================================================= */
const DataStore = {
  _cache:{},
  _listeners:{},

  listen(path, cb){
    this._listeners[path] = this._listeners[path]||[];
    this._listeners[path].push(cb);
    if(db){
      db.ref(path).on('value', snap=>{
        const val = snap.val() || {};
        this._cache[path] = val;
        this._listeners[path].forEach(fn=>fn(val));
      });
    }else{
      const val = LocalStore.read(path);
      this._cache[path] = val;
      cb(val);
    }
  },
  async push(path, data){
    const id = 'id_' + Date.now() + '_' + Math.floor(Math.random()*1000);
    if(db){
      await db.ref(path+'/'+id).set(data);
    }else{
      const val = LocalStore.read(path);
      val[id] = data;
      LocalStore.write(path, val);
      this._cache[path] = val;
      (this._listeners[path]||[]).forEach(fn=>fn(val));
    }
    return id;
  },
  async update(path, id, data){
    if(db){
      await db.ref(path+'/'+id).update(data);
    }else{
      const val = LocalStore.read(path);
      val[id] = Object.assign({}, val[id], data);
      LocalStore.write(path, val);
      this._cache[path] = val;
      (this._listeners[path]||[]).forEach(fn=>fn(val));
    }
  },
  async remove(path, id){
    if(db){
      await db.ref(path+'/'+id).remove();
    }else{
      const val = LocalStore.read(path);
      delete val[id];
      LocalStore.write(path, val);
      this._cache[path] = val;
      (this._listeners[path]||[]).forEach(fn=>fn(val));
    }
  },
  get(path){ return this._cache[path] || {}; }
};

function toast(msg){
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('show'), 2400);
}
function fmtDate(d){
  if(!d) return '-';
  const dt = new Date(d);
  if(isNaN(dt)) return d;
  return `${dt.getFullYear()}.${String(dt.getMonth()+1).padStart(2,'0')}.${String(dt.getDate()).padStart(2,'0')}`;
}
function fmtDateTime(d){
  if(!d) return '-';
  const dt = new Date(d);
  if(isNaN(dt)) return d;
  return `${fmtDate(d)} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
}
function daysBetween(a,b){
  return Math.floor((new Date(b) - new Date(a)) / 86400000);
}
function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function esc(s){
  return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function objToArr(obj){ return Object.entries(obj||{}).map(([id,v])=>({id, ...v})); }
function requireAdmin(actionLabel){
  if(State.mode !== 'admin'){
    toast(`🔒 ${actionLabel}은(는) 관리자 모드에서만 가능합니다`);
    return false;
  }
  return true;
}

function renderNav(){
  const nav = document.getElementById('navList');
  nav.innerHTML = NAV_ITEMS.map(item=>{
    const count = navBadgeCount(item.id);
    const isNew = hasNewItems(item.id);
    return `<button class="nav-item ${State.view===item.id?'active':''}" data-view="${item.id}">
      ${icon(item.icon)}<span>${t(item.labelKey)}</span>${isNew?'<span class="nav-dot" title="새 항목 있음"></span>':''}
      ${count!=null?`<span class="nav-badge">${count}</span>`:''}
    </button>`;
  }).join('');
  nav.querySelectorAll('.nav-item').forEach(btn=>{
    btn.addEventListener('click', ()=> switchView(btn.dataset.view));
  });
}
function hasNewItems(viewId){
  const pathMap = {
    permits: [PATHS.permits],
    risks: [PATHS.risks],
    incidents: [PATHS.incidents],
    contractors: [PATHS.contractorRecords],
    notices: [PATHS.notices],
  };
  const paths = pathMap[viewId];
  if(!paths) return false;
  return paths.some(path=> hasNewInList(objToArr(DataStore.get(path)), path));
}
function navBadgeCount(viewId){
  if(viewId==='permits'){
    const arr = objToArr(DataStore.get(PATHS.permits));
    const n = arr.filter(p=>p.status==='신청'||p.status==='검토중').length;
    return n>0 ? n : null;
  }
  if(viewId==='incidents'){
    const arr = objToArr(DataStore.get(PATHS.incidents));
    const n = arr.filter(i=>i.status!=='완료').length;
    return n>0 ? n : null;
  }
  if(viewId==='risks'){
    const arr = objToArr(DataStore.get(PATHS.risks));
    const n = arr.filter(r=>r.status!=='완료').length;
    return n>0 ? n : null;
  }
  return null;
}

function switchView(id){
  State.view = id;
  const item = NAV_ITEMS.find(n=>n.id===id);
  const isDashboard = id==='dashboard';
  document.getElementById('pageTitleWrap').style.display = isDashboard ? 'none' : '';
  document.getElementById('pageTitle').textContent = t(item.labelKey);
  document.getElementById('pageSub').textContent = t(item.subKey);
  renderNav();
  document.querySelectorAll('.view').forEach(v=> v.hidden = v.id !== 'view-'+id);
  document.getElementById('sidebar').classList.remove('open');
  renderCurrentView();
}
function renderCurrentView(){
  ({
    dashboard: renderDashboard,
    permits: renderPermits,
    risks: renderRisks,
    incidents: renderIncidents,
    contractors: renderContractors,
    tbm: renderTbm,
    notices: renderNotices
  }[State.view]||function(){})();
}

let monthlyChartInstance = null;
let accidentTypeChartInstance = null;
const ACCIDENT_CHART_COLORS = ['#FF6A13','#2D7DD2','#FFC93C','#1DA46F','#E5484D','#8C99B8','#B24A00','#946200'];
function renderAccidentTypeChart(incidents){
  const canvas = document.getElementById('accidentTypeChart');
  if(!canvas || typeof Chart==='undefined') return;
  const counts = {};
  incidents.forEach(i=>{
    const label = i.accidentType==='기타(직접입력)' ? (i.accidentTypeOther||'기타') : (i.accidentType||'미분류');
    counts[label] = (counts[label]||0) + 1;
  });
  const labels = Object.keys(counts);
  const data = Object.values(counts);
  if(accidentTypeChartInstance){ accidentTypeChartInstance.destroy(); }
  if(labels.length===0){
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0,0,canvas.width,canvas.height);
    return;
  }
  accidentTypeChartInstance = new Chart(canvas.getContext('2d'), {
    type: 'doughnut',
    data: {
      labels,
      datasets: [{ data, backgroundColor: labels.map((_,i)=>ACCIDENT_CHART_COLORS[i%ACCIDENT_CHART_COLORS.length]), borderWidth:2, borderColor:'#fff' }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position:'bottom', labels:{ boxWidth:10, font:{size:10.5}, color:'#4B5468', padding:8 } },
        datalabels: {
          color:'#fff', font:{ weight:'700', size:11 },
          formatter: (value, ctx) => {
            const total = ctx.chart.data.datasets[0].data.reduce((a,b)=>a+b,0);
            const pct = total ? Math.round(value/total*100) : 0;
            return value>0 ? `${value}건\n${pct}%` : '';
          }
        }
      },
      cutout: '58%'
    }
  });
}
function computeMonthlyIncidentCounts(incidents, monthsBack){
  const now = new Date();
  const labels = [];
  const keys = [];
  for(let i=monthsBack-1; i>=0; i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    keys.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);
    labels.push(`${d.getMonth()+1}월`);
  }
  const counts = keys.map(k=> incidents.filter(i=> (i.datetime||'').slice(0,7)===k).length);
  return { labels, counts };
}
function renderMonthlyChart(monthly){
  const canvas = document.getElementById('monthlyChart');
  if(!canvas || typeof Chart==='undefined') return;
  if(monthlyChartInstance){ monthlyChartInstance.destroy(); }
  monthlyChartInstance = new Chart(canvas.getContext('2d'), {
    type: 'bar',
    data: {
      labels: monthly.labels,
      datasets: [{
        label: '재해 건수',
        data: monthly.counts,
        backgroundColor: '#FF6A13',
        borderRadius: 5,
        maxBarThickness: 32
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display:false },
        datalabels: {
          anchor:'end', align:'top', offset:2,
          color:'#B24A00', font:{ weight:'700', size:11.5 },
          formatter: (value)=> value>0 ? value : ''
        }
      },
      layout: { padding: { top: 16 } },
      scales: {
        y: { beginAtZero:true, ticks:{ precision:0, color:'#667085', font:{size:10.5} }, grid:{ color:'#EEF1F5' } },
        x: { ticks:{ color:'#667085', font:{size:10.5} }, grid:{ display:false } }
      }
    }
  });
}

function renderMiniList(arr, mapFn, mlPath){
  if(!arr || arr.length===0) return `<div class="empty"><span class="big">${icon('grid',22)}</span>등록된 항목이 없습니다</div>`;
  const sorted = [...arr].sort((a,b)=> new Date(b.createdAt||b.startDate||b.datetime||0) - new Date(a.createdAt||a.startDate||a.datetime||0));
  return sorted.slice(0,6).map(item=>{
    const m = mapFn(item);
    return `<div class="mini-row">
      <div class="mr-title">${newBadge(item, mlPath)}${esc(m.title)}</div>
      <div class="mr-meta">${esc(m.meta)}</div>
      ${m.badge||''}
    </div>`;
  }).join('');
}

/* ============================================================
   8. 배지 / 위험도 헬퍼
============================================================= */
const NEW_THRESHOLD_MS = 24*60*60*1000; // 24시간 이내 등록된 항목은 NEW 표시

/* 읽음 상태 추적 — 전체관리자 모드에서만 적용, 이 브라우저(내 계정)에만 저장되고
   다른 계정(일반/부서관리자)이나 다른 기기와는 공유되지 않음 */
function getReadSet(path){
  try{ return new Set(JSON.parse(localStorage.getItem('isc_read_'+path) || '[]')); }
  catch(e){ return new Set(); }
}
function markRead(path, id){
  if(!path || !id) return;
  const set = getReadSet(path);
  if(set.has(id)) return;
  set.add(id);
  localStorage.setItem('isc_read_'+path, JSON.stringify([...set]));
}
function isRead(path, id){ return getReadSet(path).has(id); }

function isItemNew(item, path){
  if(!item || !item.createdAt) return false;
  if(Date.now() - item.createdAt >= NEW_THRESHOLD_MS) return false;
  if(State.mode==='admin' && path && isRead(path, item.id)) return false;
  return true;
}
function hasNewInList(arr, path){
  return (arr||[]).some(item => isItemNew(item, path));
}
function newBadge(item, path){
  return isItemNew(item, path) ? '<span class="badge-new">NEW</span> ' : '';
}
function statusLabel(status){
  if(!status) return '-';
  return t('status_'+status);
}
function statusBadge(kind, status){
  const map = {
    permit:{'신청':'b-info','검토중':'b-caution','승인':'b-ok','반려':'b-danger','종료':'b-gray'},
    risk:{'등록':'b-info','접수완료':'b-safety','조치중':'b-caution','완료':'b-ok','일부개선완료':'b-caution2'},
    incident:{'접수':'b-info','조사중':'b-caution','완료':'b-ok'}
  };
  const cls = (map[kind]||{})[status] || 'b-gray';
  return `<span class="badge ${cls}">${esc(statusLabel(status))}</span>`;
}
// 위험성평가 공정 분류 (고정 목록 — 필터·등록 시 공통 사용)
const PROCESS_OPTIONS = ['용해','보온로','주입','조형','사처리','후처리','래들보수','합리화','기계','전기','개발','UVT','스펙트로','실험실','공정품질','환경정리','생산관리','집진기'];
// 부서별 공정 매핑
const PROCESS_DEPT_MAP = {
  '용해':'생산부','보온로':'생산부','주입':'생산부','조형':'생산부','사처리':'생산부','후처리':'생산부','래들보수':'생산부','합리화':'생산부','기계':'생산부','전기':'생산부',
  '개발':'품질관리부','UVT':'품질관리부','스펙트로':'품질관리부','실험실':'품질관리부','공정품질':'품질관리부',
  '생산관리':'관리부','환경정리':'관리부',
  '집진기':'안전환경부'
};
function processDept(process){ return PROCESS_DEPT_MAP[process] || '-'; }

function riskLevel(r){
  const score = (Number(r.frequency)||0) * (Number(r.severity)||0);
  if(score>=15) return 'crit';
  if(score>=8) return 'high';
  if(score>=4) return 'mid';
  return 'low';
}
// 위험도 등급별 조치기준 — 색상·라벨·조치내용을 한 곳에서 관리 (표시 텍스트는 다국어)
const RISK_LEVEL_SCORE_RANGE = { crit:'15~20', high:'8~14', mid:'4~7', low:'1~3' };
function riskLevelInfo(lv){
  return {
    scoreRange: RISK_LEVEL_SCORE_RANGE[lv],
    label: t('risklevel_label_'+lv),
    action: t('risklevel_action_'+lv),
    desc: t('risklevel_desc_'+lv),
  };
}
function riskChip(r){
  const score = (Number(r.frequency)||0) * (Number(r.severity)||0);
  const lv = riskLevel(r);
  const info = riskLevelInfo(lv);
  return `<span class="risk-chip risk-${lv}" title="위험도 ${info.label} · ${info.action}">${score}</span>`;
}
// 위험도 등급을 색상+글자로 함께 보여주는 뱃지 (목록/상세에서 사용)
function riskLevelBadge(r){
  const lv = riskLevel(r);
  const info = riskLevelInfo(lv);
  return `<span class="risk-level-badge risk-${lv}">${riskChip(r)} ${esc(info.action)}</span>`;
}
function riskLegendHtml(){
  return `<div class="risk-legend">
    ${['crit','high','mid','low'].map(lv=>{
      const info = riskLevelInfo(lv);
      return `<div class="risk-legend-item">
        <span class="risk-chip risk-${lv}">${info.scoreRange}</span>
        <div><b>${esc(info.label)} · ${esc(info.action)}</b><div class="hint" style="margin:1px 0 0;">${esc(info.desc)}</div></div>
      </div>`;
    }).join('')}
  </div>`;
}

function generatePermitDocx(p){
  if(typeof PizZip==='undefined' || typeof window.docxtemplater==='undefined'){
    toast('문서 생성 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해주세요.');
    return;
  }
  try{
    const binary = atob(PERMIT_TEMPLATE_B64);
    const bytes = new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++){ bytes[i] = binary.charCodeAt(i); }
    const zip = new PizZip(bytes);
    const doc = new window.docxtemplater(zip, { paragraphLoop:true, linebreaks:true });
    const equipmentText = [...(p.equipment||[]), p.equipmentOther].filter(Boolean).join(', ') || '-';
    doc.render({
      company: p.company||'',
      workName: p.workContent||'',
      workPeriod: `${fmtDate(p.startDate)} ~ ${fmtDate(p.endDate)}`,
      location: p.location||'',
      headcount: p.headcount||'',
      siteSuper: p.contractorLead||'',
      equipment: equipmentText,
      hazardMeasures: p.hazardDetail||'',
      fireYesBox: p.fireWork ? '☑' : '□',
      fireDetail: p.fireWork ? (p.fireDetail||'') : '',
      fireNoBox: p.fireWork ? '□' : '☑',
      watchman: p.fireWork ? (p.watchman||'') : '',
      extinguisher: p.fireWork ? (p.fireExtinguisher||'') : '',
      combustible: p.fireWork ? (p.combustibleRemoval||'') : '',
      contractorSign: p.contractorLead||'',
      managerSign: p.processManager||'',
      approverSign: '',
      endDatetime: p.endDatetime ? fmtDateTime(p.endDatetime) : '',
      siteConditionText: p.siteCondition ? (p.siteCondition==='이상없음' ? '☑ 이상없음   □ 이상있음' : '□ 이상없음   ☑ 이상있음') : '□ 이상없음   □ 이상있음',
      residualCheck: p.fireWork ? (p.residualCheck||'') : '',
      endConfirmer: p.endConfirmer||'',
    });
    const out = doc.getZip().generate({ type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
    const url = URL.createObjectURL(out);
    const a = document.createElement('a');
    a.href = url;
    const safeCompany = (p.company||'업체명').replace(/[\\/:*?"<>|]/g,'');
    a.download = `안전작업허가서_${safeCompany}_${p.startDate||''}.docx`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 3000);
    toast('허가서 파일이 다운로드되었습니다');
  }catch(err){
    console.error(err);
    toast('문서 생성 중 오류가 발생했습니다');
  }
}

============================================================= */
function renderRisks(){
  const el = document.getElementById('view-risks');
  const filter = State.filters.risks || '전체';
  const processFilter = State.filters.risksProcess || '전체';
  const viewMode = State.filters.risksView || 'table';
  const isAdmin = State.mode==='admin';

  function getFilteredRisks(){
    const arr = objToArr(DataStore.get(PATHS.risks)).sort((a,b)=>{
      const s = riskLevel(b)==='crit'?4:riskLevel(b)==='high'?3:riskLevel(b)==='mid'?2:1;
      const s2 = riskLevel(a)==='crit'?4:riskLevel(a)==='high'?3:riskLevel(a)==='mid'?2:1;
      return s - s2;
    });
    let f = filter==='전체' ? arr : arr.filter(r=>r.status===filter);
    if(processFilter!=='전체') f = f.filter(r=>r.process===processFilter);
    return f;
  }

  el.innerHTML = `
    <div class="toolbar">
      <div class="tabs" id="riskTabs">
        ${['전체','등록','접수완료','조치중','완료','일부개선완료'].map(s=>`<button class="tab ${filter===s?'active':''}" data-s="${s}">${s==='전체'?t('tab_all'):statusLabel(s)}</button>`).join('')}
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <select id="riskProcessFilter" class="btn btn-sm" style="font-weight:700;">
          <option value="전체">${t('tab_all')} (${t('th_process_task')})</option>
          ${PROCESS_OPTIONS.map(p=>`<option value="${p}" ${processFilter===p?'selected':''}>${esc(p)}</option>`).join('')}
        </select>
        <button class="btn btn-sm" id="galleryToggleBtn">${viewMode==='table' ? icon('alert-triangle',14)+' '+t('btn_gallery_view') : icon('grid',14)+' '+t('btn_table_view')}</button>
        ${isAdmin ? `<button class="btn btn-sm" id="printRisksBtn">${icon('file-check',14)} ${t('btn_print')}</button>` : ''}
        ${isAdmin ? `<button class="btn btn-sm" id="excelRisksBtn">${icon('file-check',14)} ${t('btn_excel')}</button>` : ''}
        <button class="btn btn-primary" id="addRiskBtn">${icon('plus',15)} ${t('risks_add_btn')}</button>
      </div>
    </div>
    ${viewMode==='table' ? riskLegendHtml() : ''}
    <div id="riskViewArea"></div>
  `;
  el.querySelectorAll('#riskTabs .tab').forEach(t=>t.addEventListener('click', ()=>{
    State.filters.risks = t.dataset.s; renderRisks();
  }));
  document.getElementById('riskProcessFilter').addEventListener('change', e=>{
    State.filters.risksProcess = e.target.value; renderRisks();
  });
  document.getElementById('galleryToggleBtn').addEventListener('click', ()=>{
    State.filters.risksView = viewMode==='table' ? 'gallery' : 'table';
    renderRisks();
  });
  if(isAdmin){
    document.getElementById('printRisksBtn').addEventListener('click', ()=> printRisks(getFilteredRisks()));
    document.getElementById('excelRisksBtn').addEventListener('click', ()=> exportRisksExcel(getFilteredRisks()));
  }
  el.querySelector('#addRiskBtn').addEventListener('click', ()=>{
    openRiskModal();
  });

  const filtered = getFilteredRisks();
  const area = document.getElementById('riskViewArea');

  if(viewMode==='gallery'){
    const done = filtered.filter(r=>r.status==='완료'||r.status==='일부개선완료');
    if(done.length===0){
      area.innerHTML = `<div class="empty"><span class="big">${icon('alert-triangle',22)}</span>${t('gallery_empty')}</div>`;
      return;
    }
    area.innerHTML = `<div class="gallery-grid">${done.map(r=>{
      const beforeScore = (Number(r.frequency)||0)*(Number(r.severity)||0);
      const afterScore = (r.afterFrequency && r.afterSeverity) ? (Number(r.afterFrequency)*Number(r.afterSeverity)) : null;
      return `<div class="gallery-card">
        <div class="gc-photos">
          <div class="gc-photo">${r.photoBefore?`<img src="${r.photoBefore}" class="risk-photo-lg">`:`<div class="gc-noimg">${t('gallery_no_photo')}</div>`}<span class="gc-tag">${t('gallery_before')}</span></div>
          <div class="gc-photo">${r.photoAfter?`<img src="${r.photoAfter}" class="risk-photo-lg">`:`<div class="gc-noimg">${t('gallery_no_photo')}</div>`}<span class="gc-tag">${t('gallery_after')}</span></div>
        </div>
        <div class="gc-body">
          <div class="gc-head"><b>${esc(r.process||'-')}</b> ${statusBadge('risk', r.status)}</div>
          <div class="gc-hazard">${esc(r.hazard||'-')}</div>
          <div class="gc-score">${beforeScore}${afterScore!=null?` → <b>${afterScore}</b>`:''}</div>
        </div>
      </div>`;
    }).join('')}</div>`;
    bindImageZoom(area);
    return;
  }

  area.innerHTML = `
    <div class="table-wrap"><table>
      <thead><tr>
        <th>${t('th_process_task')}</th><th>${t('th_hazard')}</th><th class="tight">${t('th_frequency')}</th><th class="tight">${t('th_severity')}</th><th class="tight">${t('th_risklevel')}</th><th>${t('th_measures')}</th><th>${t('dt_photo_site')}</th><th>${t('dt_photo_after')}</th><th>${t('th_reporter_applicant')}</th><th>${t('th_status')}</th><th class="tight">${t('btn_manage_col')}</th>
      </tr></thead>
      <tbody id="riskBody"></tbody>
    </table></div>
  `;

    body.innerHTML = `<tr><td colspan="11"><div class="empty"><span class="big">${icon('alert-triangle',22)}</span>${t('risks_empty')}</div></td></tr>`;
    return;
  }

    <tr>
      <td class="cell-strong">${newBadge(r, PATHS.risks)}${esc(r.process||'-')}<div class="cell-sub">${esc(r.task||'')}</div></td>

      <td class="tight mono">${r.severity||0}</td>
      <td class="tight">${riskLevelBadge(r)}</td>
      <td>${esc(r.measures||'-')}</td>
      <td>${riskThumb(r.photoBefore)}</td>
      <td>${riskThumb(r.photoAfter)}</td>
      <td>${esc(r.reporter||'-')}</td>
      <td>${statusBadge('risk', r.status)}</td>
      <td class="tight row-btns"><button class="btn btn-sm" data-view-id="${r.id}">${t('btn_view')}</button></td>
    </tr>
  `).join('');
  body.querySelectorAll('[data-view-id]').forEach(b=> b.addEventListener('click', ()=> openRiskDetail(b.dataset.viewId)));
  bindImageZoom(body);
}

function riskThumb(src){
  if(!src) return '<span style="color:var(--ink-faint);font-size:11.5px;">-</span>';
  return `<img src="${src}" class="risk-thumb" style="width:56px;height:56px;object-fit:cover;border-radius:7px;border:1px solid var(--line);cursor:zoom-in;">`;
}
// 사진(썸네일) 클릭 시 원본 크기로 확대해서 보여주는 라이트박스
function bindImageZoom(container){
  (container||document).querySelectorAll('img.risk-thumb, img.risk-photo-lg').forEach(img=>{
    img.addEventListener('click', ()=> openImageLightbox(img.src));
  });
}
function openImageLightbox(src){
  const overlay = document.createElement('div');
  overlay.className = 'lightbox-overlay';
  overlay.innerHTML = `<img src="${src}"><button class="lightbox-close" aria-label="close">✕</button>`;
  overlay.addEventListener('click', ()=> overlay.remove());
  document.body.appendChild(overlay);
}

// 위험성평가 엑셀 다운로드 — 공식 양식과 동일한 컬럼 구조로 출력 (한글 문서에 복사·붙여넣기 용도)
function exportRisksExcel(list){
  if(!list || list.length===0){ toast(t('print_no_data')); return; }
  if(typeof XLSX==='undefined'){ toast('엑셀 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해주세요.'); return; }
  const header = ['공정명','세부작업내용','위험분류','위험세부분류','유해위험요인(위험발생상황 및 결과)','현재의 안전보건조치','가능성','중대성','위험성','위험성 감소대책(개선대책)','개선후 가능성','개선후 중대성','개선후 위험성','상태','신청자(담당자)','비고'];
  const rows = list.map(r=>{
    const score = (Number(r.frequency)||0)*(Number(r.severity)||0);
    const afterScore = (r.afterFrequency && r.afterSeverity) ? Number(r.afterFrequency)*Number(r.afterSeverity) : '';
    return [
      r.process||'', r.task||'', r.hazardCategory||'', r.hazardDetailType||'',
      r.hazard||'', r.currentMeasures||'',
      r.frequency||'', r.severity||'', score||'',
      r.measures||'',
      r.afterFrequency||'', r.afterSeverity||'', afterScore,
      statusLabel(r.status)||'', r.reporter||'', ''
    ];
  });
  const wb = XLSX.utils.book_new();
  // 공정별로 시트를 나눔 (선택된 공정이 있으면 해당 시트 하나만, 전체면 공정별로 분리)
  const byProcess = {};
  list.forEach((r, idx)=>{
    const key = r.process || '기타';
    if(!byProcess[key]) byProcess[key] = [];
    byProcess[key].push(rows[idx]);
  });
  Object.keys(byProcess).forEach(proc=>{
    const sheetData = [header, ...byProcess[proc]];
    const ws = XLSX.utils.aoa_to_sheet(sheetData);
    ws['!cols'] = [
      {wch:10},{wch:14},{wch:12},{wch:14},{wch:32},{wch:26},
      {wch:7},{wch:7},{wch:7},{wch:28},{wch:9},{wch:9},{wch:9},{wch:12},{wch:12},{wch:14}
    ];
    const safeSheetName = proc.slice(0,31).replace(/[\\\/\?\*\[\]:]/g,'');
    XLSX.utils.book_append_sheet(wb, ws, safeSheetName || 'Sheet');
  });
  XLSX.writeFile(wb, `위험성평가_${todayStr()}.xlsx`);
}

      hazard: document.getElementById('f_hazard').value.trim(),

      severity: Number(document.getElementById('f_severity').value),
      measures: document.getElementById('f_measures').value.trim(),
      reporter: document.getElementById('f_reporter').value.trim(),
    };
    let chosenStatus = null;
    if(isAdmin && document.getElementById('f_status')){
      chosenStatus = document.getElementById('f_status').value;
      data.status = chosenStatus;
    }else if(!isEdit){
      data.status = '등록';
    }
    if(!data.process || !data.hazard || !data.measures || !data.reporter){ toast(t('toast_fill_required')); return; }

    if(isAdmin){
      data.hazardCategory = document.getElementById('f_hazardCategory').value;
      data.hazardDetailType = document.getElementById('f_hazardDetailType').value.trim();
      data.currentMeasures = document.getElementById('f_currentMeasures').value.trim();
    }

    // 완료 처리 시 개선후 재평가 필수 + 점수에 따라 자동 분기(완료/일부개선완료), 경고는 뜨되 저장은 계속 진행
    if(isAdmin && chosenStatus==='완료'){
      const af = document.getElementById('f_afterFrequency').value;
      const as = document.getElementById('f_afterSeverity').value;
      if(!af || !as){ toast('완료 처리하려면 개선후 재평가(가능성·강도)를 입력해주세요'); return; }
      const afterFrequency = Number(af), afterSeverity = Number(as);
      const afterScore = afterFrequency * afterSeverity;
      data.afterFrequency = afterFrequency;
      data.afterSeverity = afterSeverity;
      if(afterScore <= 6){
        data.status = '완료';
      }else{
        data.status = '일부개선완료';
        toast('재평가 결과 위험도가 아직 높습니다 (추가 개선 필요) — 일부개선완료로 저장됩니다');
      }
    }

    const photoBeforeFile = document.getElementById('f_photoBefore').files[0];
    if(photoBeforeFile){
      if(photoBeforeFile.size > 5*1024*1024){ toast(t('toast_photo_toobig')); return; }
      data.photoBefore = await new Promise((resolve,reject)=>{
        const r = new FileReader(); r.onload=()=>resolve(r.result); r.onerror=reject; r.readAsDataURL(photoBeforeFile);
      });
    }
    const photoAfterInput = document.getElementById('f_photoAfter');
    if(photoAfterInput){
      const photoAfterFile = photoAfterInput.files[0];
      if(photoAfterFile){
        if(photoAfterFile.size > 5*1024*1024){ toast(t('toast_photo_toobig')); return; }
        data.photoAfter = await new Promise((resolve,reject)=>{
          const r = new FileReader(); r.onload=()=>resolve(r.result); r.onerror=reject; r.readAsDataURL(photoAfterFile);
        });
      }
    }
    if(isEdit){
      await DataStore.update(PATHS.risks, existing.id, data);
      toast(t('toast_risk_updated'));
    }else{
      data.createdAt = Date.now();
      await DataStore.push(PATHS.risks, data);
      toast(t('toast_risk_registered'));
    }
    closeModal(); renderRisks();
  });
}

const ACCIDENT_TYPES = ['추락','넘어짐','부딪힘','끼임(협착)','감전','화상','절단·베임','기타(직접입력)'];

function openIncidentModal(existing){

    <div class="modal-head"><h3>${isEdit?t('incident_edit_title'):t('incident_new_title')}</h3><button class="x-btn" data-close>✕</button></div>
    <div class="modal-body">
      <div class="row2">
        <div class="field"><label>${t('th_process')} *</label><input type="text" id="f_process" value="${esc(v.process||'')}" placeholder="예: 조형공정"></div>
        <div class="field"><label>${t('th_datetime')} *</label><input type="datetime-local" id="f_datetime" value="${v.datetime||''}"></div>
      </div>
      <div class="field"><label>${t('th_location')} *</label><input type="text" id="f_location" value="${esc(v.location||'')}" placeholder="예: 열처리공정 앞"></div>
      <div class="field"><label>${t('th_accidenttype')} *</label>
        <select id="f_accidentType">
          <option value="">${t('opt_select_please')}</option>
          ${ACCIDENT_TYPES.map(at=>`<option value="${esc(at)}" ${v.accidentType===at?'selected':''}>${t('accidenttype_'+at)}</option>`).join('')}
        </select>
        <input type="text" id="f_accidentTypeOther" value="${esc(v.accidentTypeOther||'')}" placeholder="${t('placeholder_accidenttype_other')}" style="margin-top:8px;${v.accidentType==='기타(직접입력)'?'':'display:none'}">
      </div>
      <div class="field"><label>${t('lbl_description')} *</label>
        <textarea id="f_description">${esc(v.description||'')}</textarea>
        <p class="hint">${t('hint_description_example')}</p>
      </div>
      <div class="field"><label>${t('lbl_reporter_input')} *</label><input type="text" id="f_reporter" value="${esc(v.reporter||'')}" placeholder="이름"></div>
      <div class="field"><label><input type="checkbox" id="f_sameAsReporter" ${v.reporter && v.reporter===v.injuredPerson ? 'checked':''}> ${t('lbl_same_as_reporter')}</label></div>
      <div class="divider"></div>
      <div class="row2">
        <div class="field"><label>${t('lbl_injured_person')} *</label><input type="text" id="f_injuredPerson" value="${esc(v.injuredPerson||'')}" placeholder="이름"></div>
        <div class="field"><label>${t('lbl_injury_severity')}</label>
          <select id="f_injurySeverity">
            <option value="">${t('opt_none_selected')}</option>
            ${['경미(응급처치)','경상(통원치료)','중상(입원치료)','기타'].map(s=>`<option value="${s}" ${v.injurySeverity===s?'selected':''}>${t('injury_'+s)}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="field"><label>${t('lbl_injury_detail')}</label><textarea id="f_injuryDetail" placeholder="예: 우측 손가락 협착, 열상 등">${esc(v.injuryDetail||'')}</textarea></div>
      <p class="hint" style="margin:-8px 0 4px;">${t('hint_privacy_notice')}</p>
      ${State.mode==='admin' ? `
      <div class="divider"></div>
      <div class="field"><label>${t('lbl_status_admin')}</label>
        <select id="f_status">${['접수','조사중','완료'].map(s=>`<option value="${s}" ${v.status===s?'selected':''}>${statusLabel(s)}</option>`).join('')}</select>
      </div>
      <div class="field"><label>${t('lbl_action_admin')}</label><textarea id="f_action">${esc(v.action||'')}</textarea></div>
      ` : ''}
    </div>
    <div class="modal-foot">
      <button class="btn" data-close>${t('btn_cancel')}</button>
      <button class="btn btn-primary" id="saveIncBtn">${t('btn_save')}</button>
    </div>
  `);
  document.getElementById('f_accidentType').addEventListener('change', e=>{
    document.getElementById('f_accidentTypeOther').style.display = e.target.value==='기타(직접입력)' ? '' : 'none';
  });
  document.getElementById('f_sameAsReporter').addEventListener('change', e=>{
    if(e.target.checked){
      document.getElementById('f_injuredPerson').value = document.getElementById('f_reporter').value;
    }
  });
  document.getElementById('f_reporter').addEventListener('input', e=>{
    if(document.getElementById('f_sameAsReporter').checked){
      document.getElementById('f_injuredPerson').value = e.target.value;
    }
  });
  document.getElementById('saveIncBtn').addEventListener('click', async ()=>{
    const accidentType = document.getElementById('f_accidentType').value;
    const data = {
      process: document.getElementById('f_process').value.trim(),
      datetime: document.getElementById('f_datetime').value,
      location: document.getElementById('f_location').value.trim(),
      accidentType,
      accidentTypeOther: accidentType==='기타(직접입력)' ? document.getElementById('f_accidentTypeOther').value.trim() : '',
      description: document.getElementById('f_description').value.trim(),
      reporter: document.getElementById('f_reporter').value.trim(),
      injuredPerson: document.getElementById('f_injuredPerson').value.trim(),
      injurySeverity: document.getElementById('f_injurySeverity').value,
      injuryDetail: document.getElementById('f_injuryDetail').value.trim(),
    };
    if(State.mode==='admin'){
      data.status = document.getElementById('f_status').value;
      data.action = document.getElementById('f_action').value.trim();
    }else if(!isEdit){
      data.status = '접수';
    }
    if(!data.process || !data.location || !data.description || !data.datetime || !data.reporter || !data.injuredPerson || !accidentType || (accidentType==='기타(직접입력)' && !data.accidentTypeOther)){
      toast(t('toast_fill_required')); return;
    }
    if(isEdit){
      await DataStore.update(PATHS.incidents, existing.id, data);
      toast(t('toast_incident_updated'));
    }else{
      data.createdAt = Date.now();
      await DataStore.push(PATHS.incidents, data);
      toast(t('toast_incident_registered'));
    }
    closeModal(); renderIncidents();
  });
}

   15. 로그인 게이트 로직
============================================================= */
const ADMIN_PW_KEY = 'isc_admin_pw';
const DEPTS = ['관리부','생산부','품질관리부'];
function deptPwKey(dept){ return 'isc_dept_pw_' + dept; }

function updateLangPicker(){
  document.querySelectorAll('#langPicker .lang-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.lang === State.lang);
  });
}
document.querySelectorAll('#langPicker .lang-btn').forEach(btn=>{

    updateLangPicker();

  });
});

document.getElementById('gateMode').addEventListener('change', e=>{
  document.getElementById('gatePwWrap').hidden = e.target.value === 'user';
});

// 저장된 비밀번호가 하나도 없으면(최초 실행) true — 이 경우에만 입력값으로 전체관리자 비번을 새로 설정
function noPasswordsSetYet(){
  if(localStorage.getItem(ADMIN_PW_KEY)) return false;
  return !DEPTS.some(d => localStorage.getItem(deptPwKey(d)));
}

// 비밀번호 하나로 역할(전체관리자/부서관리자)을 자동 판별
function resolveRoleByPassword(input){
  if(!input) return { ok:false, reason:'empty' };
  const adminSaved = localStorage.getItem(ADMIN_PW_KEY);
  if(adminSaved && input === adminSaved){
    return { ok:true, mode:'admin', dept:null };
  }
  for(const d of DEPTS){
    const saved = localStorage.getItem(deptPwKey(d));
    if(saved && input === saved){
      return { ok:true, mode:'dept', dept:d };
    }
  }
  if(noPasswordsSetYet()){
    // 최초 실행: 지금 입력한 비밀번호를 전체관리자 비밀번호로 등록
    localStorage.setItem(ADMIN_PW_KEY, input);
    toast(t('toast_admin_pw_set'));
    return { ok:true, mode:'admin', dept:null };
  }
  return { ok:false, reason:'mismatch' };
}

function enterWithPassword(input){
  const result = resolveRoleByPassword(input.trim());
  if(!result.ok){
    toast(result.reason==='empty' ? t('toast_pw_required') : t('toast_pw_mismatch'));
    return false;
  }
  State.mode = result.mode; State.dept = result.dept;
  return true;
}

document.getElementById('gateEnter').addEventListener('click', ()=>{
  const mode = document.getElementById('gateMode').value;
  if(mode==='admin'){
    if(!enterWithPassword(document.getElementById('gatePw').value)) return;
  }else{
    State.mode = 'user'; State.dept = null;
  }
  document.getElementById('gate').style.display = 'none';
  updateModeUI();
  boot();
});

document.getElementById('modeSwitchBtn').addEventListener('click', ()=>{
  if(State.mode !== 'user'){
    State.mode = 'user'; State.dept = null;
    updateModeUI();
    toast(t('toast_switched_user'));
    renderCurrentView(); renderNav();
    return;
  }
  const input = prompt('관리자 비밀번호를 입력하세요\n(비밀번호에 따라 전체관리자 또는 해당 부서 관리자로 자동 접속됩니다)');
  if(input===null) return;
  if(!enterWithPassword(input)) return;
  updateModeUI();
  toast('모드가 전환되었습니다');
  renderCurrentView(); renderNav();
});

// 전체관리자 전용: 부서 비밀번호 설정/변경
function openDeptPasswordModal(){
  showModal(`
    <div class="modal-head"><h3>관리자 계정 설정</h3><button class="x-btn" data-close>✕</button></div>
    <div class="modal-body">
      <div class="field"><label>전체관리자 비밀번호 변경</label>
        <input type="text" id="f_pw_admin" placeholder="새 비밀번호 (변경하지 않으려면 비워두세요)">
      </div>
      <div class="divider"></div>
      <p class="hint" style="margin-bottom:14px;">각 부서에 나눠줄 비밀번호를 설정하세요. 부서 담당자가 이 비밀번호로 로그인하면 자동으로 해당 부서 관리자로 접속됩니다.</p>
      ${DEPTS.map(d=>`
        <div class="field"><label>${d}</label>
          <input type="text" id="f_pw_${d}" placeholder="${localStorage.getItem(deptPwKey(d)) ? '설정됨 (변경하려면 새 비밀번호 입력)' : '비밀번호 설정'}">
        </div>
      `).join('')}
    </div>
    <div class="modal-foot">
      <button class="btn" data-close>취소</button>
      <button class="btn btn-primary" id="saveDeptPwBtn">저장</button>
    </div>
  `);
  document.getElementById('saveDeptPwBtn').addEventListener('click', ()=>{
    let changed = 0;
    const newAdminPw = document.getElementById('f_pw_admin').value.trim();
    if(newAdminPw){ localStorage.setItem(ADMIN_PW_KEY, newAdminPw); changed++; }
    DEPTS.forEach(d=>{
      const val = document.getElementById('f_pw_'+d).value.trim();
      if(val){ localStorage.setItem(deptPwKey(d), val); changed++; }
    });
    toast(changed>0 ? '비밀번호가 저장되었습니다' : '변경된 내용이 없습니다');
    closeModal();
  });
}

function updateModeUI(){
  const label = State.mode==='admin' ? t('mode_label_admin')
    : State.mode==='dept' ? `${t('mode_label_dept')} (${State.dept})`
    : t('mode_label_user');
  document.getElementById('modeLabel').textContent = label;
  document.getElementById('deptPwSettingBtn').style.display = State.mode==='admin' ? '' : 'none';
  document.getElementById('modeSwitchBtn').textContent = State.mode==='user' ? t('mode_switch') : t('mode_release');
  document.getElementById('modeSwitchBtn').classList.toggle('on', State.mode!=='user');
}

/* 정적 마크업(data-i18n / data-i18n-placeholder)에 현재 언어 적용 */
function applyI18n(){
  document.documentElement.lang = State.lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    el.textContent = t(el.dataset.i18n);
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{
    el.setAttribute('placeholder', t(el.dataset.i18nPlaceholder));
  });
}

document.getElementById('deptPwSettingBtn').addEventListener('click', ()=>{
  if(State.mode!=='admin'){ toast(t('toast_admin_only')); return; }
  openDeptPasswordModal();
});

document.getElementById('brandHome').addEventListener('click', ()=>{
  switchView('dashboard');
});

document.getElementById('hamburger').addEventListener('click', ()=>{
  document.getElementById('sidebar').classList.toggle('open');
});

/* ============================================================
   16. 부트스트랩
============================================================= */
function boot(){
  const d = new Date();
  document.getElementById('todayChip').textContent =
    `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} (${['일','월','화','수','목','금','토'][d.getDay()]})`;

  renderNav();
  switchView('dashboard');

  Object.values(PATHS).forEach(path=>{
    DataStore.listen(path, ()=>{
      renderNav();
      renderCurrentView();
    });
  });
}
</script>
