          </select>
        </div>
        <div class="field"><label>${t('lbl_severity')} *</label>
          <select id="f_severity">
            ${[1,2,3,4].map(n=>`<option value="${n}" ${Number(v.severity)===n?'selected':''}>${t('sev_'+n)}</option>`).join('')}
          </select>
          <p id="riskTypeHint" style="color:var(--danger);font-size:11.5px;font-weight:700;margin:5px 0 0;"></p>
        </div>
      </div>
      <div class="field"><label>${t('lbl_measures_only')} *</label><textarea id="f_measures">${esc(v.measures||'')}</textarea></div>
      <div class="field"><label>${t('lbl_photo_before')}</label>
        ${photoFieldHtml('f_photoBefore', v.photoBefore, v.photoBefore?`<p class="hint">${t('hint_photo_replace')}</p>`:'')}
      </div>
      <div class="row2">
        <div class="field"><label>${t('th_reporter_applicant')} *</label><input type="text" id="f_reporter" value="${esc(v.reporter||'')}" placeholder="이름"></div>
        ${isAdmin ? `
        <div class="field"><label>${t('lbl_progress_admin')}</label>
          <select id="f_status">${['등록','접수완료','조치중','완료'].map(s=>`<option value="${s}" ${(v.status===s || (s==='완료' && v.status==='일부개선완료'))?'selected':''}>${statusLabel(s)}</option>`).join('')}</select>
        </div>` : ''}

      <p class="hint" style="margin-bottom:8px;font-weight:700;color:var(--ink-soft);">관리자 전용 항목 (서류용 상세분류)</p>
      <div class="row2">
        <div class="field"><label>위험분류</label>
          <select id="f_hazardCategory">

          </select>
        </div>
        <div class="field"><label>위험세부분류</label><input type="text" id="f_hazardDetailType" value="${esc(v.hazardDetailType||'')}" placeholder="예: 끼임, 낙하, 절단·베임, 고온 등"></div>
      </div>
      <div class="field"><label>현재의 안전보건조치</label><textarea id="f_currentMeasures" placeholder="현재 이미 시행 중인 안전조치 (개선대책과 별도)">${esc(v.currentMeasures||'')}</textarea></div>
      <div class="field"><label>${t('lbl_photo_after')}</label>
        ${photoFieldHtml('f_photoAfter', v.photoAfter, v.photoAfter?`<p class="hint">${t('hint_photo_replace')}</p>`:'')}
      </div>
      <div id="afterEvalFields" style="${v.status==='완료'||v.status==='일부개선완료'?'':'display:none'};background:#F7F8FA;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:6px;">
        <p class="hint" style="margin-bottom:8px;font-weight:700;">개선후 재평가 — 완료 처리 시 반드시 입력해주세요</p>
        <div class="row2">
          <div class="field"><label>개선후 가능성</label>
            <select id="f_afterFrequency">
              <option value="">${t('opt_select_please')}</option>
              ${[1,2,3,4,5].map(n=>`<option value="${n}" ${Number(v.afterFrequency)===n?'selected':''}>${t('freq_'+n)}</option>`).join('')}
            </select>
          </div>
          <div class="field"><label>개선후 강도</label>
            <select id="f_afterSeverity">
              <option value="">${t('opt_select_please')}</option>
              ${[1,2,3,4].map(n=>`<option value="${n}" ${Number(v.afterSeverity)===n?'selected':''}>${t('sev_'+n)}</option>`).join('')}
            </select>
          </div>
        </div>
        <p class="hint">재평가 점수가 6점 이하면 "완료"로 저장됩니다. 7점 이상이면 저장 전에 확인창이 뜨고, 확인하면 "일부개선완료"로 저장됩니다.</p>
      </div>
      ` : ''}
    </div>
    <div class="modal-foot">
      <button class="btn" data-close>${t('btn_cancel')}</button>

    </div>
  `);
  bindPhotoField('f_photoBefore');
  const riskTypeSel = document.getElementById('f_riskType');
  const riskTypeHint = document.getElementById('riskTypeHint');
  function updateRiskTypeHint(){
    const rt = riskTypeSel.value;
    if(rt && ACCIDENT_SEVERITY_HINT[rt]){
      riskTypeHint.textContent = `⚠ ${t('risktype_hint_prefix')} ${ACCIDENT_SEVERITY_HINT[rt]} (${t('risktype_hint_basis')}: ${t('accidenttype_'+rt)} — ${t('risktype_hint_suffix')})`;
    }else{
      riskTypeHint.textContent = '';
    }
  }
  riskTypeSel.addEventListener('change', updateRiskTypeHint);
  updateRiskTypeHint();
  if(isAdmin){
    bindPhotoField('f_photoAfter');
    const statusSel = document.getElementById('f_status');
    const afterFields = document.getElementById('afterEvalFields');
    statusSel.addEventListener('change', e=>{
      afterFields.style.display = e.target.value==='완료' ? '' : 'none';
    });
  }
  document.getElementById('saveRiskBtn').addEventListener('click', async ()=>{
    const data = {
      process: document.getElementById('f_process').value.trim(),
      task: document.getElementById('f_task').value.trim(),
      hazard: document.getElementById('f_hazard').value.trim(),
      riskType: document.getElementById('f_riskType').value,
      frequency: Number(document.getElementById('f_frequency').value),
      severity: Number(document.getElementById('f_severity').value),
      measures: document.getElementById('f_measures').value.trim(),
      reporter: document.getElementById('f_reporter').value.trim(),
    };
    let chosenStatus = null;
    if(isAdmin && document.getElementById('f_status')){
      chosenStatus = document.getElementById('f_status').value;
      data.status = chosenStatus;
    }else if(!isEdit){
      data.status = '접수완료';
    }
    if(!data.process || !data.hazard || !data.measures || !data.reporter){ toast(t('toast_fill_required')); return; }

    if(isAdmin){
      data.hazardCategory = document.getElementById('f_hazardCategory').value;
      data.hazardDetailType = document.getElementById('f_hazardDetailType').value.trim();
      data.currentMeasures = document.getElementById('f_currentMeasures').value.trim();
    }

    // 완료 처리 시 개선후 재평가 필수. 점수가 7점 이상이면 바로 저장하지 않고 확인 팝업을 먼저 띄움
    let pendingPartial = false, afterScore = null;
    if(isAdmin && chosenStatus==='완료'){
      const af = document.getElementById('f_afterFrequency').value;
      const as = document.getElementById('f_afterSeverity').value;
      if(!af || !as){ toast('완료 처리하려면 개선후 재평가(가능성·강도)를 입력해주세요'); return; }
      const afterFrequency = Number(af), afterSeverity = Number(as);
      afterScore = afterFrequency * afterSeverity;
      data.afterFrequency = afterFrequency;
      data.afterSeverity = afterSeverity;
      if(afterScore <= 6){
        data.status = '완료';
      }else{
        data.status = '일부개선완료';
        pendingPartial = true;
      }
    }

    const photoBeforeFile = document.getElementById('f_photoBefore').files[0];
    if(photoBeforeFile){
      if(photoBeforeFile.size > 5*1024*1024){ toast(t('toast_photo_toobig')); return; }
      data.photoBefore = await new Promise((resolve,reject)=>{
        const r = new FileReader(); r.onload=()=>resolve(r.result); r.onerror=reject; r.readAsDataURL(photoBeforeFile);
      });
    }
    const photoAfterInput = document.getElementById('f_photoAfter');
    if(photoAfterInput){
      const photoAfterFile = photoAfterInput.files[0];
      if(photoAfterFile){
        if(photoAfterFile.size > 5*1024*1024){ toast(t('toast_photo_toobig')); return; }
        data.photoAfter = await new Promise((resolve,reject)=>{
          const r = new FileReader(); r.onload=()=>resolve(r.result); r.onerror=reject; r.readAsDataURL(photoAfterFile);
        });
      }
    }

    if(pendingPartial){
      openPartialImprovementConfirm(afterScore, ()=> finalizeRiskSave(data, isEdit, existing));
      return;
    }
    await finalizeRiskSave(data, isEdit, existing);
  });
}

// 개선후 재평가 점수가 7점 이상일 때 뜨는 확인 팝업 — 확인을 눌러야 실제 저장됨

        <b>"일부개선완료"</b>로 저장되며, 계속 관리 대상에 남아 추가 개선이 필요합니다.

      <button class="btn btn-primary" id="confirmPartialBtn">확인하고 저장</button>
    </div>
  `);

  });

async function finalizeRiskSave(data, isEdit, existing){
  if(isEdit){
    await DataStore.update(PATHS.risks, existing.id, data);
    toast(t('toast_risk_updated'));
    closeModal(); renderRisks();
  }else{
    data.createdAt = Date.now();
    const newId = await DataStore.push(PATHS.risks, data);
    closeModal();
    if(State.mode!=='admin'){
      addMyOwnedId('isc_my_risks', newId);
      showSuccessPopup(t('toast_risk_registered'));
    }else{
      toast(t('toast_risk_registered'));
    }
    renderRisks();
  }
}

        </div>
        <div>
          <div class="hint" style="margin-bottom:6px;font-weight:700;">${t('dt_photo_after')}</div>
          ${r.photoAfter ? `<img src="${r.photoAfter}" class="risk-photo-lg" style="width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:zoom-in;">` : `<div class="empty" style="padding:30px 10px;">-</div>`}

    <div class="modal-foot">

      ${(State.mode==='user' && r.status==='접수' && getMyOwnedIds('isc_my_risks').includes(id)) ? `<button class="btn btn-primary" id="editBtn">${t('btn_edit')}</button>` : ''}
      <button class="btn" data-close>${t('btn_close')}</button>
    </div>
  `);
  bindImageZoom(document.getElementById('modalBox') || document);
  if(document.getElementById('editBtn')){
    document.getElementById('editBtn').addEventListener('click', ()=>{ closeModal(); openRiskModal(r); });
  }
  if(State.mode==='admin'){
    document.getElementById('delBtn').addEventListener('click', async ()=>{
      if(confirm(t('confirm_delete'))){
        await DataStore.remove(PATHS.risks, id); closeModal(); toast(t('toast_deleted')); renderRisks();
      }

  }
}

    <div class="toolbar">

      <div style="display:flex;gap:8px;">

        <th>${t('th_accidenttype')}</th><th>${t('th_injuryseverity')}</th>

  const arr = objToArr(DataStore.get(PATHS.incidents)).sort((a,b)=> new Date(b.datetime||0) - new Date(a.datetime||0));
  let filtered = filter==='전체' ? arr : arr.filter(i=>i.status===filter);
  if(processFilter!=='전체') filtered = filtered.filter(i=>i.process===processFilter);
  const body = document.getElementById('incBody');
  const colCount = isAdmin ? 10 : 6;
  if(filtered.length===0){
    body.innerHTML = `<tr><td colspan="${colCount}"><div class="empty"><span class="big">${icon('siren',22)}</span>${t('incidents_empty')}</div></td></tr>`;
    return;
  }
  body.innerHTML = filtered.map(i=>`
    <tr>
      <td class="mono">${newBadge(i, PATHS.incidents)}${fmtDateTime(i.datetime)}</td>
      <td>${esc(i.process||'-')}</td>
      <td>${esc(i.location||'-')}</td>
      <td>${esc((i.description||'-').slice(0,28))}${(i.description||'').length>28?'…':''}</td>
      ${isAdmin?`<td>${esc(i.reporter||'-')}</td><td>${esc(i.injuredPerson||'-')}</td>`:''}
      <td><span class="badge b-gray">${esc(i.accidentType ? (TRANSLATIONS['accidenttype_'+i.accidentType]?t('accidenttype_'+i.accidentType):i.accidentType) : '-')}</span></td>
      <td>${esc(i.injurySeverity ? t('sev_'+i.injurySeverity) : '-')}</td>
      ${isAdmin?`<td>${statusBadge('incident', i.status)}</td><td>${rptStatusBadge(reportStatusOf(i))}</td>`:''}
      <td class="tight row-btns"><button class="btn btn-sm" data-view-id="${i.id}">${t('btn_view')}</button></td>
    </tr>
  `).join('');
  body.querySelectorAll('[data-view-id]').forEach(b=> b.addEventListener('click', ()=> openIncidentDetail(b.dataset.viewId)));
}

const ACCIDENT_TYPES = ['추락','넘어짐','부딪힘','끼임(협착)','감전','화상','절단·베임','기타(직접입력)'];
// 사고유형별 강도(중대성) 추천 범위 — 어디까지나 참고용, 자동입력하지 않음(관리자가 직접 선택)
const ACCIDENT_SEVERITY_HINT = {
  '추락':'3~4', '넘어짐':'1~2', '부딪힘':'1~2', '끼임(협착)':'3~4',
  '감전':'3~4', '화상':'2~3', '절단·베임':'2~3'

function calcLeaveDays(incidentDatetime, returnDate){
  if(!incidentDatetime || !returnDate) return null;
  const start = new Date(incidentDatetime);
  const end = new Date(returnDate+'T00:00:00');
  const diffMs = end - new Date(start.getFullYear(),start.getMonth(),start.getDate());
  const days = Math.round(diffMs / (1000*60*60*24));
  return days>=0 ? days : null;
}

        const r = new FileReader(); r.onload=()=>resolve(r.result); r.onerror=reject; r.readAsDataURL(photo2File);
      });
    }
    if(State.mode==='admin'){
      data.status = document.getElementById('f_status').value;
      data.action = document.getElementById('f_action').value.trim();
      data.returnDate = document.getElementById('f_returnDate').value;
      const d = calcLeaveDays(data.datetime, data.returnDate);
      data.leaveDays = d;
    }else if(!isEdit){
      data.status = '접수';
    }
    if(!data.process || !data.location || !data.description || !data.datetime || !data.reporter || !data.injuredPerson || !accidentType || (accidentType==='기타(직접입력)' && !data.accidentTypeOther)){
      toast(t('toast_fill_required')); return;
    }
    if(isEdit){
      await DataStore.update(PATHS.incidents, existing.id, data);
      toast(t('toast_incident_updated'));
      closeModal(); renderIncidents();
    }else{
      data.createdAt = Date.now();
      const newId = await DataStore.push(PATHS.incidents, data);
      // 사고접수가 등록되면 위험성평가에도 자동 연동 등록 (관리자가 이어서 평가만 하면 됨)
      // - 부상정도(injurySeverity)를 강도(severity)에 그대로 반영 (같은 척도를 쓰므로)
      // - 사고유형은 세부작업 칸에 참고로 표시, riskType으로 저장해 위험성평가와 동일하게 추천점수에 활용
      const typeLabel = accidentType==='기타(직접입력)' ? data.accidentTypeOther : t('accidenttype_'+accidentType);
      await DataStore.push(PATHS.risks, {
        process: data.process,
        task: typeLabel || '',
        hazard: `사고 접수로 등록됨: ${data.description}`,
        riskType: accidentType==='기타(직접입력)' ? '' : accidentType,
        frequency: '', severity: data.injurySeverity || '',
        measures: '',
        reporter: data.reporter,
        status: '접수완료',
        linkedIncidentId: newId,
        createdAt: Date.now(),
      });
      closeModal();
      if(State.mode!=='admin'){
        addMyOwnedId('isc_my_incidents', newId);
        showSuccessPopup(t('toast_incident_registered'));
      }else{
        toast(t('toast_incident_registered'));
      }
      renderIncidents();
    }
  });
}

      ${State.mode==='admin' ? `<button class="btn btn-primary" id="reportBtn">📋 정식 보고서 작성</button>` : ''}
      ${State.mode==='admin' ? `<button class="btn" id="delBtn">${t('btn_delete')}</button><button class="btn" id="editBtn">${t('btn_process_edit')}</button>` : ''}

  `);
  bindImageZoom(document.getElementById('modalBox'));

    document.getElementById('reportBtn').addEventListener('click', ()=>{ closeModal(); openIncidentReportModal(i); });

  if(linkedRisk){

  if(document.getElementById('editBtn')){
    document.getElementById('editBtn').addEventListener('click', ()=>{ closeModal(); openIncidentModal(i); });
  }
  if(State.mode==='admin'){
    document.getElementById('delBtn').addEventListener('click', async ()=>{
      if(confirm(t('confirm_delete_incident'))){
        await DataStore.remove(PATHS.incidents, id); closeModal(); toast(t('toast_deleted')); renderIncidents();
      }
    });
  }

            <div class="field"><label>대책</label><textarea id="rpt_cm_measure_${idx}" style="min-height:80px">${esc(row.measure||'')}</textarea></div>
          </div>
        </div>
      `).join('')}
    </div>
    <div class="modal-foot">
      <button class="btn" data-close>${t('btn_cancel')}</button>
      <button class="btn" id="rptSaveBtn">저장</button>
      <button class="btn btn-primary" id="rptDownloadBtn">📥 PPT 다운로드</button>
    </div>
  `);

  // 체크리스트 버튼 토글
  document.querySelectorAll('#rpt_checklistGrid .rpt-chk-btns').forEach(group=>{
    group.querySelectorAll('.rpt-chk-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        group.querySelectorAll('.rpt-chk-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
      });
    });
  });

  // 미흡사항 입력 시, 원인 칸이 비어있으면 자동으로 채워줌(직접 입력한 값은 덮어쓰지 않음)
  function autoFillCauses(){
    const def = { 인적: document.getElementById('rpt_def_인적').value.trim(),
                  물적: document.getElementById('rpt_def_물적').value.trim(),
                  시스템: document.getElementById('rpt_def_시스템').value.trim(),
                  환경: document.getElementById('rpt_def_환경').value.trim() };
    const map = [ ['인적'], ['물적'], ['시스템','환경'] ];
    map.forEach((cats, idx)=>{
      const el = document.getElementById('rpt_cm_cause_'+idx);
      if(!el.value.trim()){
        el.value = cats.map(c=>def[c]).filter(x=>x && x!=='해당 없음').join('\n');
      }
    });
  }
  ['인적','물적','시스템','환경'].forEach(cat=>{
    document.getElementById('rpt_def_'+cat).addEventListener('blur', autoFillCauses);
  });

  function collectReportData(){
    const checklist = {};
    document.querySelectorAll('#rpt_checklistGrid .rpt-chk-btns').forEach(group=>{
      const active = group.querySelector('.rpt-chk-btn.active');
      if(active) checklist[group.dataset.cat+'_'+group.dataset.item] = active.dataset.val;
    });
    const causeMeasure = v.reportCauseMeasure.map((row,idx)=>({
      cat: row.cat,
      cause: document.getElementById('rpt_cm_cause_'+idx).value.trim(),
      measure: document.getElementById('rpt_cm_measure_'+idx).value.trim(),
    }));
    return {
      reportTitle: document.getElementById('rpt_title').value.trim(),
      reportBirthDate: document.getElementById('rpt_birth').value,
      reportHireDate: document.getElementById('rpt_hire').value,
      reportGender: document.getElementById('rpt_gender').value,
      reportNarrative: document.getElementById('rpt_narrative').value.trim(),
      reportCauses: document.getElementById('rpt_causes').value.trim(),
      reportRemarks: document.getElementById('rpt_remarks').value.trim(),
      reportChecklist: checklist,
      reportDeficiency: {
        인적: document.getElementById('rpt_def_인적').value.trim(),
        물적: document.getElementById('rpt_def_물적').value.trim(),
        시스템: document.getElementById('rpt_def_시스템').value.trim(),
        환경: document.getElementById('rpt_def_환경').value.trim(),
      },
      reportCauseMeasure: causeMeasure,
      reportUpdatedAt: Date.now(),
    };
  }

  document.getElementById('rptSaveBtn').addEventListener('click', async ()=>{
    const data = collectReportData();
    await DataStore.update(PATHS.incidents, i.id, data);
    toast('보고서 내용이 저장되었습니다');
    closeModal();
    openIncidentDetail(i.id);
  });

  document.getElementById('rptDownloadBtn').addEventListener('click', async ()=>{
    const data = collectReportData();
    if(!data.reportTitle || !data.reportNarrative){
      toast('보고서 부제와 사고내용은 입력해주세요'); return;
    }
    await DataStore.update(PATHS.incidents, i.id, data);
    await generateIncidentReportPptx(Object.assign({}, i, data));
    toast('PPT 파일이 다운로드되었습니다');
  });
}

function generateIncidentReportPptx(i){
  if(typeof window.PptxGenJS==='undefined'){
    toast('문서 생성 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해주세요.');
    return Promise.resolve();
  }
  const NAVY='233C65', GRAY='7F7F7F', RED='E5484D';
  const age = calcAgeAt(i.reportBirthDate, i.datetime);
  const tenure = calcTenureAt(i.reportHireDate, i.datetime);
  const cm = i.reportCauseMeasure || [];
  const checklist = i.reportChecklist || {};
  const deficiency = i.reportDeficiency || {};

  const pres = new window.PptxGenJS();
  pres.defineLayout({ name:'REPORT', width:10, height:7.5 });
  pres.layout = 'REPORT';

  function addHeaderFooter(slide){
    slide.addImage({ data:'image/png;base64,'+RPT_LOGO_B64, x:8.72, y:0.15, w:0.87, h:0.42 });
    slide.addShape('line', { x:0.27, y:0.72, w:1.75, h:0, line:{ color:NAVY, width:2.2 } });
    slide.addShape('line', { x:2.02, y:0.72, w:6.95, h:0, line:{ color:GRAY, width:1.5 } });
    slide.addShape('line', { x:0.27, y:6.98, w:2.4, h:0, line:{ color:GRAY, width:1.5 } });
    slide.addShape('line', { x:2.67, y:6.98, w:7.05, h:0, line:{ color:NAVY, width:2.2 } });
    slide.addImage({ data:'image/png;base64,'+RPT_SLOGAN_B64, x:0.27, y:7.03, w:4.9, h:0.28 });
    slide.addText('ILSHIN CASTING', { x:7.5, y:7.03, w:2.2, h:0.28, fontSize:11, bold:true, color:GRAY, align:'right', fontFace:'맑은 고딕' });
    slide.addText('▣ 안전사고 보고서', { x:0.27, y:0.15, w:5, h:0.4, fontSize:20, bold:true, color:'14192B', fontFace:'맑은 고딕' });
  }

  // 슬라이드 1: 표지
  {
    const s = pres.addSlide();
    s.addImage({ data:'image/png;base64,'+RPT_COVER_BG_B64, x:0, y:0, w:10, h:7.5 });
    s.addImage({ data:'image/png;base64,'+RPT_APPROVAL_TBL_B64, x:0.73, y:0.33, w:3.8, h:1.239 });
    s.addText('안전사고 보고서', { x:2.2, y:2.9, w:6.5, h:0.7, fontSize:32, bold:true, color:NAVY, align:'right', fontFace:'맑은 고딕' });
    s.addText(`( ${i.reportTitle||''} )`, { x:2.2, y:3.55, w:6.5, h:0.45, fontSize:15, bold:true, color:'333333', align:'right', fontFace:'맑은 고딕' });
    s.addText(`${State.dept||'안전환경부'}`, { x:2.2, y:4.5, w:6.5, h:0.3, fontSize:12, bold:true, color:'333333', align:'right', fontFace:'맑은 고딕' });
    s.addText(fmtDate(Date.now()).replace(/-/g,'. ')+'.', { x:2.2, y:4.82, w:6.5, h:0.3, fontSize:12, bold:true, color:'333333', align:'right', fontFace:'맑은 고딕' });
  }

  // 슬라이드 2: 사고발생 장소 및 세부내용
  {
    const s = pres.addSlide();
    addHeaderFooter(s);
    s.addShape('rect', { x:0.27, y:0.85, w:0.06, h:0.3, fill:{color:NAVY}, line:{type:'none'} });
    s.addText(i.reportTitle||'', { x:0.4, y:0.85, w:5.5, h:0.3, fontSize:11, bold:true, color:'14192B', fontFace:'맑은 고딕' });
    s.addText('1) 사고발생 장소 및 세부내용', { x:6.1, y:0.8, w:3.4, h:0.3, fontSize:11, bold:true, color:'14192B', fontFace:'맑은 고딕' });

    const X0=0.34, X1=1.25, X2=1.68, X3=2.52, X4=3.08, X5=4.35, X6=4.91, X7=6.05;
    const Y0=1.18, Y1=1.90, Y2=2.16, Y3=2.41, Y4=5.15, Y5=6.09, Y6=6.82;
    const border = { pt:0.75, color:'C7CEDB' };
    const labelOpt = { fill:{color:'F1F3F7'}, fontSize:9, bold:true, align:'center', valign:'middle', line:border, margin:2 };
    const valOpt = { fontSize:8.5, valign:'middle', line:border, margin:4 };
    function box(x,y,w,h,text,opt){
      s.addShape('rect',{x,y,w,h,fill:opt.fill||{color:'FFFFFF'},line:opt.line});
      if(text!==null) s.addText(text,{x,y,w,h,fontSize:opt.fontSize,bold:opt.bold,align:opt.align||'left',valign:opt.valign,color:opt.color||'14192B',fontFace:'맑은 고딕',margin:opt.margin||2});
    }
    const dtStr = fmtDateTime(i.datetime);
    box(X0,Y0,X1-X0,Y1-Y0,'사고개요',labelOpt);
    box(X1,Y0,X7-X1,Y1-Y0,`▪ 일   시 : ${dtStr}\n▪ 장   소 : ${i.location||''}\n▪ 형   태 : ${(i.accidentType==='기타(직접입력)'?i.accidentTypeOther:t('accidenttype_'+i.accidentType))||''}`,valOpt);
    box(X0,Y1,X1-X0,Y3-Y1,'재해자',labelOpt);
    box(X1,Y1,X2-X1,Y2-Y1,'성명',labelOpt); box(X2,Y1,X3-X2,Y2-Y1,i.injuredPerson||'',valOpt);
    box(X3,Y1,X4-X3,Y2-Y1,'연령',labelOpt); box(X4,Y1,X5-X4,Y2-Y1,age!=null?age+'세':'-',valOpt);
    box(X5,Y1,X6-X5,Y2-Y1,'근속',labelOpt); box(X6,Y1,X7-X6,Y2-Y1,tenure||'-',valOpt);
    box(X1,Y2,X2-X1,Y3-Y2,'성별',labelOpt); box(X2,Y2,X3-X2,Y3-Y2,i.reportGender||'-',valOpt);
    box(X3,Y2,X4-X3,Y3-Y2,'부서',labelOpt); box(X4,Y2,X5-X4,Y3-Y2,processDept(i.process)||'-',valOpt);
    box(X5,Y2,X6-X5,Y3-Y2,'공정',labelOpt); box(X6,Y2,X7-X6,Y3-Y2,i.process||'-',valOpt);
    box(X0,Y3,X1-X0,Y4-Y3,'사고내용',labelOpt); box(X1,Y3,X7-X1,Y4-Y3,i.reportNarrative||'',valOpt);
    box(X0,Y4,X1-X0,Y5-Y4,'원 인',labelOpt); box(X1,Y4,X7-X1,Y5-Y4,i.reportCauses||'',valOpt);
    box(X0,Y5,X1-X0,Y6-Y5,'비 고',labelOpt); box(X1,Y5,X7-X1,Y6-Y5,i.reportRemarks||'',valOpt);

    if(i.photo1) s.addImage({ data:i.photo1, x:6.19, y:1.18, w:3.68, h:2.75, sizing:{type:'cover',w:3.68,h:2.75} });
    if(i.photo2) s.addImage({ data:i.photo2, x:6.19, y:4.03, w:3.68, h:2.75, sizing:{type:'cover',w:3.68,h:2.75} });
  }

  // 슬라이드 3: 안전관리항목 Check 결과
  {
    const s = pres.addSlide();
    addHeaderFooter(s);
    s.addText('[O 양호 / △ 미흡 / X 불량 / - 해당없음]', { x:5.8, y:0.85, w:3.9, h:0.25, fontSize:9, color:'667085', align:'right', fontFace:'맑은 고딕' });
    s.addShape('rect', { x:0.27, y:1.1, w:0.06, h:0.28, fill:{color:NAVY}, line:{type:'none'} });
    s.addText('안전관리항목 Check 결과', { x:0.4, y:1.1, w:5, h:0.28, fontSize:12, bold:true, color:'14192B', fontFace:'맑은 고딕' });

    const CATX = { 인적:0.664, 물적:3.134, 시스템:5.595, 환경:8.036 };
    const LABEL_W = 1.51, LABEL_H = 0.256, ROW_Y0 = 1.892, ROW_DY = 0.316;
    const CHK_OFFSET = 1.30, CHK_SIZE = 0.157;
    const DEF_HEADER_Y = 3.934, DEF_HEADER_H = 0.315, DEF_BODY_Y = 4.353, DEF_BODY_H = 2.599;

    Object.keys(RPT_CHECKLIST).forEach(cat=>{
      const x = CATX[cat];
      const color = RPT_CATCOLOR[cat];
      s.addText(RPT_CATLABEL[cat], { x, y:1.42, w:1.3, h:0.3, fontSize:13, bold:true, color, fontFace:'맑은 고딕' });
      RPT_CHECKLIST[cat].forEach((item, ri)=>{
        const y = ROW_Y0 + ri*ROW_DY;
        const val = checklist[cat+'_'+item] || '-';
        const isBad = (val==='X');
        s.addShape('rect', { x, y, w:LABEL_W, h:LABEL_H, fill:{color:'FFFFFF'}, line:{color:isBad?RED:'C7CEDB', width:0.75} });
        s.addText(item, { x:x+0.06, y, w:LABEL_W-0.5, h:LABEL_H, fontSize:7.5, bold:isBad, color:isBad?RED:'14192B', fontFace:'맑은 고딕', valign:'middle' });
        const cx = x + CHK_OFFSET;
        s.addShape('rect', { x:cx, y:y+0.05, w:CHK_SIZE, h:CHK_SIZE, fill:{color:isBad?'FDEAEA':'F7F8FA'}, line:{color:isBad?RED:'C7CEDB',width:0.75} });
        s.addText(val, { x:cx, y:y+0.05, w:CHK_SIZE, h:CHK_SIZE, fontSize:8, bold:true, color:isBad?RED:'4B5468', align:'center', valign:'middle', fontFace:'맑은 고딕' });
      });
      s.addShape('rect', { x, y:DEF_HEADER_Y, w:LABEL_W, h:DEF_HEADER_H, fill:{color}, line:{type:'none'} });
      s.addText('미흡 사항', { x, y:DEF_HEADER_Y, w:LABEL_W, h:DEF_HEADER_H, fontSize:10, bold:true, color:'FFFFFF', align:'center', valign:'middle', fontFace:'맑은 고딕' });
      s.addShape('rect', { x, y:DEF_BODY_Y, w:LABEL_W, h:DEF_BODY_H, fill:{color:'FFFFFF'}, line:{color:'E2E6EC',width:0.75} });
      s.addText(deficiency[cat]||'', { x:x+0.06, y:DEF_BODY_Y+0.05, w:LABEL_W-0.12, h:DEF_BODY_H-0.1, fontSize:8, color:'333333', fontFace:'맑은 고딕', valign:'top' });
    });
  }

  // 슬라이드 4: 사고 원인 및 재발방지 대책
  {
    const s = pres.addSlide();
    addHeaderFooter(s);
    s.addShape('rect', { x:0.27, y:0.85, w:0.06, h:0.3, fill:{color:NAVY}, line:{type:'none'} });
    s.addText('사고 원인 및 재발방지 대책', { x:0.4, y:0.85, w:5, h:0.3, fontSize:13, bold:true, color:'14192B', fontFace:'맑은 고딕' });
    const headFill = { color:'E7EAF2' };
    const rows = [
      [ {text:'',options:{fill:headFill}}, {text:'원 인',options:{fill:headFill,bold:true,align:'center',fontSize:10}}, {text:'대 책',options:{fill:headFill,bold:true,align:'center',fontSize:10}} ],
      ...cm.map(row=>[
        {text:row.cat, options:{fill:{color:'F7F8FA'}, bold:true, fontSize:9, valign:'middle', align:'center'}},
        {text:row.cause||'', options:{fontSize:9, valign:'middle'}},
        {text:row.measure||'', options:{fontSize:9, valign:'middle'}},
      ]),
    ];
    s.addTable(rows, { x:0.27, y:1.35, w:9.51, h:5.52, colW:[0.836,3.82,4.851], border:{type:'solid',color:'C7CEDB',pt:0.75}, valign:'middle' });
  }

  const safeTitle = (i.reportTitle||'사고보고서').replace(/[\\/:*?"<>|]/g,'').slice(0,40);
  return pres.writeFile({ fileName: `안전사고보고서_${safeTitle}.pptx` });
}

      ` : ''}
    </tr>
  `).join('') : `<tr><td colspan="${isAdmin?5:1}"><div class="empty"><span class="big">${icon('hard-hat',22)}</span>${t('contractors_empty')}</div></td></tr>`;

  }));

  const allRecords = objToArr(DataStore.get(PATHS.contractorRecords)).sort((a,b)=> new Date(b.date||0)-new Date(a.date||0));
  const records = activeTab==='all' ? allRecords : allRecords.filter(r=>r.contractorId===activeTab);
  const rBody = document.getElementById('recordBody');
  rBody.innerHTML = records.length ? records.map(r=>{
    const rc = contractors.find(c=>c.id===r.contractorId);
    return `<tr>
      <td><span class="badge b-gray">${r.recordType?esc(recordTypeLabel(r.recordType)):'-'}</span></td>

  rBody.querySelectorAll('[data-view-r]').forEach(b=> b.addEventListener('click', ()=> openRecordDetail(b.dataset.viewR)));
}

  showModal(`
    <div class="modal-head"><h3>${isEdit?t('contractor_edit_title'):t('contractor_new_title')}</h3><button class="x-btn" data-close>✕</button></div>
    <div class="modal-body">
      <div class="field"><label>${t('lbl_companyname')} *</label><input type="text" id="f_name" value="${esc(v.name||'')}"></div>
      <div class="row2">
        <div class="field"><label>${t('th_type')}</label>

function renderNotices(){

        <div style="font-size:13px;color:var(--ink-soft);font-weight:600;">${t('notices_tab')}</div>
        <button class="btn btn-primary" id="addNoticeBtn">${icon('plus',15)} ${t('notice_add_btn')}</button>
      </div>
      <div id="noticeList"></div>
    </div>
    <div id="contactPane" style="${tab==='contact'?'':'display:none'}">

      <div class="contact-grid" id="contactGrid"></div>

  `;
  el.querySelectorAll('.tab[data-tab]').forEach(t=>t.addEventListener('click', ()=>{
    State.filters.noticeTab = t.dataset.tab; renderNotices();
  }));
  document.getElementById('addNoticeBtn').addEventListener('click', ()=>{
    if(!requireAdmin('공지 등록')) return;
    openNoticeModal();
  });
  document.getElementById('addContactBtn').addEventListener('click', ()=>{
    if(!requireAdmin('연락처 등록')) return;
    openContactModal();
  });

  const notices = objToArr(DataStore.get(PATHS.notices)).sort((a,b)=> (b.pinned?1:0)-(a.pinned?1:0) || (b.createdAt||0)-(a.createdAt||0));
  const list = document.getElementById('noticeList');
  list.innerHTML = notices.length ? notices.map(n=>`
    <div class="notice-item ${n.pinned?'pinned':''}">
      <h4 data-view-n="${n.id}" style="cursor:pointer;">${n.pinned?icon('pin',14):''} ${newBadge(n, PATHS.notices)}${esc(n.title)}</h4>
      <div class="notice-content">${n.content||''}</div>
      ${n.fileData ? (
        n.fileType && n.fileType.startsWith('image/')
          ? `<div class="notice-meta"><img src="${n.fileData}" alt="${esc(n.fileName||'첨부이미지')}" style="max-width:100%;border-radius:8px;border:1px solid var(--line);margin:8px 0;display:block;"><a href="${n.fileData}" download="${esc(n.fileName||'첨부파일')}" style="color:var(--info);font-weight:700;">📎 ${esc(n.fileName||'첨부파일')} 다운로드</a></div>`
          : `<div class="notice-meta"><a href="${n.fileData}" download="${esc(n.fileName||'첨부파일')}" style="color:var(--info);font-weight:700;">📎 ${esc(n.fileName||'첨부파일')} 다운로드</a></div>`
      ) : ''}
      <div class="notice-meta">${esc(n.author||'안전환경부')} · ${fmtDate(n.createdAt)}
        ${State.mode==='admin'?` · <a href="#" data-edit-n="${n.id}" style="color:var(--info)">${t('btn_edit')}</a> · <a href="#" data-del-n="${n.id}" style="color:var(--danger)">${t('btn_delete')}</a>`:''}
      </div>
    </div>
  `).join('') : `<div class="empty"><span class="big">${icon('megaphone',22)}</span>${t('notices_empty')}</div>`;

  list.querySelectorAll('[data-edit-n]').forEach(a=> a.addEventListener('click', e=>{
    e.preventDefault();
    const n = DataStore.get(PATHS.notices)[a.dataset.editN];
    openNoticeModal(Object.assign({id:a.dataset.editN}, n));
  }));
  list.querySelectorAll('[data-del-n]').forEach(a=> a.addEventListener('click', async e=>{
    e.preventDefault();
    if(confirm(t('confirm_delete'))){ await DataStore.remove(PATHS.notices, a.dataset.delN); toast(t('toast_deleted')); renderNotices(); }
  }));

  const contacts = objToArr(DataStore.get(PATHS.contacts));
  const grid = document.getElementById('contactGrid');
  grid.innerHTML = contacts.length ? contacts.map(c=>`
    <div class="contact-card">
      <div class="c-role">${esc(c.role||'담당')}</div>
      <div class="c-name">${esc(c.name)}</div>
      <div class="c-phone">${esc(c.phone||'-')}</div>

    </div>
  `).join('') : `<div class="empty"><span class="big">☎</span>${t('contacts_empty')}</div>`;
  grid.querySelectorAll('[data-del-c2]').forEach(a=> a.addEventListener('click', async e=>{
    e.preventDefault();
    if(confirm(t('confirm_delete'))){ await DataStore.remove(PATHS.contacts, a.dataset.delC2); toast(t('toast_deleted')); renderNotices(); }
  }));
}

  showModal(`

    <div class="modal-body">
      <div class="field"><label>${t('lbl_title')} *</label><input type="text" id="f_title" value="${esc(v.title||'')}"></div>
      <div class="field">
        <label>${t('lbl_content')} *</label>
        <div class="rte-toolbar" style="display:flex;gap:5px;margin-bottom:6px;flex-wrap:wrap;">
          <button type="button" class="btn btn-sm" data-cmd="bold" title="${t('rte_bold')}" style="font-weight:800;">B</button>
          <button type="button" class="btn btn-sm" data-cmd="forecolor" data-group="color" data-val="#E5484D" title="${t('rte_red')}" style="color:#E5484D;font-weight:800;">A</button>
          <button type="button" class="btn btn-sm" data-cmd="forecolor" data-group="color" data-val="#2D7DD2" title="${t('rte_blue')}" style="color:#2D7DD2;font-weight:800;">A</button>
          <button type="button" class="btn btn-sm" data-cmd="forecolor" data-group="color" data-val="#1DA46F" title="${t('rte_green')}" style="color:#1DA46F;font-weight:800;">A</button>
          <button type="button" class="btn btn-sm" data-cmd="forecolor" data-group="color" data-val="#14192B" title="${t('rte_default')}" style="color:#14192B;font-weight:800;">A</button>
          <span style="width:1px;background:var(--line);margin:0 2px;"></span>

          <button type="button" class="btn btn-sm" data-cmd="fontsize" data-group="size" data-val="4" title="${t('rte_normal')}">${t('rte_normal')}</button>
          <button type="button" class="btn btn-sm" data-cmd="fontsize" data-group="size" data-val="6" title="${t('rte_large')}">${t('rte_large')}</button>
        </div>
        <div id="f_content" contenteditable="true" style="min-height:120px;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:13.5px;line-height:1.6;">${v.content||''}</div>
      </div>
      <div class="field"><label>${t('lbl_author')}</label><input type="text" id="f_author" value="${esc(v.author||'안전환경부')}"></div>
      <div class="field"><label>${t('lbl_attachment')}</label><input type="file" id="f_file">
        ${v.fileName ? `<p class="hint">${t('hint_existing_attachment').replace('{name}', esc(v.fileName))}</p>` : ''}
        <p class="hint">${t('hint_attachment_size')}</p>
      </div>
      <div class="field"><label><input type="checkbox" id="f_pinned" ${v.pinned?'checked':''}> ${t('lbl_pin_top')}</label></div>
    </div>
    <div class="modal-foot"><button class="btn" data-close>${t('btn_cancel')}</button><button class="btn btn-primary" id="saveNoticeBtn">${isEdit?t('btn_save'):t('btn_register')}</button></div>
  `);
  document.querySelectorAll('.rte-toolbar [data-cmd]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.getElementById('f_content').focus();
      document.execCommand(btn.dataset.cmd, false, btn.dataset.val || null);
      if(btn.dataset.cmd==='bold'){
        btn.classList.toggle('active', document.queryCommandState('bold'));
      }else if(btn.dataset.group){
        document.querySelectorAll(`.rte-toolbar [data-group="${btn.dataset.group}"]`).forEach(b=> b.classList.remove('active'));
        btn.classList.add('active');
      }
    });
  });
  document.getElementById('saveNoticeBtn').addEventListener('click', async ()=>{
    const title = document.getElementById('f_title').value.trim();
    const contentEl = document.getElementById('f_content');
    const content = contentEl.innerHTML.trim();
    if(!title || !contentEl.textContent.trim()){ toast(t('toast_fill_required')); return; }
    const data = {
      title, content,
      author: document.getElementById('f_author').value.trim() || '안전환경부',
      pinned: document.getElementById('f_pinned').checked,
    };
    const fileInput = document.getElementById('f_file');
    const file = fileInput.files && fileInput.files[0];
    if(file){
      if(file.size > 5*1024*1024){
        toast(t('toast_file_toobig')); return;
      }
      const dataUrl = await new Promise((resolve, reject)=>{
        const reader = new FileReader();
        reader.onload = ()=> resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
      data.fileName = file.name;
      data.fileType = file.type;
      data.fileData = dataUrl;
    }
    if(isEdit){
      await DataStore.update(PATHS.notices, existing.id, data);
      toast(t('toast_notice_updated'));
    }else{
      data.createdAt = Date.now();
      await DataStore.push(PATHS.notices, data);
      toast(t('toast_notice_registered'));
    }
    closeModal(); renderNotices();
  });
}

/* ============================================================
   13-1. 안전제안제도 — 실명 접수, 익명 불가
   일반사용자는 목록을 볼 수 없고 본인이 이 기기에서 등록한 제안만 조회 가능(로컬 저장 기반)
============================================================= */
// 여러 메뉴(위험성평가/사고접수/작업허가 등)에서 공통으로 쓰는 "내가 이 기기에서 등록한 항목" 추적
function getMyOwnedIds(storageKey){
  try{ return JSON.parse(localStorage.getItem(storageKey) || '[]'); }
  catch(e){ return []; }
}
function addMyOwnedId(storageKey, id){
  const ids = getMyOwnedIds(storageKey);
  ids.unshift(id);
  localStorage.setItem(storageKey, JSON.stringify(ids.slice(0,200)));
}

const MY_SUGGESTIONS_KEY = 'isc_my_suggestions';
function getMySuggestionIds(){
  try{ return JSON.parse(localStorage.getItem(MY_SUGGESTIONS_KEY) || '[]'); }
  catch(e){ return []; }
}
function addMySuggestionId(id){
  const ids = getMySuggestionIds();
  ids.unshift(id);
  localStorage.setItem(MY_SUGGESTIONS_KEY, JSON.stringify(ids.slice(0,100)));
}

function renderSuggestions(){
  const el = document.getElementById('view-suggestions');
  const isAdmin = State.mode==='admin';
  const filter = State.filters.suggestions || '전체';

  if(isAdmin){
    el.innerHTML = `
      <div class="toolbar">
        <div class="tabs" id="sugTabs">
          ${['전체','접수','검토중','완료'].map(s=>`<button class="tab ${filter===s?'active':''}" data-s="${s}">${s==='전체'?t('tab_all'):statusLabel(s)}</button>`).join('')}
        </div>
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>${t('sug_th_title')}</th><th>${t('sug_th_reporter')}</th><th>${t('th_date')}</th><th>${t('th_status')}</th><th class="tight">${t('btn_manage_col')}</th></tr></thead>
        <tbody id="sugBody"></tbody>
      </table></div>
    `;
    el.querySelectorAll('#sugTabs .tab').forEach(t=>t.addEventListener('click', ()=>{
      State.filters.suggestions = t.dataset.s; renderSuggestions();
    }));
    const arr = objToArr(DataStore.get(PATHS.suggestions)).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    const filtered = filter==='전체' ? arr : arr.filter(s=>s.status===filter);
    const body = document.getElementById('sugBody');
    body.innerHTML = filtered.length ? filtered.map(s=>`
      <tr>
        <td class="cell-strong">${newBadge(s, PATHS.suggestions)}${esc(s.title)}</td>
        <td>${esc(s.reporter||'-')}</td>
        <td class="mono">${fmtDate(s.createdAt)}</td>
        <td>${statusBadge('suggestion', s.status)}</td>

(function setupBackExitGuard(){
  history.pushState({ trap:true }, '');
  window.addEventListener('popstate', ()=>{
    if(signaturePadOpen){
      // 서명 중에는 뒤로가기 제스처로 서명창이 닫히지 않도록 무시하고 트랩만 다시 쌓음
      history.pushState({ trap:true }, '');
      return;
    }
    const overlay = document.getElementById('overlay');
    if(overlay && !overlay.hidden){

      closeModal();
      history.pushState({ trap:true }, '');
      return;
    }
    showModal(`
      <div class="modal-body" style="text-align:center;padding:30px 20px 22px;">

      </div>
    `);
    document.getElementById('exitCancelBtn').addEventListener('click', ()=>{
      closeModal();
      history.pushState({ trap:true }, '');
    });
    document.getElementById('exitConfirmBtn').addEventListener('click', ()=>{
      closeModal();
      try{ window.close(); }catch(e){}
      // 스크립트로 앱(탭)을 강제 종료할 방법이 없어, 트랩을 다시 쌓지 않고 안내만 표시
      // → 지금 여기가 히스토리의 가장 처음이라 다음 뒤로가기 시 실제로 앱이 종료(최소화)됨
      toast(t('exit_press_again'));
    });
  });
})();

const ADMIN_PW_KEY = 'isc_admin_pw';
const DEPTS = ['관리부','생산부','품질관리부'];
function deptPwKey(dept){ return 'isc_dept_pw_' + dept; }

document.getElementById('gateMode').addEventListener('change', e=>{
  document.getElementById('gatePwWrap').hidden = e.target.value === 'user';
});

// 저장된 비밀번호가 하나도 없으면(최초 실행) true — 이 경우에만 입력값으로 전체관리자 비번을 새로 설정
function noPasswordsSetYet(){
  if(localStorage.getItem(ADMIN_PW_KEY)) return false;
  return !DEPTS.some(d => localStorage.getItem(deptPwKey(d)));
}

// 비밀번호 하나로 역할(전체관리자/부서관리자)을 자동 판별
function resolveRoleByPassword(input){
  if(!input) return { ok:false, reason:'empty' };
  const adminSaved = localStorage.getItem(ADMIN_PW_KEY);
  if(adminSaved && input === adminSaved){
    return { ok:true, mode:'admin', dept:null };
  }
  for(const d of DEPTS){
    const saved = localStorage.getItem(deptPwKey(d));
    if(saved && input === saved){
      return { ok:true, mode:'dept', dept:d };
    }
  }
  if(noPasswordsSetYet()){
    // 최초 실행: 지금 입력한 비밀번호를 전체관리자 비밀번호로 등록
    localStorage.setItem(ADMIN_PW_KEY, input);
    toast(t('toast_admin_pw_set'));
    return { ok:true, mode:'admin', dept:null };
  }
  return { ok:false, reason:'mismatch' };
}

function enterWithPassword(input){
  const result = resolveRoleByPassword(input.trim());
  if(!result.ok){
    toast(result.reason==='empty' ? t('toast_pw_required') : t('toast_pw_mismatch'));
    return false;
  }
  State.mode = result.mode; State.dept = result.dept;
  return true;
}

const REMEMBER_MODE_KEY = 'isc_remember_mode';
const REMEMBER_DEPT_KEY = 'isc_remember_dept';

document.getElementById('gateEnter').addEventListener('click', ()=>{
  const mode = document.getElementById('gateMode').value;
  if(mode==='admin'){
    if(!enterWithPassword(document.getElementById('gatePw').value)) return;
    if(document.getElementById('gateRemember').checked){
      localStorage.setItem(REMEMBER_MODE_KEY, State.mode);
      if(State.dept) localStorage.setItem(REMEMBER_DEPT_KEY, State.dept);
      else localStorage.removeItem(REMEMBER_DEPT_KEY);
    }
  }else{
    State.mode = 'user'; State.dept = null;
  }
  document.getElementById('gate').style.display = 'none';
  updateModeUI();
  boot();
});

document.getElementById('modeSwitchBtn').addEventListener('click', ()=>{
  if(State.mode !== 'user'){
    State.mode = 'user'; State.dept = null;
    // 로그인 유지 상태였다면 이 기기의 기억 정보도 함께 삭제 (완전 로그아웃)
    localStorage.removeItem(REMEMBER_MODE_KEY);
    localStorage.removeItem(REMEMBER_DEPT_KEY);
    updateModeUI();
    toast(t('toast_switched_user'));
    renderCurrentView(); renderNav();
    return;
  }
  const input = prompt('관리자 비밀번호를 입력하세요\n(비밀번호에 따라 전체관리자 또는 해당 부서 관리자로 자동 접속됩니다)');
  if(input===null) return;
  if(!enterWithPassword(input)) return;
  updateModeUI();
  toast('모드가 전환되었습니다');
  renderCurrentView(); renderNav();
});

// 외주업체 전용 고유링크 접속 감지 (?p=토큰) — 매칭되면 게이트를 건너뛰고 작업허가만 보이는 열람모드로 진입
const partnerToken = new URLSearchParams(location.search).get('p');
if(partnerToken){
  document.getElementById('gate').style.display = 'none';
  document.body.insertAdjacentHTML('beforeend', `<div id="partnerLoadingScreen" style="position:fixed;inset:0;background:#F4F6F8;display:flex;align-items:center;justify-content:center;z-index:300;font-size:13px;color:#667085;">${t('partner_loading')}</div>`);
  let partnerDecided = false;
  DataStore.listen(PATHS.permitPartners, (val)=>{
    if(partnerDecided) return;
    partnerDecided = true;
    const entry = Object.values(val||{}).find(p=>p.token===partnerToken);
    const screen = document.getElementById('partnerLoadingScreen');
    if(entry){
      State.mode = 'partner';
      State.partnerCompany = entry.name;
      if(screen) screen.remove();
      updateModeUI();
      boot();
    }else if(screen){
      screen.innerHTML = `<div style="text-align:center;padding:20px;"><p style="font-weight:700;margin-bottom:6px;">${t('partner_invalid_title')}</p><p style="font-size:12px;color:#98A2B3;">${t('partner_invalid_desc')}</p></div>`;
    }
  });
}

// 이 기기에 "로그인 유지"가 저장되어 있으면 게이트를 건너뛰고 바로 접속
(function tryAutoLogin(){
  if(partnerToken) return; // 외주업체 링크로 접속한 경우는 이 흐름을 타지 않음
  const rememberedMode = localStorage.getItem(REMEMBER_MODE_KEY);
  if(rememberedMode==='admin' || rememberedMode==='dept'){
    State.mode = rememberedMode;
    State.dept = rememberedMode==='dept' ? localStorage.getItem(REMEMBER_DEPT_KEY) : null;
    document.getElementById('gate').style.display = 'none';
    updateModeUI();
    boot();
  }
})();

// 전체관리자 전용: 부서 비밀번호 설정/변경
function openDeptPasswordModal(){
  showModal(`
    <div class="modal-head"><h3>관리자 계정 설정</h3><button class="x-btn" data-close>✕</button></div>
    <div class="modal-body">
      <div class="field"><label>전체관리자 비밀번호 변경</label>
        <input type="text" id="f_pw_admin" placeholder="새 비밀번호 (변경하지 않으려면 비워두세요)">
      </div>
      <div class="divider"></div>
      <p class="hint" style="margin-bottom:14px;">각 부서에 나눠줄 비밀번호를 설정하세요. 부서 담당자가 이 비밀번호로 로그인하면 자동으로 해당 부서 관리자로 접속됩니다.</p>
      ${DEPTS.map(d=>`
        <div class="field"><label>${d}</label>
          <input type="text" id="f_pw_${d}" placeholder="${localStorage.getItem(deptPwKey(d)) ? '설정됨 (변경하려면 새 비밀번호 입력)' : '비밀번호 설정'}">
        </div>
      `).join('')}
    </div>
    <div class="modal-foot">
      <button class="btn" data-close>취소</button>
      <button class="btn btn-primary" id="saveDeptPwBtn">저장</button>
    </div>
  `);
  document.getElementById('saveDeptPwBtn').addEventListener('click', ()=>{
    let changed = 0;
    const newAdminPw = document.getElementById('f_pw_admin').value.trim();
    if(newAdminPw){ localStorage.setItem(ADMIN_PW_KEY, newAdminPw); changed++; }
    DEPTS.forEach(d=>{
      const val = document.getElementById('f_pw_'+d).value.trim();
      if(val){ localStorage.setItem(deptPwKey(d), val); changed++; }
    });
    toast(changed>0 ? '비밀번호가 저장되었습니다' : '변경된 내용이 없습니다');
    closeModal();
  });
}

function updateModeUI(){
  const label = State.mode==='admin' ? t('mode_label_admin')
    : State.mode==='dept' ? `${t('mode_label_dept')} (${State.dept})`
    : State.mode==='partner' ? `${t('mode_label_partner')} (${State.partnerCompany})`
    : t('mode_label_user');
  document.getElementById('modeLabel').textContent = label;
  document.getElementById('deptPwSettingBtn').style.display = State.mode==='admin' ? '' : 'none';
  document.getElementById('modeSwitchBtn').style.display = State.mode==='partner' ? 'none' : '';
  document.getElementById('modeSwitchBtn').textContent = State.mode==='user' ? t('mode_switch') : t('mode_release');
  document.getElementById('modeSwitchBtn').classList.toggle('on', State.mode!=='user');
}

/* 정적 마크업(data-i18n / data-i18n-placeholder)에 현재 언어 적용 */
function applyI18n(){
  document.documentElement.lang = State.lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    el.textContent = t(el.dataset.i18n);
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{
    el.setAttribute('placeholder', t(el.dataset.i18nPlaceholder));
  });
}

document.getElementById('deptPwSettingBtn').addEventListener('click', ()=>{
  if(State.mode!=='admin'){ toast(t('toast_admin_only')); return; }
  openDeptPasswordModal();
});

document.getElementById('brandHome').addEventListener('click', ()=>{
  switchView('dashboard');
});

function openMobileSidebar(){
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebarBackdrop').classList.add('open');
}
function closeMobileSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarBackdrop').classList.remove('open');

document.getElementById('hamburger').addEventListener('click', ()=>{

  else openMobileSidebar();

/* ============================================================
   16. 부트스트랩
============================================================= */
function boot(){
  const d = new Date();
  document.getElementById('todayChip').textContent =
    `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} (${['일','월','화','수','목','금','토'][d.getDay()]})`;

  renderNav();
  switchView('dashboard');

  Object.values(PATHS).forEach(path=>{
    DataStore.listen(path, (val)=>{
      renderNav();
      renderCurrentView();
      checkStaleEscalation(path, val);
    });
  });
}

// 접수/신청 후 2일(48시간)이 지나도록 초기 상태 그대로면 자동으로 다음 단계로 넘김
// (방치되는 것을 막기 위함 — 데이터를 실제로 불러온 시점마다 점검)
const STALE_ESCALATE_MS = 2*24*60*60*1000;
const STALE_ESCALATE_RULES = {}; // path -> {from, to}, 아래서 PATHS 확정 후 채움
STALE_ESCALATE_RULES[PATHS.permits]   = { from:'신청',     to:'검토중' };
STALE_ESCALATE_RULES[PATHS.risks]     = { from:'접수완료', to:'조치중' };
STALE_ESCALATE_RULES[PATHS.incidents] = { from:'접수',     to:'조사중' };

async function checkStaleEscalation(path, val){
  const rule = STALE_ESCALATE_RULES[path];
  if(!rule || !val) return;
  for(const id of Object.keys(val)){
    const item = val[id];
    if(item && item.status===rule.from && item.createdAt && (Date.now()-item.createdAt > STALE_ESCALATE_MS)){
      await DataStore.update(path, id, { status: rule.to });
    }
  }
}

/* ============================================================
   17. PWA 설치 안내 (로그인 화면 버튼)
============================================================= */
let deferredInstallPrompt = null;
const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);

function updateInstallBtn(){
  const btn = document.getElementById('gateInstallBtn');
  if(!btn) return;
  // 설치 여부와 상관없이 언제든 눌러서 설치를 시도/안내받을 수 있도록 항상 노출
  btn.style.display = '';
  btn.innerHTML = `${icon('file-check',14)} ${t('gate_install_btn')}`;
}

window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  updateInstallBtn();
});

document.getElementById('gateInstallBtn').addEventListener('click', async ()=>{
  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    const choice = await deferredInstallPrompt.userChoice;
    if(choice.outcome === 'accepted'){ toast(t('toast_app_installed')); }
    deferredInstallPrompt = null;
    updateInstallBtn();
  }else if(isIOS){
    showModal(`
      <div class="modal-head"><h3>${t('ios_install_title')}</h3><button class="x-btn" data-close>✕</button></div>
      <div class="modal-body">
        <ol style="margin:0;padding-left:20px;font-size:13.5px;line-height:2;">
          <li>${t('ios_install_step1')}</li>
          <li>${t('ios_install_step2')}</li>
          <li>${t('ios_install_step3')}</li>
        </ol>
      </div>
      <div class="modal-foot"><button class="btn" data-close>${t('btn_close')}</button></div>
    `);
  }else{
    // 자동 설치 이벤트가 아직 안 뜬 경우(브라우저마다 타이밍 차이) 일반 안내로 대체
    showModal(`
      <div class="modal-head"><h3>${t('generic_install_title')}</h3><button class="x-btn" data-close>✕</button></div>
      <div class="modal-body">
        <ol style="margin:0;padding-left:20px;font-size:13.5px;line-height:2;">
          <li>${t('generic_install_step1')}</li>
          <li>${t('generic_install_step2')}</li>
          <li>${t('generic_install_step3')}</li>
        </ol>
      </div>
      <div class="modal-foot"><button class="btn" data-close>${t('btn_close')}</button></div>
    `);
  }
});

window.addEventListener('appinstalled', ()=>{
  deferredInstallPrompt = null;
  updateInstallBtn();
});

updateInstallBtn();

// 로그인 상태에서도 사이드바에서 언어변경/설치 접근 가능 (앱을 껐다 켤 필요 없이)
document.getElementById('sidebarInstallBtn').addEventListener('click', ()=>{
  document.getElementById('gateInstallBtn').click();
});
document.getElementById('sidebarLangBtn').addEventListener('click', ()=>{
  showModal(`
    <div class="modal-head"><h3>${t('gate_lang_label')}</h3><button class="x-btn" data-close>✕</button></div>
    <div class="modal-body">
      <div class="lang-picker" id="sidebarLangPicker">
        <button type="button" class="lang-btn ${State.lang==='ko'?'active':''}" data-lang="ko"><span class="flag">🇰🇷</span><span>한국어</span></button>
        <button type="button" class="lang-btn ${State.lang==='en'?'active':''}" data-lang="en"><span class="flag">🇺🇸</span><span>English</span></button>
        <button type="button" class="lang-btn ${State.lang==='th'?'active':''}" data-lang="th"><span class="flag">🇹🇭</span><span>ไทย</span></button>
        <button type="button" class="lang-btn ${State.lang==='id'?'active':''}" data-lang="id"><span class="flag">🇮🇩</span><span>Indonesia</span></button>
        <button type="button" class="lang-btn ${State.lang==='mn'?'active':''}" data-lang="mn"><span class="flag">🇲🇳</span><span>Монгол</span></button>
      </div>
    </div>
  `);
  document.querySelectorAll('#sidebarLangPicker .lang-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      State.lang = btn.dataset.lang;
      localStorage.setItem('isc_lang', State.lang);
      applyI18n();
      updateModeUI();
      renderNav();
      renderCurrentView();
      closeModal();
    });
  });
});
</script>
