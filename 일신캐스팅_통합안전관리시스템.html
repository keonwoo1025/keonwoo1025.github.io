<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>일신캐스팅 통합 안전관리 시스템</title>

<!-- ============================================================
  PWA (홈 화면 설치용 앱 설정)
============================================================= -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#101B33">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="일신안전관리">

<!-- ============================================================
  Firebase SDK (compat 버전 - 별도 빌드 도구 없이 바로 사용 가능)
============================================================= -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pizzip@3.1.6/dist/pizzip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docxtemplater@3.44.0/build/docxtemplater.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@4.0.1/dist/pptxgen.min.js"></script>

<style>
/* ==========================================================================
   토큰 시스템
   Color
     --navy-900 #101B33  사이드바/헤더 배경 (딱딱한 조명 아래 도장 강판 느낌)
     --navy-700 #1C2E52  사이드바 hover
     --paper    #F4F6F8  본문 배경
     --card     #FFFFFF  카드 배경
     --line     #E2E6EC  경계선
     --ink      #14192B  본문 텍스트
     --ink-soft #667085  보조 텍스트
     --safety   #FF6A13  안전표지 오렌지 (경고/CTA 강조)
     --caution  #FFC93C  주의(황색 표지판)
     --ok       #1DA46F  안전(녹색 표지판)
     --danger   #E5484D  위험(적색 표지판)
     --info     #2D7DD2  정보/파랑
   Type
     display : 'Pretendard' (한글 가변폭 산세리프, 큰 숫자/타이틀)
     mono    : 'JetBrains Mono' (지표 숫자, 코드성 데이터)
   Signature
     대시보드 상단의 "무재해 카운터" 게시판 — 공장 정문에 걸린
     'ㅇㅇㅇ일 무재해' 안내판을 웹 UI로 옮긴 히어로 스탯 패널.
========================================================================== */
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap');

:root{
  --navy-900:#101B33;
  --navy-800:#152648;
  --navy-700:#1C2E52;
  --paper:#F4F6F8;
  --card:#FFFFFF;
  --line:#E2E6EC;
  --ink:#14192B;
  --ink-soft:#667085;
  --ink-faint:#98A2B3;
  --safety:#FF6A13;
  --safety-dim:#FFE8D6;
  --caution:#FFC93C;
  --caution-dim:#FFF6DA;
  --ok:#1DA46F;
  --ok-dim:#DDF3E9;
  --danger:#E5484D;
  --danger-dim:#FCE3E4;
  --info:#2D7DD2;
  --info-dim:#E1EDFB;
  --radius:10px;
  --shadow:0 1px 2px rgba(16,27,51,.04), 0 4px 16px rgba(16,27,51,.06);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:'Pretendard', system-ui, -apple-system, 'Malgun Gothic', sans-serif;
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  font-size:14.5px;
  line-height:1.5;
}
::selection{background:var(--safety-dim);}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:inherit;}

.mono{font-family:'JetBrains Mono', ui-monospace, monospace;}

/* ---------- App shell ---------- */
#app{display:flex;min-height:100vh;}

/* Sidebar */
.sidebar{
  width:236px;flex:0 0 236px;
  background:linear-gradient(180deg,var(--navy-900),var(--navy-800) 70%);
  color:#fff;
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
  z-index:20;
}
.brand{
  padding:22px 20px 16px;
  border-bottom:1px solid rgba(255,255,255,.08);
  display:flex;align-items:flex-start;gap:11px;
}
.brand-logo{
  flex:0 0 44px;width:44px;height:44px;border-radius:10px;
  background:#fff;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 10px rgba(0,0,0,.25);
  padding:5px;
}
.brand-logo img{width:100%;height:100%;object-fit:contain;}
.brand-text{min-width:0;}
.brand .tag{
  display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.08em;
  color:var(--safety);background:rgba(255,106,19,.14);
  padding:3px 7px;border-radius:5px;margin-bottom:8px;
}
.brand h1{font-size:16.5px;margin:0 0 2px;font-weight:800;letter-spacing:-.01em;}
.brand p{margin:0;font-size:11.5px;color:#8C99B8;}

.nav{flex:1;padding:14px 10px;overflow-y:auto;}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:8px;margin-bottom:2px;
  color:#B7C0D6;font-size:13.5px;font-weight:600;
  border:none;background:none;width:100%;text-align:left;
  transition:background .12s, color .12s;
}
.nav-item svg{flex:0 0 18px;width:18px;height:18px;opacity:.85;}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:var(--safety);color:#fff;}
.nav-item.active svg{opacity:1;}
.nav-badge{
  margin-left:auto;font-size:10.5px;font-weight:700;
  background:rgba(255,255,255,.14);padding:1px 7px;border-radius:20px;
  font-family:'JetBrains Mono',monospace;
}
.nav-item.active .nav-badge{background:rgba(255,255,255,.28);}
.nav-dot{
  width:8px;height:8px;border-radius:50%;background:var(--danger);
  display:inline-block;margin-left:6px;flex:0 0 8px;
  box-shadow:0 0 0 3px rgba(229,72,77,.28);
  animation:new-pulse 1.8s ease-in-out infinite;
}

.sidebar-foot{
  padding:14px 18px 18px;border-top:1px solid rgba(255,255,255,.08);
  font-size:11px;color:#7686A8;
}
.mode-pill{
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(255,255,255,.06);border-radius:8px;padding:8px 10px;margin-bottom:10px;
}
.mode-pill span{font-size:12px;font-weight:700;color:#D6DCEA;}
.mode-btn{
  border:1px solid rgba(255,255,255,.18);background:transparent;color:#fff;
  font-size:11px;font-weight:700;padding:4px 9px;border-radius:6px;
}
.mode-btn.on{background:var(--ok);border-color:var(--ok);}

/* Main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  position:sticky;top:0;z-index:10;
  background:rgba(244,246,248,.9);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);
  padding:18px 32px;display:flex;align-items:center;justify-content:space-between;
}
.topbar h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.01em;}
.topbar .sub{margin:2px 0 0;font-size:12.5px;color:var(--ink-soft);}
.topbar-right{display:flex;align-items:center;gap:10px;}
.today-chip{
  font-size:12px;color:var(--ink-soft);background:#fff;border:1px solid var(--line);
  padding:6px 12px;border-radius:20px;font-family:'JetBrains Mono',monospace;font-weight:600;
}

.view{padding:18px 32px 40px;}
.view[hidden]{display:none;}

/* ---------- Buttons / inputs ---------- */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--line);background:#fff;color:var(--ink);
  font-size:13px;font-weight:700;padding:9px 15px;border-radius:8px;
  transition:all .12s;white-space:nowrap;
}
[hidden]{display:none !important;}
.btn:hover{border-color:#C7CFDC;background:#FAFBFC;}
.btn-primary{background:var(--safety);border-color:var(--safety);color:#fff;}
.btn-primary:hover{background:#E85E0E;border-color:#E85E0E;}
.btn-ghost{border-color:transparent;background:transparent;}
.btn-ghost:hover{background:#EEF1F5;}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:7px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.rte-toolbar .btn.active{border:2px solid var(--safety);background:var(--safety-dim);padding:5px 10px;}

.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:6px;}
.field .hint{font-size:11.5px;color:var(--ink-faint);font-weight:500;margin-top:4px;}
.field input[type=text],.field input[type=date],.field input[type=time],
.field input[type=tel],.field select,.field textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;
  font-size:13.5px;color:var(--ink);background:#fff;
}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none;border-color:var(--safety);box-shadow:0 0 0 3px var(--safety-dim);
}
.field textarea{resize:vertical;min-height:70px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
@media(max-width:720px){.row2,.row3{grid-template-columns:1fr;}}

/* ---------- Cards / KPI ---------- */
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
@media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);}}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.kpi{padding:12px 14px 11px;border-left:4px solid var(--info);}
.kpi.c-safety{border-left-color:var(--safety);}
.kpi.c-ok{border-left-color:var(--ok);}
.kpi.c-danger{border-left-color:var(--danger);}
.kpi.c-caution{border-left-color:var(--caution);}
.kpi .k-label{font-size:11.5px;font-weight:700;color:var(--ink-soft);display:flex;align-items:center;gap:6px;}
.kpi .k-num{font-family:'JetBrains Mono',monospace;font-size:23px;font-weight:700;margin:4px 0 1px;letter-spacing:-.01em;}
.kpi .k-sub{font-size:11px;color:var(--ink-faint);}

/* Signature: 무재해 카운터 보드 */
.zeroboard{
  background:radial-gradient(120% 140% at 0% 0%, var(--navy-800), var(--navy-900) 65%);
  border-radius:14px;color:#fff;padding:26px 30px;display:flex;align-items:center;
  justify-content:space-between;gap:24px;box-shadow:var(--shadow);position:relative;overflow:hidden;
  margin-bottom:20px;
}
.zeroboard:before{
  content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(135deg, rgba(255,255,255,.025) 0 2px, transparent 2px 14px);
  pointer-events:none;
}
.zb-left .zb-eyebrow{
  font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--caution);
  display:flex;align-items:center;gap:7px;margin-bottom:10px;
}
.zb-eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(29,164,111,.25);}
.zb-num{
  font-family:'JetBrains Mono',monospace;font-size:64px;font-weight:700;line-height:1;
  letter-spacing:-.02em;
}
.zb-num span{font-size:22px;font-weight:700;margin-left:8px;color:#B7C0D6;}
.zb-desc{font-size:13px;color:#AEB9D2;margin-top:8px;max-width:360px;}
.zb-right{display:flex;gap:26px;position:relative;z-index:1;}
.zb-stat{text-align:right;}
.zb-stat .n{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:700;}
.zb-stat .l{font-size:11px;color:#8C99B8;margin-top:2px;}
@media(max-width:820px){.zeroboard{flex-direction:column;align-items:flex-start;}.zb-right{align-self:stretch;justify-content:space-between;}}

.dash-header{
  display:flex;align-items:center;gap:12px;margin-bottom:10px;cursor:default;
}
.dash-header .dh-logo{
  flex:0 0 40px;width:40px;height:40px;border-radius:10px;
  background:#fff;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow);padding:5px;
}
.dash-header .dh-logo img{width:100%;height:100%;object-fit:contain;}
.dash-header h1{
  margin:0;font-size:17px;font-weight:800;letter-spacing:-.01em;color:var(--ink);
}
.dash-header p{margin:1px 0 0;font-size:11.5px;color:var(--ink-soft);font-weight:600;}

.section-title{font-size:15px;font-weight:800;margin:26px 0 12px;display:flex;align-items:center;gap:8px;}
.section-title .n{color:var(--ink-faint);font-weight:700;font-size:12px;}

/* Two column dashboard lower section */
.dash-lower{display:grid;grid-template-columns:1.3fr 1fr;gap:12px;margin-top:10px;}
@media(max-width:980px){.dash-lower{grid-template-columns:1fr;}}
.dash-charts{display:grid;grid-template-columns:1.6fr 1fr;gap:12px;margin-bottom:10px;}
@media(max-width:980px){.dash-charts{grid-template-columns:1fr;}}

.list-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
.list-card .lc-head{padding:9px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
.list-card .lc-head h3{margin:0;font-size:12.5px;font-weight:800;}
.lc-body{max-height:170px;overflow-y:auto;}
.mini-row{padding:7px 14px;border-bottom:1px solid #EEF1F5;display:flex;align-items:center;gap:10px;font-size:12px;}
.mini-row:last-child{border-bottom:none;}
.mini-row .mr-title{flex:1;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mini-row .mr-meta{font-size:11px;color:var(--ink-faint);font-family:'JetBrains Mono',monospace;}
.empty{padding:30px 18px;text-align:center;color:var(--ink-faint);font-size:13px;}
.empty .big{font-size:26px;display:block;margin-bottom:6px;}

/* ---------- Badges ---------- */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap;}
.badge-new{
  display:inline-flex;align-items:center;padding:2px 7px;border-radius:5px;
  font-size:10px;font-weight:800;letter-spacing:.03em;color:#fff;background:var(--danger);
  vertical-align:middle;margin-right:2px;animation:new-pulse 1.8s ease-in-out infinite;
}
@keyframes new-pulse{0%,100%{opacity:1;}50%{opacity:.55;}}
.b-gray{background:#EEF1F5;color:#4B5468;}
.b-info{background:var(--info-dim);color:var(--info);}
.b-caution{background:var(--caution-dim);color:#946200;}
.b-ok{background:var(--ok-dim);color:var(--ok);}
.b-danger{background:var(--danger-dim);color:var(--danger);}
.b-safety{background:var(--safety-dim);color:#B24A00;}
.b-caution2{background:#FFE7C7;color:#9A4B00;}

/* ---------- Toolbar / filter tabs ---------- */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.tabs{display:flex;gap:6px;flex-wrap:wrap;}
.tab{
  border:1px solid var(--line);background:#fff;color:var(--ink-soft);
  font-size:12.5px;font-weight:700;padding:7px 13px;border-radius:20px;
}
.tab.active{background:var(--navy-900);border-color:var(--navy-900);color:#fff;}

/* ---------- 사고 정식보고서: 체크리스트 토글 ---------- */
.rpt-cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 20px;margin-bottom:16px;}
@media(max-width:640px){.rpt-cat-grid{grid-template-columns:1fr;}}
.rpt-cat-col{border:1px solid var(--line);border-radius:10px;padding:12px 14px;}
.rpt-cat-title{font-weight:800;font-size:14px;margin-bottom:8px;}
.rpt-chk-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);}
.rpt-chk-row:last-child{border-bottom:none;}
.rpt-chk-label{font-size:13px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rpt-chk-btns{display:flex;gap:4px;flex-shrink:0;}
.rpt-chk-btn{width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:6px;font-size:12px;font-weight:700;color:var(--ink-soft);cursor:pointer;padding:0;}
.rpt-chk-btn.active{background:var(--navy-900);border-color:var(--navy-900);color:#fff;}
.rpt-chk-btn.active[data-val="X"]{background:var(--danger);border-color:var(--danger);}
.rpt-chk-btn.active[data-val="△"]{background:var(--safety);border-color:var(--safety);}
.bullet-list{display:flex;flex-direction:column;gap:6px;}
.bullet-line-row{display:flex;align-items:center;gap:6px;}
.bullet-dot{color:var(--ink-soft);font-size:13px;flex-shrink:0;}
.bullet-line-input{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;}
.bullet-remove{flex-shrink:0;width:26px;height:26px;border:1px solid var(--line);background:#fff;border-radius:6px;color:var(--ink-soft);cursor:pointer;}
.bullet-remove:hover{color:var(--danger);border-color:var(--danger);}
.searchbox{
  display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);
  border-radius:8px;padding:0 12px;min-width:220px;
}
.searchbox input{border:none;padding:8px 0;font-size:13px;flex:1;background:transparent;}
.searchbox input:focus{outline:none;}

/* ---------- Table ---------- */
.table-wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow-x:auto;-webkit-overflow-scrolling:touch;}
.table-wrap table{min-width:640px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{
  text-align:left;font-size:11.5px;font-weight:800;color:var(--ink-soft);
  text-transform:uppercase;letter-spacing:.03em;
  padding:11px 16px;border-bottom:1px solid var(--line);background:#FAFBFC;white-space:nowrap;
}
tbody td{padding:12px 16px;border-bottom:1px solid #EEF1F5;color:var(--ink);vertical-align:middle;white-space:nowrap;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#FAFBFC;}
td.tight,th.tight{width:1%;white-space:nowrap;}
.row-btns{display:flex;gap:6px;}
.cell-strong{font-weight:700;}
.cell-sub{font-size:11.5px;color:var(--ink-faint);margin-top:2px;}

/* ---------- Modal ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(16,27,51,.5);backdrop-filter:blur(1px);
  display:flex;align-items:flex-start;justify-content:center;padding:5vh 20px;z-index:250;overflow-y:auto;
}
.overlay[hidden]{display:none;}
.modal{
  background:#fff;border-radius:14px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(16,27,51,.25);
  animation:pop .14s ease-out;
}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.99)}to{opacity:1;transform:none}}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
.modal-head h3{margin:0;font-size:16px;font-weight:800;}
.modal-body{padding:20px 22px;max-height:70vh;overflow-y:auto;}
.modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;}
.x-btn{border:none;background:#F1F3F6;width:30px;height:30px;border-radius:8px;font-size:15px;color:var(--ink-soft);}

/* ---------- Detail drawer content ---------- */
.detail-grid{display:grid;grid-template-columns:120px 1fr;row-gap:10px;font-size:13.5px;}
.detail-grid dt{color:var(--ink-soft);font-weight:700;}
.detail-grid dd{margin:0;}
.divider{height:1px;background:var(--line);margin:16px 0;}

/* ---------- Notice board ---------- */
.notice-item{border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:10px;background:#fff;}
.notice-item.pinned{border-color:var(--safety);background:linear-gradient(0deg,#fff,var(--safety-dim) 400%);}
.notice-item h4{margin:0 0 6px;font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:8px;}
.notice-item p{margin:0;font-size:13px;color:var(--ink-soft);white-space:pre-wrap;}
.notice-content{margin:0;font-size:13px;color:var(--ink-soft);line-height:1.6;word-break:break-word;}
.notice-content b,.notice-content strong{color:var(--ink);}
.notice-meta{font-size:11.5px;color:var(--ink-faint);margin-top:8px;font-family:'JetBrains Mono',monospace;}

.contact-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
@media(max-width:900px){.contact-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:600px){.contact-grid{grid-template-columns:1fr;}}
.contact-card{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:#fff;}
.contact-card .c-role{font-size:11px;font-weight:800;color:var(--safety);letter-spacing:.03em;}
.contact-card .c-name{font-size:14.5px;font-weight:800;margin:4px 0 2px;}
.contact-card .c-phone{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--ink-soft);}

/* ---------- Risk matrix chip ---------- */
.risk-chip{
  display:inline-flex;align-items:center;justify-content:center;
  width:34px;height:26px;border-radius:6px;font-weight:800;font-size:12.5px;
  font-family:'JetBrains Mono',monospace;color:#fff;
}
.risk-level-badge{
  display:inline-flex;flex-direction:column;align-items:center;justify-content:center;
  min-width:50px;padding:3px 5px;border-radius:8px;color:#fff;line-height:1.15;
}
.risk-level-badge .rlb-score{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:800;}
.risk-level-badge .rlb-action{font-size:9px;font-weight:700;white-space:nowrap;}
.risk-1{background:var(--ok);}
.risk-2{background:#2D7DD2;}
.risk-3{background:var(--caution);color:#5C4400;}
.risk-4{background:var(--safety);}
.risk-5{background:#E8590C;}
.risk-6{background:var(--danger);}
.risk-legend{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 16px;padding:14px 16px;background:#F7F8FA;border:1px solid var(--line);border-radius:10px;margin-bottom:14px;}
@media(max-width:620px){.risk-legend{grid-template-columns:1fr;}}
.risk-legend-item{display:flex;align-items:flex-start;gap:10px;font-size:12.5px;}
.risk-legend-item b{font-size:12.5px;}
.lightbox-overlay{
  position:fixed;inset:0;background:rgba(10,14,26,.88);z-index:500;
  display:flex;align-items:center;justify-content:center;padding:24px;cursor:zoom-out;
  animation:lightbox-fade .12s ease-out;
}
@keyframes lightbox-fade{from{opacity:0;}to{opacity:1;}}
.lightbox-overlay img{max-width:100%;max-height:100%;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
.lightbox-close{
  position:fixed;top:20px;right:24px;width:40px;height:40px;border-radius:50%;
  background:rgba(255,255,255,.15);color:#fff;border:none;font-size:18px;cursor:pointer;
}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;}
.gallery-card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);}
.gc-photos{display:grid;grid-template-columns:1fr 1fr;}
.gc-photo{position:relative;aspect-ratio:1/1;background:#EEF1F5;}
.gc-photo img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;display:block;}
.gc-noimg{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-size:11px;}
.gc-tag{position:absolute;bottom:6px;left:6px;background:rgba(20,25,43,.72);color:#fff;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px;}
.gc-body{padding:12px 14px;}
.gc-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px;}
.gc-hazard{font-size:12.5px;color:var(--ink-soft);margin-bottom:8px;line-height:1.5;}
.gc-score{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:800;color:var(--ink);}

/* ---------- Login gate ---------- */
.gate{
  position:fixed;inset:0;background:var(--navy-900);display:flex;align-items:center;justify-content:center;z-index:200;
}
.gate-card{background:#fff;border-radius:16px;padding:36px 34px;width:100%;max-width:360px;box-shadow:0 30px 80px rgba(0,0,0,.4);}
.gate-card .tag{
  display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.08em;color:var(--safety);
  background:var(--safety-dim);padding:3px 8px;border-radius:5px;margin-bottom:10px;
}
.gate-card h2{margin:0 0 4px;font-size:19px;font-weight:800;}
.gate-card p{margin:0 0 20px;font-size:12.5px;color:var(--ink-soft);}
.lang-picker{display:flex;flex-wrap:wrap;gap:7px;}
.lang-btn{
  display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:9px;
  border:1.5px solid var(--line);background:#fff;font-size:12.5px;font-weight:700;color:var(--ink);
}
.lang-btn .flag{font-size:16px;line-height:1;}
.lang-btn.active{border-color:var(--safety);background:var(--safety-dim);color:#B24A00;}
.gate-actions{display:flex;gap:8px;margin-top:6px;}
.gate-actions .btn{flex:1;justify-content:center;}

/* ---------- Toast ---------- */
#toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--navy-900);color:#fff;padding:12px 20px;border-radius:9px;font-size:13px;font-weight:600;
  box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:all .2s;z-index:300;
  display:flex;align-items:center;gap:8px;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#toast .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);}

/* ---------- Scrollbar ---------- */
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#CBD3DF;border-radius:20px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- Config banner ---------- */
.config-banner{
  background:var(--caution-dim);border:1px solid #F0D26B;color:#7A5B00;
  padding:10px 16px;border-radius:9px;font-size:12.5px;margin-bottom:18px;
  display:flex;align-items:center;gap:8px;font-weight:600;
}

/* ---------- Mobile ---------- */
.hamburger{display:none;}
.sidebar-close{display:none;}
.sidebar-backdrop{display:none;}
@media(max-width:880px){
  .sidebar{position:fixed;left:-260px;top:0;transition:left .18s;box-shadow:0 0 40px rgba(0,0,0,.3);z-index:150;}
  .sidebar.open{left:0;}
  .sidebar-close{
    display:flex;align-items:center;justify-content:center;
    position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;
    background:rgba(255,255,255,.12);color:#fff;border:none;font-size:15px;cursor:pointer;z-index:2;
  }
  .sidebar-backdrop{
    display:block;position:fixed;inset:0;background:rgba(10,14,26,.5);z-index:140;
    opacity:0;pointer-events:none;transition:opacity .18s;
  }
  .sidebar-backdrop.open{opacity:1;pointer-events:auto;}
  .hamburger{display:flex;border:1px solid var(--line);background:#fff;border-radius:8px;width:36px;height:36px;align-items:center;justify-content:center;}
  .topbar{padding:14px 16px;}
  .view{padding:18px 16px 50px;}
  .grid-4{grid-template-columns:1fr 1fr;}
  .dash-charts{grid-template-columns:1fr;}
}
@media(max-width:620px){
  html,body{overflow-x:hidden;}
  .grid-4{grid-template-columns:1fr;}
  .modal{max-width:100%;border-radius:12px;}
  .overlay{padding:0;align-items:flex-end;}
  .modal-body{max-height:75vh;}
  .toolbar{flex-direction:column;align-items:stretch;}
  .tabs{overflow-x:auto;padding-bottom:2px;}
  .searchbox{width:100%;}
  .contact-grid{grid-template-columns:1fr;}
  .detail-grid{grid-template-columns:100px 1fr;font-size:12.5px;}
  .dash-header h1{font-size:16px;}
  .kpi .k-num{font-size:22px;}
  .dash-charts > .list-card > div[style*="height:130px"]{height:128px;}
  .zb-num{font-size:34px;}
  .zb-right{gap:14px;flex-wrap:wrap;}
  .list-card canvas{max-width:100%;}
  .modal-foot{flex-direction:column-reverse;align-items:stretch;}
  .modal-foot .btn{justify-content:center;width:100%;}
}
</style>
</head>

<!-- =========================================================
   로그인 게이트 (모드 선택: 관리자 / 일반 열람)
========================================================== -->
<div class="gate" id="gate">
  <div class="gate-card">
    <span class="tag" data-i18n="gate_tag">ILSHIN CASTING · SAFETY</span>
    <h2 data-i18n="gate_title">통합 안전관리 시스템</h2>
    <p data-i18n="gate_desc">안전환경부 · 사고예방 및 현장관리 통합 플랫폼</p>
    <div class="field">
      <label data-i18n="gate_lang_label">언어 선택</label>
      <div class="lang-picker" id="langPicker">
        <button type="button" class="lang-btn" data-lang="ko"><span class="flag">🇰🇷</span><span>한국어</span></button>
        <button type="button" class="lang-btn" data-lang="en"><span class="flag">🇺🇸</span><span>English</span></button>
        <button type="button" class="lang-btn" data-lang="th"><span class="flag">🇹🇭</span><span>ไทย</span></button>
        <button type="button" class="lang-btn" data-lang="id"><span class="flag">🇮🇩</span><span>Indonesia</span></button>
        <button type="button" class="lang-btn" data-lang="mn"><span class="flag">🇲🇳</span><span>Монгол</span></button>
      </div>
    </div>
    <div class="field">
      <label data-i18n="gate_mode_label">접속 모드</label>
      <select id="gateMode">
        <option value="user" data-i18n="gate_mode_user">일반 열람 (조회 · 신청 · 제보)</option>
        <option value="admin" data-i18n="gate_mode_admin">관리자</option>
      </select>
    </div>
    <div class="field" id="gatePwWrap" hidden>
      <label data-i18n="gate_role_label">역할 선택</label>
      <select id="gateRole" style="margin-bottom:10px;">
        <option value="admin" data-i18n="mode_label_admin">전체관리자</option>
        <option value="관리부">관리부 관리자</option>
        <option value="생산부">생산부 관리자</option>
        <option value="품질관리부">품질관리부 관리자</option>
      </select>
      <label data-i18n="gate_pw_label">비밀번호</label>
      <input type="text" id="gatePw" placeholder="비밀번호 입력" data-i18n-placeholder="gate_pw_placeholder">
      <p class="hint" data-i18n="gate_pw_hint">선택한 역할의 비밀번호를 입력하세요.</p>
      <label style="display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;font-weight:600;color:var(--ink-soft);">
        <input type="checkbox" id="gateRemember"> 이 기기에서 로그인 상태 유지 (다음부터 비밀번호 없이 접속)
      </label>
    </div>
    <div class="gate-actions">
      <button class="btn btn-primary" id="gateEnter" style="flex:1" data-i18n="gate_enter">입장하기</button>
    </div>
    <button class="btn btn-sm" id="gateInstallBtn" style="width:100%;margin-top:8px;display:none;"></button>
  </div>
</div>

/* ============================================================

============================================================= */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyApm6yQhoaoKhkV9k3QNm2hTMjwP6NsNf4",

};
const CONFIG_IS_PLACEHOLDER = FIREBASE_CONFIG.apiKey === "YOUR_API_KEY";

// 사진·첨부파일은 Firebase가 아니라 Cloudinary(무료, 카드 등록 불필요)에 올리고,
// Firebase 데이터베이스에는 결과로 받은 짧은 링크(URL)만 저장한다.
const CLOUDINARY_CLOUD_NAME = 'mv6gjqjn';
const CLOUDINARY_UPLOAD_PRESET = 'ilshin-safety';

let db = null;
let authReady = Promise.resolve();
if(!CONFIG_IS_PLACEHOLDER){
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.database();
  // 이미 로그인된 세션(전체관리자·부서관리자 계정)이 있으면 그대로 두고,
  // 아무 세션도 없을 때만 "익명 출입증"을 새로 발급한다.
  // (무조건 익명 로그인을 하면, 새로고침 시 살아있던 관리자 세션이 덮어써지는 문제가 생김)
  authReady = new Promise((resolve)=>{
    const unsub = firebase.auth().onAuthStateChanged(user=>{
      unsub();
      if(user){ resolve(); return; }
      firebase.auth().signInAnonymously().then(resolve).catch(err=>{
        console.warn('익명 인증 실패 (Firebase 콘솔에서 익명 로그인이 켜져있는지 확인 필요):', err);

// 사진·첨부파일 업로드 공용 함수 — Cloudinary에 올리고 접근 가능한 URL을 돌려받는다.
// Cloudinary 설정이 비어있는 경우(데모 등)에는 예전처럼 base64로 폴백한다.
async function uploadFileToStorage(file, folder){
  if(!CLOUDINARY_CLOUD_NAME || !CLOUDINARY_UPLOAD_PRESET){
    return await new Promise((resolve, reject)=>{
      const r = new FileReader();
      r.onload = ()=> resolve(r.result);
      r.onerror = reject;
      r.readAsDataURL(file);
    });
  }
  const formData = new FormData();
  formData.append('file', file);
  formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
  formData.append('folder', folder || 'uploads');
  const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`, {
    method: 'POST',
    body: formData,
  });
  if(!res.ok){
    const errText = await res.text().catch(()=>'');
    throw new Error('Cloudinary 업로드 실패: ' + errText);
  }
  const json = await res.json();
  return json.secure_url;
}

/* 로컬 폴백 저장소 (Firebase 설정 전 데모/오프라인용) ------------- */
const LocalStore = {
  read(path){ try{return JSON.parse(localStorage.getItem('isc_'+path))||{}}catch(e){return {}} },
  write(path,val){ localStorage.setItem('isc_'+path, JSON.stringify(val)); }
};

/* ============================================================

============================================================= */
const DataStore = {
  _cache:{},
  _listeners:{},

  listen(path, cb){
    this._listeners[path] = this._listeners[path]||[];
    this._listeners[path].push(cb);
    if(db){
      db.ref(path).on('value', snap=>{
        const val = snap.val() || {};
        this._cache[path] = val;
        this._listeners[path].forEach(fn=>fn(val));
      });
    }else{
      const val = LocalStore.read(path);
      this._cache[path] = val;
      cb(val);
    }
  },
  async push(path, data){
    const id = 'id_' + Date.now() + '_' + Math.floor(Math.random()*1000);
    if(db){
      await db.ref(path+'/'+id).set(data);
    }else{
      const val = LocalStore.read(path);
      val[id] = data;
      LocalStore.write(path, val);
      this._cache[path] = val;
      (this._listeners[path]||[]).forEach(fn=>fn(val));
    }
    return id;
  },
  async update(path, id, data){
    if(db){
      await db.ref(path+'/'+id).update(data);
    }else{
      const val = LocalStore.read(path);
      val[id] = Object.assign({}, val[id], data);
      LocalStore.write(path, val);
      this._cache[path] = val;
      (this._listeners[path]||[]).forEach(fn=>fn(val));
    }
  },
  async remove(path, id){
    if(db){
      await db.ref(path+'/'+id).remove();
    }else{
      const val = LocalStore.read(path);
      delete val[id];
      LocalStore.write(path, val);
      this._cache[path] = val;
      (this._listeners[path]||[]).forEach(fn=>fn(val));
    }
  },
  get(path){ return this._cache[path] || {}; }
};

function photoFieldHtml(id, existingSrc, hintHtml){
  return `
    <input type="file" accept="image/*" id="${id}" style="display:none">
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button type="button" class="btn btn-sm" id="${id}_pick">📁 ${t('photo_pick_btn')}</button>
      ${isMobileDevice ? `<button type="button" class="btn btn-sm" id="${id}_cam">📷 ${t('photo_camera_btn')}</button>` : ''}
    </div>
    <div id="${id}_preview" style="margin-top:8px;">${existingSrc?`<img src="${existingSrc}" style="width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line);">`:''}</div>
    ${hintHtml||''}
  `;
}
function bindPhotoField(id, folder){
  const input = document.getElementById(id);
  const pickBtn = document.getElementById(id+'_pick');
  const camBtn = document.getElementById(id+'_cam');
  const preview = document.getElementById(id+'_preview');
  pickBtn.addEventListener('click', ()=>{ input.removeAttribute('capture'); input.click(); });
  if(camBtn){
    camBtn.addEventListener('click', ()=>{ input.setAttribute('capture','environment'); input.click(); });
  }
  input.addEventListener('change', async ()=>{
    const f = input.files[0];
    if(f){
      const localUrl = URL.createObjectURL(f);
      preview.innerHTML = `<img src="${localUrl}" style="width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line);opacity:.6;"><span class="hint">업로드 중…</span>`;
      try{
        const uploadedUrl = await uploadFileToStorage(f, folder||'uploads');
        input.dataset.uploadedUrl = uploadedUrl;
        preview.innerHTML = `<img src="${uploadedUrl}" style="width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line);">`;
      }catch(err){
        console.error('사진 업로드 실패:', err);
        toast('사진 업로드에 실패했습니다');
        preview.innerHTML = '';
      }
    }
  });
}

// 각 메뉴(뷰)를 열 때 실제로 필요한 데이터 경로 매핑 — 방문한 메뉴의 경로만 그때 구독해서
// 앱을 켤 때마다 전체 데이터를 통째로 받아오지 않도록 한다 (Firebase 무료 다운로드 한도 절약).
// 사이드바 NEW 표시는 대시보드가 이미 구독한 경로(permits/risks/incidents/notices/contractors)에서만
// 즉시 보이고, 나머지는 해당 메뉴를 한 번 열어야 그 뒤로 표시된다 — 트래픽 절약을 위한 의도된 트레이드오프.
const VIEW_PATHS = {
  dashboard: [PATHS.permits, PATHS.risks, PATHS.incidents, PATHS.notices, PATHS.contractors],
  permits: [PATHS.permits, PATHS.permitPartners],
  risks: [PATHS.risks],
  incidents: [PATHS.incidents, PATHS.nearMiss],
  contractors: [PATHS.contractors, PATHS.contractorRecords],
  tbm: [PATHS.tbm],
  notices: [PATHS.notices, PATHS.contacts],
  suggestions: [PATHS.suggestions],
  bugs: [PATHS.bugReports],
};
const subscribedPaths = new Set();
/* ============================================================
   브라우저 알림(데스크톱 팝업) + 앱 아이콘 배지
   - 사고접수 · 아차사고 · 작업허가 · 위험성평가 4곳에 새 항목이 등록되면
     (1) 앱/탭이 켜져 있으면 화면에 알림 팝업, (2) 사이드바 NEW 총개수를 앱 아이콘 배지로 표시
   - 앱을 완전히 꺼두면 동작하지 않음(브라우저 푸시 인프라 없이 가능한 범위)
============================================================= */
const NOTIFY_PATHS = { }; // path -> 표시용 라벨키/아이콘
NOTIFY_PATHS[PATHS.incidents] = { labelKey:'nav_incidents', icon:'🚨' };
NOTIFY_PATHS[PATHS.nearMiss] = { labelKey:'nm_tab_label_short', icon:'⚠️' };
NOTIFY_PATHS[PATHS.permits] = { labelKey:'permit_label_short', icon:'📋' };
NOTIFY_PATHS[PATHS.risks] = { labelKey:'risk_label_short', icon:'🔺' };

const knownIds = {}; // path -> Set(id) — 알림 중복 방지를 위해 이미 알고 있던 항목 기록
const NOTIFY_PREF_KEY = 'isc_notify_enabled';
function notifyEnabled(){ return localStorage.getItem(NOTIFY_PREF_KEY)==='1' && typeof Notification!=='undefined' && Notification.permission==='granted'; }

// 실제 알림을 화면에 띄우는 공용 함수 — 서비스워커가 있으면 그쪽을 우선 사용한다.
// (안드로이드 크롬 등 일부 브라우저는 서비스워커가 등록된 사이트에서 new Notification()을
//  직접 호출하면 조용히 무시하고, 반드시 registration.showNotification()을 써야 뜬다)
async function showAppNotification(title, options){
  if('serviceWorker' in navigator){
    try{
      const reg = await navigator.serviceWorker.ready;
      if(reg && reg.showNotification){
        await reg.showNotification(title, options);
        return true;
      }
    }catch(e){ console.warn('서비스워커 알림 실패, 대체 방식 시도:', e); }
  }
  try{
    new Notification(title, options);
    return true;
  }catch(e){
    console.warn('Notification 생성자도 실패:', e);
    return false;
  }
}

function checkNewItemsForNotify(path, val){
  if(!NOTIFY_PATHS[path]) return;
  const ids = Object.keys(val||{});
  if(!knownIds[path]){
    // 최초 구독 시점 — 지금 있는 것들은 "기존 것"으로만 기록, 알림은 안 띄움
    knownIds[path] = new Set(ids);
    return;
  }
  const fresh = ids.filter(id => !knownIds[path].has(id));
  ids.forEach(id => knownIds[path].add(id));
  if(!fresh.length || !notifyEnabled()) return;
  const meta = NOTIFY_PATHS[path];
  const label = t(meta.labelKey);
  fresh.forEach(id=>{
    const item = val[id];
    const desc = item.description || item.title || item.workContent || item.hazard || '';
    showAppNotification(`${meta.icon} ${t('notify_new_item').replace('{label}', label)}`, {
      body: desc ? String(desc).slice(0,60) : t('notify_body_default'),
      tag: path+'_'+id,
    });
  });
}

function updateAppBadge(){
  if(!('setAppBadge' in navigator)) return;
  let total = 0;
  Object.values(NOTIFY_PATHS).forEach(()=>{}); // no-op, kept for clarity
  [PATHS.incidents, PATHS.nearMiss, PATHS.permits, PATHS.risks].forEach(path=>{
    const arr = objToArr(DataStore.get(path));
    total += arr.filter(item => isItemNew(item, path)).length;
  });
  if(total>0) navigator.setAppBadge(total).catch(()=>{});
  else if('clearAppBadge' in navigator) navigator.clearAppBadge().catch(()=>{});
}

async function toggleNotify(){
  if(notifyEnabled()){
    localStorage.setItem(NOTIFY_PREF_KEY, '0');
    toast(t('toast_notify_off'));
    updateNotifyBtnUI();
    return;
  }
  if(typeof Notification==='undefined'){ toast(t('toast_notify_unsupported')); return; }
  const perm = await Notification.requestPermission();
  if(perm==='granted'){
    localStorage.setItem(NOTIFY_PREF_KEY, '1');
    toast(t('toast_notify_on'));
    if(State.mode!=='admin') ensurePathsSubscribed(Object.keys(NOTIFY_PATHS));
  }else{
    toast(t('toast_notify_denied'));
  }
  updateNotifyBtnUI();
}
function updateNotifyBtnUI(){
  const btn = document.getElementById('notifyToggleBtn');
  if(!btn) return;
  btn.textContent = notifyEnabled() ? t('notify_btn_on') : t('notify_btn_off');
  const testBtn = document.getElementById('notifyTestBtn');
  if(testBtn){
    testBtn.hidden = !notifyEnabled();
    testBtn.textContent = t('notify_test_btn');
  }
}
async function sendTestNotification(){
  const ok = await showAppNotification('🔔 '+t('notify_test_btn'), { body: new Date().toLocaleTimeString() });
  if(ok){
    toast(t('toast_notify_test_sent'));
  }else{
    toast(t('toast_notify_test_failed'));
  }
}

function ensurePathsSubscribed(paths){
  (paths||[]).forEach(path=>{
    if(!path || subscribedPaths.has(path)) return;
    subscribedPaths.add(path);
    DataStore.listen(path, (val)=>{
      checkNewItemsForNotify(path, val);
      renderNav();
      renderCurrentView();
      updateAppBadge();
      checkStaleEscalation(path, val);
    });
  });
}

function toast(msg){
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('show'), 2400);
}
function fmtDate(d){
  if(!d) return '-';
  const dt = new Date(d);
  if(isNaN(dt)) return d;
  return `${dt.getFullYear()}.${String(dt.getMonth()+1).padStart(2,'0')}.${String(dt.getDate()).padStart(2,'0')}`;
}
function fmtDateTime(d){
  if(!d) return '-';
  const dt = new Date(d);
  if(isNaN(dt)) return d;
  return `${fmtDate(d)} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
}
function daysBetween(a,b){
  return Math.floor((new Date(b) - new Date(a)) / 86400000);
}
function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function esc(s){
  return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderNav(){
  const nav = document.getElementById('navList');
  const items = State.mode==='partner' ? NAV_ITEMS.filter(i=>i.id==='permits')
    : State.mode==='dept' ? NAV_ITEMS.filter(i=> !['suggestions','bugs','tbm'].includes(i.id))

    : NAV_ITEMS; // 전체관리자는 TBM 포함 전체 메뉴
  nav.innerHTML = items.map(item=>{
    const count = navBadgeCount(item.id);
    const isNew = hasNewItems(item.id);
    return `<button class="nav-item ${State.view===item.id?'active':''}" data-view="${item.id}">
      ${icon(item.icon)}<span>${t(item.labelKey)}</span>${isNew?'<span class="nav-dot" title="새 항목 있음"></span>':''}
      ${count!=null?`<span class="nav-badge">${count}</span>`:''}
    </button>`;
  }).join('');
  nav.querySelectorAll('.nav-item').forEach(btn=>{
    btn.addEventListener('click', ()=> switchView(btn.dataset.view));
  });
}
function hasNewItems(viewId){
  if(viewId==='suggestions') return State.mode==='admin' && hasNewInList(objToArr(DataStore.get(PATHS.suggestions)), PATHS.suggestions);
  if(viewId==='bugs') return State.mode==='admin' && hasNewInList(objToArr(DataStore.get(PATHS.bugReports)), PATHS.bugReports);
  if(viewId==='permits' && State.mode==='partner'){
    const arr = objToArr(DataStore.get(PATHS.permits)).filter(p=>p.company===State.partnerCompany);
    return hasNewInList(arr, PATHS.permits);
  }
  const pathMap = {
    permits: [PATHS.permits],
    risks: [PATHS.risks],
    incidents: [PATHS.incidents, PATHS.nearMiss],
    contractors: [PATHS.contractorRecords],
    notices: [PATHS.notices],
  };
  const paths = pathMap[viewId];
  if(!paths) return false;
  return paths.some(path=> hasNewInList(objToArr(DataStore.get(path)), path));
}
function navBadgeCount(viewId){
  if(viewId==='permits'){
    let arr = objToArr(DataStore.get(PATHS.permits));
    if(State.mode==='partner') arr = arr.filter(p=>p.company===State.partnerCompany);
    const n = arr.filter(p=>p.status==='신청'||p.status==='검토중').length;
    return n>0 ? n : null;
  }
  if(viewId==='incidents'){
    const arr = objToArr(DataStore.get(PATHS.incidents));
    const n = arr.filter(i=>i.status!=='완료').length;
    return n>0 ? n : null;
  }
  if(viewId==='risks'){
    const arr = objToArr(DataStore.get(PATHS.risks));
    const n = arr.filter(r=>r.status!=='완료').length;
    return n>0 ? n : null;
  }
  return null;
}

// 저장공간·트래픽 대략 추정 (Firebase 콘솔의 정확한 수치를 대체하지는 않음 —
// 브라우저에서는 실제 사용량을 직접 조회할 수 없어, 등록된 데이터 기준으로 어림 계산만 제공)
function estimateUsage(){
  const allPaths = Object.values(PATHS);
  let recordCount = 0, textBytes = 0;
  allPaths.forEach(p=>{
    const arr = objToArr(DataStore.get(p));
    recordCount += arr.length;
    try{ textBytes += JSON.stringify(DataStore.get(p)||{}).length; }catch(e){}
  });
  let photoBytes = 0, photoCountKnown = 0, photoCountUnknown = 0;
  function addSize(v){ if(v==null) return; if(typeof v==='number'){ photoBytes+=v; photoCountKnown++; } }
  const risks = objToArr(DataStore.get(PATHS.risks));
  risks.forEach(r=>{
    if(r.photoBefore){ r.photoBeforeSize!=null ? addSize(r.photoBeforeSize) : photoCountUnknown++; }
    if(r.photoAfter){ r.photoAfterSize!=null ? addSize(r.photoAfterSize) : photoCountUnknown++; }
  });
  const incidents = objToArr(DataStore.get(PATHS.incidents));
  incidents.forEach(i=>{
    if(i.photo1){ i.photo1Size!=null ? addSize(i.photo1Size) : photoCountUnknown++; }
    if(i.photo2){ i.photo2Size!=null ? addSize(i.photo2Size) : photoCountUnknown++; }
  });
  const suggestions = objToArr(DataStore.get(PATHS.suggestions));
  suggestions.forEach(s=>{ if(s.photo){ s.photoSize!=null ? addSize(s.photoSize) : photoCountUnknown++; } });
  const bugs = objToArr(DataStore.get(PATHS.bugReports));
  bugs.forEach(b=>{ if(b.screenshot){ b.screenshotSize!=null ? addSize(b.screenshotSize) : photoCountUnknown++; } });
  const notices = objToArr(DataStore.get(PATHS.notices));
  notices.forEach(n=>{
    (n.files||[]).forEach(f=>{ f.fileSize!=null ? addSize(f.fileSize) : photoCountUnknown++; });
    if(!n.files && n.fileData){ photoCountUnknown++; }
  });
  return { recordCount, textBytes, photoBytes, photoCountKnown, photoCountUnknown };
}
function fmtBytes(n){
  if(n < 1024) return n+' B';
  if(n < 1024*1024) return (n/1024).toFixed(1)+' KB';
  if(n < 1024*1024*1024) return (n/1024/1024).toFixed(1)+' MB';
  return (n/1024/1024/1024).toFixed(2)+' GB';
}

async function runFullBackupExport(){
  if(!requireAdmin('전체 데이터 백업')) return;
  if(typeof PizZip==='undefined'){ toast('백업 도구를 불러오지 못했습니다'); return; }
  const btn = document.getElementById('backupExportBtn');
  const origText = btn.textContent;
  btn.disabled = true;
  try{
    const allData = {};
    Object.entries(PATHS).forEach(([key, path])=>{ allData[key] = DataStore.get(path) || {}; });
    const zip = new PizZip();
    zip.file('data.json', JSON.stringify(allData, null, 2));

    // 사진·파일 수집 (url이 data:로 시작하면 그대로, http(s)면 fetch해서 받아옴)
    const fileJobs = []; // {url, folder, name}
    function addJob(url, folder, name){ if(url) fileJobs.push({url, folder, name}); }
    Object.values(allData.risks||{}).forEach((r,idx)=>{
      addJob(r.photoBefore, 'risk_photos', `${idx}_before_${r.id||idx}`);
      addJob(r.photoAfter, 'risk_photos', `${idx}_after_${r.id||idx}`);
    });
    Object.entries(allData.incidents||{}).forEach(([id,i])=>{
      addJob(i.photo1, 'incident_photos', `${id}_photo1`);
      addJob(i.photo2, 'incident_photos', `${id}_photo2`);
    });
    Object.entries(allData.suggestions||{}).forEach(([id,s])=>{ addJob(s.photo, 'suggestion_photos', `${id}_photo`); });
    Object.entries(allData.bugReports||{}).forEach(([id,b])=>{ addJob(b.screenshot, 'bug_screenshots', `${id}_screenshot`); });
    Object.entries(allData.notices||{}).forEach(([id,n])=>{
      (n.files||[]).forEach((f,fi)=>{ addJob(f.fileData, 'notice_files', `${id}_${fi}_${f.fileName||'file'}`); });
    });

    btn.textContent = `⏳ 파일 수집 중... (0/${fileJobs.length})`;
    let done = 0;
    for(const job of fileJobs){
      try{
        let blob;
        if(job.url.startsWith('data:')){
          const res = await fetch(job.url);
          blob = await res.blob();
        }else{
          const res = await fetch(job.url);
          blob = await res.blob();
        }
        const ext = (blob.type && blob.type.split('/')[1]) ? '.'+blob.type.split('/')[1].replace('jpeg','jpg') : '';
        const safeName = job.name.replace(/[^\w.\-가-힣]/g,'_');
        const finalName = safeName.includes('.') ? safeName : safeName+ext;
        const buf = await blob.arrayBuffer();
        zip.file(`${job.folder}/${finalName}`, buf);
      }catch(err){
        console.warn('백업 중 파일 하나를 건너뜀:', job.url, err);
      }
      done++;
      btn.textContent = `⏳ 파일 수집 중... (${done}/${fileJobs.length})`;
    }

    btn.textContent = '⏳ 압축 파일 생성 중...';
    const out = zip.generate({ type:'blob' });
    const url = URL.createObjectURL(out);
    const a = document.createElement('a');
    a.href = url;
    a.download = `안전관리시스템_백업_${fmtDate(Date.now())}.zip`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=> URL.revokeObjectURL(url), 5000);
    toast('백업 파일 다운로드가 완료되었습니다');
  }catch(err){
    console.error('백업 오류:', err);
    alert('백업 중 오류가 발생했습니다.\n\n[오류 내용]\n' + (err&&err.message?err.message:String(err)));
  }finally{
    btn.disabled = false;
    btn.textContent = origText;
  }
}

let monthlyChartInstance = null;
let accidentTypeChartInstance = null;
const ACCIDENT_CHART_COLORS = ['#FF6A13','#2D7DD2','#FFC93C','#1DA46F','#E5484D','#8C99B8','#B24A00','#946200'];
function renderAccidentTypeChart(incidents){
  const canvas = document.getElementById('accidentTypeChart');
  if(!canvas || typeof Chart==='undefined') return;
  const counts = {};
  incidents.forEach(i=>{
    const label = i.accidentType==='기타(직접입력)' ? (i.accidentTypeOther||'기타') : (i.accidentType||'미분류');
    counts[label] = (counts[label]||0) + 1;
  });
  const labels = Object.keys(counts);
  const data = Object.values(counts);
  if(accidentTypeChartInstance){ accidentTypeChartInstance.destroy(); }
  if(labels.length===0){
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0,0,canvas.width,canvas.height);
    return;
  }
  accidentTypeChartInstance = new Chart(canvas.getContext('2d'), {
    type: 'doughnut',
    data: {
      labels,
      datasets: [{ data, backgroundColor: labels.map((_,i)=>ACCIDENT_CHART_COLORS[i%ACCIDENT_CHART_COLORS.length]), borderWidth:2, borderColor:'#fff' }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position:'bottom', labels:{ boxWidth:10, font:{size:10.5}, color:'#4B5468', padding:8 } },
        datalabels: {
          color:'#fff', font:{ weight:'700', size:10 }, textAlign:'center',
          formatter: (value, ctx) => {
            const total = ctx.chart.data.datasets[0].data.reduce((a,b)=>a+b,0);
            const pct = total ? Math.round(value/total*100) : 0;
            return value>0 ? [`${value}건`, `${pct}%`] : '';
          }
        }
      },
      cutout: '58%'
    }
  });
}
function computeMonthlyIncidentCounts(incidents, monthsBack){
  const now = new Date();
  const labels = [];
  const keys = [];
  for(let i=monthsBack-1; i>=0; i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    keys.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);
    labels.push(`${d.getMonth()+1}월`);
  }
  const counts = keys.map(k=> incidents.filter(i=> (i.datetime||'').slice(0,7)===k).length);
  return { labels, counts };
}

const NEW_THRESHOLD_MS = 24*60*60*1000; // 24시간 이내 등록된 항목은 NEW 표시

/* 읽음 상태 추적 — 전체관리자 모드에서만 적용, 이 브라우저(내 계정)에만 저장되고
   다른 계정(일반/부서관리자)이나 다른 기기와는 공유되지 않음 */
function getReadSet(path){
  try{ return new Set(JSON.parse(localStorage.getItem('isc_read_'+path) || '[]')); }
  catch(e){ return new Set(); }
}
function markRead(path, id){
  if(!path || !id) return;
  const set = getReadSet(path);
  if(set.has(id)) return;
  set.add(id);
  localStorage.setItem('isc_read_'+path, JSON.stringify([...set]));
}
function isRead(path, id){ return getReadSet(path).has(id); }

function isItemNew(item, path){
  if(!item) return false;
  if(path===PATHS.permits){
    // 부서관리자가 "검토완료"로 넘기면 전체관리자에게 NEW (createdAt과 무관하게)
    if(State.mode==='admin' && item.status==='검토완료' && item.reviewCompletedAt){
      if(Date.now() - item.reviewCompletedAt < NEW_THRESHOLD_MS && !isRead(path, item.id+'_review_'+item.reviewCompletedAt)){
        return true;
      }
    }
    // 전체관리자가 "승인"하면 부서관리자에게 NEW (작업종료 확인을 해야 함을 알림)
    if(State.mode==='dept' && item.status==='승인' && item.approvedAt){
      if(Date.now() - item.approvedAt < NEW_THRESHOLD_MS && !isRead(path, item.id+'_approved_'+item.approvedAt)){
        return true;
      }
    }
    // 작업종료 확인 입력이 끝나면 전체관리자에게 다시 NEW (최종 종료 처리 필요)
    if(State.mode==='admin' && item.status==='승인' && item.terminationEnteredAt){
      if(Date.now() - item.terminationEnteredAt < NEW_THRESHOLD_MS && !isRead(path, item.id+'_termconfirm_'+item.terminationEnteredAt)){
        return true;
      }
    }
  }
  if(!item.createdAt) return false;
  if(Date.now() - item.createdAt >= NEW_THRESHOLD_MS) return false;
  if(State.mode==='admin' && path && isRead(path, item.id)) return false;
  return true;
}
function hasNewInList(arr, path){
  return (arr||[]).some(item => isItemNew(item, path));
}
function newBadge(item, path){
  return isItemNew(item, path) ? '<span class="badge-new">NEW</span> ' : '';
}
function statusLabel(status){
  if(!status) return '-';
  return t('status_'+status);
}
function statusBadge(kind, status){

    permit:{'신청':'b-info','검토중':'b-caution','검토완료':'b-caution2','승인':'b-ok','반려':'b-danger','종료':'b-gray'},
    risk:{'등록':'b-info','접수완료':'b-safety','조치중':'b-caution','완료':'b-ok','일부개선완료':'b-caution2'},
    incident:{'접수':'b-info','조사중':'b-caution','조치중':'b-caution','완료':'b-ok'},

// 위험성평가 공정 분류 (고정 목록 — 필터·등록 시 공통 사용)
const PROCESS_OPTIONS = ['용해','보온로','주입','조형','사처리','후처리','래들보수','합리화','기계','전기','개발','UVT','스펙트로','실험실','공정품질','환경정리','생산관리','집진기'];

const PROCESS_DEPT_MAP = {
  '용해':'생산부','보온로':'생산부','주입':'생산부','조형':'생산부','사처리':'생산부','후처리':'생산부','래들보수':'생산부','합리화':'생산부','기계':'생산부','전기':'생산부',

  '생산관리':'관리부','환경정리':'관리부',
  '집진기':'안전환경부'
};
function processDept(process){ return PROCESS_DEPT_MAP[process] || '-'; }

// 위험도 등급 — 회사 「위험성평가 실시규정」의 빈도강도법(6단계, Ⅰ~Ⅵ) 기준
function riskLevel(r){
  const score = (Number(r.frequency)||0) * (Number(r.severity)||0);
  if(score>=16) return 6; // Ⅵ 매우높음 (16~20)
  if(score>=13) return 5; // Ⅴ 높음 (15)
  if(score>=9) return 4;  // Ⅳ 약간높음 (9~12)
  if(score===8) return 3; // Ⅲ 보통 (8)
  if(score>=4) return 2;  // Ⅱ 낮음 (4~6)
  return 1;                // Ⅰ 매우낮음 (1~3)
}
const RISK_LEVEL_SCORE_RANGE = {1:'1~3',2:'4~6',3:'8',4:'9~12',5:'15',6:'16~20'};
const RISK_LEVEL_ROMAN = {1:'Ⅰ',2:'Ⅱ',3:'Ⅲ',4:'Ⅳ',5:'Ⅴ',6:'Ⅵ'};
function riskLevelInfo(lv){
  return {
    scoreRange: RISK_LEVEL_SCORE_RANGE[lv],
    roman: RISK_LEVEL_ROMAN[lv],
    label: t('risklevel_label_'+lv),
    action: t('risklevel_action_'+lv),
    desc: t('risklevel_desc_'+lv),
  };
}
function riskChip(r){
  const score = (Number(r.frequency)||0) * (Number(r.severity)||0);
  const lv = riskLevel(r);
  const info = riskLevelInfo(lv);
  return `<span class="risk-chip risk-${lv}" title="위험도 ${info.roman} ${info.label} · ${info.action}">${score}</span>`;
}
// 위험도 등급을 세로형 배지로 (점수 위 · 조치명 아래) — 폭을 줄여 목록에서 옆으로 안 길어지게
function riskLevelBadge(r){
  const score = (Number(r.frequency)||0) * (Number(r.severity)||0);
  const lv = riskLevel(r);
  const info = riskLevelInfo(lv);
  return `<span class="risk-level-badge risk-${lv}" title="위험도 ${info.roman} ${info.label}">
    <span class="rlb-score">${score}</span><span class="rlb-action">(${esc(info.action)})</span>
  </span>`;
}
// 목록/상세보기에서 개선전·개선후 위험도를 각각 별도 칸/항목으로 표시 (riskLevelBadge를 직접 호출)
function riskLegendHtml(){
  return `<div class="risk-legend">
    ${[6,5,4,3,2,1].map(lv=>{
      const info = riskLevelInfo(lv);
      return `<div class="risk-legend-item">
        <span class="risk-chip risk-${lv}">${info.roman}</span>
        <div><b>${esc(info.label)}(${info.scoreRange}) · ${esc(info.action)}</b><div class="hint" style="margin:1px 0 0;">${esc(info.desc)}</div></div>
      </div>`;
    }).join('')}
  </div>`;
}

        ${!isPartner ? `<div class="field"><label>${t('lbl_sitesuper')}</label><input type="text" id="f_contractorLead" value="${esc(v.contractorLead||'')}"></div>` : ''}
      </div>
      ${isPartner ? `
      <div style="background:#F7F8FA;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:6px;">
        <p class="hint" style="margin-bottom:8px;font-weight:700;">신청 담당자 — 성명과 서명을 입력해주세요</p>
        <div class="row2">
          <div class="field"><label>${t('lbl_sitesuper')} *</label><input type="text" id="f_contractorLead" value="${esc(v.contractorLead||'')}"></div>
          <div class="field"><label>서명 *</label>
            <button type="button" class="btn btn-sm" id="contractorSigBtn">${v.contractorSignature?'서명 다시하기':'서명하기'}</button>
            <div id="contractorSigPreview" style="margin-top:6px;">${sigPreviewHtml(v.contractorSignature)}</div>
          </div>
        </div>
      </div>
      ` : ''}

      <div class="divider"></div>
      <div class="field"><label>${t('lbl_hazard_equipment')} * <span class="hint" style="margin:0;">${t('hint_select_all_equip')}</span></label>
        <div style="display:flex;flex-wrap:wrap;gap:8px 16px;padding:11px 12px;border:1px solid var(--line);border-radius:8px;">
          ${EQUIPMENT_OPTIONS.map(opt=>`<label style="display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px;"><input type="checkbox" class="eq-check" value="${esc(opt)}" ${eqSelected.includes(opt)?'checked':''}> ${esc(equipLabel(opt))}</label>`).join('')}
          <label style="display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px;"><input type="checkbox" id="f_eqOtherCheck" ${v.equipmentOther?'checked':''}> ${t('equip_other')}</label>
        </div>
        <input type="text" id="f_equipmentOther" value="${esc(v.equipmentOther||'')}" placeholder="${t('placeholder_equip_other')}" style="margin-top:8px;${v.equipmentOther?'':'display:none'}">
      </div>
      <div class="field"><label>${t('lbl_hazard_measures')} *</label><textarea id="f_hazardDetail" placeholder="예: 협착·끼임, 낙하물 위험 — 설비 전원 차단(LOTO) 후 작업, 방호덮개 설치, 보호구 착용">${esc(v.hazardDetail||'')}</textarea></div>

      <div class="divider"></div>
      <div class="field">
        <label><input type="checkbox" id="f_fireWork" ${v.fireWork?'checked':''}> ${t('lbl_firework_check')}</label>
      </div>
      <div id="fireFields" style="${v.fireWork?'':'display:none'}">
        <div class="field"><label>${t('lbl_firedetail')}</label><input type="text" id="f_fireDetail" value="${esc(v.fireDetail||'')}" placeholder="예: 용접 작업, 용단 작업"></div>
        <div class="row2">
          <div class="field"><label>${t('lbl_watchman')}</label><input type="text" id="f_watchman" value="${esc(v.watchman||'')}" placeholder="예: 박O민, 외주업체 지정"></div>
          <div class="field"><label>${t('lbl_extinguisher')}</label><input type="text" id="f_fireExtinguisher" value="${esc(v.fireExtinguisher||'')}" placeholder="예: 분말소화기 2대 비치"></div>
        </div>
        <div class="field"><label>${t('lbl_combustible')}</label><input type="text" id="f_combustibleRemoval" value="${esc(v.combustibleRemoval||'')}" placeholder="예: 반경 11m 내 가연물 제거, 방화포 설치"></div>
      </div>

      ${canProcess ? `
      <div class="divider"></div>
      <div class="field"><label>${t('lbl_progress_admin')}</label>
        <select id="f_status">
          ${(isDept ? ['검토완료','반려'] : ['승인','반려','종료']).map(s=>`<option value="${s}" ${v.status===s?'selected':''}>${statusLabel(s)}</option>`).join('')}
        </select>
        ${isDept ? `<p class="hint">최종 승인·반려는 전체관리자가 처리합니다. 검토가 끝나면 "검토완료"로 넘겨주세요.</p>` : ''}
      </div>
      <div class="field"><label>${t('lbl_review_comment')}</label><textarea id="f_reviewComment" placeholder="${t('lbl_review_comment_placeholder')}">${esc(v.reviewComment||'')}</textarea></div>
      ${isDept ? `
      <div id="deptSigFields" style="${v.status==='검토완료'?'':'display:none'};background:#F7F8FA;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:6px;">
        <p class="hint" style="margin-bottom:8px;font-weight:700;">검토완료 처리 — 성명과 서명을 입력해주세요</p>
        <div class="row2">
          <div class="field"><label>검토자 성명 *</label><input type="text" id="f_deptName" value="${esc(v.deptName||'')}"></div>
          <div class="field"><label>서명 *</label>
            <button type="button" class="btn btn-sm" id="deptSigBtn">${v.deptSignature?'서명 다시하기':'서명하기'}</button>
            <div id="deptSigPreview" style="margin-top:6px;">${sigPreviewHtml(v.deptSignature)}</div>
          </div>
        </div>
      </div>
      ` : ''}
      ${isAdmin ? `
      <div id="approverFields" style="${v.status==='승인'?'':'display:none'};background:#F7F8FA;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:6px;">
        <p class="hint" style="margin-bottom:8px;font-weight:700;">승인 처리 — 성명과 서명을 입력해주세요</p>
        <div class="row2">
          <div class="field"><label>승인자 성명 *</label><input type="text" id="f_approverName" value="${esc(v.approverName||'')}"></div>
          <div class="field"><label>서명 *</label>
            <button type="button" class="btn btn-sm" id="approverSigBtn">${v.approverSignature?'서명 다시하기':'서명하기'}</button>
            <div id="approverSigPreview" style="margin-top:6px;">${sigPreviewHtml(v.approverSignature)}</div>
          </div>
        </div>
      </div>
      ` : ''}
      ` : ''}
      <div class="field"><label>${t('lbl_note')}</label><textarea id="f_note">${esc(v.note||'')}</textarea></div>
    </div>
    <div class="modal-foot">
      <button class="btn" data-close>${t('btn_cancel')}</button>
      <button class="btn btn-primary" id="savePermitBtn">${t('btn_save')}</button>
    </div>
  `);
  document.getElementById('f_fireWork').addEventListener('change', e=>{
    document.getElementById('fireFields').style.display = e.target.checked ? '' : 'none';
  });
  document.getElementById('f_eqOtherCheck').addEventListener('change', e=>{
    document.getElementById('f_equipmentOther').style.display = e.target.checked ? '' : 'none';
  });
  let approverSigData = v.approverSignature || '';
  let deptSigData = v.deptSignature || '';
  let contractorSigData = v.contractorSignature || '';
  if(isPartner){
    document.getElementById('contractorSigBtn').addEventListener('click', ()=>{
      openSignaturePad('외주업체 담당자 서명', (dataUrl)=>{
        contractorSigData = dataUrl;
        document.getElementById('contractorSigPreview').innerHTML = sigPreviewHtml(dataUrl);
        document.getElementById('contractorSigBtn').textContent = '서명 다시하기';
      });
    });
  }
  if(isDept){
    const statusSel = document.getElementById('f_status');
    const deptSigFields = document.getElementById('deptSigFields');
    const syncDeptFields = ()=>{ deptSigFields.style.display = statusSel.value==='검토완료' ? '' : 'none'; };
    statusSel.addEventListener('change', syncDeptFields);
    syncDeptFields();
    document.getElementById('deptSigBtn').addEventListener('click', ()=>{
      openSignaturePad('공정 담당자 서명', (dataUrl)=>{
        deptSigData = dataUrl;
        document.getElementById('deptSigPreview').innerHTML = sigPreviewHtml(dataUrl);
        document.getElementById('deptSigBtn').textContent = '서명 다시하기';
      });
    });
  }
  if(isAdmin){
    const statusSel = document.getElementById('f_status');
    const approverFields = document.getElementById('approverFields');
    const syncApproverFields = ()=>{ approverFields.style.display = statusSel.value==='승인' ? '' : 'none'; };
    statusSel.addEventListener('change', syncApproverFields);
    syncApproverFields();
    document.getElementById('approverSigBtn').addEventListener('click', ()=>{
      openSignaturePad('승인자 서명', (dataUrl)=>{
        approverSigData = dataUrl;
        document.getElementById('approverSigPreview').innerHTML = sigPreviewHtml(dataUrl);
        document.getElementById('approverSigBtn').textContent = '서명 다시하기';
      });
    });
  }
  document.getElementById('savePermitBtn').addEventListener('click', async ()=>{
    const equipment = Array.from(document.querySelectorAll('.eq-check:checked')).map(el=>el.value);
    const equipmentOther = document.getElementById('f_eqOtherCheck').checked ? document.getElementById('f_equipmentOther').value.trim() : '';
    const data = {
      company: isPartner ? State.partnerCompany : document.getElementById('f_company').value.trim(),
      workType: document.getElementById('f_workType').value,
      workContent: document.getElementById('f_workContent').value.trim(),
      location: document.getElementById('f_location').value.trim(),
      startDate: document.getElementById('f_startDate').value,
      endDate: document.getElementById('f_endDate').value,
      headcount: document.getElementById('f_headcount').value.trim(),
      processManager: document.getElementById('f_processManager').value.trim(),
      contractorLead: document.getElementById('f_contractorLead').value.trim(),
      equipment, equipmentOther,
      hazardDetail: document.getElementById('f_hazardDetail').value.trim(),
      fireWork: document.getElementById('f_fireWork').checked,
      fireDetail: document.getElementById('f_fireDetail').value.trim(),
      watchman: document.getElementById('f_watchman').value.trim(),
      fireExtinguisher: document.getElementById('f_fireExtinguisher').value.trim(),
      combustibleRemoval: document.getElementById('f_combustibleRemoval').value.trim(),
      note: document.getElementById('f_note').value.trim(),
    };
    if(isPartner){
      if(!data.contractorLead || !contractorSigData){ toast('현장감독자 성명과 서명을 모두 입력해주세요'); return; }
      data.contractorSignature = contractorSigData;
    }
    if(canProcess && isEdit && document.getElementById('f_status')){
      const newStatus = document.getElementById('f_status').value;
      data.status = newStatus;
      data.reviewComment = document.getElementById('f_reviewComment').value.trim();
      // 부서관리자가 "검토완료"로 넘기면 전체관리자에게 NEW로 표시되도록 시점 기록
      if(newStatus==='검토완료'){
        const deptName = document.getElementById('f_deptName').value.trim();
        if(!deptName || !deptSigData){ toast('검토자 성명과 서명을 모두 입력해주세요'); return; }
        data.deptName = deptName;
        data.deptSignature = deptSigData;
        if(v.status!=='검토완료'){ data.reviewCompletedAt = Date.now(); }
      }
      // 전체관리자가 "승인" 처리하면 부서관리자에게 NEW로 표시(작업종료 확인을 해야 함을 알림)
      if(newStatus==='승인'){
        const approverName = document.getElementById('f_approverName').value.trim();
        if(!approverName || !approverSigData){ toast('승인자 성명과 서명을 모두 입력해주세요'); return; }
        data.approverName = approverName;
        data.approverSignature = approverSigData;
        if(v.status!=='승인'){ data.approvedAt = Date.now(); }
      }
    }else if(!isEdit){
      data.status = '신청';
    }
    const missingFields = [];
    if(!data.company) missingFields.push(t('lbl_company'));
    if(!data.workContent) missingFields.push(t('lbl_workname'));
    if(!data.location) missingFields.push(t('lbl_worklocation'));
    if(!data.startDate) missingFields.push(t('lbl_startdate'));
    if(!data.endDate) missingFields.push(t('lbl_enddate'));
    if(!data.headcount) missingFields.push(t('lbl_headcount'));
    if(!data.processManager) missingFields.push(t('lbl_processmanager'));
    if(!data.hazardDetail) missingFields.push(t('lbl_hazard_measures'));
    if(equipment.length===0 && !equipmentOther) missingFields.push(t('lbl_hazard_equipment'));
    if(missingFields.length){
      alert(t('toast_fill_required') + '\n\n[비어있는 항목]\n- ' + missingFields.join('\n- '));
      return;
    }
    if(isEdit){
      await DataStore.update(PATHS.permits, existing.id, data);
      toast(t('toast_permit_updated'));
      closeModal(); renderPermits();
    }else{
      data.createdAt = Date.now();
      const newId = await DataStore.push(PATHS.permits, data);
      closeModal();
      if(!canProcess){
        if(State.mode==='user'){ addMyOwnedId('isc_my_permits', newId); }
        showSuccessPopup(t('toast_permit_registered'));
      }else{
        toast(t('toast_permit_registered'));
      }
      renderPermits();
    }
  });
}

function openPermitDetail(id){
  const raw = DataStore.get(PATHS.permits)[id];
  if(!raw) return;
  markRead(PATHS.permits, id);
  const p = Object.assign({id}, raw);
  if(State.mode==='admin' && p.reviewCompletedAt){
    markRead(PATHS.permits, id+'_review_'+p.reviewCompletedAt);
  }
  if(State.mode==='dept' && p.approvedAt){
    markRead(PATHS.permits, id+'_approved_'+p.approvedAt);
  }
  if(State.mode==='admin' && p.terminationEnteredAt){
    markRead(PATHS.permits, id+'_termconfirm_'+p.terminationEnteredAt);
  }
  const canProcess = State.mode==='admin' || State.mode==='dept';
  const isPartner = State.mode==='partner';
  const canOwnerEdit = p.status==='신청' && (
    (isPartner && p.company===State.partnerCompany) ||
    (State.mode==='user' && getMyOwnedIds('isc_my_permits').includes(id))
  );
  const equipmentText = [...(p.equipment||[]).map(equipLabel), p.equipmentOther].filter(Boolean).join(', ') || '-';
  showModal(`
    <div class="modal-head"><h3>${t('permit_detail_title')}</h3><button class="x-btn" data-close>✕</button></div>
    <div class="modal-body">
      ${p.reviewComment ? `<div style="background:#FFF6ED;border:1px solid #FFD9AD;border-radius:10px;padding:12px 14px;margin-bottom:16px;">
        <b style="color:#B24A00;font-size:12.5px;">${t('lbl_review_comment')}</b>
        <p style="margin:6px 0 0;font-size:13px;line-height:1.6;">${esc(p.reviewComment)}</p>
      </div>` : ''}
      <dl class="detail-grid">
        <dt>${t('th_company')}</dt><dd>${esc(p.company)}</dd>
        <dt>${t('dt_type')}</dt><dd>${esc(t('worktype_'+p.workType))} ${p.fireWork?'· 🔥'+t('firework_tag'):''}</dd>
        <dt>${t('lbl_workname')}</dt><dd>${esc(p.workContent)}</dd>
        <dt>${t('lbl_worklocation')}</dt><dd>${esc(p.location)}</dd>
        <dt>${t('dt_workperiod')}</dt><dd class="mono">${fmtDate(p.startDate)} ~ ${fmtDate(p.endDate)}</dd>
        <dt>${t('lbl_headcount')}</dt><dd>${esc(p.headcount||'-')}</dd>
        <dt>${t('th_processmanager')}</dt><dd>${esc(p.processManager||'-')}</dd>
        <dt>${t('lbl_sitesuper')}</dt><dd>${esc(p.contractorLead||'-')}</dd>
        <dt>${t('lbl_hazard_equipment')}</dt><dd>${esc(equipmentText)}</dd>
        <dt>${t('dt_safety_measures')}</dt><dd>${esc(p.hazardDetail||'-')}</dd>
        ${p.fireWork?`
        <dt>${t('lbl_firedetail')}</dt><dd>${esc(p.fireDetail||'-')}</dd>
        <dt>${t('lbl_watchman')}</dt><dd>${esc(p.watchman||'-')}</dd>
        <dt>${t('lbl_extinguisher')}</dt><dd>${esc(p.fireExtinguisher||'-')}</dd>
        <dt>${t('lbl_combustible')}</dt><dd>${esc(p.combustibleRemoval||'-')}</dd>
        `:''}
        <dt>${t('th_status')}</dt><dd>${statusBadge('permit', p.status)}</dd>
        ${(p.endDatetime||p.siteCondition||p.residualCheck||p.endConfirmer) ? `
        <dt>${t('dt_enddatetime')}</dt><dd class="mono">${p.endDatetime?fmtDateTime(p.endDatetime):'-'}</dd>
        <dt>${t('dt_sitecondition')}</dt><dd>${esc(p.siteCondition||'-')}</dd>
        ${p.fireWork?`<dt>${t('dt_residualcheck')}</dt><dd>${esc(p.residualCheck||'-')}</dd>`:''}
        <dt>${t('dt_confirmer')}</dt><dd>${esc(p.endConfirmer||'-')}</dd>
        `:''}
        <dt>${t('lbl_note')}</dt><dd>${esc(p.note||'-')}</dd>
      </dl>
    </div>
    <div class="modal-foot">
      <button class="btn" id="downloadBtn">${icon('file-check',14)} ${t('btn_download_permit')}</button>
      ${(canTerminate() && (p.status==='승인'||p.status==='종료') && (!p.terminationLocked || State.mode==='admin')) ? `<button class="btn" id="termBtn">${p.terminationLocked?t('btn_term_edit'):t('btn_term_input')}</button>` : ''}
      ${canProcess ? `<button class="btn btn-primary" id="editBtn">${t('btn_process_edit')}</button>` : (canOwnerEdit ? `<button class="btn btn-primary" id="editBtn">${t('btn_edit')}</button>` : '')}
      ${State.mode==='admin' ? `<button class="btn" id="delBtn">${t('btn_delete')}</button>` : ''}
      <button class="btn" data-close>${t('btn_close')}</button>
    </div>
  `);
  document.getElementById('downloadBtn').addEventListener('click', ()=> generatePermitDocx(p));
  if(document.getElementById('termBtn')){
    document.getElementById('termBtn').addEventListener('click', ()=> openPermitTerminationModal(p));
  }
  if(document.getElementById('editBtn')){
    document.getElementById('editBtn').addEventListener('click', ()=>{ closeModal(); openPermitModal(p); });
  }
  if(State.mode==='admin'){
    document.getElementById('delBtn').addEventListener('click', async ()=>{
      if(confirm(t('confirm_delete_permit'))){
        await DataStore.remove(PATHS.permits, id); closeModal(); toast(t('toast_deleted')); renderPermits();
      }
    });
  }
}

function openPermitTerminationModal(p){
  showModal(`
    <div class="modal-head"><h3>${t('term_modal_title')}</h3><button class="x-btn" data-close>✕</button></div>
    <div class="modal-body">
      <p class="hint" style="margin-bottom:14px;">${t('term_modal_hint')}</p>
      <div class="row2">
        <div class="field"><label>${t('lbl_end_datetime_input')}</label><input type="datetime-local" id="f_endDatetime" value="${p.endDatetime||''}"></div>
        <div class="field"><label>${t('lbl_sitecondition_input')}</label>
          <select id="f_siteCondition">
            <option value="">${t('opt_none_selected')}</option>
            <option value="이상없음" ${p.siteCondition==='이상없음'?'selected':''}>${t('opt_site_ok')}</option>
            <option value="이상있음" ${p.siteCondition==='이상있음'?'selected':''}>${t('opt_site_notok')}</option>
          </select>
        </div>
      </div>
      ${p.fireWork ? `<div class="field"><label>${t('lbl_residualcheck_input')}</label><input type="text" id="f_residualCheck" value="${esc(p.residualCheck||'')}" placeholder="예: 감시자 박O민 / 17:20~17:52(32분) / 이상없음"></div>` : ''}
      <div style="background:#F7F8FA;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:6px;">
        <p class="hint" style="margin-bottom:8px;font-weight:700;">작업종료 확인 — 성명과 서명을 입력해주세요</p>
        <div class="row2">
          <div class="field"><label>${t('lbl_endconfirmer_input')} *</label><input type="text" id="f_endConfirmer" value="${esc(p.endConfirmer||'')}"></div>
          <div class="field"><label>서명 *</label>
            <button type="button" class="btn btn-sm" id="confirmerSigBtn">${p.endConfirmerSignature?'서명 다시하기':'서명하기'}</button>
            <div id="confirmerSigPreview" style="margin-top:6px;">${sigPreviewHtml(p.endConfirmerSignature)}</div>
          </div>
        </div>
      </div>
      ${p.terminationEnteredBy ? `<p class="hint">${t('lbl_last_entered')}: ${esc(p.terminationEnteredBy)} · ${fmtDateTime(p.terminationEnteredAt)}</p>` : ''}
    </div>
    <div class="modal-foot">
      <button class="btn" data-close>${t('btn_cancel')}</button>
      <button class="btn btn-primary" id="saveTerminationBtn">${t('btn_save')}</button>
    </div>
  `);
  let confirmerSigData = p.endConfirmerSignature || '';
  document.getElementById('confirmerSigBtn').addEventListener('click', ()=>{
    openSignaturePad('작업종료 확인자 서명', (dataUrl)=>{
      confirmerSigData = dataUrl;
      document.getElementById('confirmerSigPreview').innerHTML = sigPreviewHtml(dataUrl);
      document.getElementById('confirmerSigBtn').textContent = '서명 다시하기';
    });
  });
  document.getElementById('saveTerminationBtn').addEventListener('click', async ()=>{
    const endConfirmer = document.getElementById('f_endConfirmer').value.trim();
    if(!endConfirmer || !confirmerSigData){ toast('확인자 성명과 서명을 모두 입력해주세요'); return; }
    const data = {
      endDatetime: document.getElementById('f_endDatetime').value,
      siteCondition: document.getElementById('f_siteCondition').value,
      endConfirmer,
      endConfirmerSignature: confirmerSigData,
      terminationEnteredBy: State.mode==='admin' ? t('role_full_admin') : `${t('role_dept_admin')}(${State.dept})`,
      terminationEnteredAt: Date.now(),
    };
    if(State.mode==='dept'){ data.terminationLocked = true; }
    if(p.fireWork){ data.residualCheck = document.getElementById('f_residualCheck').value.trim(); }
    await DataStore.update(PATHS.permits, p.id, data);
    toast(t('toast_term_saved'));
    closeModal();
    openPermitDetail(p.id);
  });
}

// 서명패드 — 마우스/터치로 서명을 그려서 PNG(dataURL)로 저장
let signaturePadOpen = false;
function openSignaturePad(title, onSave){
  signaturePadOpen = true;
  showModal2(`
    <div class="modal-head"><h3>${esc(title)}</h3><button class="x-btn" data-close>✕</button></div>
    <div class="modal-body">
      <p class="hint" style="margin-bottom:8px;">아래 네모칸 안에 손가락 또는 마우스로 서명해주세요.</p>
      <canvas id="sigCanvas" style="width:100%;aspect-ratio:5/2;border:1px solid var(--line);border-radius:8px;background:#fff;touch-action:none;display:block;"></canvas>
    </div>
    <div class="modal-foot">
      <button class="btn" id="sigClearBtn">지우기</button>
      <button class="btn" data-close>취소</button>
      <button class="btn btn-primary" id="sigSaveBtn">서명 완료</button>
    </div>
  `);
  document.querySelectorAll('#modalBox2 [data-close]').forEach(el=> el.addEventListener('click', ()=>{ signaturePadOpen = false; }));
  const canvas = document.getElementById('sigCanvas');
  const ctx = canvas.getContext('2d');
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * 2;
  canvas.height = rect.height * 2;
  ctx.scale(2,2);
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#14192B';
  let drawing = false, hasDrawn = false;
  function getPos(e){
    const r = canvas.getBoundingClientRect();
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: cx-r.left, y: cy-r.top };
  }
  function start(e){ drawing=true; hasDrawn=true; const p=getPos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); e.preventDefault(); e.stopPropagation(); }
  function move(e){ if(!drawing) return; const p=getPos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); e.preventDefault(); }
  function end(){ drawing=false; }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);
  document.getElementById('sigClearBtn').addEventListener('click', ()=>{
    ctx.clearRect(0,0,canvas.width,canvas.height);
    hasDrawn = false;
  });
  document.getElementById('sigSaveBtn').addEventListener('click', ()=>{
    if(!hasDrawn){ toast('서명을 입력해주세요'); return; }
    const dataUrl = canvas.toDataURL('image/png');
    signaturePadOpen = false;
    closeModal2();
    onSave(dataUrl);
  });
}
function sigPreviewHtml(dataUrl){
  return dataUrl ? `<img src="${dataUrl}" style="height:44px;border:1px solid var(--line);border-radius:6px;background:#fff;">` : '';
}
function dataUrlToUint8Array(dataUrl){
  const base64 = (dataUrl||'').split(',')[1] || '';
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++){ bytes[i] = binary.charCodeAt(i); }
  return bytes;
}

// 사고발생일 기준 만 나이 계산
function calcAgeAt(birthDate, atDate){
  if(!birthDate || !atDate) return null;
  const b = new Date(birthDate), a = new Date(atDate);
  if(isNaN(b) || isNaN(a)) return null;
  let age = a.getFullYear() - b.getFullYear();
  const m = a.getMonth() - b.getMonth();
  if(m < 0 || (m===0 && a.getDate() < b.getDate())) age--;
  return age;
}
// 사고발생일 기준 근속기간(N년 M개월) 계산
function calcTenureAt(hireDate, atDate){
  if(!hireDate || !atDate) return null;
  const h = new Date(hireDate), a = new Date(atDate);
  if(isNaN(h) || isNaN(a)) return null;
  let months = (a.getFullYear()-h.getFullYear())*12 + (a.getMonth()-h.getMonth());
  if(a.getDate() < h.getDate()) months--;
  if(months < 0) return null;
  const y = Math.floor(months/12), m = months%12;
  return (y>0?`${y}년 `:'') + `${m}개월`;
}
