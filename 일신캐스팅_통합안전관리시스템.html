<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>일신캐스팅 통합 안전관리 시스템</title>

<!-- ============================================================
  PWA (홈 화면 설치용 앱 설정)
============================================================= -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#101B33">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="일신안전관리">

<!-- ============================================================
  Firebase SDK (compat 버전 - 별도 빌드 도구 없이 바로 사용 가능)
============================================================= -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pizzip@3.1.6/dist/pizzip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docxtemplater@3.44.0/build/docxtemplater.min.js"></script>

<style>
/* ==========================================================================
   토큰 시스템
   Color
     --navy-900 #101B33  사이드바/헤더 배경 (딱딱한 조명 아래 도장 강판 느낌)
     --navy-700 #1C2E52  사이드바 hover
     --paper    #F4F6F8  본문 배경
     --card     #FFFFFF  카드 배경
     --line     #E2E6EC  경계선
     --ink      #14192B  본문 텍스트
     --ink-soft #667085  보조 텍스트
     --safety   #FF6A13  안전표지 오렌지 (경고/CTA 강조)
     --caution  #FFC93C  주의(황색 표지판)
     --ok       #1DA46F  안전(녹색 표지판)
     --danger   #E5484D  위험(적색 표지판)
     --info     #2D7DD2  정보/파랑
   Type
     display : 'Pretendard' (한글 가변폭 산세리프, 큰 숫자/타이틀)
     mono    : 'JetBrains Mono' (지표 숫자, 코드성 데이터)
   Signature
     대시보드 상단의 "무재해 카운터" 게시판 — 공장 정문에 걸린
     'ㅇㅇㅇ일 무재해' 안내판을 웹 UI로 옮긴 히어로 스탯 패널.
========================================================================== */
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap');

:root{
  --navy-900:#101B33;
  --navy-800:#152648;
  --navy-700:#1C2E52;
  --paper:#F4F6F8;
  --card:#FFFFFF;
  --line:#E2E6EC;
  --ink:#14192B;
  --ink-soft:#667085;
  --ink-faint:#98A2B3;
  --safety:#FF6A13;
  --safety-dim:#FFE8D6;
  --caution:#FFC93C;
  --caution-dim:#FFF6DA;
  --ok:#1DA46F;
  --ok-dim:#DDF3E9;
  --danger:#E5484D;
  --danger-dim:#FCE3E4;
  --info:#2D7DD2;
  --info-dim:#E1EDFB;
  --radius:10px;
  --shadow:0 1px 2px rgba(16,27,51,.04), 0 4px 16px rgba(16,27,51,.06);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:'Pretendard', system-ui, -apple-system, 'Malgun Gothic', sans-serif;
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  font-size:14.5px;
  line-height:1.5;
}
::selection{background:var(--safety-dim);}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:inherit;}

.mono{font-family:'JetBrains Mono', ui-monospace, monospace;}

/* ---------- App shell ---------- */
#app{display:flex;min-height:100vh;}

/* Sidebar */
.sidebar{
  width:236px;flex:0 0 236px;
  background:linear-gradient(180deg,var(--navy-900),var(--navy-800) 70%);
  color:#fff;
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
  z-index:20;
}
.brand{
  padding:22px 20px 16px;
  border-bottom:1px solid rgba(255,255,255,.08);
  display:flex;align-items:flex-start;gap:11px;
}
.brand-logo{
  flex:0 0 44px;width:44px;height:44px;border-radius:10px;
  background:#fff;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 10px rgba(0,0,0,.25);
  padding:5px;
}
.brand-logo img{width:100%;height:100%;object-fit:contain;}
.brand-text{min-width:0;}
.brand .tag{
  display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.08em;
  color:var(--safety);background:rgba(255,106,19,.14);
  padding:3px 7px;border-radius:5px;margin-bottom:8px;
}
.brand h1{font-size:16.5px;margin:0 0 2px;font-weight:800;letter-spacing:-.01em;}
.brand p{margin:0;font-size:11.5px;color:#8C99B8;}

.nav{flex:1;padding:14px 10px;overflow-y:auto;}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:8px;margin-bottom:2px;
  color:#B7C0D6;font-size:13.5px;font-weight:600;
  border:none;background:none;width:100%;text-align:left;
  transition:background .12s, color .12s;
}
.nav-item svg{flex:0 0 18px;width:18px;height:18px;opacity:.85;}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:var(--safety);color:#fff;}
.nav-item.active svg{opacity:1;}
.nav-badge{
  margin-left:auto;font-size:10.5px;font-weight:700;
  background:rgba(255,255,255,.14);padding:1px 7px;border-radius:20px;
  font-family:'JetBrains Mono',monospace;
}
.nav-item.active .nav-badge{background:rgba(255,255,255,.28);}
.nav-dot{
  width:8px;height:8px;border-radius:50%;background:var(--danger);
  display:inline-block;margin-left:6px;flex:0 0 8px;
  box-shadow:0 0 0 3px rgba(229,72,77,.28);
  animation:new-pulse 1.8s ease-in-out infinite;
}

.sidebar-foot{
  padding:14px 18px 18px;border-top:1px solid rgba(255,255,255,.08);
  font-size:11px;color:#7686A8;
}
.mode-pill{
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(255,255,255,.06);border-radius:8px;padding:8px 10px;margin-bottom:10px;
}
.mode-pill span{font-size:12px;font-weight:700;color:#D6DCEA;}
.mode-btn{
  border:1px solid rgba(255,255,255,.18);background:transparent;color:#fff;
  font-size:11px;font-weight:700;padding:4px 9px;border-radius:6px;
}
.mode-btn.on{background:var(--ok);border-color:var(--ok);}

/* Main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  position:sticky;top:0;z-index:10;
  background:rgba(244,246,248,.9);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);
  padding:18px 32px;display:flex;align-items:center;justify-content:space-between;
}
.topbar h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.01em;}
.topbar .sub{margin:2px 0 0;font-size:12.5px;color:var(--ink-soft);}
.topbar-right{display:flex;align-items:center;gap:10px;}
.today-chip{
  font-size:12px;color:var(--ink-soft);background:#fff;border:1px solid var(--line);
  padding:6px 12px;border-radius:20px;font-family:'JetBrains Mono',monospace;font-weight:600;
}

.view{padding:18px 32px 40px;}
.view[hidden]{display:none;}

/* ---------- Buttons / inputs ---------- */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--line);background:#fff;color:var(--ink);
  font-size:13px;font-weight:700;padding:9px 15px;border-radius:8px;
  transition:all .12s;white-space:nowrap;
}
.btn:hover{border-color:#C7CFDC;background:#FAFBFC;}
.btn-primary{background:var(--safety);border-color:var(--safety);color:#fff;}
.btn-primary:hover{background:#E85E0E;border-color:#E85E0E;}
.btn-ghost{border-color:transparent;background:transparent;}
.btn-ghost:hover{background:#EEF1F5;}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:7px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.rte-toolbar .btn.active{border:2px solid var(--safety);background:var(--safety-dim);padding:5px 10px;}

.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:6px;}
.field .hint{font-size:11.5px;color:var(--ink-faint);font-weight:500;margin-top:4px;}
.field input[type=text],.field input[type=date],.field input[type=time],
.field input[type=tel],.field select,.field textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;
  font-size:13.5px;color:var(--ink);background:#fff;
}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none;border-color:var(--safety);box-shadow:0 0 0 3px var(--safety-dim);
}
.field textarea{resize:vertical;min-height:70px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
@media(max-width:720px){.row2,.row3{grid-template-columns:1fr;}}

/* ---------- Cards / KPI ---------- */
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
@media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);}}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.kpi{padding:12px 14px 11px;border-left:4px solid var(--info);}
.kpi.c-safety{border-left-color:var(--safety);}
.kpi.c-ok{border-left-color:var(--ok);}
.kpi.c-danger{border-left-color:var(--danger);}
.kpi.c-caution{border-left-color:var(--caution);}
.kpi .k-label{font-size:11.5px;font-weight:700;color:var(--ink-soft);display:flex;align-items:center;gap:6px;}
.kpi .k-num{font-family:'JetBrains Mono',monospace;font-size:23px;font-weight:700;margin:4px 0 1px;letter-spacing:-.01em;}
.kpi .k-sub{font-size:11px;color:var(--ink-faint);}

/* Signature: 무재해 카운터 보드 */
.zeroboard{
  background:radial-gradient(120% 140% at 0% 0%, var(--navy-800), var(--navy-900) 65%);
  border-radius:14px;color:#fff;padding:26px 30px;display:flex;align-items:center;
  justify-content:space-between;gap:24px;box-shadow:var(--shadow);position:relative;overflow:hidden;
  margin-bottom:20px;
}
.zeroboard:before{
  content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(135deg, rgba(255,255,255,.025) 0 2px, transparent 2px 14px);
  pointer-events:none;
}
.zb-left .zb-eyebrow{
  font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--caution);
  display:flex;align-items:center;gap:7px;margin-bottom:10px;
}
.zb-eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(29,164,111,.25);}
.zb-num{
  font-family:'JetBrains Mono',monospace;font-size:64px;font-weight:700;line-height:1;
  letter-spacing:-.02em;
}
.zb-num span{font-size:22px;font-weight:700;margin-left:8px;color:#B7C0D6;}
.zb-desc{font-size:13px;color:#AEB9D2;margin-top:8px;max-width:360px;}
.zb-right{display:flex;gap:26px;position:relative;z-index:1;}
.zb-stat{text-align:right;}
.zb-stat .n{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:700;}
.zb-stat .l{font-size:11px;color:#8C99B8;margin-top:2px;}
@media(max-width:820px){.zeroboard{flex-direction:column;align-items:flex-start;}.zb-right{align-self:stretch;justify-content:space-between;}}

.dash-header{
  display:flex;align-items:center;gap:12px;margin-bottom:10px;cursor:default;
}
.dash-header .dh-logo{
  flex:0 0 40px;width:40px;height:40px;border-radius:10px;
  background:#fff;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow);padding:5px;
}
.dash-header .dh-logo img{width:100%;height:100%;object-fit:contain;}
.dash-header h1{
  margin:0;font-size:17px;font-weight:800;letter-spacing:-.01em;color:var(--ink);
}
.dash-header p{margin:1px 0 0;font-size:11.5px;color:var(--ink-soft);font-weight:600;}

.section-title{font-size:15px;font-weight:800;margin:26px 0 12px;display:flex;align-items:center;gap:8px;}
.section-title .n{color:var(--ink-faint);font-weight:700;font-size:12px;}

/* Two column dashboard lower section */
.dash-lower{display:grid;grid-template-columns:1.3fr 1fr;gap:12px;margin-top:10px;}
@media(max-width:980px){.dash-lower{grid-template-columns:1fr;}}
.dash-charts{display:grid;grid-template-columns:1.6fr 1fr;gap:12px;margin-bottom:10px;}
@media(max-width:980px){.dash-charts{grid-template-columns:1fr;}}

.list-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
.list-card .lc-head{padding:9px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
.list-card .lc-head h3{margin:0;font-size:12.5px;font-weight:800;}
.lc-body{max-height:170px;overflow-y:auto;}
.mini-row{padding:7px 14px;border-bottom:1px solid #EEF1F5;display:flex;align-items:center;gap:10px;font-size:12px;}
.mini-row:last-child{border-bottom:none;}
.mini-row .mr-title{flex:1;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mini-row .mr-meta{font-size:11px;color:var(--ink-faint);font-family:'JetBrains Mono',monospace;}
.empty{padding:30px 18px;text-align:center;color:var(--ink-faint);font-size:13px;}
.empty .big{font-size:26px;display:block;margin-bottom:6px;}

/* ---------- Badges ---------- */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap;}
.badge-new{
  display:inline-flex;align-items:center;padding:2px 7px;border-radius:5px;
  font-size:10px;font-weight:800;letter-spacing:.03em;color:#fff;background:var(--danger);
  vertical-align:middle;margin-right:2px;animation:new-pulse 1.8s ease-in-out infinite;
}
@keyframes new-pulse{0%,100%{opacity:1;}50%{opacity:.55;}}
.b-gray{background:#EEF1F5;color:#4B5468;}
.b-info{background:var(--info-dim);color:var(--info);}
.b-caution{background:var(--caution-dim);color:#946200;}
.b-ok{background:var(--ok-dim);color:var(--ok);}
.b-danger{background:var(--danger-dim);color:var(--danger);}
.b-safety{background:var(--safety-dim);color:#B24A00;}
.b-caution2{background:#FFE7C7;color:#9A4B00;}

/* ---------- Toolbar / filter tabs ---------- */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.tabs{display:flex;gap:6px;flex-wrap:wrap;}
.tab{
  border:1px solid var(--line);background:#fff;color:var(--ink-soft);
  font-size:12.5px;font-weight:700;padding:7px 13px;border-radius:20px;
}
.tab.active{background:var(--navy-900);border-color:var(--navy-900);color:#fff;}
.searchbox{
  display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);
  border-radius:8px;padding:0 12px;min-width:220px;
}
.searchbox input{border:none;padding:8px 0;font-size:13px;flex:1;background:transparent;}
.searchbox input:focus{outline:none;}

/* ---------- Table ---------- */
.table-wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow-x:auto;-webkit-overflow-scrolling:touch;}
.table-wrap table{min-width:640px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{
  text-align:left;font-size:11.5px;font-weight:800;color:var(--ink-soft);
  text-transform:uppercase;letter-spacing:.03em;
  padding:11px 16px;border-bottom:1px solid var(--line);background:#FAFBFC;white-space:nowrap;
}
tbody td{padding:12px 16px;border-bottom:1px solid #EEF1F5;color:var(--ink);vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#FAFBFC;}
td.tight,th.tight{width:1%;white-space:nowrap;}
.row-btns{display:flex;gap:6px;}
.cell-strong{font-weight:700;}
.cell-sub{font-size:11.5px;color:var(--ink-faint);margin-top:2px;}

/* ---------- Modal ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(16,27,51,.5);backdrop-filter:blur(1px);
  display:flex;align-items:flex-start;justify-content:center;padding:5vh 20px;z-index:250;overflow-y:auto;
}
.overlay[hidden]{display:none;}
.modal{
  background:#fff;border-radius:14px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(16,27,51,.25);
  animation:pop .14s ease-out;
}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.99)}to{opacity:1;transform:none}}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
.modal-head h3{margin:0;font-size:16px;font-weight:800;}
.modal-body{padding:20px 22px;max-height:70vh;overflow-y:auto;}
.modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;}
.x-btn{border:none;background:#F1F3F6;width:30px;height:30px;border-radius:8px;font-size:15px;color:var(--ink-soft);}

/* ---------- Detail drawer content ---------- */
.detail-grid{display:grid;grid-template-columns:120px 1fr;row-gap:10px;font-size:13.5px;}
.detail-grid dt{color:var(--ink-soft);font-weight:700;}
.detail-grid dd{margin:0;}
.divider{height:1px;background:var(--line);margin:16px 0;}

/* ---------- Notice board ---------- */
.notice-item{border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:10px;background:#fff;}
.notice-item.pinned{border-color:var(--safety);background:linear-gradient(0deg,#fff,var(--safety-dim) 400%);}
.notice-item h4{margin:0 0 6px;font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:8px;}
.notice-item p{margin:0;font-size:13px;color:var(--ink-soft);white-space:pre-wrap;}
.notice-content{margin:0;font-size:13px;color:var(--ink-soft);line-height:1.6;word-break:break-word;}
.notice-content b,.notice-content strong{color:var(--ink);}
.notice-meta{font-size:11.5px;color:var(--ink-faint);margin-top:8px;font-family:'JetBrains Mono',monospace;}

.contact-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
@media(max-width:900px){.contact-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:600px){.contact-grid{grid-template-columns:1fr;}}
.contact-card{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:#fff;}
.contact-card .c-role{font-size:11px;font-weight:800;color:var(--safety);letter-spacing:.03em;}
.contact-card .c-name{font-size:14.5px;font-weight:800;margin:4px 0 2px;}
.contact-card .c-phone{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--ink-soft);}

/* ---------- Risk matrix chip ---------- */
.risk-chip{
  display:inline-flex;align-items:center;justify-content:center;
  width:34px;height:26px;border-radius:6px;font-weight:800;font-size:12.5px;
  font-family:'JetBrains Mono',monospace;color:#fff;
}
.risk-level-badge{
  display:inline-flex;flex-direction:column;align-items:center;justify-content:center;
  min-width:50px;padding:3px 5px;border-radius:8px;color:#fff;line-height:1.15;
}
.risk-level-badge .rlb-score{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:800;}
.risk-level-badge .rlb-action{font-size:9px;font-weight:700;white-space:nowrap;}
.risk-1{background:var(--ok);}
.risk-2{background:#2D7DD2;}
.risk-3{background:var(--caution);color:#5C4400;}
.risk-4{background:var(--safety);}
.risk-5{background:#E8590C;}
.risk-6{background:var(--danger);}
.risk-legend{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 16px;padding:14px 16px;background:#F7F8FA;border:1px solid var(--line);border-radius:10px;margin-bottom:14px;}
@media(max-width:620px){.risk-legend{grid-template-columns:1fr;}}
.risk-legend-item{display:flex;align-items:flex-start;gap:10px;font-size:12.5px;}
.risk-legend-item b{font-size:12.5px;}
.lightbox-overlay{
  position:fixed;inset:0;background:rgba(10,14,26,.88);z-index:500;
  display:flex;align-items:center;justify-content:center;padding:24px;cursor:zoom-out;
  animation:lightbox-fade .12s ease-out;
}
@keyframes lightbox-fade{from{opacity:0;}to{opacity:1;}}
.lightbox-overlay img{max-width:100%;max-height:100%;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
.lightbox-close{
  position:fixed;top:20px;right:24px;width:40px;height:40px;border-radius:50%;
  background:rgba(255,255,255,.15);color:#fff;border:none;font-size:18px;cursor:pointer;
}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;}
.gallery-card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);}
.gc-photos{display:grid;grid-template-columns:1fr 1fr;}
.gc-photo{position:relative;aspect-ratio:1/1;background:#EEF1F5;}
.gc-photo img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;display:block;}
.gc-noimg{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-size:11px;}
.gc-tag{position:absolute;bottom:6px;left:6px;background:rgba(20,25,43,.72);color:#fff;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px;}
.gc-body{padding:12px 14px;}
.gc-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px;}
.gc-hazard{font-size:12.5px;color:var(--ink-soft);margin-bottom:8px;line-height:1.5;}
.gc-score{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:800;color:var(--ink);}

/* ---------- Login gate ---------- */
.gate{
  position:fixed;inset:0;background:var(--navy-900);display:flex;align-items:center;justify-content:center;z-index:200;
}
.gate-card{background:#fff;border-radius:16px;padding:36px 34px;width:100%;max-width:360px;box-shadow:0 30px 80px rgba(0,0,0,.4);}
.gate-card .tag{
  display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.08em;color:var(--safety);
  background:var(--safety-dim);padding:3px 8px;border-radius:5px;margin-bottom:10px;
}
.gate-card h2{margin:0 0 4px;font-size:19px;font-weight:800;}
.gate-card p{margin:0 0 20px;font-size:12.5px;color:var(--ink-soft);}
.lang-picker{display:flex;flex-wrap:wrap;gap:7px;}
.lang-btn{
  display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:9px;
  border:1.5px solid var(--line);background:#fff;font-size:12.5px;font-weight:700;color:var(--ink);
}
.lang-btn .flag{font-size:16px;line-height:1;}
.lang-btn.active{border-color:var(--safety);background:var(--safety-dim);color:#B24A00;}
.gate-actions{display:flex;gap:8px;margin-top:6px;}
.gate-actions .btn{flex:1;justify-content:center;}

/* ---------- Toast ---------- */
#toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--navy-900);color:#fff;padding:12px 20px;border-radius:9px;font-size:13px;font-weight:600;
  box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:all .2s;z-index:300;
  display:flex;align-items:center;gap:8px;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#toast .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);}

/* ---------- Scrollbar ---------- */
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#CBD3DF;border-radius:20px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- Config banner ---------- */
.config-banner{
  background:var(--caution-dim);border:1px solid #F0D26B;color:#7A5B00;
  padding:10px 16px;border-radius:9px;font-size:12.5px;margin-bottom:18px;
  display:flex;align-items:center;gap:8px;font-weight:600;
}

/* ---------- Mobile ---------- */
.hamburger{display:none;}
.sidebar-close{display:none;}
.sidebar-backdrop{display:none;}
@media(max-width:880px){
  .sidebar{position:fixed;left:-260px;top:0;transition:left .18s;box-shadow:0 0 40px rgba(0,0,0,.3);z-index:150;}
  .sidebar.open{left:0;}
  .sidebar-close{
    display:flex;align-items:center;justify-content:center;
    position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;
    background:rgba(255,255,255,.12);color:#fff;border:none;font-size:15px;cursor:pointer;z-index:2;
  }
  .sidebar-backdrop{
    display:block;position:fixed;inset:0;background:rgba(10,14,26,.5);z-index:140;
    opacity:0;pointer-events:none;transition:opacity .18s;
  }
  .sidebar-backdrop.open{opacity:1;pointer-events:auto;}
  .hamburger{display:flex;border:1px solid var(--line);background:#fff;border-radius:8px;width:36px;height:36px;align-items:center;justify-content:center;}
  .topbar{padding:14px 16px;}
  .view{padding:18px 16px 50px;}
  .grid-4{grid-template-columns:1fr 1fr;}
  .dash-charts{grid-template-columns:1fr;}
}
@media(max-width:620px){
  html,body{overflow-x:hidden;}
  .grid-4{grid-template-columns:1fr;}
  .modal{max-width:100%;border-radius:12px;}
  .overlay{padding:0;align-items:flex-end;}
  .modal-body{max-height:75vh;}
  .toolbar{flex-direction:column;align-items:stretch;}
  .tabs{overflow-x:auto;padding-bottom:2px;}
  .searchbox{width:100%;}
  .contact-grid{grid-template-columns:1fr;}
  .detail-grid{grid-template-columns:100px 1fr;font-size:12.5px;}
  .dash-header h1{font-size:16px;}
  .kpi .k-num{font-size:22px;}
  .dash-charts > .list-card > div[style*="height:130px"]{height:128px;}
  .zb-num{font-size:34px;}
  .zb-right{gap:14px;flex-wrap:wrap;}
  .list-card canvas{max-width:100%;}
  .modal-foot{flex-direction:column-reverse;align-items:stretch;}
  .modal-foot .btn{justify-content:center;width:100%;}
}
</style>
</head>

<!-- =========================================================
   로그인 게이트 (모드 선택: 관리자 / 일반 열람)
========================================================== -->
<div class="gate" id="gate">
  <div class="gate-card">
    <span class="tag" data-i18n="gate_tag">ILSHIN CASTING · SAFETY</span>
    <h2 data-i18n="gate_title">통합 안전관리 시스템</h2>
    <p data-i18n="gate_desc">안전환경부 · 사고예방 및 현장관리 통합 플랫폼</p>
    <div class="field">
      <label data-i18n="gate_lang_label">언어 선택</label>
      <div class="lang-picker" id="langPicker">
        <button type="button" class="lang-btn" data-lang="ko"><span class="flag">🇰🇷</span><span>한국어</span></button>
        <button type="button" class="lang-btn" data-lang="en"><span class="flag">🇺🇸</span><span>English</span></button>
        <button type="button" class="lang-btn" data-lang="th"><span class="flag">🇹🇭</span><span>ไทย</span></button>
        <button type="button" class="lang-btn" data-lang="id"><span class="flag">🇮🇩</span><span>Indonesia</span></button>
        <button type="button" class="lang-btn" data-lang="mn"><span class="flag">🇲🇳</span><span>Монгол</span></button>
      </div>
    </div>
    <div class="field">
      <label data-i18n="gate_mode_label">접속 모드</label>
      <select id="gateMode">
        <option value="user" data-i18n="gate_mode_user">일반 열람 (조회 · 신청 · 제보)</option>
        <option value="admin" data-i18n="gate_mode_admin">관리자</option>
      </select>
    </div>
    <div class="field" id="gatePwWrap" hidden>
      <label data-i18n="gate_pw_label">비밀번호</label>
      <input type="text" id="gatePw" placeholder="비밀번호 입력" data-i18n-placeholder="gate_pw_placeholder">
      <p class="hint" data-i18n="gate_pw_hint">비밀번호에 따라 전체관리자 또는 해당 부서 관리자로 자동 접속됩니다.</p>
      <label style="display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;font-weight:600;color:var(--ink-soft);">
        <input type="checkbox" id="gateRemember"> 이 기기에서 로그인 상태 유지 (다음부터 비밀번호 없이 접속)
      </label>
    </div>
    <div class="gate-actions">
      <button class="btn btn-primary" id="gateEnter" style="flex:1" data-i18n="gate_enter">입장하기</button>
    </div>
    <button class="btn btn-sm" id="gateInstallBtn" style="width:100%;margin-top:8px;display:none;"></button>
  </div>
</div>

/* ============================================================
   0. Firebase 설정
   -------------------------------------------------------------
   ⚠️ 아래 값을 Firebase 콘솔(console.firebase.google.com)에서
   새로 만든 프로젝트의 "프로젝트 설정 > 일반 > 내 앱 > SDK 설정"
   값으로 교체하세요. Realtime Database를 반드시 활성화해야 합니다.
============================================================= */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyApm6yQhoaoKhkV9k3QNm2hTMjwP6NsNf4",
  authDomain: "safety-ilshin-ce0f1.firebaseapp.com",

const CONFIG_IS_PLACEHOLDER = FIREBASE_CONFIG.apiKey === "YOUR_API_KEY";

let db = null;
if(!CONFIG_IS_PLACEHOLDER){
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.database();
}

/* 로컬 폴백 저장소 (Firebase 설정 전 데모/오프라인용) ------------- */
const LocalStore = {
  read(path){ try{return JSON.parse(localStorage.getItem('isc_'+path))||{}}catch(e){return {}} },
  write(path,val){ localStorage.setItem('isc_'+path, JSON.stringify(val)); }
};

/* ============================================================
   1. 데이터 계층 — Firebase 사용 가능하면 RTDB, 아니면 로컬 저장
============================================================= */
const DataStore = {
  _cache:{},
  _listeners:{},

  listen(path, cb){
    this._listeners[path] = this._listeners[path]||[];
    this._listeners[path].push(cb);
    if(db){
      db.ref(path).on('value', snap=>{
        const val = snap.val() || {};
        this._cache[path] = val;
        this._listeners[path].forEach(fn=>fn(val));
      });
    }else{
      const val = LocalStore.read(path);
      this._cache[path] = val;
      cb(val);
    }
  },
  async push(path, data){
    const id = 'id_' + Date.now() + '_' + Math.floor(Math.random()*1000);
    if(db){
      await db.ref(path+'/'+id).set(data);
    }else{
      const val = LocalStore.read(path);
      val[id] = data;
      LocalStore.write(path, val);
      this._cache[path] = val;
      (this._listeners[path]||[]).forEach(fn=>fn(val));
    }
    return id;
  },
  async update(path, id, data){
    if(db){
      await db.ref(path+'/'+id).update(data);
    }else{
      const val = LocalStore.read(path);
      val[id] = Object.assign({}, val[id], data);
      LocalStore.write(path, val);
      this._cache[path] = val;
      (this._listeners[path]||[]).forEach(fn=>fn(val));
    }
  },
  async remove(path, id){
    if(db){
      await db.ref(path+'/'+id).remove();
    }else{
      const val = LocalStore.read(path);
      delete val[id];
      LocalStore.write(path, val);
      this._cache[path] = val;
      (this._listeners[path]||[]).forEach(fn=>fn(val));
    }
  },
  get(path){ return this._cache[path] || {}; }
};

/* ============================================================
   2. 전역 상태
============================================================= */
const State = {
  mode: 'user', // 'user' | 'dept' | 'admin'
  dept: null,   // '관리부' | '생산부' | '품질관리부' — mode==='dept'일 때만 사용
  view: 'dashboard',
  filters: {},
  lang: localStorage.getItem('isc_lang') || 'ko' // 'ko'|'en'|'th'|'id'|'mn'
};
// 작업허가 "작업종료 확인 입력"은 부서관리자·전체관리자 모두 가능
function canTerminate(){ return State.mode==='admin' || State.mode==='dept'; }
const isMobileDevice = /android|iphone|ipad|ipod|windows phone/i.test(navigator.userAgent);

// 사진 등록 필드 — 모바일에서는 "사진 선택"/"카메라로 촬영" 두 버튼, 데스크탑에서는 일반 파일 선택
function photoFieldHtml(id, existingSrc, hintHtml){
  return `
    <input type="file" accept="image/*" id="${id}" style="display:none">
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button type="button" class="btn btn-sm" id="${id}_pick">📁 ${t('photo_pick_btn')}</button>
      ${isMobileDevice ? `<button type="button" class="btn btn-sm" id="${id}_cam">📷 ${t('photo_camera_btn')}</button>` : ''}
    </div>
    <div id="${id}_preview" style="margin-top:8px;">${existingSrc?`<img src="${existingSrc}" style="width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line);">`:''}</div>
    ${hintHtml||''}
  `;
}
function bindPhotoField(id){
  const input = document.getElementById(id);
  const pickBtn = document.getElementById(id+'_pick');
  const camBtn = document.getElementById(id+'_cam');
  const preview = document.getElementById(id+'_preview');
  pickBtn.addEventListener('click', ()=>{ input.removeAttribute('capture'); input.click(); });
  if(camBtn){
    camBtn.addEventListener('click', ()=>{ input.setAttribute('capture','environment'); input.click(); });
  }
  input.addEventListener('change', ()=>{
    const f = input.files[0];
    if(f){
      const url = URL.createObjectURL(f);
      preview.innerHTML = `<img src="${url}" style="width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line);">`;
    }
  });
}

function toast(msg){
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('show'), 2400);
}
function fmtDate(d){
  if(!d) return '-';
  const dt = new Date(d);
  if(isNaN(dt)) return d;
  return `${dt.getFullYear()}.${String(dt.getMonth()+1).padStart(2,'0')}.${String(dt.getDate()).padStart(2,'0')}`;
}
function fmtDateTime(d){
  if(!d) return '-';
  const dt = new Date(d);
  if(isNaN(dt)) return d;
  return `${fmtDate(d)} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
}
function daysBetween(a,b){
  return Math.floor((new Date(b) - new Date(a)) / 86400000);
}
function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function esc(s){
  return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function objToArr(obj){ return Object.entries(obj||{}).map(([id,v])=>({id, ...v})); }

}

function renderNav(){
  const nav = document.getElementById('navList');
  const items = State.mode==='partner' ? NAV_ITEMS.filter(i=>i.id==='permits') : NAV_ITEMS;
  nav.innerHTML = items.map(item=>{
    const count = navBadgeCount(item.id);
    const isNew = hasNewItems(item.id);
    return `<button class="nav-item ${State.view===item.id?'active':''}" data-view="${item.id}">
      ${icon(item.icon)}<span>${t(item.labelKey)}</span>${isNew?'<span class="nav-dot" title="새 항목 있음"></span>':''}
      ${count!=null?`<span class="nav-badge">${count}</span>`:''}
    </button>`;
  }).join('');
  nav.querySelectorAll('.nav-item').forEach(btn=>{
    btn.addEventListener('click', ()=> switchView(btn.dataset.view));
  });
}
function hasNewItems(viewId){
  if(viewId==='suggestions') return State.mode==='admin' && hasNewInList(objToArr(DataStore.get(PATHS.suggestions)), PATHS.suggestions);
  if(viewId==='bugs') return State.mode==='admin' && hasNewInList(objToArr(DataStore.get(PATHS.bugReports)), PATHS.bugReports);
  if(viewId==='permits' && State.mode==='partner'){
    const arr = objToArr(DataStore.get(PATHS.permits)).filter(p=>p.company===State.partnerCompany);
    return hasNewInList(arr, PATHS.permits);
  }
  const pathMap = {
    permits: [PATHS.permits],
    risks: [PATHS.risks],
    incidents: [PATHS.incidents],
    contractors: [PATHS.contractorRecords],
    notices: [PATHS.notices],
  };
  const paths = pathMap[viewId];
  if(!paths) return false;
  return paths.some(path=> hasNewInList(objToArr(DataStore.get(path)), path));
}
function navBadgeCount(viewId){
  if(viewId==='permits'){
    let arr = objToArr(DataStore.get(PATHS.permits));
    if(State.mode==='partner') arr = arr.filter(p=>p.company===State.partnerCompany);
    const n = arr.filter(p=>p.status==='신청'||p.status==='검토중').length;
    return n>0 ? n : null;
  }
  if(viewId==='incidents'){
    const arr = objToArr(DataStore.get(PATHS.incidents));
    const n = arr.filter(i=>i.status!=='완료').length;
    return n>0 ? n : null;
  }
  if(viewId==='risks'){
    const arr = objToArr(DataStore.get(PATHS.risks));
    const n = arr.filter(r=>r.status!=='완료').length;
    return n>0 ? n : null;
  }
  return null;
}

function switchView(id){
  if(State.mode==='partner' && id!=='permits') id = 'permits';
  State.view = id;
  const item = NAV_ITEMS.find(n=>n.id===id);
  const isDashboard = id==='dashboard';
  document.getElementById('pageTitleWrap').style.display = isDashboard ? 'none' : '';
  document.getElementById('pageTitle').textContent = t(item.labelKey);
  document.getElementById('pageSub').textContent = t(item.subKey);
  renderNav();
  document.querySelectorAll('.view').forEach(v=> v.hidden = v.id !== 'view-'+id);
  closeMobileSidebar();
  renderCurrentView();
}
function renderCurrentView(){
  ({
    dashboard: renderDashboard,
    permits: renderPermits,
    risks: renderRisks,
    incidents: renderIncidents,
    contractors: renderContractors,
    tbm: renderTbm,
    notices: renderNotices,
    suggestions: renderSuggestions,
    bugs: renderBugs
  }[State.view]||function(){})();
}

let monthlyChartInstance = null;
let accidentTypeChartInstance = null;
const ACCIDENT_CHART_COLORS = ['#FF6A13','#2D7DD2','#FFC93C','#1DA46F','#E5484D','#8C99B8','#B24A00','#946200'];
function renderAccidentTypeChart(incidents){
  const canvas = document.getElementById('accidentTypeChart');
  if(!canvas || typeof Chart==='undefined') return;
  const counts = {};
  incidents.forEach(i=>{
    const label = i.accidentType==='기타(직접입력)' ? (i.accidentTypeOther||'기타') : (i.accidentType||'미분류');
    counts[label] = (counts[label]||0) + 1;
  });
  const labels = Object.keys(counts);
  const data = Object.values(counts);
  if(accidentTypeChartInstance){ accidentTypeChartInstance.destroy(); }
  if(labels.length===0){
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0,0,canvas.width,canvas.height);
    return;
  }
  accidentTypeChartInstance = new Chart(canvas.getContext('2d'), {
    type: 'doughnut',
    data: {
      labels,
      datasets: [{ data, backgroundColor: labels.map((_,i)=>ACCIDENT_CHART_COLORS[i%ACCIDENT_CHART_COLORS.length]), borderWidth:2, borderColor:'#fff' }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position:'bottom', labels:{ boxWidth:10, font:{size:10.5}, color:'#4B5468', padding:8 } },
        datalabels: {
          color:'#fff', font:{ weight:'700', size:10 }, textAlign:'center',
          formatter: (value, ctx) => {
            const total = ctx.chart.data.datasets[0].data.reduce((a,b)=>a+b,0);
            const pct = total ? Math.round(value/total*100) : 0;
            return value>0 ? [`${value}건`, `${pct}%`] : '';
          }
        }
      },
      cutout: '58%'
    }
  });
}
function computeMonthlyIncidentCounts(incidents, monthsBack){
  const now = new Date();
  const labels = [];
  const keys = [];
  for(let i=monthsBack-1; i>=0; i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    keys.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);
    labels.push(`${d.getMonth()+1}월`);
  }
  const counts = keys.map(k=> incidents.filter(i=> (i.datetime||'').slice(0,7)===k).length);
  return { labels, counts };
}
function renderMonthlyChart(monthly){
  const canvas = document.getElementById('monthlyChart');
  if(!canvas || typeof Chart==='undefined') return;
  if(monthlyChartInstance){ monthlyChartInstance.destroy(); }
  monthlyChartInstance = new Chart(canvas.getContext('2d'), {
    type: 'bar',
    data: {
      labels: monthly.labels,
      datasets: [{
        label: '재해 건수',
        data: monthly.counts,
        backgroundColor: '#FF6A13',
        borderRadius: 5,
        maxBarThickness: 32
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display:false },
        datalabels: {
          anchor:'end', align:'top', offset:2,
          color:'#B24A00', font:{ weight:'700', size:11.5 },
          formatter: (value)=> value>0 ? value : ''
        }
      },
      layout: { padding: { top: 22 } },
      scales: {
        y: { beginAtZero:true, ticks:{ precision:0, color:'#667085', font:{size:10.5} }, grid:{ color:'#EEF1F5' } },
        x: { ticks:{ color:'#667085', font:{size:10.5} }, grid:{ display:false } }
      }
    }
  });
}

function renderMiniList(arr, mapFn, mlPath){
  if(!arr || arr.length===0) return `<div class="empty"><span class="big">${icon('grid',22)}</span>등록된 항목이 없습니다</div>`;
  const sorted = [...arr].sort((a,b)=> new Date(b.createdAt||b.startDate||b.datetime||0) - new Date(a.createdAt||a.startDate||a.datetime||0));
  return sorted.slice(0,6).map(item=>{
    const m = mapFn(item);
    return `<div class="mini-row">
      <div class="mr-title">${newBadge(item, mlPath)}${esc(m.title)}</div>
      <div class="mr-meta">${esc(m.meta)}</div>
      ${m.badge||''}
    </div>`;
  }).join('');
}

/* ============================================================
   8. 배지 / 위험도 헬퍼
============================================================= */
const NEW_THRESHOLD_MS = 24*60*60*1000; // 24시간 이내 등록된 항목은 NEW 표시

/* 읽음 상태 추적 — 전체관리자 모드에서만 적용, 이 브라우저(내 계정)에만 저장되고
   다른 계정(일반/부서관리자)이나 다른 기기와는 공유되지 않음 */
function getReadSet(path){
  try{ return new Set(JSON.parse(localStorage.getItem('isc_read_'+path) || '[]')); }
  catch(e){ return new Set(); }
}
function markRead(path, id){
  if(!path || !id) return;
  const set = getReadSet(path);
  if(set.has(id)) return;
  set.add(id);
  localStorage.setItem('isc_read_'+path, JSON.stringify([...set]));
}
function isRead(path, id){ return getReadSet(path).has(id); }

function isItemNew(item, path){
  if(!item) return false;
  if(path===PATHS.permits){
    // 부서관리자가 "검토완료"로 넘기면 전체관리자에게 NEW (createdAt과 무관하게)
    if(State.mode==='admin' && item.status==='검토완료' && item.reviewCompletedAt){
      if(Date.now() - item.reviewCompletedAt < NEW_THRESHOLD_MS && !isRead(path, item.id+'_review_'+item.reviewCompletedAt)){
        return true;
      }
    }
    // 전체관리자가 "승인"하면 부서관리자에게 NEW (작업종료 확인을 해야 함을 알림)
    if(State.mode==='dept' && item.status==='승인' && item.approvedAt){
      if(Date.now() - item.approvedAt < NEW_THRESHOLD_MS && !isRead(path, item.id+'_approved_'+item.approvedAt)){
        return true;
      }
    }
    // 작업종료 확인 입력이 끝나면 전체관리자에게 다시 NEW (최종 종료 처리 필요)
    if(State.mode==='admin' && item.status==='승인' && item.terminationEnteredAt){
      if(Date.now() - item.terminationEnteredAt < NEW_THRESHOLD_MS && !isRead(path, item.id+'_termconfirm_'+item.terminationEnteredAt)){
        return true;
      }
    }
  }
  if(!item.createdAt) return false;
  if(Date.now() - item.createdAt >= NEW_THRESHOLD_MS) return false;
  if(State.mode==='admin' && path && isRead(path, item.id)) return false;
  return true;
}
function hasNewInList(arr, path){
  return (arr||[]).some(item => isItemNew(item, path));

function newBadge(item, path){

function statusBadge(kind, status){

  '생산관리':'관리부','환경정리':'관리부',
  '집진기':'안전환경부'
};

// 위험도 등급 — 회사 「위험성평가 실시규정」의 빈도강도법(6단계, Ⅰ~Ⅵ) 기준
function riskLevel(r){
  const score = (Number(r.frequency)||0) * (Number(r.severity)||0);
  if(score>=16) return 6; // Ⅵ 매우높음 (16~20)
  if(score>=13) return 5; // Ⅴ 높음 (15)
  if(score>=9) return 4;  // Ⅳ 약간높음 (9~12)
  if(score===8) return 3; // Ⅲ 보통 (8)
  if(score>=4) return 2;  // Ⅱ 낮음 (4~6)
  return 1;                // Ⅰ 매우낮음 (1~3)
}
const RISK_LEVEL_SCORE_RANGE = {1:'1~3',2:'4~6',3:'8',4:'9~12',5:'15',6:'16~20'};
const RISK_LEVEL_ROMAN = {1:'Ⅰ',2:'Ⅱ',3:'Ⅲ',4:'Ⅳ',5:'Ⅴ',6:'Ⅵ'};
function riskLevelInfo(lv){
  return {
    scoreRange: RISK_LEVEL_SCORE_RANGE[lv],
    roman: RISK_LEVEL_ROMAN[lv],
    label: t('risklevel_label_'+lv),
    action: t('risklevel_action_'+lv),
    desc: t('risklevel_desc_'+lv),
  };
}
function riskChip(r){
  const score = (Number(r.frequency)||0) * (Number(r.severity)||0);
  const lv = riskLevel(r);
  const info = riskLevelInfo(lv);
  return `<span class="risk-chip risk-${lv}" title="위험도 ${info.roman} ${info.label} · ${info.action}">${score}</span>`;
}
// 위험도 등급을 세로형 배지로 (점수 위 · 조치명 아래) — 폭을 줄여 목록에서 옆으로 안 길어지게
function riskLevelBadge(r){
  const score = (Number(r.frequency)||0) * (Number(r.severity)||0);
  const lv = riskLevel(r);
  const info = riskLevelInfo(lv);
  return `<span class="risk-level-badge risk-${lv}" title="위험도 ${info.roman} ${info.label}">
    <span class="rlb-score">${score}</span><span class="rlb-action">(${esc(info.action)})</span>
  </span>`;
}
// 목록/상세보기에서 개선전·개선후 위험도를 각각 별도 칸/항목으로 표시 (riskLevelBadge를 직접 호출)
function riskLegendHtml(){
  return `<div class="risk-legend">
    ${[6,5,4,3,2,1].map(lv=>{
      const info = riskLevelInfo(lv);
      return `<div class="risk-legend-item">
        <span class="risk-chip risk-${lv}">${info.roman}</span>
        <div><b>${esc(info.label)}(${info.scoreRange}) · ${esc(info.action)}</b><div class="hint" style="margin:1px 0 0;">${esc(info.desc)}</div></div>
      </div>`;
    }).join('')}
  </div>`;
}

function genPartnerToken(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID().replace(/-/g,'').slice(0,16);
  return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,10);
}
function partnerLinkUrl(token){
  return `${location.origin}${location.pathname}?p=${token}`;
}
function renderPartnerList(){
  const partners = objToArr(DataStore.get(PATHS.permitPartners)).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  const tbody = document.getElementById('partnerBody');

  tbody.innerHTML = partners.length ? partners.map(p=>`
    <tr>

  tbody.querySelectorAll('[data-copy-p]').forEach(b=> b.addEventListener('click', async ()=>{
    const p = partners.find(x=>x.id===b.dataset.copyP);
    try{ await navigator.clipboard.writeText(partnerLinkUrl(p.token)); toast('링크가 복사되었습니다'); }

  tbody.querySelectorAll('[data-edit-p]').forEach(b=> b.addEventListener('click', ()=>{

  tbody.querySelectorAll('[data-reissue-p]').forEach(b=> b.addEventListener('click', async ()=>{

  }));
  tbody.querySelectorAll('[data-del-p]').forEach(b=> b.addEventListener('click', async ()=>{
    if(!confirm(t('confirm_delete'))) return;
    await DataStore.remove(PATHS.permitPartners, b.dataset.delP);
    toast(t('toast_deleted'));
    renderPartnerList();
  }));
}

// 서명패드 — 마우스/터치로 서명을 그려서 PNG(dataURL)로 저장
let signaturePadOpen = false;
function openSignaturePad(title, onSave){
  signaturePadOpen = true;
  showModal2(`
    <div class="modal-head"><h3>${esc(title)}</h3><button class="x-btn" data-close>✕</button></div>
    <div class="modal-body">
      <p class="hint" style="margin-bottom:8px;">아래 네모칸 안에 손가락 또는 마우스로 서명해주세요.</p>
      <canvas id="sigCanvas" style="width:100%;aspect-ratio:5/2;border:1px solid var(--line);border-radius:8px;background:#fff;touch-action:none;display:block;"></canvas>
    </div>
    <div class="modal-foot">
      <button class="btn" id="sigClearBtn">지우기</button>
      <button class="btn" data-close>취소</button>
      <button class="btn btn-primary" id="sigSaveBtn">서명 완료</button>
    </div>
  `);
  document.querySelectorAll('#modalBox2 [data-close]').forEach(el=> el.addEventListener('click', ()=>{ signaturePadOpen = false; }));
  const canvas = document.getElementById('sigCanvas');
  const ctx = canvas.getContext('2d');
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * 2;
  canvas.height = rect.height * 2;
  ctx.scale(2,2);
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#14192B';
  let drawing = false, hasDrawn = false;
  function getPos(e){
    const r = canvas.getBoundingClientRect();
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: cx-r.left, y: cy-r.top };
  }
  function start(e){ drawing=true; hasDrawn=true; const p=getPos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); e.preventDefault(); e.stopPropagation(); }
  function move(e){ if(!drawing) return; const p=getPos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); e.preventDefault(); }
  function end(){ drawing=false; }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);
  document.getElementById('sigClearBtn').addEventListener('click', ()=>{
    ctx.clearRect(0,0,canvas.width,canvas.height);
    hasDrawn = false;
  });
  document.getElementById('sigSaveBtn').addEventListener('click', ()=>{
    if(!hasDrawn){ toast('서명을 입력해주세요'); return; }
    const dataUrl = canvas.toDataURL('image/png');
    signaturePadOpen = false;
    closeModal2();
    onSave(dataUrl);
  });
}
function sigPreviewHtml(dataUrl){
  return dataUrl ? `<img src="${dataUrl}" style="height:44px;border:1px solid var(--line);border-radius:6px;background:#fff;">` : '';
}
function dataUrlToUint8Array(dataUrl){
  const base64 = (dataUrl||'').split(',')[1] || '';
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++){ bytes[i] = binary.charCodeAt(i); }
  return bytes;
}

const BLANK_SIG_PNG = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR4nGNgYGBgAAAABQABpfZFQAAAAABJRU5ErkJggg==';
// 서명 이미지를 문서에 직접 삽입 (docxtemplater 이미지 모듈은 브라우저에서 호환성 버그가 있어 사용하지 않음)
// signatures: [{marker, dataUrl}] — dataUrl이 없으면 건너뜀(빈 칸으로 유지)
function injectSignatureImages(zip, signatures){
  const docXmlPath = 'word/document.xml';
  const relsPath = 'word/_rels/document.xml.rels';
  let xml = zip.file(docXmlPath).asText();
  let relsXml = zip.file(relsPath).asText();

  const existingIds = [...relsXml.matchAll(/Id="rId(\d+)"/g)].map(m=>parseInt(m[1],10));
  let nextRid = (existingIds.length ? Math.max(...existingIds) : 0) + 1;
  const mediaFiles = Object.keys(zip.files).filter(f=>/^word\/media\/image(\d+)\.png$/.test(f));
  const existingMediaNums = mediaFiles.map(f=> parseInt(f.match(/image(\d+)\.png/)[1],10));
  let mediaIndex = (existingMediaNums.length ? Math.max(...existingMediaNums) : 0) + 1;

  const cx = 762000, cy = 381000; // EMU 단위, 약 80x40px 상당의 인라인 크기
  const newRels = [];

  signatures.forEach(({marker, dataUrl})=>{
    if(!dataUrl) return;
    const runRe = new RegExp(`<w:r><w:t xml:space="preserve">${marker}</w:t></w:r>`);
    if(!runRe.test(xml)) return;
    const rId = 'rId' + (nextRid++);
    const mediaName = `image${mediaIndex}.png`;
    const picId = 100 + (mediaIndex++);
    const drawingXml = `<w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/><wp:effectExtent l="0" t="0" r="0" b="0"/><wp:docPr id="${picId}" name="Signature${picId}"/><wp:cNvGraphicFramePr><a:graphicFrameLocks xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" noChangeAspect="1"/></wp:cNvGraphicFramePr><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="${picId}" name="${mediaName}"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="${rId}" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>`;
    xml = xml.replace(runRe, drawingXml);
    zip.file(`word/media/${mediaName}`, dataUrlToUint8Array(dataUrl));
    newRels.push(`<Relationship Id="${rId}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/${mediaName}"/>`);
  });

  if(newRels.length){
    relsXml = relsXml.replace('</Relationships>', newRels.join('') + '</Relationships>');
    zip.file(relsPath, relsXml);
    zip.file(docXmlPath, xml);
  }
}

function generatePermitDocx(p){
  if(typeof PizZip==='undefined' || typeof window.docxtemplater==='undefined'){
    toast('문서 생성 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해주세요.');
    return;
  }
  try{
    const binary = atob(PERMIT_TEMPLATE_B64);
    const bytes = new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++){ bytes[i] = binary.charCodeAt(i); }
    const zip = new PizZip(bytes);
    const doc = new window.docxtemplater(zip, { paragraphLoop:true, linebreaks:true });
    const equipmentText = [...(p.equipment||[]), p.equipmentOther].filter(Boolean).join(', ') || '-';

    // 서명이 실제로 있는 항목만 고유 마커를 부여 (없으면 빈 문자열 → 해당 칸은 비워둠)
    const sigList = [
      { key:'contractorSigMarker', marker:'ZZSIGCONTRACTORZZ', dataUrl: p.contractorSignature },
      { key:'managerSigMarker',    marker:'ZZSIGMANAGERZZ',    dataUrl: p.deptSignature },
      { key:'approverSigMarker',   marker:'ZZSIGAPPROVERZZ',   dataUrl: p.approverSignature },
      { key:'endConfirmSigMarker', marker:'ZZSIGENDCONFIRMZZ', dataUrl: p.endConfirmerSignature },
    ];
    const renderData = {
      company: p.company||'',
      workName: p.workContent||'',
      workPeriod: `${fmtDate(p.startDate)} ~ ${fmtDate(p.endDate)}`,
      location: p.location||'',
      headcount: p.headcount||'',
      siteSuper: p.contractorLead||'',
      equipment: equipmentText,
      hazardMeasures: p.hazardDetail||'',
      fireYesBox: p.fireWork ? '☑' : '□',
      fireDetail: p.fireWork ? (p.fireDetail||'') : '',
      fireNoBox: p.fireWork ? '□' : '☑',
      watchman: p.fireWork ? (p.watchman||'') : '',
      extinguisher: p.fireWork ? (p.fireExtinguisher||'') : '',
      combustible: p.fireWork ? (p.combustibleRemoval||'') : '',
      contractorSign: p.contractorLead||'',
      managerSign: p.deptName || p.processManager || '',
      approverSign: p.approverName||'',
      endDatetime: p.endDatetime ? fmtDateTime(p.endDatetime) : '',
      siteConditionText: p.siteCondition ? (p.siteCondition==='이상없음' ? '☑ 이상없음   □ 이상있음' : '□ 이상없음   ☑ 이상있음') : '□ 이상없음   □ 이상있음',
      residualCheck: p.fireWork ? (p.residualCheck||'') : '',
      endConfirmer: p.endConfirmer||'',
    };
    sigList.forEach(s=>{ renderData[s.key] = s.dataUrl ? s.marker : ''; });
    doc.render(renderData);

    const outZip = doc.getZip();
    injectSignatureImages(outZip, sigList.map(s=>({ marker:s.marker, dataUrl:s.dataUrl })));

    const out = outZip.generate({ type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
    const url = URL.createObjectURL(out);
    const a = document.createElement('a');
    a.href = url;
    const safeCompany = (p.company||'업체명').replace(/[\\/:*?"<>|]/g,'');
    a.download = `안전작업허가서_${safeCompany}_${p.startDate||''}.docx`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 3000);
    toast('허가서 파일이 다운로드되었습니다');
  }catch(err){
    console.error('허가서 다운로드 오류:', err);
    let detail = err && err.message ? err.message : String(err);
    if(err && err.properties && err.properties.errors && err.properties.errors.length){
      console.error('상세 오류 목록:', err.properties.errors);
      detail = err.properties.errors.map(e=> e.message || e.name || JSON.stringify(e)).join(' / ');
    }
    alert('문서 생성 중 오류가 발생했습니다.\n\n[오류 내용]\n' + detail + '\n\n이 내용을 캡처해서 전달해주시면 빠르게 확인하겠습니다.');
  }
}

function renderRisks(){
  const el = document.getElementById('view-risks');
  const filter = State.filters.risks || '전체';
  const processFilter = State.filters.risksProcess || '전체';
  const viewMode = State.filters.risksView || 'table';
  const isAdmin = State.mode==='admin';

  function getFilteredRisks(){
    const arr = objToArr(DataStore.get(PATHS.risks)).sort((a,b)=>{
      return riskLevel(b) - riskLevel(a);
    });
    let f = filter==='전체' ? arr : arr.filter(r=>r.status===filter);
    if(processFilter!=='전체') f = f.filter(r=>r.process===processFilter);
    return f;
  }

  el.innerHTML = `
    <div class="toolbar">
      <div class="tabs" id="riskTabs">
        ${['전체','등록','접수완료','조치중','완료','일부개선완료'].map(s=>`<button class="tab ${filter===s?'active':''}" data-s="${s}">${s==='전체'?t('tab_all'):statusLabel(s)}</button>`).join('')}
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <select id="riskProcessFilter" class="btn btn-sm" style="font-weight:700;">
          <option value="전체">${t('tab_all')} (${t('th_process_task')})</option>
          ${PROCESS_OPTIONS.map(p=>`<option value="${p}" ${processFilter===p?'selected':''}>${esc(p)}</option>`).join('')}
        </select>
        <button class="btn btn-sm" id="galleryToggleBtn">${viewMode==='table' ? icon('alert-triangle',14)+' '+t('btn_gallery_view') : icon('grid',14)+' '+t('btn_table_view')}</button>
        ${isAdmin ? `<button class="btn btn-sm" id="printRisksBtn">${icon('file-check',14)} ${t('btn_print')}</button>` : ''}
        ${isAdmin ? `<button class="btn btn-sm" id="excelRisksBtn">${icon('file-check',14)} ${t('btn_excel')}</button>` : ''}
        <button class="btn btn-primary" id="addRiskBtn">${icon('plus',15)} ${t('risks_add_btn')}</button>
      </div>
    </div>
    ${viewMode==='table' ? riskLegendHtml() : ''}
    <div id="riskViewArea"></div>
  `;
  el.querySelectorAll('#riskTabs .tab').forEach(t=>t.addEventListener('click', ()=>{
    State.filters.risks = t.dataset.s; renderRisks();
  }));
  document.getElementById('riskProcessFilter').addEventListener('change', e=>{
    State.filters.risksProcess = e.target.value; renderRisks();
  });
  document.getElementById('galleryToggleBtn').addEventListener('click', ()=>{
    State.filters.risksView = viewMode==='table' ? 'gallery' : 'table';
    renderRisks();
  });
  if(isAdmin){
    document.getElementById('printRisksBtn').addEventListener('click', ()=> printRisks(getFilteredRisks()));
    document.getElementById('excelRisksBtn').addEventListener('click', ()=> exportRisksExcel(getFilteredRisks()));
  }
  el.querySelector('#addRiskBtn').addEventListener('click', ()=>{
    openRiskModal();
  });

  const filtered = getFilteredRisks();
  const area = document.getElementById('riskViewArea');

  if(viewMode==='gallery'){
    const done = filtered.filter(r=>r.status==='완료'||r.status==='일부개선완료');
    if(done.length===0){
      area.innerHTML = `<div class="empty"><span class="big">${icon('alert-triangle',22)}</span>${t('gallery_empty')}</div>`;
      return;
    }
    area.innerHTML = `<div class="gallery-grid">${done.map(r=>{
      const beforeScore = (Number(r.frequency)||0)*(Number(r.severity)||0);
      const afterScore = (r.afterFrequency && r.afterSeverity) ? (Number(r.afterFrequency)*Number(r.afterSeverity)) : null;
      return `<div class="gallery-card">
        <div class="gc-photos">
          <div class="gc-photo">${r.photoBefore?`<img src="${r.photoBefore}" class="risk-photo-lg">`:`<div class="gc-noimg">${t('gallery_no_photo')}</div>`}<span class="gc-tag">${t('gallery_before')}</span></div>
          <div class="gc-photo">${r.photoAfter?`<img src="${r.photoAfter}" class="risk-photo-lg">`:`<div class="gc-noimg">${t('gallery_no_photo')}</div>`}<span class="gc-tag">${t('gallery_after')}</span></div>
        </div>
        <div class="gc-body">
          <div class="gc-head"><b>${esc(r.process||'-')}</b> ${statusBadge('risk', r.status)}</div>
          <div class="gc-hazard">${esc(r.hazard||'-')}</div>
          <div class="gc-score">${beforeScore}${afterScore!=null?` → <b>${afterScore}</b>`:''}</div>
        </div>
      </div>`;
    }).join('')}</div>`;
    bindImageZoom(area);
    return;
  }

  area.innerHTML = `
    <div class="table-wrap"><table>
      <thead><tr>
        <th>${t('th_process_task')}</th><th>${t('th_hazard')}</th><th class="tight">${t('th_frequency')}</th><th class="tight">${t('th_severity')}</th><th class="tight">${t('th_risklevel_before')}</th><th class="tight">${t('th_risklevel_after')}</th><th>${t('th_measures')}</th><th>${t('dt_photo_site')}</th><th>${t('dt_photo_after')}</th><th>${t('th_reporter_applicant')}</th><th>${t('th_status')}</th><th class="tight">${t('btn_manage_col')}</th>
      </tr></thead>
      <tbody id="riskBody"></tbody>
    </table></div>
  `;
  const body = document.getElementById('riskBody');
  if(filtered.length===0){
    body.innerHTML = `<tr><td colspan="12"><div class="empty"><span class="big">${icon('alert-triangle',22)}</span>${t('risks_empty')}</div></td></tr>`;
    return;
  }
  body.innerHTML = filtered.map(r=>`
    <tr>
      <td class="cell-strong">${newBadge(r, PATHS.risks)}${esc(r.process||'-')}<div class="cell-sub">${esc(r.task||'')}</div></td>
      <td>${esc(r.hazard||'-')}</td>
      <td class="tight mono">${r.frequency||0}</td>
      <td class="tight mono">${r.severity||0}</td>
      <td class="tight">${riskLevelBadge(r)}</td>
      <td class="tight">${(r.afterFrequency && r.afterSeverity) ? riskLevelBadge({frequency:r.afterFrequency, severity:r.afterSeverity}) : '<span style="color:var(--ink-faint);font-size:11.5px;">-</span>'}</td>
      <td>${esc(r.measures||'-')}</td>
      <td>${riskThumb(r.photoBefore)}</td>
      <td>${riskThumb(r.photoAfter)}</td>
      <td>${esc(r.reporter||'-')}</td>
      <td>${statusBadge('risk', r.status)}</td>
      <td class="tight row-btns"><button class="btn btn-sm" data-view-id="${r.id}">${t('btn_view')}</button></td>
    </tr>
  `).join('');
  body.querySelectorAll('[data-view-id]').forEach(b=> b.addEventListener('click', ()=> openRiskDetail(b.dataset.viewId)));
  bindImageZoom(body);
}

function riskThumb(src){
  if(!src) return '<span style="color:var(--ink-faint);font-size:11.5px;">-</span>';
  return `<img src="${src}" class="risk-thumb" style="width:56px;height:56px;object-fit:cover;border-radius:7px;border:1px solid var(--line);cursor:zoom-in;">`;
}
// 사진(썸네일) 클릭 시 원본 크기로 확대해서 보여주는 라이트박스
function bindImageZoom(container){
  (container||document).querySelectorAll('img.risk-thumb, img.risk-photo-lg').forEach(img=>{
    img.addEventListener('click', ()=> openImageLightbox(img.src));
  });
}
function openImageLightbox(src){
  const overlay = document.createElement('div');
  overlay.className = 'lightbox-overlay';
  overlay.innerHTML = `<img src="${src}"><button class="lightbox-close" aria-label="close">✕</button>`;
  overlay.addEventListener('click', ()=> overlay.remove());
  document.body.appendChild(overlay);
}

// 위험성평가 엑셀 다운로드 — 공식 양식과 동일한 컬럼 구조로 출력 (한글 문서에 복사·붙여넣기 용도)
function dataUrlToExt(dataUrl){
  const m = /^data:image\/(\w+);base64,/.exec(dataUrl||'');
  return m ? m[1].replace('jpeg','jpg') : 'jpg';
}
function dataUrlToBase64(dataUrl){
  return (dataUrl||'').split(',')[1] || '';
}

function exportRisksExcel(list){
  if(!list || list.length===0){ toast(t('print_no_data')); return; }
  if(typeof XLSX==='undefined'){ toast('엑셀 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해주세요.'); return; }

  // 2부: 위험성평가표 — 실제 사용 양식(순번/공정명/세부작업명/위험분류/유해위험요인파악/현재조치/가능성/중대성/위험성/감소대책/개선후위험성/접수일/완료일/담당자) 컬럼 구조 그대로
  const header2 = ['순번','공정명','세부작업명','위험분류','유해위험요인 파악(위험발생상황 및 결과)','현재의 안전보건조치','가능성','중대성','위험성','위험성 감소대책','개선후 위험성','접수일','완료일','담당자'];
  // 3부: 위험성평가 개선계획서 — 개선전/후 사진 파일명(zip 참조), 위험성 변화, 상태 중심
  const header3 = ['공정명','점검사항(유해위험요인)','개선방법','개선전 사진파일','개선후 사진파일','개선전 위험성','개선후 위험성','상태','담당자'];

  const byProcess = {};
  list.forEach(r=>{
    const key = r.process || '기타';
    if(!byProcess[key]) byProcess[key] = [];
    byProcess[key].push(r);
  });
  // 공정별 1부터 매기는 사진 번호 — 엑셀 3부 시트와 zip 파일명이 서로 일치하도록 동일 인덱스 사용
  Object.keys(byProcess).forEach(proc=>{
    byProcess[proc].forEach((r, idx)=>{ r._photoIdx = idx+1; });
  });

  const wb = XLSX.utils.book_new();
  Object.keys(byProcess).forEach(proc=>{
    const items = byProcess[proc];
    const rows2 = items.map((r, idx)=>{
      const score = (Number(r.frequency)||0)*(Number(r.severity)||0);
      const afterScore = (r.afterFrequency && r.afterSeverity) ? Number(r.afterFrequency)*Number(r.afterSeverity) : '';
      const hazardCat = [r.hazardCategory, r.hazardDetailType].filter(Boolean).join(' · ');
      return [
        idx+1, r.process||'', r.task||'', hazardCat,
        r.hazard||'', r.currentMeasures||'',
        r.frequency||'', r.severity||'', score||'',
        r.measures||'',
        afterScore,
        r.createdAt ? fmtDate(r.createdAt) : '', '',
        r.reporter||''
      ];
    });
    const ws2 = XLSX.utils.aoa_to_sheet([header2, ...rows2]);
    ws2['!cols'] = [{wch:5},{wch:10},{wch:14},{wch:16},{wch:32},{wch:24},{wch:7},{wch:7},{wch:7},{wch:28},{wch:9},{wch:11},{wch:11},{wch:10}];
    const safeSheetName2 = (proc+'_평가표').slice(0,31).replace(/[\\\/\?\*\[\]:]/g,'');
    XLSX.utils.book_append_sheet(wb, ws2, safeSheetName2 || 'Sheet');

    const rows3 = items.map(r=>{
      const score = (Number(r.frequency)||0)*(Number(r.severity)||0);
      const afterScore = (r.afterFrequency && r.afterSeverity) ? Number(r.afterFrequency)*Number(r.afterSeverity) : '';
      return [
        r.process||'', r.hazard||'', r.measures||'',
        r.photoBefore ? `${proc}_${r._photoIdx}_개선전.${dataUrlToExt(r.photoBefore)}` : '-',
        r.photoAfter ? `${proc}_${r._photoIdx}_개선후.${dataUrlToExt(r.photoAfter)}` : '-',
        score, afterScore,
        statusLabel(r.status)||'', r.reporter||''
      ];
    });
    const ws3 = XLSX.utils.aoa_to_sheet([header3, ...rows3]);
    ws3['!cols'] = [{wch:10},{wch:32},{wch:28},{wch:22},{wch:22},{wch:10},{wch:10},{wch:12},{wch:10}];
    const safeSheetName3 = (proc+'_개선계획').slice(0,31).replace(/[\\\/\?\*\[\]:]/g,'');
    XLSX.utils.book_append_sheet(wb, ws3, safeSheetName3 || 'Sheet2');
  });
  XLSX.writeFile(wb, `위험성평가_${todayStr()}.xlsx`);

  // 사진은 엑셀에 직접 넣을 수 없어(무료 라이브러리 한계), 별도 zip 파일로 같이 내려받게 처리
  if(typeof JSZip==='undefined'){
    toast('사진 압축 라이브러리를 불러오지 못해 사진은 함께 다운로드되지 않았습니다.');
    return;
  }
  const hasAnyPhoto = list.some(r=>r.photoBefore||r.photoAfter);
  if(!hasAnyPhoto) return;
  const zip = new JSZip();
  Object.keys(byProcess).forEach(proc=>{
    const folder = zip.folder(proc);
    byProcess[proc].forEach(r=>{
      if(r.photoBefore){
        folder.file(`${proc}_${r._photoIdx}_개선전.${dataUrlToExt(r.photoBefore)}`, dataUrlToBase64(r.photoBefore), {base64:true});
      }
      if(r.photoAfter){
        folder.file(`${proc}_${r._photoIdx}_개선후.${dataUrlToExt(r.photoAfter)}`, dataUrlToBase64(r.photoAfter), {base64:true});
      }
    });
  });
  zip.generateAsync({type:'blob'}).then(blob=>{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `위험성평가_사진_${todayStr()}.zip`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
    toast('사진은 별도 zip 파일로 함께 다운로드됩니다');
  });
}

  const isAdmin = State.mode==='admin';
  showModal(`

        <select id="f_riskType">

          ${ACCIDENT_TYPES.filter(at=>at!=='기타(직접입력)').map(at=>`<option value="${at}" ${(v.riskType||v.linkedAccidentType)===at?'selected':''}>${t('accidenttype_'+at)}</option>`).join('')}

      <div class="row2">
        <div class="field"><label>${t('lbl_frequency')} *</label>
          <select id="f_frequency">
            ${[1,2,3,4,5].map(n=>`<option value="${n}" ${Number(v.frequency)===n?'selected':''}>${t('freq_'+n)}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>${t('lbl_severity')} *</label>
          <select id="f_severity">
            ${[1,2,3,4].map(n=>`<option value="${n}" ${Number(v.severity)===n?'selected':''}>${t('sev_'+n)}</option>`).join('')}
          </select>
          <p id="riskTypeHint" style="color:var(--danger);font-size:11.5px;font-weight:700;margin:5px 0 0;"></p>
        </div>
      </div>
      <div class="field"><label>${t('lbl_measures_only')} *</label><textarea id="f_measures">${esc(v.measures||'')}</textarea></div>
      <div class="field"><label>${t('lbl_photo_before')}</label>
        ${photoFieldHtml('f_photoBefore', v.photoBefore, v.photoBefore?`<p class="hint">${t('hint_photo_replace')}</p>`:'')}
      </div>
      <div class="row2">
        <div class="field"><label>${t('th_reporter_applicant')} *</label><input type="text" id="f_reporter" value="${esc(v.reporter||'')}" placeholder="이름"></div>
        ${isAdmin ? `
        <div class="field"><label>${t('lbl_progress_admin')}</label>
          <select id="f_status">${['등록','접수완료','조치중','완료'].map(s=>`<option value="${s}" ${(v.status===s || (s==='완료' && v.status==='일부개선완료'))?'selected':''}>${statusLabel(s)}</option>`).join('')}</select>
        </div>` : ''}
      </div>
      ${isAdmin ? `
      <div class="divider"></div>
      <p class="hint" style="margin-bottom:8px;font-weight:700;color:var(--ink-soft);">관리자 전용 항목 (서류용 상세분류)</p>
      <div class="row2">
        <div class="field"><label>위험분류</label>
          <select id="f_hazardCategory">
            <option value="">선택 안 함</option>
            ${HAZARD_CATEGORIES.map(c=>`<option value="${c}" ${v.hazardCategory===c?'selected':''}>${c}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>위험세부분류</label><input type="text" id="f_hazardDetailType" value="${esc(v.hazardDetailType||'')}" placeholder="예: 끼임, 낙하, 절단·베임, 고온 등"></div>
      </div>
      <div class="field"><label>현재의 안전보건조치</label><textarea id="f_currentMeasures" placeholder="현재 이미 시행 중인 안전조치 (개선대책과 별도)">${esc(v.currentMeasures||'')}</textarea></div>
      <div class="field"><label>${t('lbl_photo_after')}</label>
        ${photoFieldHtml('f_photoAfter', v.photoAfter, v.photoAfter?`<p class="hint">${t('hint_photo_replace')}</p>`:'')}
      </div>
      <div id="afterEvalFields" style="${v.status==='완료'||v.status==='일부개선완료'?'':'display:none'};background:#F7F8FA;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:6px;">
        <p class="hint" style="margin-bottom:8px;font-weight:700;">개선후 재평가 — 완료 처리 시 반드시 입력해주세요</p>
        <div class="row2">
          <div class="field"><label>개선후 가능성</label>
            <select id="f_afterFrequency">
              <option value="">${t('opt_select_please')}</option>
              ${[1,2,3,4,5].map(n=>`<option value="${n}" ${Number(v.afterFrequency)===n?'selected':''}>${t('freq_'+n)}</option>`).join('')}
            </select>
          </div>
          <div class="field"><label>개선후 강도</label>
            <select id="f_afterSeverity">
              <option value="">${t('opt_select_please')}</option>
              ${[1,2,3,4].map(n=>`<option value="${n}" ${Number(v.afterSeverity)===n?'selected':''}>${t('sev_'+n)}</option>`).join('')}
            </select>
          </div>
        </div>
        <p class="hint">재평가 점수가 6점 이하면 "완료"로 저장됩니다. 7점 이상이면 저장 전에 확인창이 뜨고, 확인하면 "일부개선완료"로 저장됩니다.</p>
      </div>
      ` : ''}
    </div>
    <div class="modal-foot">
      <button class="btn" data-close>${t('btn_cancel')}</button>
      <button class="btn btn-primary" id="saveRiskBtn">${t('btn_save')}</button>
    </div>
  `);
  bindPhotoField('f_photoBefore');
  const riskTypeSel = document.getElementById('f_riskType');
  const riskTypeHint = document.getElementById('riskTypeHint');
  function updateRiskTypeHint(){
    const rt = riskTypeSel.value;
    if(rt && ACCIDENT_SEVERITY_HINT[rt]){
      riskTypeHint.textContent = `⚠ ${t('risktype_hint_prefix')} ${ACCIDENT_SEVERITY_HINT[rt]} (${t('risktype_hint_basis')}: ${t('accidenttype_'+rt)} — ${t('risktype_hint_suffix')})`;
    }else{
      riskTypeHint.textContent = '';
    }
  }
  riskTypeSel.addEventListener('change', updateRiskTypeHint);
  updateRiskTypeHint();
  if(isAdmin){
    bindPhotoField('f_photoAfter');
    const statusSel = document.getElementById('f_status');
    const afterFields = document.getElementById('afterEvalFields');
    statusSel.addEventListener('change', e=>{
      afterFields.style.display = e.target.value==='완료' ? '' : 'none';
    });
  }
  document.getElementById('saveRiskBtn').addEventListener('click', async ()=>{
    const data = {
      process: document.getElementById('f_process').value.trim(),
      task: document.getElementById('f_task').value.trim(),
      hazard: document.getElementById('f_hazard').value.trim(),
      riskType: document.getElementById('f_riskType').value,
      frequency: Number(document.getElementById('f_frequency').value),
      severity: Number(document.getElementById('f_severity').value),
      measures: document.getElementById('f_measures').value.trim(),
      reporter: document.getElementById('f_reporter').value.trim(),
    };
    let chosenStatus = null;
    if(isAdmin && document.getElementById('f_status')){
      chosenStatus = document.getElementById('f_status').value;
      data.status = chosenStatus;
    }else if(!isEdit){
      data.status = '접수완료';
    }
    if(!data.process || !data.hazard || !data.measures || !data.reporter){ toast(t('toast_fill_required')); return; }

    if(isAdmin){
      data.hazardCategory = document.getElementById('f_hazardCategory').value;
      data.hazardDetailType = document.getElementById('f_hazardDetailType').value.trim();
      data.currentMeasures = document.getElementById('f_currentMeasures').value.trim();
    }

    // 완료 처리 시 개선후 재평가 필수. 점수가 7점 이상이면 바로 저장하지 않고 확인 팝업을 먼저 띄움
    let pendingPartial = false, afterScore = null;
    if(isAdmin && chosenStatus==='완료'){
      const af = document.getElementById('f_afterFrequency').value;
      const as = document.getElementById('f_afterSeverity').value;
      if(!af || !as){ toast('완료 처리하려면 개선후 재평가(가능성·강도)를 입력해주세요'); return; }
      const afterFrequency = Number(af), afterSeverity = Number(as);
      afterScore = afterFrequency * afterSeverity;
      data.afterFrequency = afterFrequency;
      data.afterSeverity = afterSeverity;
      if(afterScore <= 6){
        data.status = '완료';
      }else{
        data.status = '일부개선완료';
        pendingPartial = true;
      }
    }

    const photoBeforeFile = document.getElementById('f_photoBefore').files[0];
    if(photoBeforeFile){
      if(photoBeforeFile.size > 5*1024*1024){ toast(t('toast_photo_toobig')); return; }
      data.photoBefore = await new Promise((resolve,reject)=>{
        const r = new FileReader(); r.onload=()=>resolve(r.result); r.onerror=reject; r.readAsDataURL(photoBeforeFile);
      });
    }
    const photoAfterInput = document.getElementById('f_photoAfter');
    if(photoAfterInput){
      const photoAfterFile = photoAfterInput.files[0];
      if(photoAfterFile){
        if(photoAfterFile.size > 5*1024*1024){ toast(t('toast_photo_toobig')); return; }
        data.photoAfter = await new Promise((resolve,reject)=>{
          const r = new FileReader(); r.onload=()=>resolve(r.result); r.onerror=reject; r.readAsDataURL(photoAfterFile);
        });
      }
    }

    if(pendingPartial){
      openPartialImprovementConfirm(afterScore, ()=> finalizeRiskSave(data, isEdit, existing));
      return;
    }
    await finalizeRiskSave(data, isEdit, existing);
  });
}

// 개선후 재평가 점수가 7점 이상일 때 뜨는 확인 팝업 — 확인을 눌러야 실제 저장됨

    <div class="modal-body">

        <b>"일부개선완료"</b>로 저장되며, 계속 관리 대상에 남아 추가 개선이 필요합니다.

      <p class="hint">그대로 진행하시겠습니까?</p>
    </div>
    <div class="modal-foot">
      <button class="btn" data-close>취소</button>
      <button class="btn btn-primary" id="confirmPartialBtn">확인하고 저장</button>
    </div>
  `);
  document.getElementById('confirmPartialBtn').addEventListener('click', async ()=>{

  });
}

async function finalizeRiskSave(data, isEdit, existing){
  if(isEdit){
    await DataStore.update(PATHS.risks, existing.id, data);
    toast(t('toast_risk_updated'));
    closeModal(); renderRisks();
  }else{
    data.createdAt = Date.now();
    const newId = await DataStore.push(PATHS.risks, data);
    closeModal();
    if(State.mode!=='admin'){
      addMyOwnedId('isc_my_risks', newId);
      showSuccessPopup(t('toast_risk_registered'));
    }else{
      toast(t('toast_risk_registered'));
    }
    renderRisks();
  }
}

        </div>
        <div>
          <div class="hint" style="margin-bottom:6px;font-weight:700;">${t('dt_photo_after')}</div>
          ${r.photoAfter ? `<img src="${r.photoAfter}" class="risk-photo-lg" style="width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:zoom-in;">` : `<div class="empty" style="padding:30px 10px;">-</div>`}
        </div>
      </div>` : ''}

    <div class="modal-foot">
      ${State.mode==='admin' ? `<button class="btn" id="delBtn">${t('btn_delete')}</button><button class="btn btn-primary" id="editBtn">${t('btn_edit')}</button>` : ''}
      ${(State.mode==='user' && r.status==='접수' && getMyOwnedIds('isc_my_risks').includes(id)) ? `<button class="btn btn-primary" id="editBtn">${t('btn_edit')}</button>` : ''}
      <button class="btn" data-close>${t('btn_close')}</button>
    </div>
  `);
  bindImageZoom(document.getElementById('modalBox') || document);
  if(document.getElementById('editBtn')){
    document.getElementById('editBtn').addEventListener('click', ()=>{ closeModal(); openRiskModal(r); });
  }
  if(State.mode==='admin'){
    document.getElementById('delBtn').addEventListener('click', async ()=>{
      if(confirm(t('confirm_delete'))){
        await DataStore.remove(PATHS.risks, id); closeModal(); toast(t('toast_deleted')); renderRisks();
      }

  }
}

      <div style="display:flex;gap:8px;">

const ACCIDENT_TYPES = ['추락','넘어짐','부딪힘','끼임(협착)','감전','화상','절단·베임','기타(직접입력)'];
// 사고유형별 강도(중대성) 추천 범위 — 어디까지나 참고용, 자동입력하지 않음(관리자가 직접 선택)
const ACCIDENT_SEVERITY_HINT = {
  '추락':'3~4', '넘어짐':'1~2', '부딪힘':'1~2', '끼임(협착)':'3~4',
  '감전':'3~4', '화상':'2~3', '절단·베임':'2~3'
};

function calcLeaveDays(incidentDatetime, returnDate){
  if(!incidentDatetime || !returnDate) return null;
  const start = new Date(incidentDatetime);
  const end = new Date(returnDate+'T00:00:00');
  const diffMs = end - new Date(start.getFullYear(),start.getMonth(),start.getDate());
  const days = Math.round(diffMs / (1000*60*60*24));
  return days>=0 ? days : null;
}

      // - 사고유형은 세부작업 칸에 참고로 표시, riskType으로 저장해 위험성평가와 동일하게 추천점수에 활용
      const typeLabel = accidentType==='기타(직접입력)' ? data.accidentTypeOther : t('accidenttype_'+accidentType);
      await DataStore.push(PATHS.risks, {
        process: data.process,
        task: typeLabel || '',
        hazard: `사고 접수로 등록됨: ${data.description}`,
        riskType: accidentType==='기타(직접입력)' ? '' : accidentType,
        frequency: '', severity: data.injurySeverity || '',

        toast(t('toast_incident_registered'));
      }
      renderIncidents();
    }
  });

      <button class="btn" data-close>${t('btn_close')}</button>
    </div>
  `);
  if(linkedRisk){
    document.getElementById('viewLinkedRiskBtn').addEventListener('click', ()=>{ closeModal(); openRiskDetail(linkedRisk.id); });
  }
  if(document.getElementById('editBtn')){
    document.getElementById('editBtn').addEventListener('click', ()=>{ closeModal(); openIncidentModal(i); });
  }
  if(State.mode==='admin'){

        await DataStore.remove(PATHS.incidents, id); closeModal(); toast(t('toast_deleted')); renderIncidents();
      }
    });
  }
}

    <div class="notice-item ${n.pinned?'pinned':''}">

      <div class="notice-content">${n.content||''}</div>
      ${n.fileData ? (
        n.fileType && n.fileType.startsWith('image/')

          : `<div class="notice-meta"><a href="${n.fileData}" download="${esc(n.fileName||'첨부파일')}" style="color:var(--info);font-weight:700;">📎 ${esc(n.fileName||'첨부파일')} 다운로드</a></div>`
